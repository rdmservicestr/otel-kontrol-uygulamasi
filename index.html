  async function gecmisiGetir() {
    setGecmisYukleniyor(true);
    setGecmisKayitlar([]);
    try {
      const kisiye = !!kullaniciPozisyonListesi(currentUser);
      const liste = await window.storage.list(
        kisiye
          ? `checklist:${currentUser.hotelCode}:${currentUser.department}:${currentUser.userCode}:`
          : `checklist:${currentUser.hotelCode}:${currentUser.department}:`,
        true
      );
      // Departman ortak kayıtları "checklist:otel:departman:tarih" (4 parça) biçimindedir;
      // kullanıcıya özel pozisyon kayıtları (5 parça) başka kullanıcıların geçmişine karışmaz.
      const keys = ((liste && liste.keys) || []).filter((k) => k.split(":").length === (kisiye ? 5 : 4));
      const kayitlar = [];
      for (const k of keys.slice(-31)) {
        const r = await safeGet(k, true);
        if (r) {
          try {
            kayitlar.push(JSON.parse(r.value));
          } catch (e) {}
        }
      }
      kayitlar.sort((a, b) => (a.date < b.date ? 1 : -1));
      setGecmisKayitlar(kayitlar);
    } catch (e) {
      setGecmisKayitlar([]);
    }
    setGecmisYukleniyor(false);
  }

  function gecmiseGit() {
    setScreen("history");
    gecmisiGetir();
  }

  /* ---------------- PDF OLUŞTURMA ---------------- */

  function jsPdfHazirMi() {
    return typeof window !== "undefined" && window.jspdf && window.jspdf.jsPDF;
  }

  function pdfFontYukle(doc) {
    // Türkçe karakterleri (ş, ğ, ı, İ, ö, ü, ç) doğru gösterebilmek için
    // jsPDF'in varsayılan Helvetica fontu yerine, gömülü Türkçe destekli
    // bir font (Liberation Sans, subset edilmiş) kullanılıyor.
    try {
      doc.addFileToVFS("TurkceFontRegular.ttf", TURKCE_FONT_REGULAR_B64);
      doc.addFont("TurkceFontRegular.ttf", "TurkceFont", "normal");
      doc.addFileToVFS("TurkceFontBold.ttf", TURKCE_FONT_BOLD_B64);
      doc.addFont("TurkceFontBold.ttf", "TurkceFont", "bold");
      return "TurkceFont";
    } catch (e) {
      return "helvetica";
    }
  }

  function pdfOlustur(kayit) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "a4" });
    const fontAdi = pdfFontYukle(doc);
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const margin = 40;

    // Her sayfaya ince, iki katmanlı (koyu lacivert + altın) bir dekoratif
    // çerçeve çizer; raporu daha şık/kurumsal gösterir.
    function sayfaCercevesiCiz() {
      const kb = 16;
      doc.setDrawColor(22, 50, 58);
      doc.setLineWidth(1.1);
      doc.rect(kb, kb, pageWidth - kb * 2, pageHeight - kb * 2);
      doc.setDrawColor(176, 141, 62);
      doc.setLineWidth(0.6);
      doc.rect(kb + 4, kb + 4, pageWidth - (kb + 4) * 2, pageHeight - (kb + 4) * 2);
      doc.setDrawColor(0, 0, 0);
      doc.setLineWidth(1);
    }

    function yeniSayfa() {
      doc.addPage();
      sayfaCercevesiCiz();
    }

    sayfaCercevesiCiz();
    let y = margin;

    // Bu kullanıcıya özel bir logo tanımlıysa (örn. Ercan / Perge Hotels),
    // raporun en üstüne normal (opak) boyutta yerleştirilir.
    const kullaniciLogosu = logoBul(kayit.hotelCode, kayit.userCode);
    if (kullaniciLogosu) {
      const logoOran = logoOrani(kullaniciLogosu);
      const logoYuk = 60;
      const logoGen = Math.min(logoYuk * logoOran, pageWidth - 2 * margin);
      try {
        doc.addImage(
          `data:image/png;base64,${kullaniciLogosu}`,
          "PNG",
          (pageWidth - logoGen) / 2,
          y,
          logoGen,
          logoGen / logoOran
        );
      } catch (e) {}
      y += logoGen / logoOran + 16;
    }

    doc.setFont(fontAdi, "bold");
    doc.setFontSize(16);
    doc.text("Otel Departman Kontrol Listesi", margin, y);
    y += 22;

    doc.setFont(fontAdi, "normal");
    doc.setFontSize(11);
    doc.text(`Otel: ${kayit.hotelName}  (Kod: ${kayit.hotelCode})`, margin, y);
    y += 16;
    doc.text(`Departman: ${kayit.department}`, margin, y);
    y += 16;
    if (kayit.pozisyonKaydi) {
      doc.text(`Pozisyon: ${kayit.pozisyonKaydi.ad}`, margin, y);
      y += 16;
    }
    doc.text(`Tarih: ${formatTarihSadece(kayit.date)}`, margin, y);
    y += 16;
    doc.text(`Kontrol eden: ${kayit.userName} (Kullanıcı Kodu: ${kayit.userCode})`, margin, y);
    y += 16;
    const durumYazi = kayit.tamamlandiMi ? "Tamamlandı" : "Süre içinde tamamlanmadı / otomatik kaydedildi";
    doc.text(`Durum: ${durumYazi}`, margin, y);
    y += 26;

    function gorevYaz(t) {
      if (y + 40 > pageHeight - margin) {
        yeniSayfa();
        y = margin;
      }
      const olumsuzMu = t.status === "olumsuz";
      const girinti = olumsuzMu ? 10 : 0;
      const baslangicY = y;
      const kirmizi = [183, 45, 30];
      const lacivert = [22, 50, 58];

      doc.setFont(fontAdi, "bold");
      doc.setFontSize(11);
      doc.setTextColor(...(olumsuzMu ? kirmizi : lacivert));
      const baslikSatirlari = doc.splitTextToSize(`${t.id}. ${t.text}`, pageWidth - margin * 2 - girinti);
      doc.text(baslikSatirlari, margin + girinti, y);
      y += baslikSatirlari.length * 14;

      doc.setFont(fontAdi, "normal");
      doc.setFontSize(10);
      doc.setTextColor(0, 0, 0);
      if (t.tip === "sayisal") {
        const satir = (t.alanlar || [])
          .map((a) => `${a.label}: ${a.deger ? a.deger : "-"}`)
          .join("    ");
        const satirlar = doc.splitTextToSize(satir, pageWidth - margin * 2 - girinti);
        doc.text(satirlar, margin + girinti, y);
        y += satirlar.length * 13;
      } else if (t.tip === "metin") {
        const satirlar = doc.splitTextToSize(`Yanıt: ${t.metinDeger ? t.metinDeger : "-"}`, pageWidth - margin * 2 - girinti);
        doc.text(satirlar, margin + girinti, y);
        y += satirlar.length * 13;
      } else {
        const durum =
          t.status === "olumlu"
            ? "OLUMLU"
            : t.status === "olumsuz"
            ? "OLUMSUZ"
            : t.status === "mevcut_degil"
            ? "MEVCUT DEĞİL"
            : "İşaretlenmedi";
        const zamanEki = t.zaman ? `  (Saat: ${t.zaman}${t.isaretleyen ? " - " + t.isaretleyen : ""})` : "";
        if (olumsuzMu) {
          doc.setFont(fontAdi, "bold");
          doc.setTextColor(...kirmizi);
        }
        doc.text(`Durum: ${durum}${zamanEki}`, margin + girinti, y);
        doc.setFont(fontAdi, "normal");
        doc.setTextColor(0, 0, 0);
        y += 14;
      }

      if (t.aciklama) {
        const aciklamaSatirlari = doc.splitTextToSize(`Açıklama: ${t.aciklama}`, pageWidth - margin * 2 - girinti);
        if (y + aciklamaSatirlari.length * 13 > pageHeight - margin) {
          yeniSayfa();
          y = margin;
        }
        doc.text(aciklamaSatirlari, margin + girinti, y);
        y += aciklamaSatirlari.length * 13;
      }

      if (t.photo) {
        if (y + 110 > pageHeight - margin) {
          yeniSayfa();
          y = margin;
        }
        try {
          doc.addImage(t.photo, "JPEG", margin + girinti, y, 100, 100);
        } catch (e) {}
        y += 112;
      }

      if (olumsuzMu) {
        doc.setDrawColor(...kirmizi);
        doc.setLineWidth(2);
        doc.line(margin + 2, baslangicY - 9, margin + 2, y - 3);
        doc.setDrawColor(0, 0, 0);
        doc.setLineWidth(1);
      }
      doc.setTextColor(0, 0, 0);
      y += 8;
    }

    if (kayit.odalar) {
      kayit.odalar.forEach((oda) => {
        if (y + 30 > pageHeight - margin) {
          yeniSayfa();
          y = margin;
        }
        doc.setFont(fontAdi, "bold");
        doc.setFontSize(13);
        doc.setTextColor(22, 50, 58);
        doc.text(`Oda ${oda.oda}`, margin, y);
        doc.setTextColor(0, 0, 0);
        y += 8;
        doc.setDrawColor(176, 141, 62);
        doc.line(margin, y, pageWidth - margin, y);
        doc.setDrawColor(0, 0, 0);
        y += 14;
        oda.gorevler.forEach(gorevYaz);
        y += 10;
      });
    } else {
      let sonBolum = null;
      kayit.tasks.forEach((t) => {
        if (kayit.pozisyonKaydi && t.bolum && t.bolum !== sonBolum) {
          sonBolum = t.bolum;
          if (y + 50 > pageHeight - margin) {
            yeniSayfa();
            y = margin;
          }
          doc.setFont(fontAdi, "bold");
          doc.setFontSize(12);
          doc.setTextColor(22, 50, 58);
          doc.text(`${t.bolum}. ${t.bolumBaslik || ""}`, margin, y);
          y += 6;
          doc.setDrawColor(176, 141, 62);
          doc.line(margin, y, pageWidth - margin, y);
          doc.setDrawColor(0, 0, 0);
          doc.setTextColor(0, 0, 0);
          y += 14;
        }
        gorevYaz(t);
      });
    }

    return doc;
  }

  async function raporOlusturVeGonder(kayit) {
    setRaporMesaj("");
    setPdfLinkUrl(null);
    if (!kayit) {
      setRaporMesaj("Bu gün için kaydedilmiş bir kontrol listesi bulunamadı.");
      return;
    }
    if (!jsPdfHazirMi()) {
      setRaporMesaj("PDF oluşturucu henüz hazırlanıyor, birkaç saniye sonra tekrar deneyin.");
      return;
    }
    setRaporIsleniyor(true);
    setRaporMesaj("PDF hazırlanıyor…");
    try {
      const doc = pdfOlustur(await fotograflariGomuluYap(kayit));
      const dosyaAdi = `kontrol-listesi-${kayit.hotelCode}-${kayit.date}.pdf`;
      const konuMetni = `${kayit.hotelName} - ${kayit.department} Kontrol Listesi - ${formatTarihSadece(kayit.date)}`;

      // Yedek bağlantı: otomatik indirme telefonda/tarayıcıda engellenirse
      // veya fark edilmezse, kullanıcı bu bağlantıya dokunarak PDF'i her zaman
      // açabilir/indirebilir.
      try {
        const blobUrl = doc.output("bloburl");
        setPdfLinkUrl(blobUrl.toString ? blobUrl.toString() : blobUrl);
        setPdfLinkAdi(dosyaAdi);
      } catch (e) {}

      if (BACKEND_URL) {
        if (!raporEposta.trim()) {
          setRaporMesaj("Lütfen alıcı e-posta adresini girin.");
          setRaporIsleniyor(false);
          return;
        }
        const pdfBase64 = doc.output("datauristring").split(",")[1];
        const yanit = await fetch(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            to: raporEposta.trim(),
            subject: konuMetni,
            hotelName: kayit.hotelName,
            department: kayit.department,
            date: kayit.date,
            fileName: dosyaAdi,
            pdfBase64,
          }),
        });
        if (yanit.ok) {
          setRaporMesaj("E-posta başarıyla gönderildi.");
          toastGoster("✓ E-posta gönderildi");
        } else {
          setRaporMesaj("Sunucu e-postayı gönderirken bir hata döndürdü.");
        }
      } else {
        let indirmeBasarili = true;
        try {
          doc.save(dosyaAdi);
        } catch (e) {
          indirmeBasarili = false;
        }

        if (raporEposta.trim()) {
          const konu = encodeURIComponent(konuMetni);
          const govde = encodeURIComponent(
            `Merhaba,\n\n${formatTarihSadece(kayit.date)} tarihli ${kayit.department} departmanı kontrol listesi PDF olarak cihaza indirildi.\nLütfen e-posta uygulamasında az önce indirilen "${dosyaAdi}" dosyasını bu mesaja ekleyip gönderin.\n\nOtel: ${kayit.hotelName}\nKontrol eden: ${kayit.userName}`
          );
          window.location.href = `mailto:${raporEposta.trim()}?subject=${konu}&body=${govde}`;
        }

        if (indirmeBasarili) {
          setRaporMesaj(
            raporEposta.trim()
              ? "PDF indirildi ve e-posta uygulamanız açıldı. Lütfen indirilen dosyayı mesaja ekleyip gönderin."
              : "PDF indirildi. İnmediyse aşağıdaki bağlantıya dokunun."
          );
          toastGoster("✓ PDF hazır");
        } else {
          setRaporMesaj("Otomatik indirme başlamadı. Lütfen aşağıdaki bağlantıya dokunup PDF'i açın.");
        }
      }
    } catch (e) {
      setRaporMesaj("Rapor oluşturulurken bir hata oluştu: " + (e && e.message ? e.message : String(e)));
    }
    setRaporIsleniyor(false);
  }

  const durum = pencereDurumu(currentUser && currentUser.department);
  const tamamlanan = kayitTamamlananSayisiKullanici(record, currentUser);
  const toplamMadde = kayitToplamMaddeSayisiKullanici(record, currentUser);
  const duzenlenebilir = durum === "aktif";

  return (
    <div style={styles.sayfaDisi}>
      <GuncellemeUyarisi />
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
        .telefon-govde { font-family: 'Inter', sans-serif; }
        .baslik-font { font-family: 'Sora', sans-serif; }
        @keyframes uynYanipSon { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        input:focus, textarea:focus, button:focus-visible {
          outline: 2px solid #B08D3E;

        @media (prefers-reduced-motion: reduce) {

      `}</style>

      <div className="telefon-govde" style={styles.telefonCerceve}>
        <div style={styles.durumCubugu}>
          <span>{new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" })}</span>
          <span style={{ letterSpacing: 2 }}>●●●●</span>
        </div>

        {hazirlaniyor ? (
          <div style={styles.merkezYukleniyor}>Hazırlanıyor…</div>
        ) : screen === "login" ? (
          <GirisEkrani
            hotelCode={hotelCode}
            userCode={userCode}
            password={password}
            setHotelCode={(v) => digitInput(v, setHotelCode)}
            setUserCode={(v) => digitInput(v, setUserCode)}
            setPassword={(v) => digitInput(v, setPassword, 6)}
            hata={girisHatasi}
            yukleniyor={girisYukleniyor}
            onGiris={handleLogin}
          />
        ) : screen === "pinDegistir" ? (
          <PinDegistirEkrani
            yeniPin={yeniPin}
            yeniPin2={yeniPin2}
            setYeniPin={(v) => digitInput(v, setYeniPin, 6)}
            setYeniPin2={(v) => digitInput(v, setYeniPin2, 6)}
            hata={pinHatasi}
            yukleniyor={pinIsleniyor}
            onKaydet={pinDegistirKaydet}
            onCikis={handleLogout}
            gonullu={pinGonullu}
            mevcutPin={mevcutPin}
            setMevcutPin={(v) => digitInput(v, setMevcutPin, 6)}
            onVazgec={pinVazgec}
          />
        ) : screen === "home" ? (
          <AnaSayfa
            user={currentUser}
            record={record}
            kayitYukleniyor={kayitYukleniyor}
            durum={durum}
            tamamlanan={tamamlanan}
            toplamMadde={toplamMadde}
            onBaslat={() => setScreen("checklist")}
            onGecmis={gecmiseGit}
            onCikis={handleLogout}
            onPinDegistir={pinEkraniAc}
            raporPaneliAcik={raporPaneliAcik}

            raporEposta={raporEposta}

            onRaporGonder={() => raporOlusturVeGonder(record)}
            bildirimDurumu={bildirimDurumu}
            onBildirimIzniIste={bildirimIzniIste}
            onGorevAta={() => setScreen("gorevAta")}
            onLostFound={() => setScreen("lostfound")}
            onArizaBildir={() => setScreen("ariza")}
            onRoomService={() => setScreen("roomservice")}
            onUyandirma={() => setScreen("uyandirma")}
            onPavilion={() => setScreen("pavilion")}
            onAlacarte={() => setScreen("alacarte")}
            onServis={() => setScreen("servis")}
            onRevir={() => setScreen("revir")}
            onGMYonetim={() => setScreen("gmYonetim")}
            bekleyenGorevler={bekleyenGorevler}
            onGorevKabul={gorevKabulEt}
          />
        ) : screen === "checklist" ? (
          <KontrolListesiEkrani
            user={currentUser}
            record={record}
            duzenlenebilir={duzenlenebilir}
            durum={durum}
            hata={listeHatasi}
            tamamlanan={tamamlanan}
            bitiriliyor={bitiriliyor}
            tamamlandiMesaji={tamamlandiMesaji}
            setStatus={setStatus}
            setAciklama={setAciklama}
            setSayisalDeger={setSayisalDeger}
            setMetinDeger={setMetinDeger}
            onPhotoSelect={handlePhotoSelect}
            onRemovePhoto={removePhoto}
            onOdaEkle={odaEkle}
            onOdaGorevDurum={odaGorevDurumAyarla}
            onOdaGorevAciklama={odaGorevAciklamaAyarla}
            onOdaFotoSecildi={handleOdaFotoSecildi}
            onOdaFotoSil={(odaKodu, gorevId) => odaGorevFotoAyarla(odaKodu, gorevId, null)}
            onBitir={handleBitir}
            onGeri={() => setScreen("home")}
            fileInputRefs={fileInputRefs}
          />
        ) : screen === "history" ? (
          <GecmisEkrani
            kayitlar={gecmisKayitlar}
            yukleniyor={gecmisYukleniyor}
            onGeri={() => setScreen("home")}
            onPdf={(k) => raporOlusturVeGonder(k)}
            jsPdfHazirMi={jsPdfHazirMi}
          />
        ) : screen === "admin" ? (
          <AdminEkrani onCikis={handleLogout} onPinDegistir={pinEkraniAc} />
        ) : screen === "gorevAta" ? (
          <GorevAtaEkrani user={currentUser} onGeri={() => setScreen("home")} toastGoster={toastGoster} />
        ) : screen === "gmYonetim" ? (
          <GMYonetimEkrani
            user={currentUser}
            onGeri={() => setScreen("home")}
            toastGoster={toastGoster}
            onDepartmanOlustur={departmanOlustur}
            onKullaniciOlustur={yeniKullaniciOlustur}
            onSatirEkle={kontrolSatiriEkle}
            onSatirDuzenle={kontrolSatiriDuzenle}
            onSatirSil={kontrolSatiriSil}
          />
        ) : screen === "lostfound" ? (
          <LostFoundEkrani user={currentUser} onGeri={() => setScreen("home")} toastGoster={toastGoster} />
        ) : screen === "ariza" ? (
          <ArizaEkrani user={currentUser} onGeri={() => setScreen("home")} toastGoster={toastGoster} />
        ) : screen === "roomservice" ? (
          <RoomServiceEkrani user={currentUser} onGeri={() => setScreen("home")} toastGoster={toastGoster} />
        ) : screen === "uyandirma" ? (
          <UyandirmaEkrani user={currentUser} onGeri={() => setScreen("home")} toastGoster={toastGoster} />
        ) : screen === "pavilion" ? (
          <PavilionEkrani user={currentUser} onGeri={() => setScreen("home")} toastGoster={toastGoster} />
        ) : screen === "servis" && servisKullanabilir(currentUser) ? (
          <ServisTakipEkrani user={currentUser} onGeri={() => setScreen("home")} toastGoster={toastGoster} />
        ) : screen === "revir" && revirKullanabilir(currentUser) ? (
          <RevirEkrani user={currentUser} onGeri={() => setScreen("home")} toastGoster={toastGoster} />
        ) : screen === "alacarte" && alacarteKullanabilir(currentUser) ? (
          <AlacarteEkrani user={currentUser} onGeri={() => setScreen("home")} toastGoster={toastGoster} />
        ) : null}

        {currentUser && screen !== "login" && servisAliciMi(currentUser) && <ServisAlarmi onGit={() => setScreen("servis")} />}

        {uyandirmaGeciken.length > 0 && screen !== "uyandirma" && screen !== "login" && (
          <button style={styles.uynBanner} onClick={() => setScreen("uyandirma")}>
            ⏰ {uyandirmaGeciken.length} uyandırma bekliyor —{" "}
            {uyandirmaGeciken
              .slice(0, 3)
              .map((k) => `Oda ${k.odaNo} (${k.saat})`)
              .join(", ")}
            {uyandirmaGeciken.length > 3 ? "…" : ""}
          </button>
        )}

        {toast && !pdfLinkUrl && <div style={styles.toastMesaj}>{toast}</div>}

        {pdfLinkUrl && (
          <div style={styles.pdfBaglantiCubugu}>
            <a href={pdfLinkUrl} target="_blank" rel="noreferrer" style={styles.pdfBaglantiLink}>
              📄 {pdfLinkAdi} — Aç / İndir
            </a>
            <button
              style={styles.pdfBaglantiKapat}
              onClick={() => setPdfLinkUrl(null)}
              aria-label="Kapat"
            >
              ✕
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

        </div>
        <div className="baslik-font" style={styles.anahtarBaslik}>
          {gonullu ? "PIN Değiştir" : "Yeni PIN Belirleyin"}
        </div>
      </div>

      <div style={{ marginTop: 20, fontSize: 13, color: "#4A5A60", lineHeight: 1.5 }}>
        {gonullu
          ? "Güvenliğiniz için önce mevcut PIN'inizi, sonra yeni 6 haneli PIN'inizi girin. PIN'inizi kimseyle paylaşmayın."
          : "İlk girişiniz için size geçici bir PIN verilmişti. Devam etmek için yalnızca sizin bileceğiniz 6 haneli yeni bir PIN belirleyin. 111111 veya 123456 gibi kolay PIN'ler kabul edilmez."}
      </div>

      <div style={{ marginTop: 16 }}>
        {gonullu && (
          <>
            <Etiket>MEVCUT PIN</Etiket>
            <input
              className="kod-input"
              style={styles.kodInput}
              inputMode="numeric"
              type="password"
              autoComplete="current-password"
              placeholder="••••••"
              maxLength={6}
              value={mevcutPin}
              onChange={(e) => setMevcutPin(e.target.value)}
            />
          </>
        )}
        <Etiket>YENİ PIN (6 haneli)</Etiket>
        <input
          className="kod-input"
          style={styles.kodInput}
          inputMode="numeric"
          type="password"
          autoComplete="new-password"
          placeholder="••••••"
          maxLength={6}
          value={yeniPin}
          onChange={(e) => setYeniPin(e.target.value)}
        />

        <Etiket>YENİ PIN (tekrar)</Etiket>
        <input
          className="kod-input"
          style={styles.kodInput}
          inputMode="numeric"
          type="password"
          autoComplete="new-password"
          placeholder="••••••"
          maxLength={6}
          value={yeniPin2}
          onChange={(e) => setYeniPin2(e.target.value)}
        />

        {hata && <div style={styles.hataKutusu}>{hata}</div>}

        <button
          style={{ ...styles.anaButon, marginTop: 20, opacity: yukleniyor ? 0.7 : 1 }}
          onClick={onKaydet}
          disabled={yukleniyor || yeniPin.length !== 6 || yeniPin2.length !== 6 || (gonullu && mevcutPin.length !== 6)}
        >
          {yukleniyor ? "Kaydediliyor…" : "PIN'i Kaydet ve Devam Et"}
        </button>
        <button style={{ ...styles.anaButon, marginTop: 10, background: "#8A9296" }} onClick={gonullu ? onVazgec : onCikis}>
          {gonullu ? "Vazgeç" : "Çıkış"}
        </button>
      </div>
    </div>
  );
}

function AnaSayfa({
  user,
  record,
  kayitYukleniyor,
  durum,
  tamamlanan,
  toplamMadde,
  onBaslat,
  onGecmis,
  onCikis,
  onPinDegistir,
  raporPaneliAcik,
  setRaporPaneliAcik,
  raporEposta,
  setRaporEposta,
  raporMesaj,
  raporIsleniyor,
  onRaporGonder,
  bildirimDurumu,
  onBildirimIzniIste,
  onGorevAta,
  onGMYonetim,
  onLostFound,
  onArizaBildir,
  onRoomService,
  onUyandirma,
  onPavilion,
  onAlacarte,
  onServis,
  onRevir,
  bekleyenGorevler,
  onGorevKabul,
}) {
  const zamanPenceresi = DEPARTMAN_ZAMAN_PENCERELERI[user.department];
  const baslangicMetni = zamanPenceresi ? saatMetni(zamanPenceresi.baslangic) : "";
  const bitisMetni = zamanPenceresi ? saatMetni(zamanPenceresi.bitis) : "";
  let durumYazisi = "";
  let durumRengi = "#6B7280";
  if (durum === "once") {
    durumYazisi = `Bugünkü kontrol listesi henüz başlamadı (${baslangicMetni}'de açılır)`;
  } else if (durum === "aktif") {
    durumYazisi = `Devam ediyor · ${tamamlanan}/${toplamMadde} madde işaretlendi`;
    durumRengi = "#B08D3E";
  } else {
    durumYazisi = record
      ? `Süre doldu (${bitisMetni}) · ${tamamlanan}/${toplamMadde} madde ile kaydedildi`
      : `Süre doldu (${bitisMetni}) · bugün için kayıt oluşturulmadı`;
    durumRengi = "#B7472A";
  }

  const hatirlatmalar = record && !record.pozisyonKaydi ? HATIRLATMALAR[record.department] : null;
  const gecikenler =
    record && hatirlatmalar
      ? record.tasks.filter((t) => hatirlatmalar[t.id] && !t.status && saatGectiMi(hatirlatmalar[t.id]))
      : [];
  const kullaniciLogosu = logoBul(user.hotelCode, user.userCode);

  return (
    <div style={styles.icerik}>
      <div style={styles.anahtarKart}>
        <div style={styles.anahtarUst}>
          <span style={styles.anahtarEtiket}>{user.hotelName}</span>
          <div style={styles.manyetikSerit} />
        </div>
        <div className="baslik-font" style={styles.anahtarBaslik}>
          Hoş geldiniz, {user.name}
        </div>
        <div style={styles.anahtarAltBilgi}>
          Otel Kodu {user.hotelCode} · Kullanıcı {user.userCode}
        </div>
        <div style={styles.departmanRozeti}>
          {user.department}
          {user.bolum ? ` · ${bolumBasligiBul(user.department, user.bolum)}` : ""}
          {user.pozisyon ? ` · ${user.pozisyon}` : ""}
        </div>
      </div>

      {kullaniciLogosu && (
        <div style={styles.anaSayfaLogoKutusu}>
          <img
            src={`data:image/png;base64,${kullaniciLogosu}`}
            alt={`${user.hotelName} logosu`}
            style={styles.anaSayfaLogo}
          />
        </div>
      )}

      {bekleyenGorevler && bekleyenGorevler.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 14 }}>
          {bekleyenGorevler.map((g) => (
            <div key={g.key} style={styles.gorevBildirimKarti}>
              <div style={styles.gorevBildirimBaslik}>📬 Yeni Görev</div>
              <div style={styles.gorevBildirimMetin}>
                <strong>{g.atayanAdi}</strong> size <strong>Oda {g.odaKodu}</strong> kontrolünü atadı.
              </div>
              <button style={styles.gorevKabulButon} onClick={() => onGorevKabul(g)}>
                GÖREVİ KABUL ET
              </button>
            </div>
          ))}
        </div>
      )}

      <div style={styles.durumKarti}>
        <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: 0.5, color: "#6B7280" }}>
          {zamanPenceresi ? `BUGÜN · ${baslangicMetni} – ${bitisMetni}` : "BUGÜN"}
        </div>
        <div style={{ fontSize: 14, fontWeight: 600, color: durumRengi, marginTop: 4 }}>
          {kayitYukleniyor ? "Yükleniyor…" : durumYazisi}
        </div>
      </div>

      {gecikenler.length > 0 && (
        <div style={styles.gecikmeBanner}>
          ⏰ {gecikenler.length === 1
            ? `Hatırlatma: "${gecikenler[0].text}" maddesi henüz işaretlenmedi.`
            : `Hatırlatma: ${gecikenler.length} madde zamanında işaretlenmedi.`}
        </div>
      )}

      {bildirimDurumu !== "granted" && bildirimDurumu !== "unsupported" && (
        <button style={styles.bildirimButon} onClick={onBildirimIzniIste}>
          🔔 Saatli Hatırlatma Bildirimlerini Aç
        </button>
      )}

      <div style={{ marginTop: 18, display: "flex", flexDirection: "column", gap: 12 }}>
        <button
          style={{ ...styles.anaButon, opacity: durum === "once" ? 0.5 : 1 }}
          onClick={onBaslat}
          disabled={durum === "once"}
        >
          {durum === "aktif" ? "Kontrol Listesini Aç" : durum === "once" ? "Henüz Başlamadı" : "Bugünün Listesini Görüntüle"}
        </button>

        <button style={styles.arizaButon} onClick={onArizaBildir}>
          🔧 Arıza Bildir
        </button>

        <button style={styles.lostFoundButon} onClick={onLostFound}>
          📦 Lost & Found
        </button>

        <button style={styles.roomServiceButon} onClick={onRoomService}>
          🍽️ Oda Servisi
        </button>

        <button style={styles.uyandirmaButon} onClick={onUyandirma}>
          ⏰ Uyandırma Servisi
        </button>

        <button style={styles.pavilionButon} onClick={onPavilion}>
          🏖️ Pavilion Rezervasyon
        </button>

        {servisKullanabilir(user) && (
          <button style={{ ...styles.pavilionButon, borderColor: "#6D28D9", color: "#6D28D9" }} onClick={onServis}>
            🎮 Servis Takip (Bebek Kamerası · PS)
          </button>
        )}

        {revirKullanabilir(user) && (
          <button data-testid="revir-btn" style={{ ...styles.pavilionButon, borderColor: "#B91C1C", color: "#B91C1C" }} onClick={onRevir}>
            🩺 Revir Takip (sağlık vakası bildir / takip)
          </button>
        )}

        {alacarteKullanabilir(user) && (
          <button style={{ ...styles.pavilionButon, borderColor: "#9A3412", color: "#9A3412" }} onClick={onAlacarte}>
            🍷 Alacarte Rezervasyon
          </button>
        )}

        <button style={styles.ikincilButon} onClick={onGecmis}>
          Geçmiş Kayıtlar
        </button>

        {user.department === "Genel Müdürlük" && GOREV_ATAMA_IZINLI_OTELLER.includes(user.hotelCode) && (
          <button style={styles.gorevAtaButon} onClick={onGorevAta}>
            📋 Kat Hizmetlerine Görev Ata
          </button>
        )}

        {user.department === "Genel Müdürlük" && (
          <button style={styles.gmYonetimButon} onClick={onGMYonetim}>
            🏨 Otel Yönetim Paneli
          </button>
        )}

        <button
          style={styles.ucuncuButon}
          onClick={() => setRaporPaneliAcik((a) => !a)}
        >
          📄 Gün Sonu Raporunu Oluştur ve E-posta ile Gönder
        </button>

        {raporPaneliAcik && (
          <div style={styles.raporPaneli}>
            <Etiket>YÖNETİCİ E-POSTA ADRESİ</Etiket>
            <input
              style={styles.epostaInput}
              type="email"
              placeholder="ornek@rdmhotels.com"
              value={raporEposta}
              onChange={(e) => setRaporEposta(e.target.value)}
            />
            <button
              style={{ ...styles.anaButon, marginTop: 12, opacity: raporIsleniyor ? 0.7 : 1 }}
              onClick={onRaporGonder}
              disabled={raporIsleniyor}
            >
              {raporIsleniyor ? "Hazırlanıyor…" : "PDF Oluştur ve Gönder"}
            </button>
            {raporMesaj && <div style={styles.bilgiKutusu}>{raporMesaj}</div>}
            <div style={styles.notMetni}>
              Not: Tarayıcı güvenliği nedeniyle e-posta dosya eki otomatik eklenemez;
              PDF cihaza indirilir ve e-posta uygulamanız hazır bir taslakla açılır,
              dosyayı eklemeniz yeterlidir.
            </div>
          </div>
        )}

        <button style={styles.metinButon} onClick={onPinDegistir}>
          🔑 PIN Değiştir
        </button>
        <button style={styles.metinButon} onClick={onCikis}>
          Çıkış Yap
        </button>
        <SurumAlani />
      </div>
    </div>
  );
}

function KontrolListesiEkrani({
  user,
  record,
  duzenlenebilir,
  durum,
  hata,
  tamamlanan,
  bitiriliyor,
  tamamlandiMesaji,
  setStatus,
  setAciklama,
  setSayisalDeger,
  setMetinDeger,
  onPhotoSelect,
  onRemovePhoto,
  onOdaEkle,
  onOdaGorevDurum,
  onOdaGorevAciklama,
  onOdaFotoSecildi,
  onOdaFotoSil,
  onBitir,
  onGeri,
  fileInputRefs,
}) {
  const bolumlerTumu = DEPARTMAN_BOLUMLERI[user.department];
  const bolumlerHarfEslesen =
    user.bolum && bolumlerTumu ? bolumlerTumu.filter((b) => b.harf === user.bolum) : null;
  // user.bolum artık serbest metin (organizasyon şemasından) olabileceği için,
  // harf koduyla eşleşme bulunamazsa (örn. "Elektrik" gibi bir metinse) tüm
  // bölümler gösterilir; eşleşme varsa (örn. "A") sadece o bölüm gösterilir.
  const pozisyonModu = !!(record && record.pozisyonKaydi);
  const bolumler = pozisyonModu
    ? record.pozisyonKaydi.bolumler
    : bolumlerHarfEslesen && bolumlerHarfEslesen.length > 0
    ? bolumlerHarfEslesen
    : bolumlerTumu;
  // Pozisyon listelerinde: gruplar kapalı açılır, madde renkleri cevaba göre boyanır, 3 cevapta da fotoğraf,
  // OLUMSUZ'da açıklama zorunlu, grup bitince yeşile döner ve kapanır.
  const otomatikKapat = pozisyonModu || !!DEPARTMAN_OTOMATIK_KAPAT[user.department];
  const yorumFotoIzinli = !!DEPARTMAN_YORUM_FOTO_IZINLI[user.department];
  const yorumFotoHerZaman = pozisyonModu || !!DEPARTMAN_YORUM_FOTO_HERZAMAN[user.department];
  const maddeRenginiDurumaGoreBoya = pozisyonModu || !!DEPARTMAN_MADDE_RENGI_DURUMA_GORE[user.department];
  const aciklamaButonlu = pozisyonModu || !!DEPARTMAN_ACIKLAMA_BUTONLU[user.department];
  const aciklamaMaxUzunluk = DEPARTMAN_ACIKLAMA_MAX_UZUNLUK[user.department] || null;
  const tekBolumAcik = !!DEPARTMAN_TEK_BOLUM_ACIK[user.department];
  const [acikBolumHarfi, setAcikBolumHarfi] = useState(null);
  const odaBazliMi = odaBazliKullaniciMi(user);
  const kullaniciLogosu = logoBul(user.hotelCode, user.userCode);
  const toplamMaddeSayisi = kayitToplamMaddeSayisiKullanici(record, user);

  if (!record) {
    return (
      <div style={styles.icerik}>
        <div style={styles.hataKutusu}>
          "{user.department}" departmanı için tanımlı bir kontrol listesi bulunamadı.
        </div>
        <button style={{ ...styles.ikincilButon, marginTop: 16 }} onClick={onGeri}>
          Ana Sayfaya Dön
        </button>
      </div>
    );
  }

  return (
    <div style={styles.icerik}>
      <div style={styles.listeUstBaslik}>
        <button style={styles.geriButon} onClick={onGeri} aria-label="Geri">
          ←
        </button>
        <div>
          <div className="baslik-font" style={styles.listeBaslikYazi}>
            {pozisyonModu ? `${record.pozisyonKaydi.ad} Kontrol Listesi` : <>{user.department}
            {user.bolum ? ` · ${bolumBasligiBul(user.department, user.bolum)}` : ""} Kontrol Listesi</>}
          </div>
          <div style={styles.ilerlemeYazi}>
            {tamamlanan} / {toplamMaddeSayisi} madde işaretlendi
            {!duzenlenebilir && "  ·  Süre doldu, salt okunur"}
          </div>
        </div>
      </div>

      <div style={styles.ilerlemeCubugu}>
        <div
          style={{
            ...styles.ilerlemeDoluluk,
            width: `${toplamMaddeSayisi > 0 ? (tamamlanan / toplamMaddeSayisi) * 100 : 0}%`,
          }}
        />
      </div>

      {tamamlandiMesaji && <div style={styles.basariMesaji}>✓ Kontrol listesi kaydedildi</div>}

      <div style={{ position: "relative" }}>
        {kullaniciLogosu && (
          <img
            src={`data:image/png;base64,${kullaniciLogosu}`}
            alt=""
            aria-hidden="true"
            style={styles.sorularArkaPlanLogosu}
          />
        )}

        {odaBazliMi ? (
          <OdaBazliKontrolListesi
            record={record}
            duzenlenebilir={duzenlenebilir}
            onOdaEkle={onOdaEkle}
            onOdaGorevDurum={onOdaGorevDurum}
            onOdaGorevAciklama={onOdaGorevAciklama}
            onOdaFotoSecildi={onOdaFotoSecildi}
            onOdaFotoSil={onOdaFotoSil}
            fileInputRefs={fileInputRefs}
          />
        ) : bolumler ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 14, position: "relative", zIndex: 1 }}>
          {bolumler.map((b) => (
            <BolumKarti
              key={b.harf}
              bolum={b}
              tasks={record.tasks}
              duzenlenebilir={duzenlenebilir}
              otomatikKapat={otomatikKapat}
              pozisyonModu={pozisyonModu}
              yorumFotoIzinli={yorumFotoIzinli}
              yorumFotoHerZaman={yorumFotoHerZaman}
              maddeRenginiDurumaGoreBoya={maddeRenginiDurumaGoreBoya}
              aciklamaButonlu={aciklamaButonlu}
              aciklamaMaxUzunluk={aciklamaMaxUzunluk}
              disardanAcik={tekBolumAcik ? acikBolumHarfi === b.harf : undefined}
              onAcikToggle={
                tekBolumAcik ? () => setAcikBolumHarfi((h) => (h === b.harf ? null : b.harf)) : undefined
              }
              setStatus={setStatus}
              setAciklama={setAciklama}
              setSayisalDeger={setSayisalDeger}
              setMetinDeger={setMetinDeger}
              onPhotoSelect={onPhotoSelect}
              onRemovePhoto={onRemovePhoto}
              fileInputRefs={fileInputRefs}
            />
          ))}
        </div>
      ) : (
      <div style={{ display: "flex", flexDirection: "column", gap: 14, marginTop: 14, position: "relative", zIndex: 1 }}>
        {record.tasks.map((t) => {
          const hatirlatmaSaati = (HATIRLATMALAR[record.department] || {})[t.id];
          const gecikti = hatirlatmaSaati && !t.status && saatGectiMi(hatirlatmaSaati);
          return (
          <div
            key={t.id}
            style={{
              ...styles.gorevKarti,
              ...(gecikti ? styles.gorevKartiUyari : {}),
            }}
          >
            <div style={styles.gorevUst}>
              <div
                style={{
                  ...styles.gorevNumara,
                  background:
                    t.status === "olumlu" ? "#2F7D5C" : t.status === "olumsuz" ? "#B7472A" : "#EFEAE0",
                  color: t.status ? "#fff" : "#16323A",
                }}
              >
                {t.id}
              </div>
              <div style={{ flex: 1 }}>
                <div style={styles.gorevMetin}>{t.text}</div>
                {hatirlatmaSaati && (
                  <div style={{ ...styles.hatirlatmaEtiketi, ...(gecikti ? styles.hatirlatmaGecikti : {}) }}>
                    {gecikti
                      ? `⏰ Hatırlatma: ${hatirlatmaSaati}'a kadar tamamlanmalıydı, henüz işaretlenmedi`
                      : `⏰ ${hatirlatmaSaati}'a kadar tamamlanmalı`}
                  </div>
                )}
              </div>
            </div>

            <div style={styles.secimSatiri}>
              <label
                style={{
                  ...styles.secimKutusu,
                  ...(t.status === "olumlu" ? styles.secimAktifOlumlu : {}),
                  opacity: duzenlenebilir ? 1 : 0.6,
                }}
              >
                <input
                  type="checkbox"
                  checked={t.status === "olumlu"}
                  disabled={!duzenlenebilir}
                  onChange={() => setStatus(t.id, "olumlu")}
                  style={styles.gizliCheckbox}
                />
                OLUMLU
              </label>
              <label
                style={{
                  ...styles.secimKutusu,
                  ...(t.status === "olumsuz" ? styles.secimAktifOlumsuz : {}),
                  opacity: duzenlenebilir ? 1 : 0.6,
                }}
              >
                <input
                  type="checkbox"
                  checked={t.status === "olumsuz"}
                  disabled={!duzenlenebilir}
                  onChange={() => setStatus(t.id, "olumsuz")}
                  style={styles.gizliCheckbox}
                />
                OLUMSUZ
              </label>
            </div>

            {t.zaman && <div style={styles.zamanNotu}>🕒 İşaretlendi: {t.zaman}{t.isaretleyen ? ` · ${t.isaretleyen}` : ""}</div>}

            <textarea
              placeholder={t.status === "olumsuz" ? "Açıklama girin (zorunlu)" : "Açıklama (isteğe bağlı)"}
              value={t.aciklama}
              disabled={!duzenlenebilir}
              onChange={(e) => setAciklama(t.id, e.target.value)}
              style={styles.aciklamaAlani}
              rows={2}
            />

            <div style={styles.fotografSatiri}>
              <input
                ref={(el) => (fileInputRefs.current[t.id] = el)}
                type="file"
                accept="image/*"
                capture="environment"
                style={{ display: "none" }}
                onChange={(e) => onPhotoSelect(t.id, e.target.files[0])}
              />
              <button
                style={{ ...styles.fotoButon, opacity: duzenlenebilir ? 1 : 0.6 }}
                disabled={!duzenlenebilir}
                onClick={() => fileInputRefs.current[t.id] && fileInputRefs.current[t.id].click()}
              >
                {t.photo ? "Fotoğrafı Değiştir" : "📷 Fotoğraf Ekle"}
              </button>
              {t.photo && (
                <div style={styles.fotoOnizlemeSarmalayici}>
                  <img src={t.photo} alt={`Görev ${t.id} fotoğrafı`} style={styles.fotoOnizleme} />
                  {duzenlenebilir && (
                    <button
                      style={styles.fotoSilButon}
                      onClick={() => onRemovePhoto(t.id)}
                      aria-label="Fotoğrafı kaldır"
                    >
                      ✕
                    </button>
                  )}
                </div>
              )}
            </div>
          </div>
          );
        })}
      </div>
      )}
      </div>

      {hata && <div style={{ ...styles.hataKutusu, marginTop: 16 }}>{hata}</div>}

      {duzenlenebilir ? (
        <button
          style={{ ...styles.anaButon, marginTop: 20, marginBottom: 24, opacity: bitiriliyor ? 0.7 : 1 }}
          onClick={onBitir}
          disabled={bitiriliyor}
        >
          {bitiriliyor ? "Kaydediliyor…" : "Bitir ve Kaydet"}
        </button>
      ) : (
        <div style={{ ...styles.bilgiKutusu, marginTop: 20, marginBottom: 24 }}>
          İşaretlemeleriniz otomatik olarak kaydedildi.{DEPARTMAN_ZAMAN_PENCERELERI[user.department] ? ` ${saatMetni(DEPARTMAN_ZAMAN_PENCERELERI[user.department].baslangic)}–${saatMetni(DEPARTMAN_ZAMAN_PENCERELERI[user.department].bitis)} dışında düzenleme yapılamaz.` : ""}
        </div>
      )}
    </div>
  );
}

// Bölümlü (harf başlıklı, akordiyon) departmanlar için tek bir bölüm kartı.
// Tıklanınca açılır/kapanır; bölümdeki tüm maddeler tamamlanınca başlık
// yeşile döner. otomatikKapat true ise, tamamlandığında akordiyon kendiliğinden
// kapanır. Madde tipine göre (evethayir/sayisal/metin) farklı giriş alanı gösterir.
// Oda bazlı (Kat Hizmetleri) departmanlar için "Kontrol Noktası" alanı.
// "+" ile yeni bir kontrol noktası (oda kodu) eklenir; her kod bir çip olarak
// görünür, çipe tıklanınca o odanın A/B/C bölümlü kontrol listesi açılır.
function OdaBazliKontrolListesi({
  record,
  duzenlenebilir,
  onOdaEkle,
  onOdaGorevDurum,
  onOdaGorevAciklama,
  onOdaFotoSecildi,
  onOdaFotoSil,
  fileInputRefs,
}) {
  const [yeniOdaAcik, setYeniOdaAcik] = useState(false);
  const [yeniOdaDegeri, setYeniOdaDegeri] = useState("");
  const [acikOda, setAcikOda] = useState(null);

  const odalar = record.odalar || [];
  const maxaUlasildi = odalar.length >= ODA_BAZLI_MAX_NOKTA;

  function odaEkleOnayla() {
    if (yeniOdaDegeri.length !== ODA_KODU_UZUNLUGU) return;
    onOdaEkle(yeniOdaDegeri);
    setYeniOdaDegeri("");
    setYeniOdaAcik(false);
    setAcikOda(yeniOdaDegeri);
  }

  return (
    <div>
      <div style={styles.kontrolNoktasiBaslik}>
        Kontrol noktası ({odalar.length}/{ODA_BAZLI_MAX_NOKTA})
      </div>

      <div style={styles.odaCipSarmalayici}>
        {odalar.map((oda) => {
          const tamamlanan = oda.gorevler.filter((g) => gorevTamamMi(g)).length;
          const tumuTamam = tamamlanan === oda.gorevler.length;
          return (
            <button
              key={oda.oda}
              style={{
                ...styles.odaCip,
                ...(oda.atanmis ? styles.odaCipAtanmis : {}),
                ...(acikOda === oda.oda ? styles.odaCipAktif : {}),
                ...(tumuTamam ? styles.odaCipTamam : {}),
              }}
              onClick={() => setAcikOda(acikOda === oda.oda ? null : oda.oda)}
              title={oda.atanmis ? `Görev: ${oda.atayanAdi} tarafından atandı` : undefined}
            >
              {oda.oda}
              {oda.atanmis && !tumuTamam ? " 📌" : ""}
            </button>
          );
        })}

        {duzenlenebilir && !maxaUlasildi && !yeniOdaAcik && (
          <button style={styles.odaArtiButon} onClick={() => setYeniOdaAcik(true)} aria-label="Kontrol noktası ekle">
            +
          </button>
        )}
      </div>

      {yeniOdaAcik && (
        <div style={styles.odaEkleKutusu}>
          <input
            type="text"
            inputMode="numeric"
            maxLength={ODA_KODU_UZUNLUGU}
            placeholder="0000"
            value={yeniOdaDegeri}
            autoFocus
            onChange={(e) => setYeniOdaDegeri(e.target.value.replace(/\D/g, "").slice(0, ODA_KODU_UZUNLUGU))}
            style={styles.odaEkleInput}
          />
          <button
            style={styles.odaEkleOnayButon}
            disabled={yeniOdaDegeri.length !== ODA_KODU_UZUNLUGU}
            onClick={odaEkleOnayla}
          >
            Ekle
          </button>
          <button
            style={styles.odaEkleIptalButon}
            onClick={() => {
              setYeniOdaAcik(false);
              setYeniOdaDegeri("");
            }}
          >
            ✕
          </button>
        </div>
      )}

      {odalar.length === 0 && !yeniOdaAcik && (
        <div style={styles.bilgiKutusu}>
          Henüz bir kontrol noktası eklenmedi. Başlamak için "+" düğmesine dokunup oda numarasını girin.
        </div>
      )}

      {odalar
        .filter((oda) => oda.oda === acikOda)
        .map((oda) => (
          <OdaKarti
            key={oda.oda}
            oda={oda}
            duzenlenebilir={duzenlenebilir}
            onOdaGorevDurum={onOdaGorevDurum}
            onOdaGorevAciklama={onOdaGorevAciklama}
            onOdaFotoSecildi={onOdaFotoSecildi}
            onOdaFotoSil={onOdaFotoSil}
            fileInputRefs={fileInputRefs}
          />
        ))}
    </div>
  );
}

// Tek bir kontrol noktasının (odanın) A/B/C bölümlü kontrol listesi.
// Bölüm başlıkları kendi içinde akordiyon; bir maddenin başlığına tıklanınca
// OLUMLU/OLUMSUZ seçenekleri açılır — aynı anda yalnızca bir madde açık kalır.
function OdaKarti({ oda, duzenlenebilir, onOdaGorevDurum, onOdaGorevAciklama, onOdaFotoSecildi, onOdaFotoSil, fileInputRefs }) {
  const [acikBolumler, setAcikBolumler] = useState({});
  const [acikGorevId, setAcikGorevId] = useState(null);

  function bolumAcKapat(harf) {
    setAcikBolumler((prev) => ({ ...prev, [harf]: !prev[harf] }));
  }

  return (
    <div style={styles.odaKartiSarmalayici}>
      <div style={styles.odaKartiBaslik}>Oda {oda.oda} — Kontrol Listesi</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {KAT_HIZMETLERI_BOLUMLER.map((b) => {
          const bolumGorevleri = oda.gorevler.filter((g) => g.bolum === b.harf);
          const tamamlanan = bolumGorevleri.filter((g) => gorevTamamMi(g)).length;
          const tumuTamam = tamamlanan === bolumGorevleri.length;
          const acik = !!acikBolumler[b.harf];
          return (
            <div key={b.harf} style={styles.gmBolumKarti}>
              <button
                style={{ ...styles.gmBolumBaslik, ...(tumuTamam ? styles.gmBolumBaslikTamam : {}) }}
                onClick={() => bolumAcKapat(b.harf)}
              >
                <span
                  style={{ ...styles.gmBolumHarfRozeti, ...(tumuTamam ? styles.gmBolumHarfRozetiTamam : {}) }}
                >
                  {b.harf}
                </span>
                <span style={styles.gmBolumBaslikMetin}>{b.baslik}</span>
                <span style={styles.gmBolumSayac}>
                  {tamamlanan}/{bolumGorevleri.length}
                </span>
                <span style={styles.gmBolumOk}>{acik ? "▲" : "▼"}</span>
              </button>

              {acik && (
                <div style={styles.gmMaddeListesi}>
                  {bolumGorevleri.map((g) => {
                    const gorevAcik = acikGorevId === g.id;
                    const refAnahtari = `${oda.oda}-${g.id}`;
                    return (
                      <div key={g.id} style={styles.gmMadde}>
                        <button
                          style={{
                            ...styles.odaMaddeBaslikButon,
                            color: g.status ? "#2F7D5C" : "#16323A",
                          }}
                          onClick={() => setAcikGorevId(gorevAcik ? null : g.id)}
                        >
                          {g.id}. {g.text}
                        </button>

                        {gorevAcik && (
                          <div style={{ marginTop: 8 }}>
                            <div style={styles.secimSatiri}>
                              <label
                                style={{
                                  ...styles.secimKutusu,
                                  ...(g.status === "olumlu" ? styles.secimAktifOlumlu : {}),
                                  opacity: duzenlenebilir ? 1 : 0.6,
                                }}
                              >
                                <input
                                  type="checkbox"
                                  checked={g.status === "olumlu"}
                                  disabled={!duzenlenebilir}
                                  onChange={() => onOdaGorevDurum(oda.oda, g.id, "olumlu")}
                                  style={styles.gizliCheckbox}
                                />
                                OLUMLU
                              </label>
                              <label
                                style={{
                                  ...styles.secimKutusu,
                                  ...(g.status === "olumsuz" ? styles.secimAktifOlumsuz : {}),
                                  opacity: duzenlenebilir ? 1 : 0.6,
                                }}
                              >
                                <input
                                  type="checkbox"
                                  checked={g.status === "olumsuz"}
                                  disabled={!duzenlenebilir}
                                  onChange={() => onOdaGorevDurum(oda.oda, g.id, "olumsuz")}
                                  style={styles.gizliCheckbox}
                                />
                                OLUMSUZ
                              </label>
                            </div>

                            {g.status === "olumsuz" && (
                              <textarea
                                placeholder="Açıklama girin (zorunlu)"
                                value={g.aciklama}
                                disabled={!duzenlenebilir}
                                onChange={(e) => onOdaGorevAciklama(oda.oda, g.id, e.target.value)}
                                style={styles.aciklamaAlani}
                                rows={2}
                              />
                            )}

                            {g.status && (
                              <div style={styles.fotografSatiri}>
                                <input
                                  ref={(el) => (fileInputRefs.current[refAnahtari] = el)}
                                  type="file"
                                  accept="image/*"
                                  capture="environment"
                                  style={{ display: "none" }}
                                  onChange={(e) => onOdaFotoSecildi(oda.oda, g.id, e.target.files[0])}
                                />
                                <button
                                  style={{ ...styles.fotoButon, opacity: duzenlenebilir ? 1 : 0.6 }}
                                  disabled={!duzenlenebilir}
                                  onClick={() =>
                                    fileInputRefs.current[refAnahtari] && fileInputRefs.current[refAnahtari].click()
                                  }
                                >
                                  {g.photo ? "Fotoğrafı Değiştir" : "📷 Fotoğraf Ekle"}
                                </button>
                                {g.photo && (
                                  <div style={styles.fotoOnizlemeSarmalayici}>
                                    <img src={g.photo} alt={`Görev ${g.id} fotoğrafı`} style={styles.fotoOnizleme} />
                                    {duzenlenebilir && (
                                      <button
                                        style={styles.fotoSilButon}
                                        onClick={() => onOdaFotoSil(oda.oda, g.id)}
                                        aria-label="Fotoğrafı kaldır"
                                      >
                                        ✕
                                      </button>
                                    )}
                                  </div>
                                )}
                              </div>
                            )}

                            {g.zaman && <div style={styles.zamanNotu}>🕒 İşaretlendi: {g.zaman}{g.isaretleyen ? ` · ${g.isaretleyen}` : ""}</div>}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function BolumKarti({
  bolum,
  tasks,
  duzenlenebilir,
  otomatikKapat,
  pozisyonModu,
  yorumFotoIzinli,
  yorumFotoHerZaman,
  maddeRenginiDurumaGoreBoya,
  aciklamaButonlu,
  aciklamaMaxUzunluk,
  disardanAcik,
  onAcikToggle,
  setStatus,
  setAciklama,
  setSayisalDeger,
  setMetinDeger,
  onPhotoSelect,
  onRemovePhoto,
  fileInputRefs,
}) {
  const [icAcik, setIcAcik] = useState(false);
  const [acikAciklamalar, setAcikAciklamalar] = useState({}); // { [taskId]: true } - "AÇIKLAMA" düğmesiyle manuel açılanlar
  const kontrolluMu = typeof onAcikToggle === "function";
  const acik = kontrolluMu ? !!disardanAcik : icAcik;
  const altTasks = tasks.filter((t) => t.bolum === bolum.harf);
  const tamamlanan = altTasks.filter((t) => gorevTamamMi(t)).length;
  const tumuTamam = altTasks.length > 0 && tamamlanan === altTasks.length;

  // Pozisyon listelerinde son madde cevaplanınca grup kısa bir gecikmeyle kapanır; açıklama yazılırken
  // ya da fotoğraf eklenirken süre yeniden başlar (yazarken kapanmasın diye).
  const duzenlemeImzasi = pozisyonModu ? altTasks.map((t) => `${t.status}|${t.aciklama || ""}|${t.photo ? 1 : 0}`).join("#") : "";
  useEffect(() => {
    if (!(otomatikKapat && tumuTamam)) return undefined;
    const kapat = () => {
      if (kontrolluMu) {
        if (acik) onAcikToggle();
      } else {
        setIcAcik(false);
      }
    };
    if (!pozisyonModu) {
      kapat();
      return undefined;
    }
    const z = setTimeout(kapat, 2000);
    return () => clearTimeout(z);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [tumuTamam, duzenlemeImzasi]);

  function basliaTikla() {
    if (kontrolluMu) {
      onAcikToggle();
    } else {
      setIcAcik((a) => !a);
    }
  }

  return (
    <div style={styles.gmBolumKarti}>
      <button
        style={{
          ...styles.gmBolumBaslik,
          ...(tumuTamam ? styles.gmBolumBaslikTamam : {}),
        }}
        onClick={basliaTikla}
      >
        <span
          style={{
            ...styles.gmBolumHarfRozeti,
            ...(tumuTamam ? styles.gmBolumHarfRozetiTamam : {}),
          }}
        >
          {bolum.harf}
        </span>
        <span style={styles.gmBolumBaslikMetin}>{bolum.baslik}</span>
        <span style={styles.gmBolumSayac}>
          {tamamlanan}/{altTasks.length}
        </span>
        <span style={styles.gmBolumOk}>{acik ? "▲" : "▼"}</span>
      </button>

      {/* Kapalıyken de DOM'da kalır (gizlenir): fotoğraf seçici açıkken grup kapansa bile seçim kaybolmaz */}
      {(acik || pozisyonModu) && (
        <div style={{ ...styles.gmMaddeListesi, ...(acik ? {} : { display: "none" }) }}>
          {altTasks.map((t) => {
            const maddeRengi = !maddeRenginiDurumaGoreBoya
              ? undefined
              : t.status === "olumlu"
              ? "#2F7D5C"
              : t.status === "olumsuz"
              ? "#B7472A"
              : t.status === "mevcut_degil"
              ? "#D9822B"
              : undefined;
            const yorumFotoGoster =
              (yorumFotoIzinli && t.status === "olumsuz") || (yorumFotoHerZaman && !!t.status);
            const aciklamaZorunlu = t.status === "olumsuz";
            const aciklamaGorunsun = aciklamaButonlu
              ? aciklamaZorunlu || !!acikAciklamalar[t.id] || (pozisyonModu && !!t.aciklama)
              : yorumFotoGoster;
            const fotoGorunsun = yorumFotoGoster;
            return (
            <div key={t.id} style={styles.gmMadde}>
              <div style={{ ...styles.gmMaddeMetin, ...(maddeRengi ? { color: maddeRengi } : {}) }}>
                {t.id}. {t.text}
              </div>

              {t.tip === "sayisal" && (
                <div style={styles.sayisalAlanSarmalayici}>
                  {t.alanlar.map((a, i) => (
                    <div key={i} style={styles.sayisalAlanTekil}>
                      <span style={styles.sayisalEtiket}>{a.label}</span>
                      <input
                        type="text"
                        inputMode="numeric"
                        maxLength={3}
                        placeholder="000"
                        value={a.deger}
                        disabled={!duzenlenebilir}
                        onChange={(e) => setSayisalDeger(t.id, i, e.target.value)}
                        style={styles.sayisalInput}
                      />
                    </div>
                  ))}
                </div>
              )}

              {t.tip === "metin" && (
                <input
                  type="text"
                  maxLength={50}
                  placeholder="Yanıt yazın (en fazla 50 karakter)"
                  value={t.metinDeger}
                  disabled={!duzenlenebilir}
                  onChange={(e) => setMetinDeger(t.id, e.target.value)}
                  style={styles.metinInput}
                />
              )}

              {t.tip === "evethayir" && (
                <>
                  <div style={styles.secimSatiri}>
                    <label
                      style={{
                        ...styles.secimKutusu,
                        ...(t.status === "olumlu" ? styles.secimAktifOlumlu : {}),
                        opacity: duzenlenebilir ? 1 : 0.6,
                      }}
                    >
                      <input
                        type="checkbox"
                        checked={t.status === "olumlu"}
                        disabled={!duzenlenebilir}
                        onChange={() => setStatus(t.id, "olumlu")}
                        style={styles.gizliCheckbox}
                      />
                      OLUMLU
                    </label>
                    <label
                      style={{
                        ...styles.secimKutusu,
                        ...(t.status === "olumsuz" ? styles.secimAktifOlumsuz : {}),
                        opacity: duzenlenebilir ? 1 : 0.6,
                      }}
                    >
                      <input
                        type="checkbox"
                        checked={t.status === "olumsuz"}
                        disabled={!duzenlenebilir}
                        onChange={() => setStatus(t.id, "olumsuz")}
                        style={styles.gizliCheckbox}
                      />
                      OLUMSUZ
                    </label>
                    {pozisyonModu && (
                      <label
                        style={{
                          ...styles.secimKutusu,
                          ...(t.status === "mevcut_degil" ? styles.secimAktifMevcutDegil : {}),
                          opacity: duzenlenebilir ? 1 : 0.6,
                        }}
                      >
                        <input
                          type="checkbox"
                          checked={t.status === "mevcut_degil"}
                          disabled={!duzenlenebilir}
                          onChange={() => setStatus(t.id, "mevcut_degil")}
                          style={styles.gizliCheckbox}
                        />
                        MEVCUT DEĞİL
                      </label>
                    )}
                  </div>

                  {aciklamaButonlu && (t.status === "olumlu" || t.status === "mevcut_degil") && !acikAciklamalar[t.id] && !(pozisyonModu && t.aciklama) && (
                    <button
                      style={{ ...styles.fotoButon, marginTop: 10 }}
                      onClick={() => setAcikAciklamalar((prev) => ({ ...prev, [t.id]: true }))}
                    >
                      ✏️ AÇIKLAMA
                    </button>
                  )}

                  {aciklamaGorunsun && (
                    <div style={{ marginTop: 10 }}>
                      <textarea
                        placeholder={
                          aciklamaZorunlu
                            ? "Açıklama girin (zorunlu)"
                            : `Açıklama (isteğe bağlı)${aciklamaMaxUzunluk ? ` — en fazla ${aciklamaMaxUzunluk} karakter` : ""}`
                        }
                        value={t.aciklama}
                        disabled={!duzenlenebilir}
                        maxLength={aciklamaMaxUzunluk || undefined}
                        onChange={(e) => setAciklama(t.id, e.target.value)}
                        style={{
                          ...styles.aciklamaAlani,
                          ...(aciklamaZorunlu && pozisyonModu && !(t.aciklama || "").trim() ? { borderColor: "#B7472A" } : {}),
                        }}
                        rows={2}
                      />
                      {aciklamaZorunlu && pozisyonModu && !(t.aciklama || "").trim() && (
                        <div style={{ ...styles.zamanNotu, color: "#B7472A" }}>OLUMSUZ cevapta açıklama zorunludur.</div>
                      )}
                      {aciklamaMaxUzunluk && (
                        <div style={styles.zamanNotu}>
                          {(t.aciklama || "").length}/{aciklamaMaxUzunluk} karakter
                        </div>
                      )}
                    </div>
                  )}

                  {fotoGorunsun && (
                    <div style={{ marginTop: 10 }}>
                      <div style={styles.fotografSatiri}>
                        <input
                          ref={(el) => (fileInputRefs.current[t.id] = el)}
                          type="file"
                          accept="image/*"
                          capture="environment"
                          style={{ display: "none" }}
                          onChange={(e) => onPhotoSelect(t.id, e.target.files[0])}
                        />
                        <button
                          style={{ ...styles.fotoButon, opacity: duzenlenebilir ? 1 : 0.6 }}
                          disabled={!duzenlenebilir}
                          onClick={() => fileInputRefs.current[t.id] && fileInputRefs.current[t.id].click()}
                        >
                          {t.photo ? "Fotoğrafı Değiştir" : "📷 Fotoğraf Ekle"}
                        </button>
                        {t.photo && (
                          <div style={styles.fotoOnizlemeSarmalayici}>
                            <img src={t.photo} alt={`Görev ${t.id} fotoğrafı`} style={styles.fotoOnizleme} />
                            {duzenlenebilir && (
                              <button
                                style={styles.fotoSilButon}
                                onClick={() => onRemovePhoto(t.id)}
                                aria-label="Fotoğrafı kaldır"
                              >
                                ✕
                              </button>
                            )}
                          </div>
                        )}
                      </div>
                    </div>
                  )}
                </>
              )}

              {t.zaman && <div style={styles.zamanNotu}>🕒 İşaretlendi: {t.zaman}{t.isaretleyen ? ` · ${t.isaretleyen}` : ""}</div>}
            </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// Yönetici ekranı: kayıtlı tüm otelleri ve her otele bağlı kullanıcıları
// (kod, isim, departman, şifre) listeler. Veriler doğrudan kalıcı
// depodan okunur, böylece sonradan eklenen kullanıcılar da otomatik görünür.
// Genel Müdürlük kullanıcılarının, kendi otellerindeki Kat Hizmetleri
// personeline oda numarası görevi atamasını sağlayan ekran.
function GorevAtaEkrani({ user, onGeri, toastGoster }) {
  const atanabilirDepartmanlar = Object.keys(DEPARTMAN_ODA_BAZLI);
  const [departman, setDepartman] = useState(atanabilirDepartmanlar[0] || "");
  const [kullanicilar, setKullanicilar] = useState([]);
  const [secilenKullaniciKodu, setSecilenKullaniciKodu] = useState("");
  const [odaKodu, setOdaKodu] = useState("");
  const [yukleniyor, setYukleniyor] = useState(true);
  const [gonderiliyor, setGonderiliyor] = useState(false);
  const [mesaj, setMesaj] = useState("");

  useEffect(() => {
    kullanicilariGetir();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [departman]);

  async function kullanicilariGetir() {
    setYukleniyor(true);
    setSecilenKullaniciKodu("");
    try {
      const liste = await window.storage.list("users:", true);
      const keyler = (liste && liste.keys) || [];
      const sonuc = [];
      for (const k of keyler) {
        const r = await safeGet(k, true);
        if (r) {
          try {
            const veri = JSON.parse(r.value);
            if (veri.hotelCode === user.hotelCode && veri.department === departman && !kullaniciPozisyonListesi(veri)) {
              sonuc.push(veri);
            }
          } catch (e) {}
        }
      }
      sonuc.sort((a, b) => (a.name < b.name ? -1 : 1));
      setKullanicilar(sonuc);
      if (sonuc.length > 0) setSecilenKullaniciKodu(sonuc[0].userCode);
    } catch (e) {}
    setYukleniyor(false);
  }

  async function gorevGonder() {
    setMesaj("");
    if (!secilenKullaniciKodu) {
      setMesaj("Lütfen bir kullanıcı seçin.");
      return;
    }
    if (odaKodu.length !== ODA_KODU_UZUNLUGU) {
      setMesaj("Oda numarası 4 haneli olmalıdır.");
      return;
    }
    const hedefKullanici = kullanicilar.find((k) => k.userCode === secilenKullaniciKodu);
    if (!hedefKullanici) return;

    setGonderiliyor(true);
    try {
      const key = `gorev:${user.hotelCode}:${hedefKullanici.userCode}:${Date.now()}`;
      const gorev = {
        hotelCode: user.hotelCode,
        department: departman,
        userCode: hedefKullanici.userCode,
        odaKodu,
        atayanAdi: user.name,
        atananAdi: hedefKullanici.name,
        olusturmaZamani: new Date().toISOString(),
        durum: "bekliyor",
      };
      await window.storage.set(key, JSON.stringify(gorev), true);
      setOdaKodu("");
      setMesaj(`✓ Oda ${gorev.odaKodu} görevi ${hedefKullanici.name}'e gönderildi.`);
      if (toastGoster) toastGoster(`✓ Görev gönderildi — Oda ${gorev.odaKodu} → ${hedefKullanici.name}`);
    } catch (e) {
      setMesaj("Görev gönderilirken bir hata oluştu.");
    }
    setGonderiliyor(false);
  }

  return (
    <div style={styles.icerik}>
      <div style={styles.listeUstBaslik}>
        <button style={styles.geriButon} onClick={onGeri} aria-label="Geri">
          ←
        </button>
        <div className="baslik-font" style={styles.listeBaslikYazi}>
          Görev Ata
        </div>
      </div>

      <div style={{ marginTop: 18 }}>
        <Etiket>DEPARTMAN</Etiket>
        <select value={departman} onChange={(e) => setDepartman(e.target.value)} style={styles.gorevSecim}>
          {atanabilirDepartmanlar.map((d) => (
            <option key={d} value={d}>
              {d}
            </option>
          ))}
        </select>

        <Etiket>KULLANICI</Etiket>
        {yukleniyor ? (
          <div style={styles.bilgiKutusu}>Kullanıcılar yükleniyor…</div>
        ) : kullanicilar.length === 0 ? (
          <div style={styles.bilgiKutusu}>
            "{user.hotelName}" otelinde "{departman}" departmanına ait kullanıcı bulunamadı.
          </div>
        ) : (
          <select
            value={secilenKullaniciKodu}
            onChange={(e) => setSecilenKullaniciKodu(e.target.value)}
            style={styles.gorevSecim}
          >
            {kullanicilar.map((k) => (
              <option key={k.userCode} value={k.userCode}>
                {k.name} ({k.userCode})
              </option>
            ))}
          </select>
        )}

        <Etiket>ODA NUMARASI</Etiket>
        <input
          className="kod-input"
          style={styles.kodInput}
          inputMode="numeric"
          placeholder="0000"
          maxLength={ODA_KODU_UZUNLUGU}
          value={odaKodu}
          onChange={(e) => setOdaKodu(e.target.value.replace(/\D/g, "").slice(0, ODA_KODU_UZUNLUGU))}
        />

        {mesaj && <div style={styles.bilgiKutusu}>{mesaj}</div>}

        <button
          style={{ ...styles.anaButon, marginTop: 20, opacity: gonderiliyor ? 0.7 : 1 }}
          onClick={gorevGonder}
          disabled={gonderiliyor || kullanicilar.length === 0}
        >
          {gonderiliyor ? "Gönderiliyor…" : "Görevi Gönder"}
        </button>
      </div>
    </div>
  );
}

// Otelde görevli herkesin bugünkü iş özetini (departman bazlı, paylaşımlı
// kontrol listesi ilerlemesi) gösterir. Yalnızca user.hotelCode'a ait
// kullanıcılar listelenir. Bir kullanıcıya dokununca canlı ilerleme paneli
// açılır (15 saniyede bir otomatik yenilenir): "7/70 - %10" gibi.
function GMOzetSekmesi({ user }) {
  const [yukleniyor, setYukleniyor] = useState(true);
  const [kullanicilar, setKullanicilar] = useState([]);
  const [acikKullanici, setAcikKullanici] = useState(null);
  const [ilerlemeVerisi, setIlerlemeVerisi] = useState({});

  useEffect(() => {
    yukle();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  useEffect(() => {
    if (!acikKullanici) return;
    const k = kullanicilar.find((x) => x.userCode === acikKullanici);
    if (!k) return;
    const t = setInterval(() => ilerlemeGetir(k), 15000);
    return () => clearInterval(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [acikKullanici, kullanicilar]);

  async function yukle() {
    setYukleniyor(true);
    try {
      const liste = await window.storage.list(`users:${user.hotelCode}:`, true);
      const keys = (liste && liste.keys) || [];
      const kayitlar = [];
      for (const k of keys) {
        const r = await safeGet(k, true);
        if (r) {
          try {
            const veri = JSON.parse(r.value);
            if (veri.hotelCode === user.hotelCode && veri.department !== "Admin") kayitlar.push(veri);
          } catch (e) {}
        }
      }
      kayitlar.sort((a, b) => (a.userCode < b.userCode ? -1 : 1));
      setKullanicilar(kayitlar);
    } catch (e) {}
    setYukleniyor(false);
  }

  async function ilerlemeGetir(k) {
    setIlerlemeVerisi((prev) => ({ ...prev, [k.userCode]: { ...(prev[k.userCode] || {}), yukleniyor: true } }));
    const tarih = bugunTarihi();
    const key = gunlukKayitAnahtari(k, tarih);
    const r = await safeGet(key, true);
    if (!r) {
      setIlerlemeVerisi((prev) => ({ ...prev, [k.userCode]: { yukleniyor: false, bulunamadi: true } }));
      return;
    }
    try {
      const veri = JSON.parse(r.value);
      setIlerlemeVerisi((prev) => ({
        ...prev,
        [k.userCode]: {
          yukleniyor: false,
          bulunamadi: false,
          tamamlanan: kayitTamamlananSayisiKullanici(veri, k),
          toplam: kayitToplamMaddeSayisiKullanici(veri, k),
          tamamlandiMi: veri.tamamlandiMi,
        },
      }));
    } catch (e) {
      setIlerlemeVerisi((prev) => ({ ...prev, [k.userCode]: { yukleniyor: false, hata: true } }));
    }
  }

  function tikla(k) {
    if (acikKullanici === k.userCode) {
      setAcikKullanici(null);
      return;
    }
    setAcikKullanici(k.userCode);
    ilerlemeGetir(k);
  }

  return (
    <div style={{ marginTop: 14 }}>
      {yukleniyor ? (
        <div style={styles.merkezYukleniyor}>Yükleniyor…</div>
      ) : kullanicilar.length === 0 ? (
        <div style={styles.bilgiKutusu}>Bu otelde henüz kullanıcı bulunmuyor.</div>
      ) : (
        <div style={styles.adminTablo}>
          <div style={{ ...styles.adminSatir, ...styles.adminSatirBaslik }}>
            <div style={styles.adminHucreKod}>Kod</div>
            <div style={styles.adminHucreIsim}>İsim</div>
            <div style={styles.adminHucreDepartman}>Departman</div>
          </div>
          {kullanicilar.map((k) => {
            const acik = acikKullanici === k.userCode;
            const il = ilerlemeVerisi[k.userCode];
            return (
              <div key={k.userCode}>
                <button style={{ ...styles.adminSatir, ...styles.adminSatirButon }} onClick={() => tikla(k)}>
                  <div style={styles.adminHucreKod}>{k.userCode}</div>
                  <div style={styles.adminHucreIsim}>{k.name}</div>
                  <div style={styles.adminHucreDepartman}>{k.department}</div>
                  <div style={styles.adminOkIsareti}>{acik ? "▲" : "▼"}</div>
                </button>

                {acik && (
                  <div style={styles.adminIlerlemePaneli}>
                    {!il || il.yukleniyor ? (
                      <div style={styles.adminIlerlemeYukleniyor}>Yükleniyor…</div>
                    ) : il.hata ? (
                      <div style={styles.adminIlerlemeHata}>İlerleme bilgisi alınamadı.</div>
                    ) : il.bulunamadi ? (
                      <div style={styles.adminIlerlemeBos}>
                        Bugün için "{k.department}" departmanında henüz bir kontrol listesi başlatılmadı.
                      </div>
                    ) : (
                      (() => {
                        const yuzde = il.toplam > 0 ? Math.round((il.tamamlanan / il.toplam) * 100) : 0;
                        return (
                          <>
                            <div style={styles.adminIlerlemeUstSatir}>
                              <span>
                                Bugün · {k.department}
                                {k.bolum ? ` · ${bolumBasligiBul(k.department, k.bolum)}` : ""} ·{" "}
                                <strong>
                                  {il.tamamlanan}/{il.toplam} - %{yuzde}
                                </strong>
                              </span>
                            </div>
                            <div style={styles.ilerlemeCubugu}>
                              <div style={{ ...styles.ilerlemeDoluluk, width: `${yuzde}%` }} />
                            </div>
                            {il.tamamlandiMi && <div style={styles.adminIlerlemeTamamRozeti}>✓ Tamamlandı</div>}
                          </>
                        );
                      })()
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// Pasif (kapatılmış) kullanıcıları listeler ve tekrar aktifleştirmeye izin verir.
// Genel Müdür yalnızca kendi otelinin, admin tüm otellerin pasif kullanıcılarını görür.
function PasifKullanicilarKutusu({ onDegisti }) {
  const [liste, setListe] = useState(null);
  const [hata, setHata] = useState("");
  const [isleniyor, setIsleniyor] = useState(null);

  async function yukle() {
    try {
      setListe(await window.OtelYonetim.pasifKullanicilar());
      setHata("");
    } catch (e) {
      setHata((e && e.message) || "Pasif kullanıcılar yüklenemedi.");
      setListe([]);
    }
  }
  useEffect(() => {
    yukle();
  }, []);

  async function aktiflestir(k) {
    const anahtar = `${k.hotelCode}:${k.userCode}`;
    setIsleniyor(anahtar);
    setHata("");
    try {
      await window.OtelYonetim.cagir("kullanici_guncelle", { hotelCode: k.hotelCode, userCode: k.userCode, active: true });
      await yukle();
      if (onDegisti) onDegisti();
    } catch (e) {
      setHata((e && e.message) || "Aktifleştirilemedi.");
    }
    setIsleniyor(null);
  }

  return (
    <div style={{ marginTop: 24 }}>
      <div style={{ fontWeight: 700 }}>Pasif kullanıcılar</div>
      {hata && <div style={{ ...styles.hataKutusu, marginTop: 8 }}>{hata}</div>}
      {liste === null && <div style={{ ...styles.bilgiKutusu, marginTop: 8 }}>Yükleniyor…</div>}
      {liste && liste.length === 0 && !hata && (
        <div style={{ ...styles.bilgiKutusu, marginTop: 8 }}>Pasif kullanıcı yok.</div>
      )}
      {(liste || []).map((k) => {
        const anahtar = `${k.hotelCode}:${k.userCode}`;
        return (
          <div key={anahtar} style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 8, fontSize: 13 }}>
            <div style={{ flex: 1, opacity: 0.8 }}>
              {k.hotelCode} · {k.userCode} · {k.name} · {k.department}
            </div>
            <button style={styles.gmKucukButon} onClick={() => aktiflestir(k)} disabled={isleniyor === anahtar}>
              {isleniyor === anahtar ? "…" : "✅ Aktifleştir"}
            </button>
          </div>
        );
      })}
    </div>
  );
}

function GMKullaniciSekmesi({ user, onKullaniciOlustur, toastGoster }) {
  const [userCode, setUserCode] = useState("");

  const [pasifOnay, setPasifOnay] = useState(null);
  const [pasifSayac, setPasifSayac] = useState(0); // pasif listesini yeniden yüklemek için

  async function hesapPasiflestir(k) {
    if (pasifOnay !== k.userCode) {
      setPasifOnay(k.userCode); // ikinci dokunuşta onaylanır
      return;
    }
    setHata("");
    try {
      await window.OtelYonetim.cagir("kullanici_guncelle", { hotelCode: k.hotelCode, userCode: k.userCode, active: false });
      setPasifOnay(null);
      await otelKullanicilariniYukle();
      setPasifSayac((x) => x + 1);
      toastGoster(`✓ ${k.name} pasifleştirildi`);

      setHata(e.message || "Hesap pasifleştirilemedi.");
    }
  }
  const [otelKullanicilari, setOtelKullanicilari] = useState([]);

      kayitlar.sort((a, b) => (a.userCode < b.userCode ? -1 : 1));

      <div style={styles.notMetni}>

        yapıdaki departmanlar (Genel Müdürlük, Gece Müdürü, Kat Hizmetleri) burada listelenmez.
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 14 }}>
        {maddeler.map((m, i) => (
          <div key={i} style={styles.gmMaddeSatiri}>

            ) : (
