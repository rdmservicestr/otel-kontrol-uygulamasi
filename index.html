  { k: "GUNES_SICAK", ad: "Güneş / Sıcak çarpması", ikon: "☀️" },
  { k: "BAYILMA_TANSIYON", ad: "Bayılma / Tansiyon", ikon: "💓" },
  { k: "AGRI", ad: "Ağrı (bel, diz, karın…)", ikon: "💢" },
  { k: "DIGER", ad: "Diğer", ikon: "➕" },
];
const REVIR_YERLER = [["Oda", "Oda"], ["Aquapark", "Aquapark"], ["Havuz", "Havuz"], ["Restoran", "Restoran"], ["Plaj", "Plaj"], ["Lobi", "Lobi"], ["Diger", "Diğer"]];
const REVIR_YAS = [["Belirsiz", "Belirsiz"], ["Bebek", "Bebek (0-2)"], ["Cocuk", "Çocuk"], ["Yetiskin", "Yetişkin"], ["Yasli", "Yaşlı"], ["Personel", "Personel"]];
const REVIR_UYRUK = [["", "—"], ["TR", "Türkiye"], ["RU", "Rusya"], ["DE", "Almanya"], ["EN", "İngilizce"], ["Diğer", "Diğer"]];
const REVIR_KARARLAR = [["Otelde", "Otelde müdahale"], ["Gozlem", "Revirde gözlem"], ["Eczane", "Eczaneye yönlendirildi"], ["Hastane", "Hastane sevki"], ["Ret", "Tedaviyi reddetti"]];
const REVIR_SEVK = [["Ambulans", "Ambulans"], ["KendiAraci", "Kendi aracı"], ["Taksi", "Taksi"], ["OtelAraci", "Otel aracı"]];
const REVIR_SONUC = [["Iyilesti", "İyileşti"], ["OteldenAyrildi", "Otelden ayrıldı"], ["HastayaYatirildi", "Hastaneye yatırıldı"], ["TedaviReddedildi", "Tedavi reddedildi (ret formu)"], ["TakipDisi", "Takip dışı"]];
const REVIR_TAKIP = [["Iyi", "İyi"], ["Ayni", "Aynı"], ["Kotu", "Kötüleşti"], ["Ulasilamadi", "Ulaşılamadı"]];
function revirKullanabilir(user) {
  return !!user && REVIR_OTELLER.includes(user.hotelCode);
}
function revirEtiket(liste, k) {
  const x = liste.find((a) => a[0] === k);
  return x ? x[1] : k || "";
}
function revirKat(k) {
  return REVIR_KATEGORILER.find((x) => x.k === k) || { k, ad: k, ikon: "•" };
}
function revirNo(n) {
  return "R-" + String(n).padStart(4, "0");
}
function revirGecen(iso, simdi) {
  if (!iso) return "";
  const dk = Math.max(0, Math.round((simdi - Date.parse(iso)) / 60000));
  if (dk < 60) return `${dk} dk önce`;
  if (dk < 48 * 60) return `${Math.floor(dk / 60)} sa önce`;
  return `${Math.floor(dk / 1440)} gün önce`;
}
function revirDurum(v, simdi) {
  if (v.durum === "Kapandi") return { ad: "Kapandı", renk: "#6B7280" };
  if (v.karar === "Hastane" && !v.donus_zamani) return { ad: "Hastanede / yolda", renk: "#B91C1C" };
  if (v.durum === "Bildirildi") return { ad: "Değerlendirme bekliyor", renk: "#B45309" };
  if (v.sonraki_takip && Date.parse(v.sonraki_takip) <= simdi) return { ad: "Takip gecikti", renk: "#B91C1C" };
  return { ad: "Takipte", renk: "#0369A1" };
}
function revirPdf(liste, pano, tarih, hotelName, kullaniciAdi) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4", orientation: "landscape" });
  const font = pavPdfFontYukle(doc);
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const m = 30;
  let y = m;
  function yeniSayfa(ih) {
    if (y + ih > H - m) {
      doc.addPage();
      y = m;
    }
  }
  doc.setFont(font, "bold");
  doc.setFontSize(16);
  doc.setTextColor(22, 50, 58);
  doc.text("Revir Günlük Özeti", m, y + 4);
  doc.setDrawColor(176, 141, 62);
  doc.setLineWidth(1.2);
  doc.line(m, y + 12, W - m, y + 12);
  y += 30;
  doc.setFont(font, "normal");
  doc.setFontSize(10);
  doc.setTextColor(70, 70, 70);
  doc.text(`${hotelName}   |   Tarih: ${formatTarihSadece(tarih)}   |   Hazırlayan: ${kullaniciAdi}   |   ${new Date().toLocaleString("tr-TR")}`, m, y);
  y += 16;
  const say = (f) => liste.filter(f).length;
  doc.setFont(font, "bold");
  doc.setFontSize(11);
  doc.text(`Toplam vaka: ${liste.length}   |   Kusma/ishal: ${say((v) => v.kategori.includes("GIS"))}   |   Hastane sevki: ${say((v) => v.karar === "Hastane")}   |   Ambulans: ${say((v) => v.sevk_sekli === "Ambulans")}   |   Tedavi reddi: ${say((v) => v.karar === "Ret")}`, m, y);
  y += 14;
  doc.setFont(font, "normal");
  doc.setFontSize(8);
  doc.text("Bu özet kişisel (ad-soyad, tanı, tedavi) veri içermez; yalnızca oda ve vaka bilgisi bulunur.", m, y);
  y += 16;
  const kolon = [["Vaka", 52], ["Saat", 70], ["Oda", 40], ["Tür", 190], ["Kişi / Yaş", 90], ["Yer", 62], ["Karar / Sevk", 150], ["Durum", 100], ["Takip", 0]];
  const toplam = W - 2 * m;
  const sabit = kolon.slice(0, -1).reduce((t, k) => t + k[1], 0);
  const gen = kolon.map((k, i) => (i === kolon.length - 1 ? toplam - sabit : k[1]));
  const kes = (t, g) => {
    let x = String(t == null ? "" : t);
    while (x.length > 1 && doc.getTextWidth(x) > g - 6) x = x.slice(0, -1);
    return x;
  };
  const satir = (h, kalin, dolgu) => {
    yeniSayfa(16);
    if (dolgu) {
      doc.setFillColor(dolgu[0], dolgu[1], dolgu[2]);
      doc.rect(m, y - 11, toplam, 15, "F");
    }
    doc.setFont(font, kalin ? "bold" : "normal");
    let x = m;
    h.forEach((v, i) => {
      doc.text(kes(v, gen[i]), x + 3, y);
      x += gen[i];
    });
    y += 15;
  };
  doc.setFontSize(9);
  doc.setTextColor(30, 30, 30);
  satir(kolon.map((k) => k[0]), true, [232, 226, 208]);
  if (!liste.length) satir(["Kayıt yok"], false);
  const sim = Date.now();
  liste.slice().sort((a, b) => Date.parse(a.olay_zamani) - Date.parse(b.olay_zamani)).forEach((v, i) => {
    const d = revirDurum(v, sim);
    satir([revirNo(v.vaka_no), servisKisa(v.olay_zamani), v.oda, v.kategori.map((k) => revirKat(k).ad.split(" /")[0]).join(", "), `${v.kisi_sayisi} · ${revirEtiket(REVIR_YAS, v.yas_grubu)}`, revirEtiket(REVIR_YERLER, v.olay_yeri), [v.karar ? revirEtiket(REVIR_KARARLAR, v.karar) : "-", v.sevk_sekli ? revirEtiket(REVIR_SEVK, v.sevk_sekli) : ""].filter(Boolean).join(" · "), v.durum === "Kapandi" ? "Kapandı" : d.ad, v.son_takip_durumu ? revirEtiket(REVIR_TAKIP, v.son_takip_durumu) : ""], false, i % 2 ? [247, 244, 235] : null);
  });
  return doc;
}

function RevirEkrani({ user, onGeri, toastGoster }) {
  const [yetki, setYetki] = useState(null);
  const [sekme, setSekme] = useState("pano");
  const [pano, setPano] = useState(null);
  const [liste, setListe] = useState([]);
  const [filtre, setFiltre] = useState("acik");
  const [detayId, setDetayId] = useState(null);
  const [hata, setHata] = useState("");
  const [fark, setFark] = useState(0);
  const [, yenile] = useState(0);
  const [eposta, setEposta] = useState(() => {
    try {
      return window.localStorage.getItem("revir_eposta") || "";
    } catch (e) {
      return "";
    }
  });
  const [pdfMesaj, setPdfMesaj] = useState("");
  const kutu = { background: "#fff", border: "1px solid #E2DCCC", borderRadius: 12, padding: 12, marginTop: 10 };
  const girdi = { width: "100%", padding: "11px 12px", borderRadius: 10, border: "1.5px solid #D6CFBD", fontSize: 16, boxSizing: "border-box", background: "#fff" };
  const simdi = Date.now() + fark;
  const gor = !!(yetki && yetki.goruntule);

  async function yukleYetki() {
    try {
      const y = await window.OtelRpc.cagir("revir_yetki");
      setYetki(y);
      if (!y.goruntule) setSekme("yeni");
      return y;
    } catch (e) {
      setHata(e.message);
      return null;
    }
  }
  async function yukle(sessiz) {
    if (!gor) return;
    try {
      const [p, l] = await Promise.all([window.OtelRpc.cagir("revir_pano"), window.OtelRpc.cagir("revir_listele", { p_filtre: filtre, p_limit: 200 })]);
      setPano(p);
      setListe(l);
      setFark(Date.parse(p.simdi) - Date.now());
      if (!sessiz) setHata("");
    } catch (e) {
      if (!sessiz) setHata(e.message);
    }
  }
  useEffect(() => {
    yukleYetki();
  }, []);
  useEffect(() => {
    yukle(false);
    if (!gor) return;
    const t = setInterval(() => yukle(true), 15000);
    const sn = setInterval(() => yenile((n) => n + 1), 30000);
    return () => {
      clearInterval(t);
      clearInterval(sn);
    };
  }, [gor, filtre]);

  function pdfGunluk(epostaGonder) {
    setPdfMesaj("");
    if (!(window.jspdf && window.jspdf.jsPDF)) return setPdfMesaj("PDF oluşturucu hazırlanıyor, birkaç saniye sonra tekrar deneyin.");
    const adres = eposta.trim();
    if (epostaGonder && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(adres)) return setPdfMesaj("Lütfen geçerli bir e-posta adresi yazın.");
    window.OtelRpc.cagir("revir_listele", { p_filtre: "gun", p_limit: 500 })
      .then((l) => {
        const tarih = servisParca(simdi).tarih;
        const doc = revirPdf(l, pano, tarih, user.hotelName, user.name);
        const ad = `revir-ozet-${tarih}.pdf`;
        try {
          doc.save(ad);
        } catch (e) {}
        if (epostaGonder) {
          try {
            window.localStorage.setItem("revir_eposta", adres);
          } catch (e) {}
          const konu = encodeURIComponent(`${user.hotelName} - Revir Günlük Özeti - ${formatTarihSadece(tarih)}`);
          const govde = encodeURIComponent(`Merhaba,\n\nRevir günlük özeti PDF olarak cihaza indirildi.\nLütfen e-posta uygulamasında "${ad}" dosyasını ekleyip gönderin.\n\nOtel: ${user.hotelName}\nHazırlayan: ${user.name}`);
          window.location.href = `mailto:${adres}?subject=${konu}&body=${govde}`;
          setPdfMesaj("PDF indirildi ve e-posta uygulamanız açıldı. Dosyayı ekleyip gönderin.");
        } else setPdfMesaj("PDF indirildi.");
      })
      .catch((e) => setPdfMesaj("PDF oluşturulamadı: " + e.message));
  }

  const sekmeler = gor ? [["pano", "Pano"], ["yeni", "+ Bildir"], ["liste", "Vakalar"]] : [["yeni", "+ Bildir"]];
  const filtreler = [["acik", "Açık"], ["bekleyen", "Bekleyen"], ["hastanede", "Hastanede"], ["takip", "Takip gecikmiş"], ["gun", "Bugün"], ["kapali", "Kapalı (7 gün)"]];
  const kutuSayi = (sayi, etiket, renk, onTikla, tid) => (
    <div data-testid={tid} onClick={onTikla} style={{ flex: "1 1 30%", textAlign: "center", background: `${renk}14`, border: `1.5px solid ${renk}`, borderRadius: 12, padding: "8px 2px", cursor: onTikla ? "pointer" : "default" }}>
      <div style={{ fontSize: 26, fontWeight: 800, color: renk }}>{sayi}</div>
      <div style={{ fontSize: 11, color: "#374151", fontWeight: 700 }}>{etiket}</div>
    </div>
  );
  function git(f) {
    setFiltre(f);
    setSekme("liste");
  }
  function kart(v) {
    const d = revirDurum(v, simdi);
    return (
      <div key={v.id} data-testid={`vaka-${v.oda}`} onClick={() => setDetayId(v.id)} style={{ ...kutu, borderLeft: `5px solid ${d.renk}`, cursor: "pointer" }}>
        <div style={{ display: "flex", justifyContent: "space-between", gap: 8, alignItems: "flex-start" }}>
          <div style={{ fontWeight: 800, fontSize: 15 }}>
            {v.yuksek_risk ? "🚨 " : ""}{revirNo(v.vaka_no)} · Oda {v.oda}
          </div>
          <div style={{ background: d.renk, color: "#fff", borderRadius: 8, fontSize: 11, fontWeight: 800, padding: "3px 8px", whiteSpace: "nowrap" }}>{d.ad}</div>
        </div>
        <div style={{ fontSize: 14, marginTop: 2 }}>{v.kategori.map((k) => revirKat(k).ikon + " " + revirKat(k).ad).join("  ·  ")}</div>
        <div style={{ fontSize: 12, color: "#4B5563", marginTop: 2 }}>
          {v.kisi_sayisi} kişi · {revirEtiket(REVIR_YAS, v.yas_grubu)} · {revirEtiket(REVIR_YERLER, v.olay_yeri)} · {revirGecen(v.olay_zamani, simdi)}
        </div>
        {v.sikayet && <div style={{ fontSize: 12, color: "#4B5563" }}>{v.sikayet}</div>}
        {(v.karar || v.sevk_sekli) && (
          <div style={{ fontSize: 12, color: "#111827", marginTop: 2, fontWeight: 700 }}>
            {revirEtiket(REVIR_KARARLAR, v.karar)}{v.sevk_sekli ? " · " + revirEtiket(REVIR_SEVK, v.sevk_sekli) : ""}{v.hastane_adi ? " · " + v.hastane_adi : ""}{v.donus_zamani ? " · döndü " + servisKisa(v.donus_zamani) : ""}
          </div>
        )}
        {v.karar === "Ret" && !v.ret_formu && v.durum !== "Kapandi" && <div style={{ fontSize: 12, color: "#B91C1C", fontWeight: 800 }}>⚠ İmzalı ret formu bekleniyor</div>}
        {v.durum !== "Kapandi" && v.sonraki_takip && <div style={{ fontSize: 11, color: Date.parse(v.sonraki_takip) <= simdi ? "#B91C1C" : "#6B7280" }}>Sonraki takip: {servisKisa(v.sonraki_takip)}</div>}
      </div>
    );
  }

  if (detayId)
    return (
      <RevirDetay id={detayId} yetki={yetki || {}} simdi={simdi} kutu={kutu} girdi={girdi} toastGoster={toastGoster} onGeri={() => { setDetayId(null); yukle(true); }} />
    );

  return (
    <div style={styles.icerik}>
      <div style={styles.listeUstBaslik}>
        <button style={styles.geriButon} onClick={onGeri} aria-label="Geri">←</button>
        <div>
          <div className="baslik-font" style={styles.listeBaslikYazi}>Revir Takip</div>
          <div style={styles.ilerlemeYazi}>{user.hotelName} · sağlık vakası bildirimi ve takibi</div>
        </div>
      </div>
      <div style={{ display: "flex", gap: 6, marginTop: 12, overflowX: "auto" }}>
        {sekmeler.map(([k, ad]) => (
          <button key={k} onClick={() => setSekme(k)} style={{ flex: "1 0 auto", padding: "9px 10px", borderRadius: 10, border: "1.5px solid #B91C1C", background: sekme === k ? "#B91C1C" : "#fff", color: sekme === k ? "#fff" : "#B91C1C", fontWeight: 700, fontSize: 13, whiteSpace: "nowrap" }}>
            {ad}
          </button>
        ))}
      </div>
      {hata && <div style={styles.hataKutusu}>{hata}</div>}
      {!yetki && !hata && <div style={{ ...styles.ilerlemeYazi, marginTop: 12 }}>Yükleniyor…</div>}

      {yetki && sekme === "pano" && gor && pano && (
        <div>
          {pano.kumelenme && (
            <div data-testid="kumelenme" style={{ marginTop: 10, background: "#FEE2E2", border: "2px solid #B91C1C", borderRadius: 12, padding: 12 }}>
              <div style={{ fontWeight: 800, color: "#7F1D1D" }}>⚠️ KUSMA / İSHAL KÜMELENMESİ</div>
              <div style={{ fontSize: 13, color: "#7F1D1D", marginTop: 4 }}>
                Son 24 saatte {pano.gis_24s_oda} farklı odada vaka var (eşik {pano.esik}). Odalar: {pano.gis_odalar.join(", ")}. Gıda güvenliği, Kalite ve Genel Müdür Yardımcısı bilgilendirilmeli; misafirlerin ortak yedikleri yemek/alan sorgulanmalı.

            </div>

          <div style={{ ...kutu, borderTop: "4px solid #B91C1C" }}>
            <div style={styles.etiket}>ŞU AN</div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {kutuSayi(pano.acik, "AÇIK VAKA", "#0369A1", () => git("acik"), "p-acik")}

              {kutuSayi(pano.hastanede, "HASTANEDE", pano.hastanede ? "#B91C1C" : "#6B7280", () => git("hastanede"), "p-hastanede")}
              {kutuSayi(pano.takip_gecikmis, "TAKİP GECİKMİŞ", pano.takip_gecikmis ? "#B91C1C" : "#6B7280", () => git("takip"), "p-takip")}
              {kutuSayi(pano.yuksek_risk, "YÜKSEK RİSK", pano.yuksek_risk ? "#B91C1C" : "#6B7280", () => git("acik"), "p-risk")}
            </div>
            <div style={styles.etiket}>BUGÜN</div>
            <div style={{ display: "flex", gap: 6 }}>

function RevirBildirForm({ kutu, girdi, gor, onBitti }) {
  const bos = { oda: "", kat: [], kisi: 1, yas: "Belirsiz", cins: "", uyruk: "", yer: "Oda", sikayet: "", supheli: "", ad: "", yuksek: false };
  const [f, setF] = useState(bos);
  const [hata, setHata] = useState("");
  const [mesgul, setMesgul] = useState(false);
  const ayar = (k, v) => setF((o) => ({ ...o, [k]: v }));
  const chip = (aktif, renk) => ({ padding: "8px 12px", borderRadius: 18, border: `1.5px solid ${renk}`, background: aktif ? renk : "#fff", color: aktif ? "#fff" : renk, fontWeight: 700, fontSize: 13 });
  async function kaydet() {
    setHata("");
    if (!/^[0-9]{3,4}$/.test(f.oda.trim())) return setHata("Oda numarası 3 veya 4 haneli olmalı.");
    if (f.kat.length === 0) return setHata("En az bir şikâyet türü seçin.");
    setMesgul(true);
    try {
      const r = await window.OtelRpc.cagir("revir_bildir", {
        p_oda: f.oda.trim(), p_kategori: f.kat, p_kisi: Number(f.kisi) || 1, p_yas: f.yas, p_cinsiyet: f.cins || null, p_uyruk: f.uyruk || null,
        p_adi: f.ad.trim() || null, p_yer: f.yer, p_sikayet: f.sikayet.trim() || null, p_supheli: f.supheli.trim() || null, p_yuksek: f.yuksek,
      });
      const benzer = (r.benzer || []).length ? ` · Bu odada ${r.benzer.length} önceki/açık kayıt var (${r.benzer.map(revirNo).join(", ")})` : "";
      setF(bos);
      await onBitti(`✓ ${revirNo(r.vaka_no)} bildirildi${benzer}`);
    } catch (e) {
      setHata(e.message);
    } finally {
      setMesgul(false);
    }
  }
  return (
    <div style={kutu}>
      {hata && <div style={styles.hataKutusu}>{hata}</div>}
      <div style={styles.etiket}>ODA NUMARASI</div>
      <input style={girdi} inputMode="numeric" maxLength={4} placeholder="Örn. 1204" value={f.oda} onChange={(e) => ayar("oda", e.target.value.replace(/\D/g, ""))} />
      <div style={styles.etiket}>ŞİKÂYET TÜRÜ (birden fazla seçilebilir)</div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
        {REVIR_KATEGORILER.map((k) => (
          <button key={k.k} data-testid={`kat-${k.k}`} type="button" style={chip(f.kat.includes(k.k), "#B91C1C")} onClick={() => ayar("kat", f.kat.includes(k.k) ? f.kat.filter((x) => x !== k.k) : [...f.kat, k.k])}>
            {k.ikon} {k.ad}
          </button>
        ))}
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        <div style={{ flex: 1 }}>
          <div style={styles.etiket}>KİŞİ SAYISI</div>
          <input style={girdi} inputMode="numeric" value={f.kisi} onChange={(e) => ayar("kisi", e.target.value.replace(/\D/g, "").slice(0, 2))} />
        </div>
        <div style={{ flex: 2 }}>
          <div style={styles.etiket}>YAŞ GRUBU</div>
          <select style={girdi} value={f.yas} onChange={(e) => ayar("yas", e.target.value)}>
            {REVIR_YAS.map(([k, ad]) => (<option key={k} value={k}>{ad}</option>))}
          </select>
        </div>
      </div>
      <div style={{ display: "flex", gap: 8 }}>

function PavilionEkrani({ user, onGeri, toastGoster }) {
  const [gorunum, setGorunum] = useState("chart"); // chart | yeni | detay
  const [kayitlar, setKayitlar] = useState([]);
  const [yukleniyor, setYukleniyor] = useState(true);
  const [tarih, setTarih] = useState(bugunTarihi());
  const [tip, setTip] = useState("gunluk"); // gunluk | haftalik
  const [secilenNo, setSecilenNo] = useState(null);
  const [onDeger, setOnDeger] = useState({ pavilionNo: "", tarih: bugunTarihi() });
  const [pdfLink, setPdfLink] = useState(null);
  const [pdfMesaj, setPdfMesaj] = useState("");

  const yoneticiMi = LF_YONETICI_POZISYONLARI.includes(user.pozisyon);
  const yetkiliMi = yoneticiMi || user.department === "Genel Müdürlük";

  useEffect(() => {
    yukle(true);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  async function yukle(goster) {
    if (goster) setYukleniyor(true);
    const veri = await pavKayitlariGetir(user.hotelCode);
    setKayitlar(veri);
    setYukleniyor(false);
  }

  async function rezervasyonOlustur(form) {
    const taze = await pavKayitlariGetir(user.hotelCode);
    if (pavAktifKayit(taze, form.pavilionNo, form.tarih)) {
      throw new Error("Bu pavilion bu tarihte zaten rezerve edilmiş.");
    }
    const simdi = new Date();
    const yil = simdi.getFullYear();
    const sayac = taze.filter((k) => k.no.includes(`-${yil}-`)).length + 1;
    const no = `PAV-${yil}-${String(sayac).padStart(4, "0")}`;
    const pav = PAV_LISTESI.find((p) => p.no === form.pavilionNo);
    const kayit = {
      no,
      hotelCode: user.hotelCode,
      hotelName: user.hotelName,
      pavilionNo: form.pavilionNo,
      alan: pav ? pav.alan : "",
      tarih: form.tarih,
      odaNo: form.odaNo,
      kisiSayisi: form.kisiSayisi,
      ucret: form.ucret,
      aciklama: form.aciklama,
      durum: "Rezerve",
      olusturanKullanici: user.name,
      olusturanUserCode: user.userCode,
      olusturmaZamani: simdi.toISOString(),
      iptalNedeni: "",
      auditLog: [{ zaman: simdi.toISOString(), kullanici: user.name, islem: "Rezervasyon oluşturuldu" }],
    };
    await pavKayitKaydet(kayit);
    toastGoster(`✓ Rezervasyon kaydedildi: ${form.pavilionNo} (${no})`);
    setTarih(form.tarih);
    await yukle(true);
    setGorunum("chart");
  }

  async function durumGuncelle(kayit, yeniDurum, neden) {
    const simdi = new Date();
    const guncel = {
      ...kayit,
      durum: yeniDurum,
      iptalNedeni: yeniDurum === "İptal" ? neden : kayit.iptalNedeni,
      auditLog: [
        ...kayit.auditLog,
        {
          zaman: simdi.toISOString(),
          kullanici: user.name,
          islem: `Durum: ${yeniDurum}${yeniDurum === "İptal" && neden ? ` — ${neden}` : ""}`,
        },
      ],
    };
    await pavKayitKaydet(guncel);
    toastGoster(`✓ "${yeniDurum}" olarak işaretlendi`);
    await yukle(false);
  }

  async function bilgiDuzenle(kayit, yeni) {
    const simdi = new Date();
    const degisiklikler = [];
    if (yeni.odaNo !== kayit.odaNo) degisiklikler.push(`oda ${kayit.odaNo} → ${yeni.odaNo}`);
    if (yeni.kisiSayisi !== kayit.kisiSayisi) degisiklikler.push(`kişi ${kayit.kisiSayisi} → ${yeni.kisiSayisi}`);
    if (yeni.ucret !== kayit.ucret) degisiklikler.push(`ücret ${kayit.ucret} → ${yeni.ucret}`);
    if (yeni.aciklama !== kayit.aciklama) degisiklikler.push("açıklama güncellendi");
    if (degisiklikler.length === 0) return;
    const guncel = {
      ...kayit,
      ...yeni,
      auditLog: [
        ...kayit.auditLog,
        { zaman: simdi.toISOString(), kullanici: user.name, islem: `Düzenlendi: ${degisiklikler.join(", ")}` },
      ],
    };
    await pavKayitKaydet(guncel);
    toastGoster("✓ Rezervasyon güncellendi");
    await yukle(false);
  }

  function pdfAl(tur) {
    setPdfMesaj("");
    setPdfLink(null);
    if (!(window.jspdf && window.jspdf.jsPDF)) {
      setPdfMesaj("PDF oluşturucu henüz hazırlanıyor, birkaç saniye sonra tekrar deneyin.");
      return;
    }
    try {
      const doc =
        tur === "haftalik"
          ? pavPdfHaftalik(kayitlar, tarih, user.hotelName, user.name)
          : pavPdfGunluk(kayitlar, tarih, user.hotelName, user.name);
      const ad = `pavilion-${tur}-${tarih}.pdf`;
      try {
        doc.save(ad);
      } catch (e) {}
      try {
        const url = doc.output("bloburl");
        setPdfLink({ url: url.toString ? url.toString() : url, ad });
      } catch (e) {}
      setPdfMesaj("PDF hazır. İnmediyse aşağıdaki bağlantıya dokunun.");
    } catch (e) {
      setPdfMesaj("PDF oluşturulurken hata oluştu: " + (e && e.message ? e.message : String(e)));
    }
  }

  const secilenKayit = kayitlar.find((k) => k.no === secilenNo);

  function bosaTikla(pavNo, gun) {
    setOnDeger({ pavilionNo: pavNo, tarih: gun < bugunTarihi() ? bugunTarihi() : gun });
    setGorunum("yeni");
  }
  function doluyaTikla(k) {
    setSecilenNo(k.no);
    setGorunum("detay");
  }

  if (gorunum === "yeni") {
    return (
      <PAVYeniRezervasyon
        kayitlar={kayitlar}
        onDeger={onDeger}
        onIptal={() => setGorunum("chart")}
        onKaydet={rezervasyonOlustur}
      />
    );
  }

  if (gorunum === "detay" && secilenKayit) {
    return (
      <PAVDetay
        kayit={secilenKayit}
        yetkiliMi={yetkiliMi || secilenKayit.olusturanUserCode === user.userCode}
        onGeri={() => {
          setGorunum("chart");
          setSecilenNo(null);
        }}
        onDurum={durumGuncelle}
        onDuzenle={bilgiDuzenle}
      />
    );
  }

  const gunler = tip === "haftalik" ? Array.from({ length: 7 }, (_, i) => pavTarihEkle(tarih, i)) : [tarih];
  const aralikAktifler = kayitlar.filter((k) => gunler.includes(k.tarih) && PAV_AKTIF_DURUMLAR.includes(k.durum));
  const toplamKisi = aralikAktifler.reduce((t, k) => t + (Number(k.kisiSayisi) || 0), 0);
  const toplamUcret = aralikAktifler.reduce((t, k) => t + (Number(k.ucret) || 0), 0);
  const kapasite = PAV_LISTESI.length * gunler.length;

  const matrisSatirlari = [];
  if (tip === "haftalik") {
    PAV_ALANLAR.forEach((alan) => {
      matrisSatirlari.push(
        <tr key={`g-${alan}`}>
          <td colSpan={gunler.length + 1} style={styles.pavTabloGrup}>
            {alan}
          </td>
        </tr>
      );
      PAV_LISTESI.filter((p) => p.alan === alan).forEach((p) => {
        matrisSatirlari.push(
          <tr key={p.no}>

/* ------------------------------------------------------------------
   PAVILION REZERVASYON - yeni rezervasyon formu
-------------------------------------------------------------------*/
function PAVYeniRezervasyon({ kayitlar, onDeger, onIptal, onKaydet }) {
  const [pavilionNo, setPavilionNo] = useState(onDeger.pavilionNo || "");
  const [tarih, setTarih] = useState(onDeger.tarih || bugunTarihi());
  const [odaNo, setOdaNo] = useState("");
  const [kisi, setKisi] = useState("");
  const [ucret, setUcret] = useState("");
  const [aciklama, setAciklama] = useState("");
  const [hata, setHata] = useState("");
  const [kaydediliyor, setKaydediliyor] = useState(false);

  const mevcut = pavilionNo && tarih ? pavAktifKayit(kayitlar, pavilionNo, tarih) : null;

  async function kaydet() {
    setHata("");
    if (!pavilionNo) {
      setHata("Lütfen bir pavilion seçin.");
      return;
    }
    if (!tarih) {
      setHata("Tarih zorunludur.");
      return;
    }
    if (tarih < bugunTarihi()) {
      setHata("Geçmiş bir tarih için rezervasyon yapılamaz.");
      return;
    }
    if (!odaNo.trim()) {
      setHata("Oda numarası zorunludur.");
      return;
    }
    const kisiSayisi = parseInt(kisi, 10);
    if (!kisiSayisi || kisiSayisi < 1 || kisiSayisi > 99) {
      setHata("Kişi sayısı 1 ile 99 arasında olmalıdır.");
      return;
    }
    const ucretSayi = Number(String(ucret).replace(",", "."));
    if (String(ucret).trim() === "" || Number.isNaN(ucretSayi) || ucretSayi < 0) {
      setHata("Ücret zorunludur (ücretsiz ise 0 yazın).");
      return;
    }
    if (!aciklama.trim()) {
      setHata("Açıklama zorunludur.");
      return;
    }
    setKaydediliyor(true);
    try {
      await onKaydet({
        pavilionNo,
        tarih,
        odaNo: odaNo.trim(),
        kisiSayisi,
        ucret: ucretSayi,
        aciklama: aciklama.trim(),
      });
    } catch (e) {
      setHata(e && e.message ? e.message : "Kayıt sırasında bir hata oluştu.");
      setKaydediliyor(false);
    }
  }

  return (
    <div style={styles.icerik}>
      <div style={styles.listeUstBaslik}>
        <button style={styles.geriButon} onClick={onIptal} aria-label="Geri">
          ←
        </button>
        <div className="baslik-font" style={styles.listeBaslikYazi}>
          Yeni Pavilion Rezervasyonu
        </div>
      </div>

      <Etiket>PAVILION (zorunlu)</Etiket>
      <select style={styles.gmSecim} value={pavilionNo} onChange={(e) => setPavilionNo(e.target.value)}>
        <option value="">Seçiniz</option>
        {PAV_ALANLAR.map((alan) => (
          <optgroup key={alan} label={alan}>
            {PAV_LISTESI.filter((p) => p.alan === alan).map((p) => (
              <option key={p.no} value={p.no}>
                {p.no}
              </option>
            ))}
          </optgroup>
        ))}
      </select>

      <Etiket>TARİH (zorunlu)</Etiket>
      <input type="date" style={styles.epostaInput} value={tarih} min={bugunTarihi()} onChange={(e) => setTarih(e.target.value)} />

      {mevcut && (
        <div style={styles.hataKutusu}>
          Bu pavilion bu tarihte zaten {mevcut.durum.toLowerCase()} (Oda {mevcut.odaNo}, {mevcut.kisiSayisi} kişi).
        </div>
      )}

      <Etiket>ODA NUMARASI (zorunlu)</Etiket>
      <input style={styles.epostaInput} value={odaNo} onChange={(e) => setOdaNo(e.target.value)} placeholder="örn. 325" />

      <Etiket>KİŞİ SAYISI (zorunlu)</Etiket>
      <input
        style={styles.epostaInput}
        inputMode="numeric"
        value={kisi}
        onChange={(e) => setKisi(e.target.value.replace(/\D/g, "").slice(0, 2))}
        placeholder="örn. 4"
      />

      <Etiket>ÜCRET - TL (zorunlu)</Etiket>
      <input
        style={styles.epostaInput}
        inputMode="decimal"
        value={ucret}
        onChange={(e) => setUcret(e.target.value.replace(/[^0-9.,]/g, ""))}
        placeholder="örn. 2500"
      />

      <Etiket>AÇIKLAMA (zorunlu)</Etiket>
      <textarea
        style={styles.aciklamaAlani}
        rows={3}
        maxLength={300}
        value={aciklama}
        onChange={(e) => setAciklama(e.target.value)}
        placeholder="örn. Doğum günü organizasyonu, 18:00 servis, ikram paketi dahil"
      />
      <div style={styles.zamanNotu}>{aciklama.length}/300 karakter</div>

      {hata && <div style={styles.hataKutusu}>{hata}</div>}

      <button
        style={{ ...styles.anaButon, marginTop: 16, marginBottom: 24, opacity: kaydediliyor || mevcut ? 0.7 : 1 }}
        onClick={kaydet}
        disabled={kaydediliyor || !!mevcut}
      >
        {kaydediliyor ? "Kaydediliyor…" : "Rezervasyonu Kaydet"}
      </button>
    </div>
  );
}

function PAVDetay({ kayit, yetkiliMi, onGeri, onDurum, onDuzenle }) {

  const aktifMi = PAV_AKTIF_DURUMLAR.includes(kayit.durum);
  const renk = aktifMi ? pavDurumRengi(kayit) : "#9CA3AF";

  async function durumDegistir(yeniDurum, neden) {
    setIslem(true);
    await onDurum(kayit, yeniDurum, neden);
    setIslem(false);
  }

  async function duzenlemeKaydet() {
    setHata("");
    if (!odaNo.trim()) {
      setHata("Oda numarası zorunludur.");
      return;
    }
    const kisiSayisi = parseInt(kisi, 10);
    if (!kisiSayisi || kisiSayisi < 1 || kisiSayisi > 99) {
      setHata("Kişi sayısı 1 ile 99 arasında olmalıdır.");
      return;
    }
    const ucretSayi = Number(String(ucret).replace(",", "."));
    if (String(ucret).trim() === "" || Number.isNaN(ucretSayi) || ucretSayi < 0) {
      setHata("Ücret zorunludur (ücretsiz ise 0 yazın).");
      return;
    }
    if (!aciklama.trim()) {
      setHata("Açıklama zorunludur.");
      return;
    }
    setIslem(true);
    await onDuzenle(kayit, { odaNo: odaNo.trim(), kisiSayisi, ucret: ucretSayi, aciklama: aciklama.trim() });
    setIslem(false);
    setDuzenle(false);

  return (

          </div>

            <span>Kişi Sayısı</span>
            <strong>{kayit.kisiSayisi}</strong>
          </div>

        <div style={styles.bilgiKutusu}>

      )}
    </div>
  );
}

function AdminEkrani({ onCikis, onPinDegistir }) {
  const [yukleniyor, setYukleniyor] = useState(true);
  const [oteller, setOteller] = useState([]);
  const [kullanicilar, setKullanicilar] = useState([]);
  const [hata, setHata] = useState("");
  const [acikKullanici, setAcikKullanici] = useState(null); // "hotelCode:userCode"
  const [ilerlemeVerisi, setIlerlemeVerisi] = useState({}); // { [anahtar]: {...} }
  const [duzenlenenKullanici, setDuzenlenenKullanici] = useState(null); // anahtar
  const [duzenleForm, setDuzenleForm] = useState({ department: "", bolum: "", pozisyon: "", password: "" });
  const [kaydediliyor, setKaydediliyor] = useState(false);
  const [duzenleMesaj, setDuzenleMesaj] = useState("");
  const [sifirlananPin, setSifirlananPin] = useState(null); // { anahtar, baslik, pin }
  const [pasifOnay, setPasifOnay] = useState(null);
  const [pasifSayac, setPasifSayac] = useState(0);

  async function pinSifirla(k) {
    setKaydediliyor(true);
    setDuzenleMesaj("");
    try {
      const r = await window.OtelYonetim.cagir("pin_sifirla", { hotelCode: k.hotelCode, userCode: k.userCode });
      setSifirlananPin({ anahtar: `${k.hotelCode}:${k.userCode}`, baslik: `${k.name} için yeni geçici PIN`, pin: r.pin });
    } catch (e) {
      setDuzenleMesaj(e.message || "PIN sıfırlanamadı.");
    }
    setKaydediliyor(false);
  }

  async function hesapPasiflestir(k) {
    const anahtar = `${k.hotelCode}:${k.userCode}`;
    if (pasifOnay !== anahtar) {
      setPasifOnay(anahtar); // ikinci dokunuşta onaylanır
      return;
    }
    setKaydediliyor(true);
    setDuzenleMesaj("");
    try {
      await window.OtelYonetim.cagir("kullanici_guncelle", { hotelCode: k.hotelCode, userCode: k.userCode, active: false });
      setPasifOnay(null);
      setDuzenlenenKullanici(null);
      await verileriYukle();
      setPasifSayac((x) => x + 1);
    } catch (e) {
      setDuzenleMesaj(e.message || "Hesap pasifleştirilemedi.");
    }
    setKaydediliyor(false);
  }

  useEffect(() => {
    verileriYukle();
  }, []);

  // Açık olan kullanıcının ilerlemesini canlı tutmak için periyodik yenileme.
  useEffect(() => {
    if (!acikKullanici) return;
    const kullanici = kullanicilar.find((k) => `${k.hotelCode}:${k.userCode}` === acikKullanici);
    if (!kullanici) return;
    const zamanlayici = setInterval(() => ilerlemeGetir(kullanici), 15000);
    return () => clearInterval(zamanlayici);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [acikKullanici, kullanicilar]);

  async function verileriYukle() {
    setYukleniyor(true);
    setHata("");
    try {
      const otelListesi = await window.storage.list("hotels:", true);
      const otelKeyleri = (otelListesi && otelListesi.keys) || [];
      const otelKayitlari = [];
      for (const k of otelKeyleri) {
        const r = await safeGet(k, true);
        if (r) {
          try {
            otelKayitlari.push(JSON.parse(r.value));
          } catch (e) {}
        }
      }
      otelKayitlari.sort((a, b) => (a.code < b.code ? -1 : 1));
      setOteller(otelKayitlari);

      const kullaniciListesi = await window.storage.list("users:", true);
      const kullaniciKeyleri = (kullaniciListesi && kullaniciListesi.keys) || [];
      const kullaniciKayitlari = [];
      for (const k of kullaniciKeyleri) {
        const r = await safeGet(k, true);
        if (r) {
          try {
            kullaniciKayitlari.push(JSON.parse(r.value));
          } catch (e) {}
        }
      }
      setKullanicilar(kullaniciKayitlari);
    } catch (e) {
      setHata("Veriler yüklenirken bir hata oluştu: " + (e && e.message ? e.message : String(e)));
    }
    setYukleniyor(false);
  }

  async function ilerlemeGetir(kullanici) {
    const anahtar = `${kullanici.hotelCode}:${kullanici.userCode}`;
    setIlerlemeVerisi((prev) => ({
      ...prev,
      [anahtar]: { ...(prev[anahtar] || {}), yukleniyor: true },
    }));
    try {
      const tarih = bugunTarihi();
      const key = gunlukKayitAnahtari(kullanici, tarih);
      const r = await safeGet(key, true);
      if (!r) {
        setIlerlemeVerisi((prev) => ({
          ...prev,
          [anahtar]: { yukleniyor: false, bulunamadi: true },
        }));
        return;
      }
      const veri = JSON.parse(r.value);
      setIlerlemeVerisi((prev) => ({
        ...prev,
        [anahtar]: {
          yukleniyor: false,
          bulunamadi: false,
          tamamlanan: kayitTamamlananSayisiKullanici(veri, kullanici),
          toplam: kayitToplamMaddeSayisiKullanici(veri, kullanici),
          tamamlandiMi: veri.tamamlandiMi,
          guncellemeSaati: new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" }),
        },
      }));
    } catch (e) {
      setIlerlemeVerisi((prev) => ({
        ...prev,
        [anahtar]: { yukleniyor: false, hata: true },
      }));
    }
  }

  function satiraTikla(kullanici) {
    const anahtar = `${kullanici.hotelCode}:${kullanici.userCode}`;
    if (acikKullanici === anahtar) {
      setAcikKullanici(null);
      return;
    }
    setAcikKullanici(anahtar);
    setDuzenlenenKullanici(null);
    ilerlemeGetir(kullanici);
  }

  function duzenlemeyeBasla(k) {
    const anahtar = `${k.hotelCode}:${k.userCode}`;
    setDuzenlenenKullanici(anahtar);
    setDuzenleForm({
      department: k.department,
      bolum: k.bolum || "",
      pozisyon: k.pozisyon || "",
      password: "",
    });
    setDuzenleMesaj("");
  }

  async function duzenlemeyiKaydet(k) {
    setKaydediliyor(true);
    setDuzenleMesaj("");
    try {
      if (!duzenleForm.department) throw new Error("Lütfen bir Departman seçin.");
      if (!duzenleForm.bolum) throw new Error("Lütfen bir Bölüm seçin.");
      if (!duzenleForm.pozisyon) throw new Error("Lütfen bir Pozisyon seçin.");
      await window.OtelYonetim.cagir("kullanici_guncelle", {
        hotelCode: k.hotelCode,
        userCode: k.userCode,
        department: duzenleForm.department,
        bolum: duzenleForm.bolum,
        pozisyon: duzenleForm.pozisyon,
      });
      setDuzenlenenKullanici(null);
      await verileriYukle();
    } catch (e) {
      setDuzenleMesaj(e.message || "Kaydetme sırasında bir hata oluştu.");
    }
    setKaydediliyor(false);
  }

  return (
    <div style={styles.icerik}>
      <div style={styles.anahtarKart}>
        <div style={styles.anahtarUst}>
          <span style={styles.anahtarEtiket}>YÖNETİM PANELİ</span>
          <div style={styles.manyetikSerit} />
        </div>
        <div className="baslik-font" style={styles.anahtarBaslik}>
          Tüm Oteller ve Kullanıcılar
        </div>
        <div style={styles.anahtarAltBilgi}>
          {oteller.length} otel · {kullanicilar.length} kullanıcı (Admin hariç {Math.max(kullanicilar.length - 1, 0)})
        </div>
      </div>

      {yukleniyor ? (
        <div style={styles.merkezYukleniyor}>Yükleniyor…</div>
      ) : hata ? (
        <div style={{ ...styles.hataKutusu, marginTop: 16 }}>{hata}</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 14, marginTop: 16 }}>
          {oteller.map((otel) => {
            const otelKullanicilari = kullanicilar
              .filter((k) => k.hotelCode === otel.code && k.department !== "Admin")
              .sort((a, b) => (a.userCode < b.userCode ? -1 : 1));
            if (otel.code === "0001") return null; // yönetim "oteli"ni listede göstermeye gerek yok
            return (
              <div key={otel.code} style={styles.adminOtelKarti}>
                <div style={styles.adminOtelBaslik}>
                  <span>{otel.name}</span>
                  <span style={styles.adminOtelKodRozeti}>Kod {otel.code}</span>
                </div>

                {otelKullanicilari.length === 0 ? (
                  <div style={styles.adminBosMetin}>Bu otel için henüz kullanıcı tanımlanmadı.</div>
                ) : (
                  <div style={styles.adminTablo}>
                    <div style={{ ...styles.adminSatir, ...styles.adminSatirBaslik }}>
                      <div style={styles.adminHucreKod}>Kod</div>
                      <div style={styles.adminHucreIsim}>İsim</div>
                      <div style={styles.adminHucreDepartman}>Departman</div>
                      <div style={styles.adminHucreSifre}>Şifre</div>
                    </div>
                    {otelKullanicilari.map((k) => {
                      const anahtar = `${k.hotelCode}:${k.userCode}`;
                      const acik = acikKullanici === anahtar;
                      const ilerleme = ilerlemeVerisi[anahtar];
                      return (
                        <div key={k.userCode}>
                          <button
                            style={{ ...styles.adminSatir, ...styles.adminSatirButon }}
                            onClick={() => satiraTikla(k)}
                          >
                            <div style={styles.adminHucreKod}>{k.userCode}</div>
                            <div style={styles.adminHucreIsim}>{k.name}</div>
                            <div style={styles.adminHucreDepartman}>{k.department}</div>
                            <div style={styles.adminHucreSifre}>••••••</div>
                            <div style={styles.adminOkIsareti}>{acik ? "▲" : "▼"}</div>
                          </button>

                          {acik && (
                            <div style={styles.adminIlerlemePaneli}>
                              {!ilerleme || ilerleme.yukleniyor ? (
                                <div style={styles.adminIlerlemeYukleniyor}>Yükleniyor…</div>
                              ) : ilerleme.hata ? (
                                <div style={styles.adminIlerlemeHata}>İlerleme bilgisi alınamadı.</div>
                              ) : ilerleme.bulunamadi ? (
                                <div style={styles.adminIlerlemeBos}>
                                  Bugün için "{k.department}" departmanında henüz bir kontrol listesi başlatılmadı.
                                </div>
                              ) : (
                                <>
                                  <div style={styles.adminIlerlemeUstSatir}>
                                    <span>
                                      Bugün · {k.department}
                                {k.bolum ? ` · ${bolumBasligiBul(k.department, k.bolum)}` : ""} ·{" "}
                                      <strong>
                                        {ilerleme.tamamlanan}/{ilerleme.toplam}
                                      </strong>{" "}
                                      madde işaretlendi
                                    </span>
                                    <span style={styles.adminIlerlemeSaat}>{ilerleme.guncellemeSaati}</span>
                                  </div>
                                  <div style={styles.ilerlemeCubugu}>
                                    <div
                                      style={{
                                        ...styles.ilerlemeDoluluk,
                                        width: `${
                                          ilerleme.toplam > 0 ? (ilerleme.tamamlanan / ilerleme.toplam) * 100 : 0
                                        }%`,
                                      }}
                                    />
                                  </div>
                                  {ilerleme.tamamlandiMi && (
                                    <div style={styles.adminIlerlemeTamamRozeti}>✓ Tamamlandı</div>
                                  )}
                                  <div style={styles.adminIlerlemeNot}>
                                    Bu ilerleme, "{k.department}" departmanındaki tüm kullanıcılar tarafından
                                    paylaşılan ortak kontrol listesine aittir; 15 saniyede bir otomatik güncellenir.
                                  </div>
                                </>
                              )}

                              {duzenlenenKullanici === anahtar ? (
                                <div style={styles.adminDuzenleForm}>
                                  <Etiket>DEPARTMAN (zorunlu)</Etiket>
                                  <select
                                    style={styles.gmSecim}
                                    value={duzenleForm.department}
                                    onChange={(e) =>
                                      setDuzenleForm((f) => ({ ...f, department: e.target.value, bolum: "" }))
                                    }
                                  >
                                    <option value="">Seçiniz</option>
                                    {STANDART_DEPARTMAN_YAPISI.map((d) => (
                                      <option key={d.harf} value={d.departman}>
                                        {d.harf}. {d.departman}
                                      </option>
                                    ))}
                                  </select>

                                  <Etiket>BÖLÜM (zorunlu)</Etiket>
                                  <select
                                    style={styles.gmSecim}
                                    value={duzenleForm.bolum}
                                    onChange={(e) => setDuzenleForm((f) => ({ ...f, bolum: e.target.value }))}
                                    disabled={!STANDART_DEPARTMAN_YAPISI.find((d) => d.departman === duzenleForm.department)}
                                  >
                                    <option value="">Seçiniz</option>
                                    {(
                                      (STANDART_DEPARTMAN_YAPISI.find((d) => d.departman === duzenleForm.department) || {})
                                        .bolumler || []
                                    ).map((b) => (
                                      <option key={b} value={b}>
                                        {b}
                                      </option>
                                    ))}
                                  </select>

                                  <Etiket>POZİSYON (zorunlu)</Etiket>
                                  <select
                                    style={styles.gmSecim}
                                    value={duzenleForm.pozisyon}
                                    onChange={(e) => setDuzenleForm((f) => ({ ...f, pozisyon: e.target.value }))}
                                  >
                                    <option value="">Seçiniz</option>
                                    {STANDART_POZISYON_LISTESI.map((p) => (
                                      <option key={p} value={p}>
                                        {p}
                                      </option>
                                    ))}
                                  </select>

                                  <div style={{ marginTop: 14 }}>
                                    <button
                                      style={styles.gmKucukIptalButon}
                                      onClick={() => pinSifirla(k)}
                                      disabled={kaydediliyor}
                                    >
                                      🔑 PIN'i Sıfırla (yeni geçici PIN üret)
                                    </button>
                                    <button
                                      style={{ ...styles.gmKucukIptalButon, marginLeft: 8, color: "#A33" }}
                                      onClick={() => hesapPasiflestir(k)}
                                      disabled={kaydediliyor}
                                    >
                                      {pasifOnay === anahtar ? "Emin misiniz? Tekrar dokunun" : "⛔ Hesabı Pasifleştir"}
                                    </button>
                                    {sifirlananPin && sifirlananPin.anahtar === anahtar && (
                                      <PinKutusu
                                        baslik={sifirlananPin.baslik}
                                        pin={sifirlananPin.pin}
                                        onKapat={() => setSifirlananPin(null)}
                                      />
                                    )}
                                  </div>

                                  {duzenleMesaj && <div style={styles.hataKutusu}>{duzenleMesaj}</div>}

                                  <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                                    <button
                                      style={{ ...styles.gmKucukButon, flex: 1, opacity: kaydediliyor ? 0.7 : 1 }}
                                      onClick={() => duzenlemeyiKaydet(k)}
                                      disabled={kaydediliyor}
                                    >
                                      {kaydediliyor ? "Kaydediliyor…" : "Kaydet"}
                                    </button>
                                    <button
                                      style={{ ...styles.gmKucukIptalButon, flex: 1 }}
                                      onClick={() => setDuzenlenenKullanici(null)}
                                    >
                                      Vazgeç
                                    </button>
                                  </div>
                                </div>
                              ) : (
                                <button style={styles.adminDuzenleButon} onClick={() => duzenlemeyeBasla(k)}>
                                  ✏️ Düzenle
                                </button>
                              )}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      <div style={styles.notMetni}>
        Not: PIN'ler güvenlik gereği burada gösterilmez; yalnızca kullanıcının kendisi değiştirebilir
        ya da yönetici sunucu tarafında sıfırlayabilir.
      </div>

      <PasifKullanicilarKutusu key={pasifSayac} onDegisti={verileriYukle} />

      <button style={{ ...styles.metinButon, marginTop: 12 }} onClick={onPinDegistir}>
        🔑 PIN Değiştir
      </button>
      <button style={{ ...styles.metinButon, marginTop: 4, marginBottom: 24 }} onClick={onCikis}>
        Çıkış Yap
      </button>
    </div>
  );
}

function GecmisEkrani({ kayitlar, yukleniyor, onGeri, onPdf, jsPdfHazirMi }) {
  return (
    <div style={styles.icerik}>
      <div style={styles.listeUstBaslik}>
        <button style={styles.geriButon} onClick={onGeri} aria-label="Geri">
          ←
        </button>
        <div className="baslik-font" style={styles.listeBaslikYazi}>
          Geçmiş Kayıtlar
        </div>
      </div>

      {yukleniyor ? (
        <div style={styles.merkezYukleniyor}>Yükleniyor…</div>
      ) : kayitlar.length === 0 ? (
        <div style={{ color: "#6B7280", marginTop: 24, fontSize: 14 }}>
          Bu departman için henüz kayıtlı bir kontrol listesi bulunmuyor.
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 16 }}>
          {kayitlar.map((k, i) => {
            const tumGorevler = k.odalar ? k.odalar.flatMap((o) => o.gorevler) : k.tasks || [];
            const olumsuz = tumGorevler.filter((t) => t.status === "olumsuz").length;
            const mevcutDegil = tumGorevler.filter((t) => t.status === "mevcut_degil").length;
            const isaretli = kayitTamamlananSayisi(k);
            const toplamMadde = kayitToplamMaddeSayisi(k);
            return (
              <div key={i} style={styles.gecmisKarti}>
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <strong style={{ color: "#16323A" }}>{formatTarihSadece(k.date)}</strong>
                  <span style={{ fontSize: 12, color: "#6B7280" }}>{k.userName}</span>
                </div>
                <div style={{ fontSize: 12, color: "#6B7280", marginTop: 4 }}>
                  {isaretli}/{toplamMadde} madde · {k.tamamlandiMi ? "Tamamlandı" : "Süre içinde tamamlanmadı"}
                  {k.odalar ? ` · ${k.odalar.length} kontrol noktası` : ""}
                </div>
                <div
                  style={{
                    marginTop: 6,
                    fontSize: 12,
                    fontWeight: 600,
                    color: olumsuz > 0 ? "#B7472A" : "#2F7D5C",
                  }}
                >
                  {olumsuz > 0 ? `${olumsuz} olumsuz madde` : mevcutDegil > 0 ? `Olumsuz yok · ${mevcutDegil} mevcut değil` : "Tüm maddeler olumlu"}
                </div>
                <button
                  style={styles.kucukPdfButon}
                  onClick={() => onPdf(k)}
                  title={jsPdfHazirMi() ? "" : "PDF oluşturucu hazırlanıyor"}
                >
                  📄 PDF Oluştur
                </button>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function Etiket({ children }) {
  return <div style={styles.etiket}>{children}</div>;
}
