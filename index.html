<script>
window.storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    return v !== null ? { key, value: v } : null;
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
  async delete(key) {
    localStorage.removeItem(key);
    return { key, deleted: true };
  },
  async list(prefix) {
    const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
    return { keys, prefix };
  },
};

function hataGoster(mesaj) {
  var kutu = document.getElementById("hataKutusu");
  var metin = document.getElementById("hataMetni");
  if (kutu && metin) {
    metin.textContent = mesaj;
    kutu.style.display = "block";
  }
}

window.addEventListener("error", function (e) {
  hataGoster((e.message || "Bilinmeyen hata") + "\n" + (e.filename ? (e.filename + ":" + e.lineno) : ""));
});

window.addEventListener("load", function () {
  setTimeout(function () {
    var eksikler = [];
    if (typeof React === "undefined") eksikler.push("React");
    if (typeof ReactDOM === "undefined") eksikler.push("ReactDOM");
    if (typeof Babel === "undefined") eksikler.push("Babel");
    if (eksikler.length > 0) {
      hataGoster(
        "Şu kütüphaneler yüklenemedi: " + eksikler.join(", ") +
        ".\n\nBu genellikle internet bağlantınızın veya kullandığınız ağın " +
        "cdnjs.cloudflare.com adresine erişimi engellemesinden kaynaklanır. " +
        "Lütfen farklı bir ağ (örn. mobil veri / farklı Wi-Fi) ile tekrar deneyin."
      );
    }
  }, 4000);
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("service-worker.js").catch(function () {});
  });
}

// Bir departmanın toplam kontrol noktası sayısını döner (bölümlü ya da düz fark etmez).
function departmanToplamMaddeSayisi(department) {
  if (DEPARTMAN_BOLUMLERI[department]) {
    return DEPARTMAN_BOLUMLERI[department].reduce((toplam, b) => toplam + b.maddeler.length, 0);
  }
  return (DEPARTMAN_LISTELERI_CALISMA[department] || []).length;
}

// Bölümlü bir departman için düz (flat) görev dizisi üretir; her göreve
// hangi bölüme ait olduğu bilgisini (bolum harfi + başlığı) ekler.
function bolumlerdenGorevOlustur(bolumler) {
  const gorevler = [];
  let sayac = 1;
  bolumler.forEach((bolum) => {
    bolum.maddeler.forEach((madde) => {
      const isObj = typeof madde === "object" && madde !== null;
      const tip = isObj ? madde.tip || "evethayir" : "evethayir";
      const text = isObj ? madde.text : madde;
      const gorev = {
        id: sayac++,
        text,
        tip,
        status: null,
        zaman: null,
        aciklama: "",
        photo: null,
        bolum: bolum.harf,
        bolumBaslik: bolum.baslik,
      };
      if (tip === "sayisal") {
        const alanEtiketleri = (isObj && madde.alanlar) || [text];
        gorev.alanlar = alanEtiketleri.map((label) => ({ label, deger: "" }));
      }
      if (tip === "metin") {
        gorev.metinDeger = "";
      }
      gorevler.push(gorev);
    });
  });
  return gorevler;
}

function bolumluGorevleriOlustur(department) {
  return bolumlerdenGorevOlustur(DEPARTMAN_BOLUMLERI[department]);
}

// Bir görevin "tamamlandı" sayılıp sayılmayacağını, madde tipine göre belirler:
// - evethayir: OLUMLU/OLUMSUZ işaretlenmiş olması yeterli
// - sayisal: tüm alt alanlara değer girilmiş olması gerekir
// - metin: metin alanına bir şey yazılmış olması gerekir
function gorevTamamMi(t) {
  if (t.tip === "sayisal") {
    return (t.alanlar || []).every((a) => a.deger && a.deger.trim() !== "");
  }
  if (t.tip === "metin") {
    return !!(t.metinDeger && t.metinDeger.trim() !== "");
  }
  return !!t.status;
}

// Bir günlük kaydın toplam "tamamlanan" ve "toplam" madde sayısını döner.
// Oda bazlı departmanlarda (record.odalar) tüm odalardaki maddeler toplanır;
// diğerlerinde doğrudan record.tasks kullanılır.
function kayitTamamlananSayisi(record) {
  if (!record) return 0;
  if (record.odalar) {
    return record.odalar.reduce((t, o) => t + o.gorevler.filter((g) => gorevTamamMi(g)).length, 0);
  }
  return (record.tasks || []).filter((t) => gorevTamamMi(t)).length;
}

function kayitToplamMaddeSayisi(record) {
  if (!record) return 0;
  if (record.odalar) {
    return record.odalar.reduce((t, o) => t + o.gorevler.length, 0);
  }
  return (record.tasks || []).length;
}

// Bir kullanıcının "bölüm" alanı varsa (örn. Teknik Servis'te sadece
// Elektrik'ten sorumlu), ilerleme sayımı da o kullanıcının kendi bölümüyle
// sınırlı tutulur. Pozisyon yoksa (veya bölümlü/oda bazlı olmayan bir
// departmansa) normal davranışa (departmanın tamamı) geri döner.
function kayitTamamlananSayisiKullanici(record, kullanici) {
  if (!record || !kullanici || !kullanici.bolum || !record.tasks) {
    return kayitTamamlananSayisi(record);
  }
  return record.tasks.filter((t) => t.bolum === kullanici.bolum && gorevTamamMi(t)).length;
}

function kayitToplamMaddeSayisiKullanici(record, kullanici) {
  if (!record || !kullanici || !kullanici.bolum || !record.tasks) {
    return kayitToplamMaddeSayisi(record);
  }
  return record.tasks.filter((t) => t.bolum === kullanici.bolum).length;
}

// Bir departman + harf kodundan bölüm başlığını bulur (örn. "Teknik Servis","A" -> "Elektrik Sistemleri").
function bolumBasligiBul(department, harf) {
  const bolum = (DEPARTMAN_BOLUMLERI[department] || []).find((b) => b.harf === harf);
  return bolum ? bolum.baslik : harf;
}

/* ------------------------------------------------------------------
   YARDIMCI FONKSİYONLAR
-------------------------------------------------------------------*/

async function safeGet(key, shared) {
  try {
    const res = await window.storage.get(key, shared);
    return res || null;
  } catch (e) {
    return null;
  }
}

function bugunTarihi() {
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${yyyy}-${mm}-${dd}`;
}

function pencereDurumu() {
  if (ZAMANLAMA_DEVRE_DISI) return "aktif";
  const simdi = new Date();
  const saat = simdi.getHours() + simdi.getMinutes() / 60;
  if (saat < BASLANGIC_SAATI) return "once";
  if (saat >= BITIS_SAATI) return "sonra";
  return "aktif";
}

function formatTarih(iso) {
  const d = new Date(iso);
  return d.toLocaleString("tr-TR", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function saatGectiMi(saatStr) {
  const [h, m] = saatStr.split(":").map(Number);
  const simdi = new Date();
  const hedef = new Date();
  hedef.setHours(h, m, 0, 0);
  return simdi >= hedef;
}

// Telegram Bot API'ye doğrudan tarayıcıdan istek atarak grup sohbetine
// hatırlatma mesajı gönderir. Token veya Chat ID boşsa hiçbir şey yapmaz.
async function telegramMesajGonder(mesaj) {
  if (!TELEGRAM_BOT_TOKEN || !TELEGRAM_CHAT_ID) return;
  try {
    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: mesaj }),
    });
  } catch (e) {
    // Sessizce yut: internet yoksa ya da Telegram'a ulaşılamıyorsa
    // uygulamanın geri kalanını etkilemesin.
  }
}

function formatTarihSadece(dateStr) {
  const [y, m, d] = dateStr.split("-");
  return `${d}.${m}.${y}`;
}

  const [bildirimDurumu, setBildirimDurumu] = useState(
    typeof Notification !== "undefined" ? Notification.permission : "unsupported"
  );

  const fileInputRefs = useRef({});
  const autosaveTimer = useRef(null);

  function bildirimIzniIste() {
    if (typeof Notification === "undefined") return;
    Notification.requestPermission().then((sonuc) => setBildirimDurumu(sonuc));
  }

  // --- Genel Müdür yönetim yetkileri: departman / kullanıcı / kontrol satırı ---
  // Kullanıcı oluşturma ve özet ekranı DAİMA çağıran GM'in kendi otel koduna
  // (hotelCode) kilitlenir; başka bir otelin kullanıcılarına erişilemez.

  async function departmanOlustur(ad) {
    const temiz = ad.trim();
    if (!temiz) throw new Error("Departman adı boş olamaz.");
    if (tumDepartmanAdlari().includes(temiz)) {
      throw new Error("Bu departman adı zaten kullanılıyor.");
    }
    await ozelDepartmanKaydet(temiz, []);
  }

  async function yeniKullaniciOlustur({ hotelCode, userCode, password, name, department, bolum, pozisyon }) {
    if (userCode.length !== 4 || password.length !== 4) {
      throw new Error("Kullanıcı kodu ve şifre 4 haneli olmalıdır.");
    }
    if (!name.trim()) throw new Error("İsim boş olamaz.");
    const mevcut = await safeGet(`users:${hotelCode}:${userCode}`, true);
    if (mevcut) throw new Error("Bu kullanıcı kodu bu otelde zaten kullanılıyor.");
    const kayit = { hotelCode, userCode, password, name: name.trim(), department };
    if (bolum) kayit.bolum = bolum;
    if (pozisyon) kayit.pozisyon = pozisyon;
    await window.storage.set(`users:${hotelCode}:${userCode}`, JSON.stringify(kayit), true);
  }

  async function kontrolSatiriEkle(departman, metin) {
    const temiz = metin.trim();
    if (!temiz) throw new Error("Madde metni boş olamaz.");
    const guncel = [...(DEPARTMAN_LISTELERI_CALISMA[departman] || []), temiz];
    await ozelDepartmanKaydet(departman, guncel);
  }

  async function kontrolSatiriDuzenle(departman, index, metin) {
    const temiz = metin.trim();
    if (!temiz) throw new Error("Madde metni boş olamaz.");
    const guncel = [...DEPARTMAN_LISTELERI_CALISMA[departman]];
    guncel[index] = temiz;
    await ozelDepartmanKaydet(departman, guncel);
  }

  async function kontrolSatiriSil(departman, index) {
    const guncel = DEPARTMAN_LISTELERI_CALISMA[departman].filter((_, i) => i !== index);
    await ozelDepartmanKaydet(departman, guncel);
  }

  // Her ekranda görünen, kısa süreli onay mesajı (örn. "Kaydedildi")
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);
  function toastGoster(mesaj) {
    setToast(mesaj);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 3500);
  }

  // PDF için yedek bağlantı: otomatik indirme çalışmazsa (bazı Android
  // tarayıcılarında "yüklü uygulama" modunda indirme engellenebiliyor)
  // kullanıcı bu bağlantıya dokunup PDF'i açabilir/indirebilir.
  const [pdfLinkUrl, setPdfLinkUrl] = useState(null);
  const [pdfLinkAdi, setPdfLinkAdi] = useState("");

  // Genel Müdürlük'ten Kat Hizmetleri kullanıcısına atanan, henüz kabul
  // edilmemiş oda görevleri.
  const [bekleyenGorevler, setBekleyenGorevler] = useState([]);

  useEffect(() => {
    seedData();
    const script = document.createElement("script");
    script.src = JSPDF_URL;
    document.body.appendChild(script);
    const zamanlayici = setInterval(() => setTick((x) => x + 1), 60000);
    return () => clearInterval(zamanlayici);
  }, []);

  async function seedData() {
    for (const h of OTELLER_BASLANGIC) {
      const mevcut = await safeGet(`hotels:${h.code}`, true);
      if (!mevcut) await window.storage.set(`hotels:${h.code}`, JSON.stringify(h), true);
    }
    for (const u of KULLANICILAR_BASLANGIC) {
      const mevcut = await safeGet(`users:${u.hotelCode}:${u.userCode}`, true);
      if (!mevcut)
        await window.storage.set(`users:${u.hotelCode}:${u.userCode}`, JSON.stringify(u), true);
    }
    await ozelDepartmanlariYukle();
    setHazirlaniyor(false);
  }

  function digitInput(value, setter) {
    setter(value.replace(/\D/g, "").slice(0, 4));
  }

  async function handleLogin() {
    setGirisHatasi("");
    if (hotelCode.length !== 4 || userCode.length !== 4 || password.length !== 4) {
      setGirisHatasi("Otel kodu, kullanıcı kodu ve şifre 4 haneli olmalıdır.");
      return;
    }
    setGirisYukleniyor(true);
    const hotelRes = await safeGet(`hotels:${hotelCode}`, true);
    if (!hotelRes) {
      setGirisHatasi("Otel kodu bulunamadı.");
      setGirisYukleniyor(false);
      return;
    }
    const userRes = await safeGet(`users:${hotelCode}:${userCode}`, true);
    if (!userRes) {
      setGirisHatasi("Kullanıcı kodu bulunamadı.");
      setGirisYukleniyor(false);
      return;
    }
    const hotel = JSON.parse(hotelRes.value);
    const user = JSON.parse(userRes.value);
    if (user.password !== password) {
      setGirisHatasi("Şifre hatalı.");
      setGirisYukleniyor(false);
      return;
    }
    const tamUser = { ...user, hotelName: hotel.name };
    setCurrentUser(tamUser);
    setGirisYukleniyor(false);
    if (user.department === "Admin") {
      setScreen("admin");
      return;
    }
    setScreen("home");
    await bugununKaydiniYukle(tamUser);
    if (DEPARTMAN_ODA_BAZLI[user.department]) {
      bekleyenGorevleriGetir(tamUser);
    }
  }

  function handleLogout() {
    setCurrentUser(null);
    setRecord(null);
    setHotelCode("");
    setUserCode("");
    setPassword("");
    setRaporPaneliAcik(false);
    setRaporMesaj("");
    setBekleyenGorevler([]);
    setScreen("login");
  }

  // --- Genel Müdürlük'ten Kat Hizmetleri'ne oda görevi atama ---

  async function bekleyenGorevleriGetir(user) {
    try {
      const liste = await window.storage.list(`gorev:${user.hotelCode}:${user.userCode}:`, true);
      const keyler = (liste && liste.keys) || [];
      const gorevler = [];
      for (const k of keyler) {
        const r = await safeGet(k, true);
        if (r) {
          try {
            const veri = JSON.parse(r.value);
            if (veri.durum === "bekliyor") gorevler.push({ ...veri, key: k });
          } catch (e) {}
        }
      }
      setBekleyenGorevler(gorevler);
    } catch (e) {}
  }

  async function gorevKabulEt(gorev) {
    odaEkle(gorev.odaKodu, { atanmis: true, atayanAdi: gorev.atayanAdi });
    try {
      await window.storage.set(
        gorev.key,
        JSON.stringify({ ...gorev, durum: "kabul_edildi", kabulZamani: new Date().toISOString() }),
        true
      );
    } catch (e) {}
    setBekleyenGorevler((prev) => prev.filter((g) => g.key !== gorev.key));
    toastGoster(`✓ Görev kabul edildi — Oda ${gorev.odaKodu} eklendi`);
  }

  async function bugununKaydiniYukle(user) {
    setKayitYukleniyor(true);
    const tarih = bugunTarihi();
    const key = `checklist:${user.hotelCode}:${user.department}:${tarih}`;
    const mevcut = await safeGet(key, true);
    const odaBazliMi = !!DEPARTMAN_ODA_BAZLI[user.department];

    if (mevcut) {
      const veri = JSON.parse(mevcut.value);
      const uyumlu = odaBazliMi
        ? Array.isArray(veri.odalar)
        : veri.tasks && veri.tasks.length === departmanToplamMaddeSayisi(user.department);
      if (uyumlu) {
        if (!odaBazliMi) {
          veri.tasks = veri.tasks.map((t) => ({ zaman: null, ...t }));
        }
        veri.remindedTasks = veri.remindedTasks || [];
        setRecord(veri);
        setKayitYukleniyor(false);
        return;
      }
      // Kontrol listesi güncellendiği için (madde sayısı değişti), bu güne ait
      // eski kayıt yeni şablona göre sıfırdan oluşturuluyor.
    }

    const temelKayit = {
      key,
      date: tarih,
      hotelCode: user.hotelCode,
      hotelName: user.hotelName,
      department: user.department,
      userCode: user.userCode,
      userName: user.name,
      remindedTasks: [],
      tamamlandiMi: false,
      tamamlanmaZamani: null,
      sonGuncelleme: new Date().toISOString(),
    };

    if (odaBazliMi) {
      // Oda bazlı departmanlarda her gün boş bir "kontrol noktası" listesiyle
      // başlanır; kullanıcı o gün hangi odaları kontrol edecekse kendisi ekler.
      setRecord({ ...temelKayit, odalar: [] });
      setKayitYukleniyor(false);
      return;
    }

    const guncelMaddeSayisi = departmanToplamMaddeSayisi(user.department);
    if (guncelMaddeSayisi === 0) {
      setRecord(null);
      setKayitYukleniyor(false);
      return;
    }

    const yeniTasks = DEPARTMAN_BOLUMLERI[user.department]
      ? bolumluGorevleriOlustur(user.department)
      : DEPARTMAN_LISTELERI_CALISMA[user.department].map((text, i) => ({
          id: i + 1,
          text,
          status: null,
          zaman: null,
          aciklama: "",
          photo: null,
        }));

    setRecord({ ...temelKayit, tasks: yeniTasks });
    setKayitYukleniyor(false);
  }

  // Otomatik kaydetme: kontrol listesi ekranındayken her değişiklikte
  // kısa bir gecikmeyle arka planda kaydeder. "Bitir" tuşuna basılmasa da
  // veriler kaybolmaz; 08:00-16:00 arasında istediği zaman kaldığı yerden devam edebilir.
  useEffect(() => {
    if (!record || screen !== "checklist") return;
    if (autosaveTimer.current) clearTimeout(autosaveTimer.current);
    autosaveTimer.current = setTimeout(() => {
      window.storage.set(
        record.key,
        JSON.stringify({ ...record, sonGuncelleme: new Date().toISOString() }),
        true
      );
    }, 600);
    return () => clearTimeout(autosaveTimer.current);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [record]);

  // Saatli hatırlatma kontrolü: HATIRLATMALAR'da tanımlı bir madde, tanımlı
  // saati geçtiği halde hâlâ işaretlenmediyse bir kere bildirim gönderir.
  // NOT: Bu bildirim yalnızca uygulama açıkken (ön planda ya da arka plan
  // sekmesinde) çalışır; tarayıcı tamamen kapalıyken gerçek bir OS alarmı
  // gibi çalışmaz (bunun için sunucu taraflı push bildirimi gerekir).
  useEffect(() => {
    if (!record || !record.tasks) return;
    const hatirlatmalar = HATIRLATMALAR[record.department];
    if (!hatirlatmalar) return;
    const zatenBildirilenler = record.remindedTasks || [];
    const yeniBildirilecekler = [];
    record.tasks.forEach((t) => {
      const saat = hatirlatmalar[t.id];
      if (saat && !t.status && saatGectiMi(saat) && !zatenBildirilenler.includes(t.id)) {
        yeniBildirilecekler.push({ id: t.id, text: t.text, saat });
      }
    });
    if (yeniBildirilecekler.length === 0) return;

    yeniBildirilecekler.forEach((b) => {
      if (typeof Notification !== "undefined" && Notification.permission === "granted") {
        try {
          new Notification("Kontrol Hatırlatması", {
            body: `"${b.text}" maddesi saat ${b.saat} itibarıyla tamamlanmış olmalıydı, henüz işaretlenmedi.`,
            icon: "icon-192-v2.png",
          });
        } catch (e) {}
      }
      telegramMesajGonder(
        `⏰ Kontrol Hatırlatması\n${record.hotelName} — ${record.department}\n\nMadde ${b.id}: ${b.text}\n\nSaat ${b.saat} itibarıyla tamamlanmış olmalıydı, henüz işaretlenmedi.`
      );
    });

    setRecord((prev) => ({
      ...prev,
      remindedTasks: [...(prev.remindedTasks || []), ...yeniBildirilecekler.map((b) => b.id)],
    }));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [record]);

  // Kat Hizmetleri kullanıcıları için, Genel Müdürlük'ten yeni bir oda görevi
  // gelip gelmediğini periyodik olarak kontrol eder (uygulama açıkken).
  useEffect(() => {
    if (!currentUser || !DEPARTMAN_ODA_BAZLI[currentUser.department]) return;
    bekleyenGorevleriGetir(currentUser);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [tick]);

  function setStatus(id, status) {
    setRecord((prev) => ({
      ...prev,
      tasks: prev.tasks.map((t) => {
        if (t.id !== id) return t;
        const yeniDurum = t.status === status ? null : status;
        return {
          ...t,
          status: yeniDurum,
          zaman: yeniDurum ? new Date().toLocaleTimeString("tr-TR", { hour12: false }) : null,
        };
      }),
    }));
  }

  function setAciklama(id, value) {
    setRecord((prev) => ({
      ...prev,
      tasks: prev.tasks.map((t) => (t.id === id ? { ...t, aciklama: value } : t)),
    }));
  }

  function setSayisalDeger(id, alanIndex, value) {
    const temiz = value.replace(/\D/g, "").slice(0, 3);
    setRecord((prev) => ({
      ...prev,
      tasks: prev.tasks.map((t) =>
        t.id === id
          ? { ...t, alanlar: t.alanlar.map((a, i) => (i === alanIndex ? { ...a, deger: temiz } : a)) }
          : t
      ),
    }));
  }

  function setMetinDeger(id, value) {
    const temiz = value.slice(0, 50);
    setRecord((prev) => ({
      ...prev,
      tasks: prev.tasks.map((t) => (t.id === id ? { ...t, metinDeger: temiz } : t)),
    }));
  }

  // --- Oda bazlı (Kat Hizmetleri) departmanlar için ---

  function odaEkle(odaKodu, ekstra) {
    setRecord((prev) => {
      const mevcutOdalar = prev.odalar || [];
      if (mevcutOdalar.length >= ODA_BAZLI_MAX_NOKTA) return prev;
      if (mevcutOdalar.some((o) => o.oda === odaKodu)) return prev;
      const yeniOda = {
        oda: odaKodu,
        gorevler: bolumlerdenGorevOlustur(KAT_HIZMETLERI_BOLUMLER),
        ...(ekstra || {}),
      };
      return { ...prev, odalar: [...mevcutOdalar, yeniOda] };
    });
  }

  function odaGorevDurumAyarla(odaKodu, gorevId, status) {
    setRecord((prev) => ({
      ...prev,
      odalar: prev.odalar.map((o) => {
        if (o.oda !== odaKodu) return o;
        return {
          ...o,
          gorevler: o.gorevler.map((g) => {
            if (g.id !== gorevId) return g;
            const yeniDurum = g.status === status ? null : status;
            return {
              ...g,
              status: yeniDurum,
              zaman: yeniDurum ? new Date().toLocaleTimeString("tr-TR", { hour12: false }) : null,
            };
          }),
        };
      }),
    }));
  }

  function odaGorevAciklamaAyarla(odaKodu, gorevId, value) {
    setRecord((prev) => ({
      ...prev,
      odalar: prev.odalar.map((o) =>
        o.oda !== odaKodu
          ? o
          : { ...o, gorevler: o.gorevler.map((g) => (g.id === gorevId ? { ...g, aciklama: value } : g)) }
      ),
    }));
  }

  function odaGorevFotoAyarla(odaKodu, gorevId, dataUrl) {
    setRecord((prev) => ({
      ...prev,
      odalar: prev.odalar.map((o) =>
        o.oda !== odaKodu
          ? o
          : { ...o, gorevler: o.gorevler.map((g) => (g.id === gorevId ? { ...g, photo: dataUrl } : g)) }
      ),
    }));
  }

  function handleOdaFotoSecildi(odaKodu, gorevId, file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 700;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.6);
        odaGorevFotoAyarla(odaKodu, gorevId, dataUrl);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function removePhoto(id) {
    setRecord((prev) => ({
      ...prev,
      tasks: prev.tasks.map((t) => (t.id === id ? { ...t, photo: null } : t)),
    }));
  }

  function handlePhotoSelect(id, file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 700;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.6);
        setRecord((prev) => ({
          ...prev,
          tasks: prev.tasks.map((t) => (t.id === id ? { ...t, photo: dataUrl } : t)),
        }));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function handleBitir() {
    setListeHatasi("");
    setBitiriliyor(true);
    const guncel = {
      ...record,
      tamamlandiMi: true,
      tamamlanmaZamani: new Date().toISOString(),
      sonGuncelleme: new Date().toISOString(),
    };
    try {
      await window.storage.set(guncel.key, JSON.stringify(guncel), true);
      setRecord(guncel);
      setTamamlandiMesaji(true);
      const isaretliSayisi = kayitTamamlananSayisi(guncel);
      toastGoster(`✓ Kaydedildi — ${isaretliSayisi}/${kayitToplamMaddeSayisi(guncel)} madde işaretli`);
      setTimeout(() => setTamamlandiMesaji(false), 2500);

      setListeHatasi("Kaydetme sırasında bir hata oluştu. Lütfen tekrar deneyin.");

    setBitiriliyor(false);

  async function gecmisiGetir() {
    setGecmisYukleniyor(true);
    setGecmisKayitlar([]);
    try {
      const liste = await window.storage.list(
        `checklist:${currentUser.hotelCode}:${currentUser.department}:`,
        true
      );
      const keys = (liste && liste.keys) || [];
      const kayitlar = [];
      for (const k of keys.slice(-31)) {
        const r = await safeGet(k, true);
        if (r) {
          try {
            kayitlar.push(JSON.parse(r.value));
          } catch (e) {}
        }
      }
      kayitlar.sort((a, b) => (a.date < b.date ? 1 : -1));
      setGecmisKayitlar(kayitlar);
    } catch (e) {
      setGecmisKayitlar([]);
    }
    setGecmisYukleniyor(false);
  }

  function gecmiseGit() {
    setScreen("history");
    gecmisiGetir();
  }

  /* ---------------- PDF OLUŞTURMA ---------------- */

  function jsPdfHazirMi() {
    return typeof window !== "undefined" && window.jspdf && window.jspdf.jsPDF;
  }

  function pdfFontYukle(doc) {
    // Türkçe karakterleri (ş, ğ, ı, İ, ö, ü, ç) doğru gösterebilmek için
    // jsPDF'in varsayılan Helvetica fontu yerine, gömülü Türkçe destekli
    // bir font (Liberation Sans, subset edilmiş) kullanılıyor.
    try {
      doc.addFileToVFS("TurkceFontRegular.ttf", TURKCE_FONT_REGULAR_B64);
      doc.addFont("TurkceFontRegular.ttf", "TurkceFont", "normal");
      doc.addFileToVFS("TurkceFontBold.ttf", TURKCE_FONT_BOLD_B64);
      doc.addFont("TurkceFontBold.ttf", "TurkceFont", "bold");
      return "TurkceFont";
    } catch (e) {
      return "helvetica";
    }
  }

  function pdfOlustur(kayit) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "a4" });
    const fontAdi = pdfFontYukle(doc);
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const margin = 40;

    // Her sayfaya ince, iki katmanlı (koyu lacivert + altın) bir dekoratif
    // çerçeve çizer; raporu daha şık/kurumsal gösterir.
    function sayfaCercevesiCiz() {
      const kb = 16;
      doc.setDrawColor(22, 50, 58);
      doc.setLineWidth(1.1);
      doc.rect(kb, kb, pageWidth - kb * 2, pageHeight - kb * 2);
      doc.setDrawColor(176, 141, 62);
      doc.setLineWidth(0.6);
      doc.rect(kb + 4, kb + 4, pageWidth - (kb + 4) * 2, pageHeight - (kb + 4) * 2);
      doc.setDrawColor(0, 0, 0);
      doc.setLineWidth(1);
    }

    function yeniSayfa() {
      doc.addPage();
      sayfaCercevesiCiz();
    }

    sayfaCercevesiCiz();
    let y = margin;

    // Bu kullanıcıya özel bir logo tanımlıysa (örn. Ercan / Perge Hotels),
    // raporun en üstüne normal (opak) boyutta yerleştirilir.
    const kullaniciLogosu = KULLANICI_LOGOLARI[kayit.userCode];
    if (kullaniciLogosu) {
      const logoBoyutu = 60;
      try {
        doc.addImage(
          `data:image/png;base64,${kullaniciLogosu}`,
          "PNG",
          (pageWidth - logoBoyutu) / 2,
          y,
          logoBoyutu,
          logoBoyutu
        );
      } catch (e) {}
      y += logoBoyutu + 16;
    }

    doc.setFont(fontAdi, "bold");
    doc.setFontSize(16);
    doc.text("Otel Departman Kontrol Listesi", margin, y);
    y += 22;

    doc.setFont(fontAdi, "normal");
    doc.setFontSize(11);
    doc.text(`Otel: ${kayit.hotelName}  (Kod: ${kayit.hotelCode})`, margin, y);
    y += 16;
    doc.text(`Departman: ${kayit.department}`, margin, y);
    y += 16;
    doc.text(`Tarih: ${formatTarihSadece(kayit.date)}`, margin, y);
    y += 16;
    doc.text(`Kontrol eden: ${kayit.userName} (Kullanıcı Kodu: ${kayit.userCode})`, margin, y);
    y += 16;
    const durumYazi = kayit.tamamlandiMi ? "Tamamlandı" : "Süre içinde tamamlanmadı / otomatik kaydedildi";
    doc.text(`Durum: ${durumYazi}`, margin, y);
    y += 26;

    function gorevYaz(t) {
      if (y + 40 > pageHeight - margin) {
        yeniSayfa();
        y = margin;
      }
      const olumsuzMu = t.status === "olumsuz";
      const girinti = olumsuzMu ? 10 : 0;
      const baslangicY = y;
      const kirmizi = [183, 45, 30];
      const lacivert = [22, 50, 58];

      doc.setFont(fontAdi, "bold");
      doc.setFontSize(11);
      doc.setTextColor(...(olumsuzMu ? kirmizi : lacivert));
      const baslikSatirlari = doc.splitTextToSize(`${t.id}. ${t.text}`, pageWidth - margin * 2 - girinti);
      doc.text(baslikSatirlari, margin + girinti, y);
      y += baslikSatirlari.length * 14;

      doc.setFont(fontAdi, "normal");
      doc.setFontSize(10);
      doc.setTextColor(0, 0, 0);
      if (t.tip === "sayisal") {
        const satir = (t.alanlar || [])
          .map((a) => `${a.label}: ${a.deger ? a.deger : "-"}`)
          .join("    ");
        const satirlar = doc.splitTextToSize(satir, pageWidth - margin * 2 - girinti);
        doc.text(satirlar, margin + girinti, y);
        y += satirlar.length * 13;
      } else if (t.tip === "metin") {
        const satirlar = doc.splitTextToSize(`Yanıt: ${t.metinDeger ? t.metinDeger : "-"}`, pageWidth - margin * 2 - girinti);
        doc.text(satirlar, margin + girinti, y);
        y += satirlar.length * 13;
      } else {
        const durum = t.status === "olumlu" ? "OLUMLU" : t.status === "olumsuz" ? "OLUMSUZ" : "İşaretlenmedi";
        const zamanEki = t.zaman ? `  (Saat: ${t.zaman})` : "";
        if (olumsuzMu) {
          doc.setFont(fontAdi, "bold");
          doc.setTextColor(...kirmizi);
        }
        doc.text(`Durum: ${durum}${zamanEki}`, margin + girinti, y);
        doc.setFont(fontAdi, "normal");
        doc.setTextColor(0, 0, 0);
        y += 14;
      }

      if (t.aciklama) {
        const aciklamaSatirlari = doc.splitTextToSize(`Açıklama: ${t.aciklama}`, pageWidth - margin * 2 - girinti);
        if (y + aciklamaSatirlari.length * 13 > pageHeight - margin) {
          yeniSayfa();
          y = margin;
        }
        doc.text(aciklamaSatirlari, margin + girinti, y);
        y += aciklamaSatirlari.length * 13;
      }

      if (t.photo) {
        if (y + 110 > pageHeight - margin) {
          yeniSayfa();
          y = margin;
        }
        try {
          doc.addImage(t.photo, "JPEG", margin + girinti, y, 100, 100);
        } catch (e) {}
        y += 112;
      }

      if (olumsuzMu) {
        doc.setDrawColor(...kirmizi);
        doc.setLineWidth(2);
        doc.line(margin + 2, baslangicY - 9, margin + 2, y - 3);
        doc.setDrawColor(0, 0, 0);
        doc.setLineWidth(1);
      }
      doc.setTextColor(0, 0, 0);
      y += 8;
    }

    if (kayit.odalar) {
      kayit.odalar.forEach((oda) => {
        if (y + 30 > pageHeight - margin) {
          yeniSayfa();
          y = margin;
        }
        doc.setFont(fontAdi, "bold");
        doc.setFontSize(13);
        doc.setTextColor(22, 50, 58);
        doc.text(`Oda ${oda.oda}`, margin, y);
        doc.setTextColor(0, 0, 0);
        y += 8;
        doc.setDrawColor(176, 141, 62);
        doc.line(margin, y, pageWidth - margin, y);
        doc.setDrawColor(0, 0, 0);
        y += 14;
        oda.gorevler.forEach(gorevYaz);
        y += 10;
      });
    } else {
      kayit.tasks.forEach(gorevYaz);
    }

    return doc;
  }

  async function raporOlusturVeGonder(kayit) {
    setRaporMesaj("");
    setPdfLinkUrl(null);
    if (!kayit) {
      setRaporMesaj("Bu gün için kaydedilmiş bir kontrol listesi bulunamadı.");
      return;
    }
    if (!jsPdfHazirMi()) {
      setRaporMesaj("PDF oluşturucu henüz hazırlanıyor, birkaç saniye sonra tekrar deneyin.");
      return;
    }
    setRaporIsleniyor(true);
    setRaporMesaj("PDF hazırlanıyor…");
    try {
      const doc = pdfOlustur(kayit);
      const dosyaAdi = `kontrol-listesi-${kayit.hotelCode}-${kayit.date}.pdf`;
      const konuMetni = `${kayit.hotelName} - ${kayit.department} Kontrol Listesi - ${formatTarihSadece(kayit.date)}`;

      // Yedek bağlantı: otomatik indirme telefonda/tarayıcıda engellenirse
      // veya fark edilmezse, kullanıcı bu bağlantıya dokunarak PDF'i her zaman
      // açabilir/indirebilir.
      try {
        const blobUrl = doc.output("bloburl");
        setPdfLinkUrl(blobUrl.toString ? blobUrl.toString() : blobUrl);
        setPdfLinkAdi(dosyaAdi);
      } catch (e) {}

      if (BACKEND_URL) {
        if (!raporEposta.trim()) {
          setRaporMesaj("Lütfen alıcı e-posta adresini girin.");
          setRaporIsleniyor(false);
          return;
        }
        const pdfBase64 = doc.output("datauristring").split(",")[1];
        const yanit = await fetch(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            to: raporEposta.trim(),
            subject: konuMetni,
            hotelName: kayit.hotelName,
            department: kayit.department,
            date: kayit.date,
            fileName: dosyaAdi,
            pdfBase64,
          }),
        });
        if (yanit.ok) {
          setRaporMesaj("E-posta başarıyla gönderildi.");
          toastGoster("✓ E-posta gönderildi");
        } else {
          setRaporMesaj("Sunucu e-postayı gönderirken bir hata döndürdü.");
        }
      } else {
        let indirmeBasarili = true;
        try {
          doc.save(dosyaAdi);
        } catch (e) {
          indirmeBasarili = false;
        }

        if (raporEposta.trim()) {
          const konu = encodeURIComponent(konuMetni);
          const govde = encodeURIComponent(
            `Merhaba,\n\n${formatTarihSadece(kayit.date)} tarihli ${kayit.department} departmanı kontrol listesi PDF olarak cihaza indirildi.\nLütfen e-posta uygulamasında az önce indirilen "${dosyaAdi}" dosyasını bu mesaja ekleyip gönderin.\n\nOtel: ${kayit.hotelName}\nKontrol eden: ${kayit.userName}`
          );
          window.location.href = `mailto:${raporEposta.trim()}?subject=${konu}&body=${govde}`;
        }

        if (indirmeBasarili) {
          setRaporMesaj(
            raporEposta.trim()
              ? "PDF indirildi ve e-posta uygulamanız açıldı. Lütfen indirilen dosyayı mesaja ekleyip gönderin."
              : "PDF indirildi. İnmediyse aşağıdaki bağlantıya dokunun."
          );
          toastGoster("✓ PDF hazır");
        } else {
          setRaporMesaj("Otomatik indirme başlamadı. Lütfen aşağıdaki bağlantıya dokunup PDF'i açın.");
        }
      }
    } catch (e) {
      setRaporMesaj("Rapor oluşturulurken bir hata oluştu: " + (e && e.message ? e.message : String(e)));
    }
    setRaporIsleniyor(false);
  }

  const durum = pencereDurumu();
  const tamamlanan = kayitTamamlananSayisiKullanici(record, currentUser);
  const toplamMadde = kayitToplamMaddeSayisiKullanici(record, currentUser);
  const duzenlenebilir = durum === "aktif";

  return (
    <div style={styles.sayfaDisi}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
        .telefon-govde { font-family: 'Inter', sans-serif; }
        .baslik-font { font-family: 'Sora', sans-serif; }
        input:focus, textarea:focus, button:focus-visible {
          outline: 2px solid #B08D3E;
          outline-offset: 2px;
        }
        .kod-input::placeholder { color: #A9A398; letter-spacing: 0.3em; }
        @media (prefers-reduced-motion: reduce) {
          * { transition: none !important; animation: none !important; }
        }
      `}</style>

      <div className="telefon-govde" style={styles.telefonCerceve}>
        <div style={styles.durumCubugu}>
          <span>{new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" })}</span>
          <span style={{ letterSpacing: 2 }}>●●●●</span>
        </div>

        {hazirlaniyor ? (
          <div style={styles.merkezYukleniyor}>Hazırlanıyor…</div>
        ) : screen === "login" ? (
          <GirisEkrani
            hotelCode={hotelCode}
            userCode={userCode}
            password={password}
            setHotelCode={(v) => digitInput(v, setHotelCode)}
            setUserCode={(v) => digitInput(v, setUserCode)}
            setPassword={(v) => digitInput(v, setPassword)}
            hata={girisHatasi}
            yukleniyor={girisYukleniyor}
            onGiris={handleLogin}
          />
        ) : screen === "home" ? (
          <AnaSayfa
            user={currentUser}
            record={record}
            kayitYukleniyor={kayitYukleniyor}
            durum={durum}
            tamamlanan={tamamlanan}
            toplamMadde={toplamMadde}
            onBaslat={() => setScreen("checklist")}
            onGecmis={gecmiseGit}
            onCikis={handleLogout}
            raporPaneliAcik={raporPaneliAcik}
            setRaporPaneliAcik={setRaporPaneliAcik}
            raporEposta={raporEposta}
            setRaporEposta={setRaporEposta}
            raporMesaj={raporMesaj}
            raporIsleniyor={raporIsleniyor}
            onRaporGonder={() => raporOlusturVeGonder(record)}
            bildirimDurumu={bildirimDurumu}
            onBildirimIzniIste={bildirimIzniIste}
            onGorevAta={() => setScreen("gorevAta")}
            onGMYonetim={() => setScreen("gmYonetim")}
            bekleyenGorevler={bekleyenGorevler}
            onGorevKabul={gorevKabulEt}
          />
        ) : screen === "checklist" ? (
          <KontrolListesiEkrani
            user={currentUser}
            record={record}
            duzenlenebilir={duzenlenebilir}
            durum={durum}
            hata={listeHatasi}
            tamamlanan={tamamlanan}
            bitiriliyor={bitiriliyor}
            tamamlandiMesaji={tamamlandiMesaji}
            setStatus={setStatus}
            setAciklama={setAciklama}
            setSayisalDeger={setSayisalDeger}
            setMetinDeger={setMetinDeger}
            onPhotoSelect={handlePhotoSelect}
            onRemovePhoto={removePhoto}
            onOdaEkle={odaEkle}
            onOdaGorevDurum={odaGorevDurumAyarla}
            onOdaGorevAciklama={odaGorevAciklamaAyarla}
            onOdaFotoSecildi={handleOdaFotoSecildi}
            onOdaFotoSil={(odaKodu, gorevId) => odaGorevFotoAyarla(odaKodu, gorevId, null)}
            onBitir={handleBitir}
            onGeri={() => setScreen("home")}
            fileInputRefs={fileInputRefs}
          />
        ) : screen === "history" ? (
          <GecmisEkrani
            kayitlar={gecmisKayitlar}
            yukleniyor={gecmisYukleniyor}
            onGeri={() => setScreen("home")}
            onPdf={(k) => raporOlusturVeGonder(k)}
            jsPdfHazirMi={jsPdfHazirMi}
          />
        ) : screen === "admin" ? (
          <AdminEkrani onCikis={handleLogout} />
        ) : screen === "gorevAta" ? (
          <GorevAtaEkrani user={currentUser} onGeri={() => setScreen("home")} toastGoster={toastGoster} />
        ) : screen === "gmYonetim" ? (
          <GMYonetimEkrani
            user={currentUser}
            onGeri={() => setScreen("home")}
            toastGoster={toastGoster}
            onDepartmanOlustur={departmanOlustur}
            onKullaniciOlustur={yeniKullaniciOlustur}
            onSatirEkle={kontrolSatiriEkle}
            onSatirDuzenle={kontrolSatiriDuzenle}
            onSatirSil={kontrolSatiriSil}
          />
        ) : null}

        {toast && !pdfLinkUrl && <div style={styles.toastMesaj}>{toast}</div>}

        {pdfLinkUrl && (
          <div style={styles.pdfBaglantiCubugu}>
            <a href={pdfLinkUrl} target="_blank" rel="noreferrer" style={styles.pdfBaglantiLink}>
              📄 {pdfLinkAdi} — Aç / İndir
            </a>
            <button
              style={styles.pdfBaglantiKapat}
              onClick={() => setPdfLinkUrl(null)}
              aria-label="Kapat"
            >
              ✕
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

   EKRAN BİLEŞENLERİ
