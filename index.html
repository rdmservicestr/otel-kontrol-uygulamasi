/* ------------------------------------------------------------------
   LOST & FOUND - depolama yardımcı fonksiyonları
-------------------------------------------------------------------*/
async function lfKayitlariGetir(hotelCode) {
  try {
    const liste = await window.storage.list(`lostfound:${hotelCode}:`, true);
    const keys = (liste && liste.keys) || [];
    const kayitlar = [];
    for (const k of keys) {
      const r = await safeGet(k, true);
      if (r) {
        try {
          kayitlar.push(JSON.parse(r.value));
        } catch (e) {}
      }
    }
    kayitlar.sort((a, b) => (a.olusturmaZamani < b.olusturmaZamani ? 1 : -1));
    return kayitlar;
  } catch (e) {
    return [];
  }
}

async function lfKayitKaydet(kayit) {
  await window.storage.set(`lostfound:${kayit.hotelCode}:${kayit.no}`, JSON.stringify(kayit), true);
}

function lfSaklamaBitisTarihi(kayit) {
  const baslangic = new Date(kayit.olusturmaZamani);
  const bitis = new Date(baslangic);
  bitis.setDate(bitis.getDate() + (kayit.saklamaSuresiGun || LF_SAKLAMA_SURESI_GUN));
  return bitis;
}

function lfKalanGun(kayit) {
  const bitis = lfSaklamaBitisTarihi(kayit);
  const simdi = new Date();
  return Math.ceil((bitis - simdi) / (1000 * 60 * 60 * 24));
}

function lfZamanFormatla(iso) {
  const d = new Date(iso);
  return d.toLocaleString("tr-TR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}

/* ------------------------------------------------------------------
   LOST & FOUND - ana ekran (KPI + liste + gezinme)
-------------------------------------------------------------------*/
function LostFoundEkrani({ user, onGeri, toastGoster }) {
  const [gorunum, setGorunum] = useState("liste"); // liste | yeni | detay
  const [kayitlar, setKayitlar] = useState([]);
  const [yukleniyor, setYukleniyor] = useState(true);
  const [secilenNo, setSecilenNo] = useState(null);
  const [filtre, setFiltre] = useState("hepsi");

  const yoneticiMi = LF_YONETICI_POZISYONLARI.includes(user.pozisyon);

  useEffect(() => {
    yukle();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  async function yukle() {
    setYukleniyor(true);
    const veri = await lfKayitlariGetir(user.hotelCode);
    setKayitlar(veri);
    setYukleniyor(false);
  }

  async function kayitOlustur(form, fotograflar) {
    const simdi = new Date();
    const no = `LF-${String(kayitlar.length + 1).padStart(4, "0")}`;
    const degerliMi = LF_DEGERLI_KATEGORILER.includes(form.kategori);
    const kritikMi = LF_KRITIK_KATEGORILER.includes(form.kategori);
    const kayit = {
      no,
      hotelCode: user.hotelCode,
      hotelName: user.hotelName,
      tarih: simdi.toLocaleDateString("tr-TR"),
      saat: simdi.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" }),
      olusturmaZamani: simdi.toISOString(),
      bulanKullanici: user.name,
      bulanUserCode: user.userCode,
      bulanDepartman: user.department,
      alan: form.alan,
      odaNo: form.odaNo,
      kategori: form.kategori,
      aciklama: form.aciklama,
      marka: form.marka,
      renk: form.renk,
      adet: form.adet || 1,
      tahminiDeger: form.tahminiDeger,
      esyaDurumu: form.esyaDurumu,
      ekAciklama: form.ekAciklama,
      fotograflar: fotograflar || [],
      durum: "Yeni Kayıt",
      degerliMi,
      kritikMi,
      saklamaSuresiGun: LF_SAKLAMA_SURESI_GUN,
      misafir: { ad: "", telefon: "", email: "", checkIn: "", checkOut: "", rezervasyonNo: "" },
      iletisimGecmisi: [],
      auditLog: [{ zaman: simdi.toISOString(), kullanici: user.name, islem: "Kayıt oluşturuldu" }],
    };
    await lfKayitKaydet(kayit);

    if (degerliMi || kritikMi) {
      const etiket = kritikMi ? "🔴 KRİTİK EŞYA BULUNDU" : "💎 DEĞERLİ EŞYA BULUNDU";
      telegramMesajGonder(
        `${etiket}\n${kayit.hotelName}\n\nKayıt No: ${no}\nKategori: ${form.kategori}\nBulunduğu Alan: ${form.alan}${
          form.odaNo ? ` (Oda ${form.odaNo})` : ""
        }\nBulan: ${user.name} (${user.department})\n\n${
          kritikMi ? "Özel prosedür gerekli — yönetici/güvenlik bilgilendirilmelidir." : "Yönetici bilgilendirmesi gerekiyor."
        }`
      );
    }

    toastGoster(`✓ Kayıt oluşturuldu: ${no}`);
    await yukle();
    setGorunum("liste");
  }

  async function durumGuncelle(kayit, yeniDurum) {
    const simdi = new Date();
    const guncel = {
      ...kayit,
      durum: yeniDurum,
      auditLog: [...kayit.auditLog, { zaman: simdi.toISOString(), kullanici: user.name, islem: `Durum güncellendi: ${yeniDurum}` }],
    };
    await lfKayitKaydet(guncel);
    toastGoster(`✓ Durum güncellendi: ${yeniDurum}`);
    await yukle();
  }

  async function iletisimEkle(kayit, kanal, not) {
    const simdi = new Date();
    const guncel = {
      ...kayit,
      iletisimGecmisi: [...kayit.iletisimGecmisi, { zaman: simdi.toISOString(), kanal, not, kullanici: user.name }],
      auditLog: [...kayit.auditLog, { zaman: simdi.toISOString(), kullanici: user.name, islem: `İletişim kaydı eklendi (${kanal})` }],
    };
    await lfKayitKaydet(guncel);
    toastGoster("✓ İletişim kaydı eklendi");
    await yukle();
  }

  async function misafirGuncelle(kayit, misafir) {
    const simdi = new Date();
    const guncel = {
      ...kayit,
      misafir,
      auditLog: [...kayit.auditLog, { zaman: simdi.toISOString(), kullanici: user.name, islem: "Misafir bilgisi güncellendi" }],
    };
    await lfKayitKaydet(guncel);
    toastGoster("✓ Misafir bilgisi kaydedildi");
    await yukle();
  }

  async function fotografEkle(kayit, dataUrl) {
    const guncel = { ...kayit, fotograflar: [...(kayit.fotograflar || []), dataUrl] };
    await lfKayitKaydet(guncel);
    await yukle();
  }

  const secilenKayit = kayitlar.find((k) => k.no === secilenNo);

  const kapatilmisMi = (k) => LF_KAPANIS_DURUMLARI.includes(k.durum) || k.durum === "Kayıp / Akıbeti Belirsiz";
  const toplam = kayitlar.length;
  const aktif = kayitlar.filter((k) => !kapatilmisMi(k) && k.durum !== "Süre Doldu").length;
  const teslimBekleyen = kayitlar.filter((k) => k.durum === "Teslim Bekliyor").length;
  const degerli = kayitlar.filter((k) => k.degerliMi).length;
  const kritik = kayitlar.filter((k) => k.kritikMi).length;
  const suresiYaklasan = kayitlar.filter((k) => !kapatilmisMi(k) && lfKalanGun(k) <= 15 && lfKalanGun(k) > 0).length;
  const suresiDolan = kayitlar.filter((k) => !kapatilmisMi(k) && lfKalanGun(k) <= 0).length;

  let gosterilecekler = kayitlar;
  if (filtre === "aktif") gosterilecekler = kayitlar.filter((k) => !kapatilmisMi(k));
  if (filtre === "teslimBekleyen") gosterilecekler = kayitlar.filter((k) => k.durum === "Teslim Bekliyor");
  if (filtre === "degerli") gosterilecekler = kayitlar.filter((k) => k.degerliMi);
  if (filtre === "kritik") gosterilecekler = kayitlar.filter((k) => k.kritikMi);
  if (filtre === "suresiYaklasan") gosterilecekler = kayitlar.filter((k) => !kapatilmisMi(k) && lfKalanGun(k) <= 15);

  if (gorunum === "yeni") {
    return (
      <LFYeniKayit
        user={user}
        onIptal={() => setGorunum("liste")}
        onKaydet={kayitOlustur}
      />
    );
  }

  if (gorunum === "detay" && secilenKayit) {
    return (
      <LFDetay
        kayit={secilenKayit}
        yoneticiMi={yoneticiMi}
        onGeri={() => {
          setGorunum("liste");
          setSecilenNo(null);
        }}
        onDurumGuncelle={durumGuncelle}
        onIletisimEkle={iletisimEkle}
        onMisafirGuncelle={misafirGuncelle}
        onFotografEkle={fotografEkle}
      />
    );
  }

  return (
    <div style={styles.icerik}>
      <div style={styles.listeUstBaslik}>
        <button style={styles.geriButon} onClick={onGeri} aria-label="Geri">
          ←
        </button>
        <div>
          <div className="baslik-font" style={styles.listeBaslikYazi}>
            Lost & Found
          </div>
          <div style={styles.ilerlemeYazi}>{user.hotelName}</div>
        </div>
      </div>

      <button style={{ ...styles.anaButon, marginTop: 14 }} onClick={() => setGorunum("yeni")}>
        + Yeni Eşya Buldum
      </button>

      <div style={styles.lfKpiIzgara}>
        {[
          ["Toplam", toplam, "hepsi"],
          ["Aktif", aktif, "aktif"],
          ["Teslim Bekleyen", teslimBekleyen, "teslimBekleyen"],
          ["Değerli", degerli, "degerli"],
          ["Kritik", kritik, "kritik"],
          ["Süresi Yaklaşan", suresiYaklasan, "suresiYaklasan"],
        ].map(([etiket, sayi, key]) => (
          <button
            key={key}
            style={{ ...styles.lfKpiKart, ...(filtre === key ? styles.lfKpiKartAktif : {}) }}
            onClick={() => setFiltre(key)}
          >
            <div style={styles.lfKpiSayi}>{sayi}</div>
            <div style={styles.lfKpiEtiket}>{etiket}</div>
          </button>
        ))}
      </div>

      {suresiDolan > 0 && (
        <div style={styles.gecikmeBanner}>⚠ {suresiDolan} kaydın saklama süresi doldu, işlem bekliyor.</div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 14 }}>
        {yukleniyor ? (
          <div style={styles.merkezYukleniyor}>Yükleniyor…</div>
        ) : gosterilecekler.length === 0 ? (
          <div style={styles.bilgiKutusu}>Kayıt bulunamadı.</div>
        ) : (
          gosterilecekler.map((k) => (
            <button
              key={k.no}
              style={styles.lfKayitKarti}
              onClick={() => {
                setSecilenNo(k.no);
                setGorunum("detay");
              }}
            >
              <div style={styles.lfKayitUst}>
                <span style={styles.lfKayitNo}>{k.no}</span>
                <span style={{ ...styles.lfDurumRozeti, ...(kapatilmisMi(k) ? styles.lfDurumRozetiTamam : {}) }}>
                  {k.durum}
                </span>
              </div>
              <div style={styles.lfKayitAciklama}>
                {k.kategori}
                {k.marka ? ` · ${k.marka}` : ""}
                {k.renk ? ` · ${k.renk}` : ""}
              </div>
              <div style={styles.lfKayitAltBilgi}>
                {k.alan}
                {k.odaNo ? ` · Oda ${k.odaNo}` : ""} · {k.tarih} {k.saat}
                {k.degerliMi && "  💎"}
                {k.kritikMi && "  🔴"}
              </div>
            </button>
          ))
        )}
      </div>
    </div>
  );
}

function LFYeniKayit({ user, onIptal, onKaydet }) {
  const [alan, setAlan] = useState("");
  const [alanDiger, setAlanDiger] = useState("");
  const [odaNo, setOdaNo] = useState("");
  const [kategori, setKategori] = useState("");
  const [aciklama, setAciklama] = useState("");
  const [marka, setMarka] = useState("");
  const [renk, setRenk] = useState("");
  const [adet, setAdet] = useState("1");
  const [tahminiDeger, setTahminiDeger] = useState("");
  const [esyaDurumu, setEsyaDurumu] = useState("");
  const [ekAciklama, setEkAciklama] = useState("");
  const [fotograflar, setFotograflar] = useState([]);
  const [hata, setHata] = useState("");
  const [kaydediliyor, setKaydediliyor] = useState(false);
  const fileRef = useRef(null);

  function fotoSecildi(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 700;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        setFotograflar((prev) => [...prev, canvas.toDataURL("image/jpeg", 0.6)]);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function kaydet() {
    setHata("");
    if (!alan) {
      setHata("Lütfen bulunduğu alanı seçin.");
      return;
    }
    if (alan === "Diğer" && !alanDiger.trim()) {
      setHata("Lütfen 'Diğer' için alanı yazın.");
      return;
    }
    if (!kategori) {
      setHata("Lütfen bir kategori seçin.");
      return;
    }
    if (!aciklama.trim()) {
      setHata("Eşya açıklaması zorunludur.");
      return;
    }
    setKaydediliyor(true);
    const nihaiAlan = alan === "Diğer" ? alanDiger.trim() : alan;
    await onKaydet(
      { alan: nihaiAlan, odaNo, kategori, aciklama, marka, renk, adet: Number(adet) || 1, tahminiDeger, esyaDurumu, ekAciklama },
      fotograflar
    );
    setKaydediliyor(false);
  }

  return (
    <div style={styles.icerik}>
      <div style={styles.listeUstBaslik}>
        <button style={styles.geriButon} onClick={onIptal} aria-label="Geri">
          ←
        </button>
        <div className="baslik-font" style={styles.listeBaslikYazi}>
          Yeni Eşya Buldum
        </div>
      </div>

      <div style={{ ...styles.gmSabitDeger, marginTop: 14 }}>
        Bulan: {user.name} · {user.department} · {new Date().toLocaleDateString("tr-TR")}{" "}
        {new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" })}
      </div>

      <Etiket>BULUNDUĞU ALAN (zorunlu)</Etiket>
      <select style={styles.gmSecim} value={alan} onChange={(e) => setAlan(e.target.value)}>
        <option value="">Seçiniz</option>
        {LF_ALANLAR.map((a) => (
          <option key={a} value={a}>
            {a}
          </option>
        ))}
      </select>
      {alan === "Diğer" && (
        <input
          style={{ ...styles.epostaInput, marginTop: 8 }}
          value={alanDiger}
          onChange={(e) => setAlanDiger(e.target.value)}
          placeholder="Alanı yazın"
        />
      )}

      <Etiket>ODA NUMARASI (varsa)</Etiket>
      <input style={styles.epostaInput} value={odaNo} onChange={(e) => setOdaNo(e.target.value)} placeholder="örn. 1024" />

      <Etiket>EŞYA KATEGORİSİ (zorunlu)</Etiket>
      <select style={styles.gmSecim} value={kategori} onChange={(e) => setKategori(e.target.value)}>
        <option value="">Seçiniz</option>
        {LF_KATEGORILER.map((k) => (
          <option key={k} value={k}>
            {k}
          </option>
        ))}
      </select>
      {(LF_DEGERLI_KATEGORILER.includes(kategori) || LF_KRITIK_KATEGORILER.includes(kategori)) && (
        <div style={styles.lfUyariKutusu}>
          {LF_KRITIK_KATEGORILER.includes(kategori)
            ? "🔴 Kritik eşya — kayıt oluşturulunca yönetici/güvenlik otomatik bilgilendirilecek."
            : "💎 Değerli eşya — kayıt oluşturulunca yönetici otomatik bilgilendirilecek."}
        </div>
      )}

      <Etiket>EŞYA AÇIKLAMASI (zorunlu)</Etiket>
      <textarea
        style={styles.aciklamaAlani}

    </div>
  );
}

/* ------------------------------------------------------------------
   LOST & FOUND - kayıt detay ekranı
-------------------------------------------------------------------*/
function LFDetay({ kayit, yoneticiMi, onGeri, onDurumGuncelle, onIletisimEkle, onMisafirGuncelle, onFotografEkle }) {
  const [yeniDurum, setYeniDurum] = useState(kayit.durum);
  const [durumMesaj, setDurumMesaj] = useState("");
  const [durumKaydediliyor, setDurumKaydediliyor] = useState(false);

  const [misafirAcik, setMisafirAcik] = useState(false);
  const [misafirForm, setMisafirForm] = useState(kayit.misafir || {});
  const [misafirKaydediliyor, setMisafirKaydediliyor] = useState(false);

  const [iletisimAcik, setIletisimAcik] = useState(false);
  const [iletisimKanal, setIletisimKanal] = useState("E-mail");
  const [iletisimNot, setIletisimNot] = useState("");

  const [auditAcik, setAuditAcik] = useState(false);
  const fileRef = useRef(null);

  const kalanGun = lfKalanGun(kayit);

  async function durumKaydet() {
    setDurumMesaj("");
    if (LF_ONAY_GEREKTIREN_DURUMLAR.includes(yeniDurum) && !yoneticiMi) {
      setDurumMesaj("Bu işlem (imha/bağış) yönetici onayı (Müdür/Supervisor/Şef/Vardiya Amiri) gerektirir.");
      return;
    }
    setDurumKaydediliyor(true);
    await onDurumGuncelle(kayit, yeniDurum);
    setDurumKaydediliyor(false);
  }

  async function misafirKaydet() {
    setMisafirKaydediliyor(true);
    await onMisafirGuncelle(kayit, misafirForm);
    setMisafirKaydediliyor(false);
    setMisafirAcik(false);
  }

  async function iletisimKaydet() {
    if (!iletisimNot.trim()) return;
    await onIletisimEkle(kayit, iletisimKanal, iletisimNot.trim());
    setIletisimNot("");
  }

  function fotoSecildi(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 700;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        onFotografEkle(kayit, canvas.toDataURL("image/jpeg", 0.6));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function pdfOlustur() {
    if (!window.jspdf || !window.jspdf.jsPDF) return;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "a4" });
    const margin = 40;
    let y = margin;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(16);
    doc.text(`Lost & Found Kaydı - ${kayit.no}`, margin, y);
    y += 24;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    const satirlar = [
      `Otel: ${kayit.hotelName}`,
      `Durum: ${kayit.durum}`,
      `Bulunma: ${kayit.tarih} ${kayit.saat}`,
      `Bulan: ${kayit.bulanKullanici} (${kayit.bulanDepartman})`,
      `Alan: ${kayit.alan}${kayit.odaNo ? `  Oda: ${kayit.odaNo}` : ""}`,
      `Kategori: ${kayit.kategori}${kayit.degerliMi ? "  [DEĞERLİ]" : ""}${kayit.kritikMi ? "  [KRİTİK]" : ""}`,
      `Açıklama: ${kayit.aciklama}`,
      `Marka: ${kayit.marka || "-"}   Renk: ${kayit.renk || "-"}   Adet: ${kayit.adet}`,
      `Tahmini Değer: ${kayit.tahminiDeger || "-"}`,
      `Eşya Durumu: ${kayit.esyaDurumu || "-"}`,
      `Ek Açıklama: ${kayit.ekAciklama || "-"}`,
    ];
    satirlar.forEach((s) => {
      const wrapped = doc.splitTextToSize(s, 515);
      doc.text(wrapped, margin, y);
      y += wrapped.length * 13;
    });
    y += 10;
    doc.setFont("helvetica", "bold");
    doc.text("İşlem Geçmişi:", margin, y);
    y += 14;
    doc.setFont("helvetica", "normal");
    kayit.auditLog.forEach((a) => {
      const s = `${lfZamanFormatla(a.zaman)} — ${a.kullanici} — ${a.islem}`;
      const wrapped = doc.splitTextToSize(s, 515);
      doc.text(wrapped, margin, y);
      y += wrapped.length * 12;
    });
    doc.save(`${kayit.no}.pdf`);
  }

  return (
    <div style={styles.icerik}>
      <div style={styles.listeUstBaslik}>
        <button style={styles.geriButon} onClick={onGeri} aria-label="Geri">
          ←
        </button>
        <div>
          <div className="baslik-font" style={styles.listeBaslikYazi}>
            {kayit.no}
          </div>
          <div style={styles.ilerlemeYazi}>
            {kayit.tarih} {kayit.saat} · {kayit.bulanKullanici}
          </div>
        </div>
      </div>

      {(kayit.degerliMi || kayit.kritikMi) && (
        <div style={styles.lfUyariKutusu}>
          {kayit.kritikMi ? "🔴 Kritik eşya — özel prosedür uygulanmalı." : "💎 Değerli eşya."}
        </div>
      )}

      <div style={styles.lfBilgiKarti}>
        <div style={styles.lfBilgiSatiri}>
          <span>Kategori</span>
          <strong>{kayit.kategori}</strong>
        </div>
        <div style={styles.lfBilgiSatiri}>
          <span>Açıklama</span>
          <strong>{kayit.aciklama}</strong>
        </div>
        <div style={styles.lfBilgiSatiri}>
          <span>Marka / Renk / Adet</span>
          <strong>
            {kayit.marka || "-"} / {kayit.renk || "-"} / {kayit.adet}
          </strong>
        </div>
        <div style={styles.lfBilgiSatiri}>
          <span>Tahmini Değer</span>
          <strong>{kayit.tahminiDeger || "-"}</strong>
        </div>
        <div style={styles.lfBilgiSatiri}>
          <span>Bulunduğu Alan</span>
          <strong>
            {kayit.alan}
            {kayit.odaNo ? ` (Oda ${kayit.odaNo})` : ""}
          </strong>
        </div>
        <div style={styles.lfBilgiSatiri}>
          <span>Saklama Süresi</span>
          <strong style={{ color: kalanGun <= 0 ? "#B7472A" : kalanGun <= 15 ? "#8A6A22" : "#2F7D5C" }}>
            {kalanGun <= 0 ? "Süre doldu" : `${kalanGun} gün kaldı`}
          </strong>
        </div>
        {kayit.ekAciklama && (
          <div style={styles.lfBilgiSatiri}>
            <span>Ek Açıklama</span>
            <strong>{kayit.ekAciklama}</strong>
          </div>
        )}
      </div>

      {kayit.fotograflar && kayit.fotograflar.length > 0 && (
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 12 }}>
          {kayit.fotograflar.map((f, i) => (
            <img key={i} src={f} alt="" style={styles.fotoOnizleme} />
          ))}
        </div>
      )}
      <input
        ref={fileRef}
        type="file"
        accept="image/*"
        capture="environment"
        style={{ display: "none" }}
        onChange={(e) => fotoSecildi(e.target.files[0])}
      />
      <button style={{ ...styles.fotoButon, marginTop: 10 }} onClick={() => fileRef.current && fileRef.current.click()}>
        📷 Fotoğraf Ekle
      </button>

      <Etiket>DURUM GÜNCELLE</Etiket>
      <select style={styles.gmSecim} value={yeniDurum} onChange={(e) => setYeniDurum(e.target.value)}>
        {LF_DURUMLAR.map((d) => (
          <option key={d} value={d}>
            {d}
          </option>
        ))}
      </select>
      {durumMesaj && <div style={styles.hataKutusu}>{durumMesaj}</div>}
      <button
        style={{ ...styles.ikincilButon, marginTop: 8, opacity: durumKaydediliyor ? 0.7 : 1 }}
        onClick={durumKaydet}
        disabled={durumKaydediliyor || yeniDurum === kayit.durum}
      >
        {durumKaydediliyor ? "Kaydediliyor…" : "Durumu Kaydet"}
      </button>

      <button style={{ ...styles.adminDuzenleButon, marginTop: 14 }} onClick={() => setMisafirAcik((a) => !a)}>
        👤 Misafir Bilgisi {misafirAcik ? "▲" : "▼"}
      </button>
      {misafirAcik && (
        <div style={styles.gmMaddeSatiri}>
          <Etiket>MİSAFİR ADI</Etiket>
          <input
            style={styles.epostaInput}
            value={misafirForm.ad || ""}
            onChange={(e) => setMisafirForm((f) => ({ ...f, ad: e.target.value }))}
          />
          <Etiket>TELEFON</Etiket>
          <input
            style={styles.epostaInput}
            value={misafirForm.telefon || ""}
            onChange={(e) => setMisafirForm((f) => ({ ...f, telefon: e.target.value }))}
          />
          <Etiket>E-POSTA</Etiket>
          <input
            style={styles.epostaInput}
            value={misafirForm.email || ""}
            onChange={(e) => setMisafirForm((f) => ({ ...f, email: e.target.value }))}
          />
          <Etiket>REZERVASYON NO</Etiket>
          <input
            style={styles.epostaInput}
            value={misafirForm.rezervasyonNo || ""}
            onChange={(e) => setMisafirForm((f) => ({ ...f, rezervasyonNo: e.target.value }))}
          />
          <button
            style={{ ...styles.gmKucukButon, marginTop: 10, opacity: misafirKaydediliyor ? 0.7 : 1 }}
            onClick={misafirKaydet}
            disabled={misafirKaydediliyor}
          >
            Kaydet
          </button>
        </div>
      )}

      <button style={{ ...styles.adminDuzenleButon, marginTop: 10 }} onClick={() => setIletisimAcik((a) => !a)}>
        💬 İletişim Geçmişi ({kayit.iletisimGecmisi.length}) {iletisimAcik ? "▲" : "▼"}
      </button>
      {iletisimAcik && (
        <div style={styles.gmMaddeSatiri}>
          {kayit.iletisimGecmisi.map((i, idx) => (
            <div key={idx} style={styles.zamanNotu}>
              {lfZamanFormatla(i.zaman)} — {i.kanal} — {i.not} ({i.kullanici})
            </div>
          ))}
          <Etiket>KANAL</Etiket>
          <select style={styles.gmSecim} value={iletisimKanal} onChange={(e) => setIletisimKanal(e.target.value)}>
            {["E-mail", "Telefon", "SMS", "WhatsApp"].map((k) => (
              <option key={k} value={k}>
                {k}
              </option>
            ))}
          </select>
          <Etiket>NOT</Etiket>
          <input style={styles.epostaInput} value={iletisimNot} onChange={(e) => setIletisimNot(e.target.value)} placeholder="örn. E-mail gönderildi" />
          <button style={{ ...styles.gmKucukButon, marginTop: 10 }} onClick={iletisimKaydet}>
            Ekle
          </button>
        </div>
      )}

      <button style={{ ...styles.adminDuzenleButon, marginTop: 10 }} onClick={() => setAuditAcik((a) => !a)}>
        📜 İşlem Geçmişi (Audit Log) {auditAcik ? "▲" : "▼"}
      </button>
      {auditAcik && (
        <div style={styles.gmMaddeSatiri}>
          {kayit.auditLog.map((a, idx) => (
            <div key={idx} style={styles.zamanNotu}>
              {lfZamanFormatla(a.zaman)} — {a.kullanici} — {a.islem}
            </div>
          ))}
        </div>
      )}

      <button style={{ ...styles.ikincilButon, marginTop: 16, marginBottom: 24 }} onClick={pdfOlustur}>
        📄 PDF Oluştur
      </button>
    </div>
  );
}


/* ------------------------------------------------------------------
   ARIZA BİLDİRİM VE TAKİP - depolama yardımcı fonksiyonları
-------------------------------------------------------------------*/
async function arzKayitlariGetir(hotelCode) {
  try {
    const liste = await window.storage.list(`ariza:${hotelCode}:`, true);
    const keys = (liste && liste.keys) || [];
    const kayitlar = [];
    for (const k of keys) {
      const r = await safeGet(k, true);
      if (r) {
        try {
          kayitlar.push(JSON.parse(r.value));
        } catch (e) {}
      }
    }
    kayitlar.sort((a, b) => (a.olusturmaZamani < b.olusturmaZamani ? 1 : -1));
    return kayitlar;
  } catch (e) {
    return [];
  }
}

async function arzKayitKaydet(kayit) {
  await window.storage.set(`ariza:${kayit.hotelCode}:${kayit.no}`, JSON.stringify(kayit), true);
}

function arzOncelikBilgisi(oncelik) {
  return ARZ_ONCELIKLER.find((o) => o.deger === oncelik) || ARZ_ONCELIKLER[2];
}

/* ------------------------------------------------------------------
   ARIZA BİLDİRİM VE TAKİP - ana ekran (KPI + liste + gezinme)
-------------------------------------------------------------------*/
function ArizaEkrani({ user, onGeri, toastGoster }) {
  const [gorunum, setGorunum] = useState("liste"); // liste | yeni | detay
  const [kayitlar, setKayitlar] = useState([]);
  const [yukleniyor, setYukleniyor] = useState(true);
  const [secilenNo, setSecilenNo] = useState(null);
  const [filtre, setFiltre] = useState("acik");
  const [teknisyenler, setTeknisyenler] = useState([]);

  const teknisyenMi = user.department === ARZ_TEKNIK_DEPARTMAN;
  const yoneticiMi = LF_YONETICI_POZISYONLARI.includes(user.pozisyon);
  const atamaYapabilirMi = teknisyenMi && yoneticiMi;

  useEffect(() => {
    yukle();
    teknisyenleriGetir();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  async function yukle() {
    setYukleniyor(true);
    const veri = await arzKayitlariGetir(user.hotelCode);
    setKayitlar(veri);
    setYukleniyor(false);
  }

  async function teknisyenleriGetir() {
    try {
      const liste = await window.storage.list(`users:${user.hotelCode}:`, true);
      const keys = (liste && liste.keys) || [];
      const sonuc = [];
      for (const k of keys) {
        const r = await safeGet(k, true);
        if (r) {
          try {
            const veri = JSON.parse(r.value);
            if (veri.department === ARZ_TEKNIK_DEPARTMAN) sonuc.push(veri);
          } catch (e) {}
        }
      }
      setTeknisyenler(sonuc);
    } catch (e) {}
  }

  function tekrarlayanUyari(form) {
    const simdi = new Date();
    const esikTarih = new Date(simdi.getTime() - ARZ_TEKRARLAYAN_GUN * 24 * 60 * 60 * 1000);
    const benzer = kayitlar.filter(
      (k) =>
        k.kategori === form.kategori &&
        ((form.odaNo && k.odaNo === form.odaNo) || (!form.odaNo && k.alan === form.alan)) &&
        new Date(k.olusturmaZamani) >= esikTarih
    );
    return benzer.length + 1 >= ARZ_TEKRARLAYAN_ESIK ? benzer.length + 1 : 0;
  }

  async function arizaOlustur(form, fotograflar) {
    const simdi = new Date();
    const yil = simdi.getFullYear();
    const sayac = kayitlar.filter((k) => k.no.includes(`-${yil}-`)).length + 1;
    const no = `ARZ-${yil}-${String(sayac).padStart(4, "0")}`;
    const tekrarSayisi = tekrarlayanUyari(form);
    const kayit = {
      no,
      hotelCode: user.hotelCode,
      hotelName: user.hotelName,
      tarih: simdi.toLocaleDateString("tr-TR"),
      saat: simdi.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" }),
      olusturmaZamani: simdi.toISOString(),
      bildirenKullanici: user.name,
      bildirenUserCode: user.userCode,
      bildirenDepartman: user.department,
      alan: form.alan,
      odaNo: form.odaNo,
      kategori: form.kategori,
      aciklama: form.aciklama,
      oncelik: form.oncelik,
      fotograflar: fotograflar || [],
      durum: "Yeni",
      atananTeknisyen: null,
      atanmaZamani: null,
      baslamaZamani: null,
      beklemeNedeni: "",
      cozumAciklamasi: "",
      kullanilanParca: "",
      cozumFotograflari: [],
      cozumZamani: null,
      kontrolEden: "",
      kontrolZamani: null,
      kapanisZamani: null,
      auditLog: [{ zaman: simdi.toISOString(), kullanici: user.name, islem: "Arıza bildirildi" }],
    };
    await arzKayitKaydet(kayit);

    if (form.oncelik === "Acil") {
      telegramMesajGonder(
        `🔴 ACİL ARIZA\n${kayit.hotelName}\n\nArıza No: ${no}\nAlan: ${form.alan}${
          form.odaNo ? ` (Oda ${form.odaNo})` : ""
        }\nKategori: ${form.kategori}\nAçıklama: ${form.aciklama}\nBildiren: ${user.name} (${user.department})`
      );
    }
    if (tekrarSayisi > 0) {
      toastGoster(`⚠ Kaydedildi (${no}) — bu alanda son ${ARZ_TEKRARLAYAN_GUN} günde ${tekrarSayisi}. arıza!`);
    } else {
      toastGoster(`✓ Arıza bildirildi: ${no}`);
    }
    await yukle();
    setGorunum("liste");
  }

  async function auditEkle(kayit, islem) {
    return { zaman: new Date().toISOString(), kullanici: user.name, islem };
  }

  async function teknisyenAta(kayit, teknisyen) {
    const simdi = new Date();
    const guncel = {
      ...kayit,
      durum: "Atandı",
      atananTeknisyen: { userCode: teknisyen.userCode, name: teknisyen.name },
      atanmaZamani: simdi.toISOString(),
      auditLog: [...kayit.auditLog, await auditEkle(kayit, `Teknisyen atandı: ${teknisyen.name}`)],
    };
    await arzKayitKaydet(guncel);
    toastGoster(`✓ ${teknisyen.name} atandı`);
    await yukle();
  }

  async function islemeBasla(kayit) {
    const simdi = new Date();
    const guncel = {
      ...kayit,
      durum: "İşlemde",
      baslamaZamani: simdi.toISOString(),
      auditLog: [...kayit.auditLog, await auditEkle(kayit, "İşleme başlandı")],
    };
    await arzKayitKaydet(guncel);
    toastGoster("✓ İşleme başlandı");
    await yukle();
  }

  async function beklemeyeAl(kayit, neden) {
    const guncel = {
      ...kayit,
      durum: "Beklemede",
      beklemeNedeni: neden,
      auditLog: [...kayit.auditLog, await auditEkle(kayit, `Beklemeye alındı: ${neden}`)],
    };
    await arzKayitKaydet(guncel);
    toastGoster("✓ Beklemeye alındı");
    await yukle();
  }

  async function islemeDevamEt(kayit) {
    const guncel = {
      ...kayit,
      durum: "İşlemde",
      auditLog: [...kayit.auditLog, await auditEkle(kayit, "İşleme devam edildi")],
    };
    await arzKayitKaydet(guncel);
    toastGoster("✓ İşleme devam ediliyor");
    await yukle();
  }

  async function cozumKaydet(kayit, form, fotograflar) {
    const simdi = new Date();
    const guncel = {
      ...kayit,
      durum: "Kontrol Bekliyor",
      cozumAciklamasi: form.cozumAciklamasi,
      kullanilanParca: form.kullanilanParca,
      cozumFotograflari: fotograflar || [],
      cozumZamani: simdi.toISOString(),
      auditLog: [...kayit.auditLog, await auditEkle(kayit, "Çözüldü olarak işaretlendi, kontrol bekleniyor")],
    };
    await arzKayitKaydet(guncel);
    toastGoster("✓ Çözüm kaydedildi, bildiren kişinin kontrolü bekleniyor");
    await yukle();
  }

  async function kontrolOnayla(kayit, onaylandiMi, aciklama) {
    const simdi = new Date();
    if (onaylandiMi) {
      const guncel = {
        ...kayit,
        durum: "Kapatıldı",
        kontrolEden: user.name,
        kontrolZamani: simdi.toISOString(),
        kapanisZamani: simdi.toISOString(),
        auditLog: [...kayit.auditLog, await auditEkle(kayit, "Kontrol edildi ve kapatıldı")],
      };
      await arzKayitKaydet(guncel);
      toastGoster("✓ Arıza kapatıldı");
    } else {
      const guncel = {
        ...kayit,
        durum: "İşlemde",
        auditLog: [
          ...kayit.auditLog,
          await auditEkle(kayit, `Sorun devam ediyor olarak işaretlendi: ${aciklama}`),
        ],
      };
      await arzKayitKaydet(guncel);
      toastGoster("↩ Arıza tekrar işleme alındı");
    }
    await yukle();
  }

  async function fotografEkle(kayit, dataUrl) {
    const guncel = { ...kayit, fotograflar: [...(kayit.fotograflar || []), dataUrl] };
    await arzKayitKaydet(guncel);
    await yukle();
  }

  const secilenKayit = kayitlar.find((k) => k.no === secilenNo);
  const acikMi = (k) => k.durum !== "Kapatıldı";
  const bugun = new Date().toLocaleDateString("tr-TR");

  const acikSayisi = kayitlar.filter(acikMi).length;
  const yeniSayisi = kayitlar.filter((k) => k.durum === "Yeni").length;
  const atandiSayisi = kayitlar.filter((k) => k.durum === "Atandı").length;
  const islemdeSayisi = kayitlar.filter((k) => k.durum === "İşlemde").length;
  const beklemedeSayisi = kayitlar.filter((k) => k.durum === "Beklemede").length;
  const kontrolBekleyenSayisi = kayitlar.filter((k) => k.durum === "Kontrol Bekliyor").length;
  const bugunKapatilan = kayitlar.filter((k) => k.kapanisZamani && new Date(k.kapanisZamani).toLocaleDateString("tr-TR") === bugun).length;

  let gosterilecekler = kayitlar;
  if (filtre === "acik") gosterilecekler = kayitlar.filter(acikMi);
  if (filtre === "benim") gosterilecekler = kayitlar.filter((k) => k.bildirenUserCode === user.userCode);
  if (filtre === "islerim")
    gosterilecekler = kayitlar.filter((k) => k.atananTeknisyen && k.atananTeknisyen.userCode === user.userCode && acikMi(k));
  if (filtre === "kapatildi") gosterilecekler = kayitlar.filter((k) => k.durum === "Kapatıldı");

  if (gorunum === "yeni") {
    return <ARZYeniBildirim user={user} onIptal={() => setGorunum("liste")} onKaydet={arizaOlustur} />;
  }

  if (gorunum === "detay" && secilenKayit) {
    return (
      <ARZDetay
        kayit={secilenKayit}
        user={user}
        teknisyenler={teknisyenler}
        atamaYapabilirMi={atamaYapabilirMi}
        onGeri={() => {
          setGorunum("liste");
          setSecilenNo(null);
        }}
        onTeknisyenAta={teknisyenAta}
        onIslemeBasla={islemeBasla}
        onBeklemeyeAl={beklemeyeAl}
        onIslemeDevamEt={islemeDevamEt}
        onCozumKaydet={cozumKaydet}
        onKontrolOnayla={kontrolOnayla}
        onFotografEkle={fotografEkle}
      />
    );
  }

  return (
    <div style={styles.icerik}>
      <div style={styles.listeUstBaslik}>
        <button style={styles.geriButon} onClick={onGeri} aria-label="Geri">
          ←
        </button>
        <div>
          <div className="baslik-font" style={styles.listeBaslikYazi}>
            Arıza Bildirim ve Takip
          </div>
          <div style={styles.ilerlemeYazi}>{user.hotelName}</div>
        </div>
      </div>

      <button style={{ ...styles.anaButon, marginTop: 14 }} onClick={() => setGorunum("yeni")}>
        🔧 Yeni Arıza Bildir
      </button>

      <div style={styles.lfKpiIzgara}>
        {[
          ["Açık Arıza", acikSayisi, "acik"],
          ["Benim Bildirdiklerim", kayitlar.filter((k) => k.bildirenUserCode === user.userCode).length, "benim"],
          ["Benim İşlerim", kayitlar.filter((k) => k.atananTeknisyen && k.atananTeknisyen.userCode === user.userCode && acikMi(k)).length, "islerim"],
          ["Yeni", yeniSayisi, null],
          ["İşlemde", islemdeSayisi, null],
          ["Beklemede", beklemedeSayisi, null],
          ["Kontrol Bekleyen", kontrolBekleyenSayisi, null],
          ["Bugün Çözülen", bugunKapatilan, null],
        ].map(([etiket, sayi, key]) => (
          <button
            key={etiket}
            style={{ ...styles.lfKpiKart, ...(key && filtre === key ? styles.lfKpiKartAktif : {}), ...(key ? {} : { cursor: "default" }) }}
            onClick={() => key && setFiltre(key)}
          >
            <div style={styles.lfKpiSayi}>{sayi}</div>
            <div style={styles.lfKpiEtiket}>{etiket}</div>
          </button>
        ))}
      </div>

      <div style={{ display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
        {[
          ["acik", "Açık"],
          ["benim", "Bildirdiklerim"],
          ["islerim", "İşlerim"],
          ["kapatildi", "Kapatılanlar"],
          ["hepsi", "Tümü"],
        ].map(([key, label]) => (
          <button
            key={key}
            style={{ ...styles.gmSekmeButon, flex: "none", padding: "7px 14px", ...(filtre === key ? styles.gmSekmeButonAktif : {}) }}
            onClick={() => setFiltre(key)}
          >
            {label}
          </button>
        ))}
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 14 }}>
        {yukleniyor ? (
          <div style={styles.merkezYukleniyor}>Yükleniyor…</div>
        ) : gosterilecekler.length === 0 ? (
          <div style={styles.bilgiKutusu}>Kayıt bulunamadı.</div>
        ) : (
          gosterilecekler.map((k) => {
            const oncelik = arzOncelikBilgisi(k.oncelik);
            return (
              <button
                key={k.no}
                style={styles.lfKayitKarti}
                onClick={() => {
                  setSecilenNo(k.no);
                  setGorunum("detay");
                }}
              >
                <div style={styles.lfKayitUst}>
                  <span style={styles.lfKayitNo}>
                    {oncelik.emoji} {k.no}
                  </span>
                  <span style={{ ...styles.lfDurumRozeti, ...(k.durum === "Kapatıldı" ? styles.lfDurumRozetiTamam : {}) }}>
                    {k.durum}
                  </span>
                </div>
                <div style={styles.lfKayitAciklama}>
                  {k.kategori} · {k.aciklama.slice(0, 60)}
                  {k.aciklama.length > 60 ? "…" : ""}
                </div>
                <div style={styles.lfKayitAltBilgi}>
                  {k.alan}
                  {k.odaNo ? ` · Oda ${k.odaNo}` : ""} · {k.tarih} {k.saat}
                  {k.atananTeknisyen ? ` · 👤 ${k.atananTeknisyen.name}` : ""}
                </div>
              </button>
            );
          })
        )}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------
   ARIZA BİLDİRİM VE TAKİP - yeni bildirim formu
-------------------------------------------------------------------*/
function ARZYeniBildirim({ user, onIptal, onKaydet }) {
  const [alan, setAlan] = useState("");
  const [alanDiger, setAlanDiger] = useState("");
  const [odaNo, setOdaNo] = useState("");
  const [kategori, setKategori] = useState("");
  const [aciklama, setAciklama] = useState("");
  const [oncelik, setOncelik] = useState("Normal");
  const [fotograflar, setFotograflar] = useState([]);
  const [hata, setHata] = useState("");
  const [kaydediliyor, setKaydediliyor] = useState(false);
  const fileRef = useRef(null);

  function fotoSecildi(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 700;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        setFotograflar((prev) => [...prev, canvas.toDataURL("image/jpeg", 0.6)]);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function kaydet() {
    setHata("");
    if (!alan) {
      setHata("Lütfen arızanın bulunduğu alanı seçin.");
      return;
    }
    if (alan === "Diğer" && !alanDiger.trim()) {
      setHata("Lütfen 'Diğer' için alanı yazın.");
      return;
    }
    if (!kategori) {
      setHata("Lütfen bir kategori seçin.");
      return;
    }
    if (!aciklama.trim()) {
      setHata("Arıza açıklaması zorunludur.");
      return;
    }
    setKaydediliyor(true);
    const nihaiAlan = alan === "Diğer" ? alanDiger.trim() : alan;
    await onKaydet({ alan: nihaiAlan, odaNo, kategori, aciklama, oncelik }, fotograflar);
    setKaydediliyor(false);
  }

  return (
    <div style={styles.icerik}>
      <div style={styles.listeUstBaslik}>
        <button style={styles.geriButon} onClick={onIptal} aria-label="Geri">
          ←
        </button>
        <div className="baslik-font" style={styles.listeBaslikYazi}>
          Yeni Arıza Bildir
        </div>
      </div>

      <div style={{ ...styles.gmSabitDeger, marginTop: 14 }}>
        Bildiren: {user.name} · {user.department} · {new Date().toLocaleDateString("tr-TR")}{" "}
        {new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" })}
      </div>

      <Etiket>ARIZANIN BULUNDUĞU ALAN (zorunlu)</Etiket>
      <select style={styles.gmSecim} value={alan} onChange={(e) => setAlan(e.target.value)}>
        <option value="">Seçiniz</option>
        {ARZ_ALANLAR.map((a) => (
          <option key={a} value={a}>
            {a}
          </option>
        ))}
      </select>
      {alan === "Diğer" && (
        <input
          style={{ ...styles.epostaInput, marginTop: 8 }}
          value={alanDiger}
          onChange={(e) => setAlanDiger(e.target.value)}
          placeholder="Alanı yazın"
        />
      )}

      <Etiket>ODA NUMARASI (varsa)</Etiket>
      <input style={styles.epostaInput} value={odaNo} onChange={(e) => setOdaNo(e.target.value)} placeholder="örn. 218" />

      <Etiket>ARIZA KATEGORİSİ (zorunlu)</Etiket>
      <select style={styles.gmSecim} value={kategori} onChange={(e) => setKategori(e.target.value)}>
        <option value="">Seçiniz</option>
        {ARZ_KATEGORILER.map((k) => (
          <option key={k} value={k}>
            {k}
          </option>
        ))}
      </select>

      <Etiket>ARIZA AÇIKLAMASI (zorunlu)</Etiket>
      <textarea
        style={styles.aciklamaAlani}
        rows={2}
        value={aciklama}
        onChange={(e) => setAciklama(e.target.value)}
        placeholder="Arızayı tarif edin"
      />

      <Etiket>ÖNCELİK</Etiket>
      <div style={{ display: "flex", gap: 8 }}>
        {ARZ_ONCELIKLER.map((o) => (
          <button
            key={o.deger}
            style={{
              ...styles.secimKutusu,
              flex: 1,
              ...(oncelik === o.deger ? { background: o.renk, borderColor: o.renk, color: "#fff" } : {}),
            }}
            onClick={() => setOncelik(o.deger)}
          >
            {o.emoji} {o.deger}
          </button>
        ))}
      </div>

      <Etiket>FOTOĞRAF</Etiket>
      <input
        ref={fileRef}
        type="file"
        accept="image/*"
        capture="environment"
        style={{ display: "none" }}
        onChange={(e) => fotoSecildi(e.target.files[0])}
      />
      <button style={styles.fotoButon} onClick={() => fileRef.current && fileRef.current.click()}>
        📷 Fotoğraf Ekle
      </button>
      {fotograflar.length > 0 && (
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 10 }}>
          {fotograflar.map((f, i) => (
            <div key={i} style={styles.fotoOnizlemeSarmalayici}>
              <img src={f} alt="" style={styles.fotoOnizleme} />
              <button
                style={styles.fotoSilButon}
                onClick={() => setFotograflar((prev) => prev.filter((_, idx) => idx !== i))}
              >
                ✕
              </button>
            </div>
          ))}
        </div>
      )}

      {hata && <div style={styles.hataKutusu}>{hata}</div>}

      <button
        style={{ ...styles.anaButon, marginTop: 16, marginBottom: 24, opacity: kaydediliyor ? 0.7 : 1 }}
        onClick={kaydet}
        disabled={kaydediliyor}
      >
        {kaydediliyor ? "Kaydediliyor…" : "Arızayı Bildir"}
      </button>
    </div>
  );
}

/* ------------------------------------------------------------------
   ARIZA BİLDİRİM VE TAKİP - kayıt detay ekranı
-------------------------------------------------------------------*/
function ARZDetay({
  kayit,
  user,
  teknisyenler,
  atamaYapabilirMi,
  onGeri,
  onTeknisyenAta,
  onIslemeBasla,
  onBeklemeyeAl,
  onIslemeDevamEt,
  onCozumKaydet,
  onKontrolOnayla,
  onFotografEkle,
}) {
  const [secilenTeknisyen, setSecilenTeknisyen] = useState("");
  const [beklemeNedeni, setBeklemeNedeni] = useState("");
  const [beklemeAcik, setBeklemeAcik] = useState(false);
  const [cozumAciklamasi, setCozumAciklamasi] = useState("");
  const [kullanilanParca, setKullanilanParca] = useState("");
  const [cozumFotograflari, setCozumFotograflari] = useState([]);
  const [cozumAcik, setCozumAcik] = useState(false);
  const [sorunAciklamasi, setSorunAciklamasi] = useState("");
  const [sorunFormAcik, setSorunFormAcik] = useState(false);
  const [auditAcik, setAuditAcik] = useState(false);
  const [islem, setIslem] = useState(false);
  const fileRef = useRef(null);
  const cozumFileRef = useRef(null);

  const oncelik = arzOncelikBilgisi(kayit.oncelik);
  const benimAtananimMi = kayit.atananTeknisyen && kayit.atananTeknisyen.userCode === user.userCode;
  const benimBildirdigimMi = kayit.bildirenUserCode === user.userCode;

  function fotoSecildiGenel(file, hedefFonksiyon) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 700;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        hedefFonksiyon(canvas.toDataURL("image/jpeg", 0.6));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function teknisyenAtaTikla() {
    const t = teknisyenler.find((x) => x.userCode === secilenTeknisyen);
    if (!t) return;
    setIslem(true);
    await onTeknisyenAta(kayit, t);
    setIslem(false);
  }

  async function beklemeyeAlKaydet() {
    if (!beklemeNedeni.trim()) return;
    setIslem(true);
    await onBeklemeyeAl(kayit, beklemeNedeni.trim());
    setIslem(false);
    setBeklemeAcik(false);
    setBeklemeNedeni("");
  }

  async function cozumKaydetTikla() {
    if (!cozumAciklamasi.trim()) return;
    setIslem(true);
    await onCozumKaydet(kayit, { cozumAciklamasi: cozumAciklamasi.trim(), kullanilanParca }, cozumFotograflari);
    setIslem(false);
  }

  async function sorunDevamEdiyorKaydet() {
    if (!sorunAciklamasi.trim()) return;
    setIslem(true);
    await onKontrolOnayla(kayit, false, sorunAciklamasi.trim());
    setIslem(false);
  }

  return (
    <div style={styles.icerik}>
      <div style={styles.listeUstBaslik}>
        <button style={styles.geriButon} onClick={onGeri} aria-label="Geri">
          ←
        </button>
        <div>
          <div className="baslik-font" style={styles.listeBaslikYazi}>
            {kayit.no}
          </div>
          <div style={styles.ilerlemeYazi}>
            {kayit.tarih} {kayit.saat} · {kayit.bildirenKullanici}
          </div>
        </div>
      </div>

      <div style={{ ...styles.lfUyariKutusu, background: `${oncelik.renk}1A`, color: oncelik.renk }}>
        {oncelik.emoji} {oncelik.deger} öncelik · Durum: {kayit.durum}
      </div>

      <div style={styles.lfBilgiKarti}>
        <div style={styles.lfBilgiSatiri}>
          <span>Kategori</span>
          <strong>{kayit.kategori}</strong>
        </div>
        <div style={styles.lfBilgiSatiri}>
          <span>Açıklama</span>
          <strong>{kayit.aciklama}</strong>
        </div>
        <div style={styles.lfBilgiSatiri}>
          <span>Alan</span>
          <strong>
            {kayit.alan}
            {kayit.odaNo ? ` (Oda ${kayit.odaNo})` : ""}
          </strong>
        </div>
        <div style={styles.lfBilgiSatiri}>
          <span>Bildiren</span>
          <strong>
            {kayit.bildirenKullanici} · {kayit.bildirenDepartman}
          </strong>
        </div>
        {kayit.atananTeknisyen && (
          <div style={styles.lfBilgiSatiri}>
            <span>Teknisyen</span>
            <strong>{kayit.atananTeknisyen.name}</strong>
          </div>
        )}
        {kayit.beklemeNedeni && kayit.durum === "Beklemede" && (
          <div style={styles.lfBilgiSatiri}>
            <span>Bekleme Nedeni</span>
            <strong>{kayit.beklemeNedeni}</strong>
          </div>
        )}
        {kayit.cozumAciklamasi && (
          <div style={styles.lfBilgiSatiri}>
            <span>Çözüm Açıklaması</span>
            <strong>{kayit.cozumAciklamasi}</strong>
          </div>
        )}
        {kayit.kullanilanParca && (
          <div style={styles.lfBilgiSatiri}>
            <span>Kullanılan Parça</span>
            <strong>{kayit.kullanilanParca}</strong>
          </div>
        )}
      </div>

      {kayit.fotograflar && kayit.fotograflar.length > 0 && (
        <>
          <Etiket>BİLDİRİM FOTOĞRAFLARI</Etiket>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {kayit.fotograflar.map((f, i) => (
              <img key={i} src={f} alt="" style={styles.fotoOnizleme} />
            ))}
          </div>
        </>
      )}
      {kayit.cozumFotograflari && kayit.cozumFotograflari.length > 0 && (
        <>
          <Etiket>ÇÖZÜM FOTOĞRAFLARI</Etiket>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {kayit.cozumFotograflari.map((f, i) => (
              <img key={i} src={f} alt="" style={styles.fotoOnizleme} />
            ))}
          </div>
        </>
      )}
      <input
        ref={fileRef}
        type="file"
        accept="image/*"
        capture="environment"
        style={{ display: "none" }}
        onChange={(e) => fotoSecildiGenel(e.target.files[0], (url) => onFotografEkle(kayit, url))}
      />
      <button style={{ ...styles.fotoButon, marginTop: 10 }} onClick={() => fileRef.current && fileRef.current.click()}>
        📷 Fotoğraf Ekle
      </button>

      {/* --- Durum bazlı işlem alanları --- */}

      {kayit.durum === "Yeni" && atamaYapabilirMi && (
        <>
          <Etiket>TEKNİSYEN ATA</Etiket>
          <select style={styles.gmSecim} value={secilenTeknisyen} onChange={(e) => setSecilenTeknisyen(e.target.value)}>
            <option value="">Seçiniz</option>
            {teknisyenler.map((t) => (
              <option key={t.userCode} value={t.userCode}>
                {t.name}
                {t.bolum ? ` (${t.bolum})` : ""}
              </option>
            ))}
          </select>
          <button
            style={{ ...styles.anaButon, marginTop: 10, opacity: islem ? 0.7 : 1 }}
            onClick={teknisyenAtaTikla}
            disabled={islem || !secilenTeknisyen}
          >
            Teknisyeni Ata
          </button>
        </>
      )}

      {kayit.durum === "Atandı" && benimAtananimMi && (
        <button style={{ ...styles.anaButon, marginTop: 14, opacity: islem ? 0.7 : 1 }} onClick={async () => { setIslem(true); await onIslemeBasla(kayit); setIslem(false); }} disabled={islem}>
          İşleme Başla
        </button>
      )}

      {kayit.durum === "İşlemde" && benimAtananimMi && (
        <div style={{ marginTop: 14 }}>
          <div style={{ display: "flex", gap: 8 }}>
            <button style={{ ...styles.ikincilButon, flex: 1 }} onClick={() => setBeklemeAcik((a) => !a)}>
              Beklemeye Al
            </button>
            <button style={{ ...styles.anaButon, flex: 1 }} onClick={() => setCozumAcik((a) => !a)}>
              Çözüldü
            </button>
          </div>
          {beklemeAcik && (
            <div style={styles.gmMaddeSatiri}>

              <Etiket>KULLANILAN PARÇA (isteğe bağlı)</Etiket>

              <Etiket>ÇÖZÜM FOTOĞRAFI</Etiket>
              <input

                style={{ display: "none" }}

              {cozumFotograflari.length > 0 && (

      {kayit.durum === "Beklemede" && benimAtananimMi && (
        <button style={{ ...styles.anaButon, marginTop: 14, opacity: islem ? 0.7 : 1 }} onClick={async () => { setIslem(true); await onIslemeDevamEt(kayit); setIslem(false); }} disabled={islem}>

      {kayit.durum === "Kontrol Bekliyor" && (benimBildirdigimMi || atamaYapabilirMi) && (
        <div style={{ marginTop: 14 }}>
          <div style={{ display: "flex", gap: 8 }}>
            <button
              style={{ ...styles.anaButon, flex: 1, opacity: islem ? 0.7 : 1 }}
              onClick={async () => { setIslem(true); await onKontrolOnayla(kayit, true, ""); setIslem(false); }}
              disabled={islem}
            >

            <button style={{ ...styles.ikincilButon, flex: 1 }} onClick={() => setSorunFormAcik((a) => !a)}>
              ✖ Sorun Devam Ediyor

          </div>
          {sorunFormAcik && (
            <div style={styles.gmMaddeSatiri}>
              <Etiket>AÇIKLAMA (zorunlu)</Etiket>
              <textarea style={styles.aciklamaAlani} rows={2} value={sorunAciklamasi} onChange={(e) => setSorunAciklamasi(e.target.value)} placeholder="Sorunun neden devam ettiğini açıklayın" />
              <button style={{ ...styles.gmKucukSilButon, marginTop: 10 }} onClick={sorunDevamEdiyorKaydet} disabled={islem || !sorunAciklamasi.trim()}>
                Gönder

            </div>
          )}
        </div>
      )}

      {kayit.durum === "Kapatıldı" && (
        <div style={styles.basariMesaji}>✓ Bu arıza kapatıldı ({lfZamanFormatla(kayit.kapanisZamani)})</div>
      )}

      <button style={{ ...styles.adminDuzenleButon, marginTop: 14 }} onClick={() => setAuditAcik((a) => !a)}>
        📜 İşlem Geçmişi (Audit Log) {auditAcik ? "▲" : "▼"}
      </button>
      {auditAcik && (
        <div style={{ ...styles.gmMaddeSatiri, marginBottom: 24 }}>
          {kayit.auditLog.map((a, idx) => (
            <div key={idx} style={styles.zamanNotu}>

            </div>
          ))}
        </div>
      )}
    </div>
  );
}


/* ------------------------------------------------------------------
   ODA SERVİSİ - depolama yardımcı fonksiyonları
-------------------------------------------------------------------*/
async function rsSiparisleriGetir(hotelCode) {
  try {
    const liste = await window.storage.list(`roomservice:${hotelCode}:`, true);
    const keys = (liste && liste.keys) || [];
    const kayitlar = [];
    for (const k of keys) {
      const r = await safeGet(k, true);
      if (r) {
        try {
          kayitlar.push(JSON.parse(r.value));
        } catch (e) {}
      }
    }
    kayitlar.sort((a, b) => (a.olusturmaZamani < b.olusturmaZamani ? 1 : -1));
    return kayitlar;
  } catch (e) {
    return [];
  }
}

async function rsSiparisKaydet(siparis) {
  await window.storage.set(`roomservice:${siparis.hotelCode}:${siparis.no}`, JSON.stringify(siparis), true);
}

function rsSlaHedefi(kalemler) {
  const kategoriler = [...new Set((kalemler || []).map((k) => k.kategori))];
  if (kategoriler.length === 0) return RS_VARSAYILAN_SLA;
  if (kategoriler.length > 1) return RS_VARSAYILAN_SLA;
  return RS_SLA_DAKIKA[kategoriler[0]] || RS_VARSAYILAN_SLA;
}

function rsGecenDakika(siparis) {
  const bitisAn = siparis.teslimZamani ? new Date(siparis.teslimZamani) : new Date();
  return Math.round((bitisAn - new Date(siparis.olusturmaZamani)) / 60000);
}

function rsSlaDurumu(siparis) {
  if (siparis.durum === "İptal") return "iptal";
  const gecen = rsGecenDakika(siparis);
  const hedef = rsSlaHedefi(siparis.kalemler);
  if (siparis.durum === "Teslim Edildi") return gecen <= hedef ? "yesil" : "kirmizi";
  if (gecen > hedef) return "kirmizi";
  if (gecen > hedef * 0.75) return "turuncu";
  return "yesil";
}

/* ------------------------------------------------------------------
   ODA SERVİSİ - ana ekran (KPI + liste + gezinme)
-------------------------------------------------------------------*/
function RoomServiceEkrani({ user, onGeri, toastGoster }) {
  const [gorunum, setGorunum] = useState("liste"); // liste | yeni | detay
  const [siparisler, setSiparisler] = useState([]);
  const [yukleniyor, setYukleniyor] = useState(true);
  const [secilenNo, setSecilenNo] = useState(null);
  const [filtre, setFiltre] = useState("aktif");

  const mutfakMi = user.department === RS_FB_DEPARTMAN && ["Mutfak", "Executive Chef", "Sous Chef", "Ana Mutfak"].includes(user.bolum);
  const roomServiceMi = user.department === RS_FB_DEPARTMAN && user.bolum === "Room Service";
  const yoneticiMi = LF_YONETICI_POZISYONLARI.includes(user.pozisyon);

  useEffect(() => {
    yukle();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  async function yukle() {
    setYukleniyor(true);
    const veri = await rsSiparisleriGetir(user.hotelCode);
    setSiparisler(veri);
    setYukleniyor(false);
  }

  async function auditEkle(islem) {
    return { zaman: new Date().toISOString(), kullanici: user.name, islem };
  }

  async function siparisOlustur(form) {
    const simdi = new Date();
    const yil = simdi.getFullYear();
    const sayac = siparisler.filter((s) => s.no.includes(`-${yil}-`)).length + 1;
    const no = `RS-${yil}-${String(sayac).padStart(4, "0")}`;
    const toplamTutar = form.kalemler.reduce((t, k) => t + k.fiyat * k.adet, 0);
    const siparis = {
      no,
      hotelCode: user.hotelCode,
      hotelName: user.hotelName,
      odaNo: form.odaNo,
      misafirAdi: form.misafirAdi,
      kalemler: form.kalemler,
      toplamTutar,
      misafirNotu: form.misafirNotu,
      oncelik: form.oncelik,
      durum: "Yeni",
      olusturanKullanici: user.name,
      olusturanUserCode: user.userCode,
      olusturmaZamani: simdi.toISOString(),
      onaylanmaZamani: null,
      hazirlanmaBaslangic: null,
      hazirZamani: null,
      gonderilmeZamani: null,
      teslimZamani: null,
      kapanisZamani: null,
      iptalZamani: null,
      iptalNedeni: "",
      sorumluTeslimEden: null,
      auditLog: [{ zaman: simdi.toISOString(), kullanici: user.name, islem: "Sipariş oluşturuldu" }],
    };
    await rsSiparisKaydet(siparis);

    telegramMesajGonder(
      `🍽️ YENİ ODA SERVİSİ SİPARİŞİ\n${siparis.hotelName}\n\nSipariş No: ${no}\nOda: ${form.odaNo}\n${form.kalemler
        .map((k) => `${k.ad} x${k.adet}`)
        .join(", ")}\n\nAlan: ${user.name}`
    );

    toastGoster(`✓ Sipariş oluşturuldu: ${no}`);
    await yukle();
    setGorunum("liste");
  }

  async function durumIlerlet(siparis, yeniDurum, ekAlanlar, islemMetni) {
    const simdi = new Date();
    const guncel = {
      ...siparis,
      durum: yeniDurum,
      ...ekAlanlar,
      auditLog: [...siparis.auditLog, await auditEkle(islemMetni)],
    };
    await rsSiparisKaydet(guncel);
    toastGoster(`✓ ${islemMetni}`);
    await yukle();
  }

  async function siparisIptalEt(siparis, neden, aciklama) {
    const simdi = new Date();
    const tamNeden = neden === "Diğer" ? `Diğer: ${aciklama}` : neden;
    const guncel = {
      ...siparis,
      durum: "İptal",
      iptalZamani: simdi.toISOString(),
      iptalNedeni: tamNeden,
      auditLog: [...siparis.auditLog, await auditEkle(`Sipariş iptal edildi: ${tamNeden}`)],
    };
    await rsSiparisKaydet(guncel);
    toastGoster("✓ Sipariş iptal edildi");
    await yukle();
  }

  const secilenSiparis = siparisler.find((s) => s.no === secilenNo);
  const bugun = new Date().toLocaleDateString("tr-TR");
  const bugunSiparisler = siparisler.filter((s) => new Date(s.olusturmaZamani).toLocaleDateString("tr-TR") === bugun);
  const aktifMi = (s) => s.durum !== "Teslim Edildi" && s.durum !== "İptal";

  const bugunToplam = bugunSiparisler.length;
  const yeniSayisi = siparisler.filter((s) => s.durum === "Yeni").length;
  const hazirlaniyorSayisi = siparisler.filter((s) => s.durum === "Hazırlanıyor").length;
  const hazirSayisi = siparisler.filter((s) => s.durum === "Hazır").length;
  const gonderildiSayisi = siparisler.filter((s) => s.durum === "Odaya Gönderildi").length;
  const teslimEdilenBugun = bugunSiparisler.filter((s) => s.durum === "Teslim Edildi").length;
  const iptalBugun = bugunSiparisler.filter((s) => s.durum === "İptal").length;
  const teslimEdilenler = siparisler.filter((s) => s.durum === "Teslim Edildi");
  const ortTeslimSuresi =
    teslimEdilenler.length > 0
      ? Math.round(teslimEdilenler.reduce((t, s) => t + rsGecenDakika(s), 0) / teslimEdilenler.length)
      : 0;
  const slaBasarili = teslimEdilenler.filter((s) => rsSlaDurumu(s) === "yesil").length;
  const slaYuzde = teslimEdilenler.length > 0 ? Math.round((slaBasarili / teslimEdilenler.length) * 100) : 0;

  let gosterilecekler = siparisler;
  if (filtre === "aktif") gosterilecekler = siparisler.filter(aktifMi);
  if (filtre === "mutfagim") gosterilecekler = siparisler.filter((s) => aktifMi(s) && ["Yeni", "Onaylandı", "Hazırlanıyor"].includes(s.durum));
  if (filtre === "teslimatlarim") gosterilecekler = siparisler.filter((s) => aktifMi(s) && ["Hazır", "Odaya Gönderildi"].includes(s.durum));
  if (filtre === "tamamlanan") gosterilecekler = siparisler.filter((s) => !aktifMi(s));

  if (gorunum === "yeni") {
    return <RSYeniSiparis user={user} onIptal={() => setGorunum("liste")} onKaydet={siparisOlustur} />;
  }

  if (gorunum === "detay" && secilenSiparis) {
    return (
      <RSDetay
        siparis={secilenSiparis}
        user={user}
        mutfakMi={mutfakMi}
        roomServiceMi={roomServiceMi}
        yoneticiMi={yoneticiMi}
        onGeri={() => {
          setGorunum("liste");
          setSecilenNo(null);
        }}
        onDurumIlerlet={durumIlerlet}
        onIptalEt={siparisIptalEt}
      />
    );
  }

  return (
    <div style={styles.icerik}>
      <div style={styles.listeUstBaslik}>
        <button style={styles.geriButon} onClick={onGeri} aria-label="Geri">
          ←
        </button>
        <div>
          <div className="baslik-font" style={styles.listeBaslikYazi}>
            Oda Servisi
          </div>
          <div style={styles.ilerlemeYazi}>{user.hotelName}</div>
        </div>
      </div>

      <button style={{ ...styles.anaButon, marginTop: 14 }} onClick={() => setGorunum("yeni")}>
        + Yeni Sipariş
      </button>

      <div style={styles.lfKpiIzgara}>
        {[
          ["Bugün Toplam", bugunToplam, null],
          ["Yeni", yeniSayisi, null],
          ["Hazırlanıyor", hazirlaniyorSayisi, null],
          ["Hazır", hazirSayisi, null],
          ["Yolda", gonderildiSayisi, null],
          ["Bugün Teslim", teslimEdilenBugun, null],
          ["Bugün İptal", iptalBugun, null],
          ["Ort. Süre (dk)", ortTeslimSuresi, null],
          ["SLA Başarı %", `%${slaYuzde}`, null],
        ].map(([etiket, sayi]) => (
          <div key={etiket} style={{ ...styles.lfKpiKart, cursor: "default" }}>
            <div style={styles.lfKpiSayi}>{sayi}</div>
            <div style={styles.lfKpiEtiket}>{etiket}</div>
          </div>
        ))}
      </div>

      <div style={{ display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
        {[
          ["aktif", "Aktif"],
          ["mutfagim", "Mutfak"],
          ["teslimatlarim", "Teslimat"],
          ["tamamlanan", "Tamamlanan"],
          ["hepsi", "Tümü"],
        ].map(([key, label]) => (
          <button
            key={key}
            style={{ ...styles.gmSekmeButon, flex: "none", padding: "7px 14px", ...(filtre === key ? styles.gmSekmeButonAktif : {}) }}
            onClick={() => setFiltre(key)}
          >
            {label}
          </button>
        ))}
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 14 }}>
        {yukleniyor ? (
          <div style={styles.merkezYukleniyor}>Yükleniyor…</div>
        ) : gosterilecekler.length === 0 ? (
          <div style={styles.bilgiKutusu}>Sipariş bulunamadı.</div>
        ) : (
          gosterilecekler.map((s) => {
            const slaRengi = { yesil: "#2F7D5C", turuncu: "#B08D3E", kirmizi: "#B7472A", iptal: "#9CA3AF" }[rsSlaDurumu(s)];
            const gecen = rsGecenDakika(s);
            return (
              <button
                key={s.no}
                style={styles.lfKayitKarti}
                onClick={() => {
                  setSecilenNo(s.no);
                  setGorunum("detay");
                }}
              >
                <div style={styles.lfKayitUst}>
                  <span style={styles.lfKayitNo}>{s.no}</span>
                  <span style={{ ...styles.lfDurumRozeti, color: slaRengi, background: `${slaRengi}1A` }}>{s.durum}</span>
                </div>
                <div style={styles.lfKayitAciklama}>
                  Oda {s.odaNo} — {s.kalemler.map((k) => `${k.ad} x${k.adet}`).join(", ")}
                </div>
                <div style={styles.lfKayitAltBilgi}>
                  {s.olusturanKullanici} · {new Date(s.olusturmaZamani).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" })} ·{" "}
                  {aktifMi(s) ? `${gecen} dk geçti` : `${gecen} dk sürdü`}
                </div>
              </button>
            );
          })
        )}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------
   ODA SERVİSİ - yeni sipariş formu
-------------------------------------------------------------------*/
function RSYeniSiparis({ user, onIptal, onKaydet }) {
  const [odaNo, setOdaNo] = useState("");
  const [misafirAdi, setMisafirAdi] = useState("");
  const [kategori, setKategori] = useState(RS_KATEGORILER[0]);
  const [urunAdi, setUrunAdi] = useState(RS_MENU[0].ad);
  const [urunAdet, setUrunAdet] = useState("1");
  const [urunNot, setUrunNot] = useState("");
  const [kalemler, setKalemler] = useState([]);
  const [misafirNotu, setMisafirNotu] = useState("");
  const [oncelik, setOncelik] = useState("Normal");
  const [hata, setHata] = useState("");
  const [kaydediliyor, setKaydediliyor] = useState(false);

  const kategoriUrunleri = RS_MENU.filter((m) => m.kategori === kategori);

  function urunEkle() {
    const urun = RS_MENU.find((m) => m.ad === urunAdi);
    if (!urun) return;
    setKalemler((prev) => [...prev, { ad: urun.ad, kategori: urun.kategori, fiyat: urun.fiyat, adet: Number(urunAdet) || 1, not: urunNot }]);
    setUrunNot("");
    setUrunAdet("1");
  }

  function kalemSil(i) {
    setKalemler((prev) => prev.filter((_, idx) => idx !== i));
  }

  const toplamTutar = kalemler.reduce((t, k) => t + k.fiyat * k.adet, 0);

  async function kaydet() {
    setHata("");
    if (!odaNo.trim()) {
      setHata("Oda numarası zorunludur.");
      return;
    }
    if (kalemler.length === 0) {
      setHata("En az bir ürün ekleyin.");
      return;
    }
    setKaydediliyor(true);
    await onKaydet({ odaNo: odaNo.trim(), misafirAdi, kalemler, misafirNotu, oncelik });
    setKaydediliyor(false);
  }

  return (
    <div style={styles.icerik}>
      <div style={styles.listeUstBaslik}>
        <button style={styles.geriButon} onClick={onIptal} aria-label="Geri">
          ←
        </button>
        <div className="baslik-font" style={styles.listeBaslikYazi}>
          Yeni Sipariş
        </div>
      </div>

      <Etiket>ODA NO (zorunlu)</Etiket>
      <input style={styles.epostaInput} value={odaNo} onChange={(e) => setOdaNo(e.target.value)} placeholder="örn. 325" />

      <Etiket>MİSAFİR ADI (isteğe bağlı)</Etiket>
      <input style={styles.epostaInput} value={misafirAdi} onChange={(e) => setMisafirAdi(e.target.value)} />

      <div style={{ ...styles.gmSabitDeger, marginTop: 14 }}>Ürün Ekle</div>
      <Etiket>KATEGORİ</Etiket>
      <select
        style={styles.gmSecim}
        value={kategori}
        onChange={(e) => {
          setKategori(e.target.value);
          const ilk = RS_MENU.find((m) => m.kategori === e.target.value);
          setUrunAdi(ilk ? ilk.ad : "");
        }}
      >
        {RS_KATEGORILER.map((k) => (
          <option key={k} value={k}>
            {k}
          </option>
        ))}
      </select>

      <Etiket>ÜRÜN</Etiket>
      <select style={styles.gmSecim} value={urunAdi} onChange={(e) => setUrunAdi(e.target.value)}>
        {kategoriUrunleri.map((m) => (
          <option key={m.ad} value={m.ad}>
            {m.ad} — {m.fiyat > 0 ? `${m.fiyat}₺` : "-"}
          </option>
        ))}
      </select>

      <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
        <div style={{ flex: 1 }}>
          <Etiket>ADET</Etiket>
          <input
            style={styles.epostaInput}
            inputMode="numeric"
            value={urunAdet}
            onChange={(e) => setUrunAdet(e.target.value.replace(/\D/g, ""))}
          />
        </div>
        <div style={{ flex: 2 }}>
          <Etiket>NOT (örn. soğansız)</Etiket>
          <input style={styles.epostaInput} value={urunNot} onChange={(e) => setUrunNot(e.target.value)} />
        </div>
      </div>
      <button style={{ ...styles.ikincilButon, marginTop: 10 }} onClick={urunEkle}>
        + Ürünü Sipariş Listesine Ekle
      </button>

      {kalemler.length > 0 && (
        <div style={{ marginTop: 14 }}>
          <Etiket>SİPARİŞ LİSTESİ</Etiket>
          {kalemler.map((k, i) => (
            <div key={i} style={styles.gmMaddeSatiri}>
              <div style={styles.gmMaddeMetni}>
                {k.ad} x{k.adet} {k.not ? `(${k.not})` : ""} — {k.fiyat > 0 ? `${k.fiyat * k.adet}₺` : "-"}
              </div>
              <button style={styles.gmKucukSilButon} onClick={() => kalemSil(i)}>
                Sil
              </button>
            </div>
          ))}
          <div style={{ ...styles.gmSabitDeger, marginTop: 8, textAlign: "right" }}>
            Toplam (bilgi amaçlı): {toplamTutar}₺
          </div>
        </div>
      )}

      <Etiket>MİSAFİR NOTU</Etiket>
      <textarea
        style={styles.aciklamaAlani}
        rows={2}
        value={misafirNotu}
        onChange={(e) => setMisafirNotu(e.target.value)}
        placeholder="örn. Kapı çalınmadan bırakılsın"
      />

      <Etiket>ÖNCELİK</Etiket>
      <div style={{ display: "flex", gap: 8 }}>

            }}
            onClick={() => setOncelik(o)}
          >
            {o === "Acil" ? "🔴 Acil" : "🟢 Normal"}

        ))}
      </div>

      {hata && <div style={styles.hataKutusu}>{hata}</div>}

/* ------------------------------------------------------------------

-------------------------------------------------------------------*/
function RSDetay({ siparis, user, mutfakMi, roomServiceMi, yoneticiMi, onGeri, onDurumIlerlet, onIptalEt }) {
  const [islem, setIslem] = useState(false);
  const [iptalAcik, setIptalAcik] = useState(false);
  const [iptalNeden, setIptalNeden] = useState(RS_IPTAL_NEDENLERI[0]);
  const [iptalAciklama, setIptalAciklama] = useState("");
  const [auditAcik, setAuditAcik] = useState(false);

  const slaHedefi = rsSlaHedefi(siparis.kalemler);
  const gecen = rsGecenDakika(siparis);

  const iptalEdilebilirMi = ["Yeni", "Onaylandı", "Hazırlanıyor"].includes(siparis.durum);

  async function ilerlet(yeniDurum, ekAlanlar, mesaj) {
    setIslem(true);
    await onDurumIlerlet(siparis, yeniDurum, ekAlanlar, mesaj);
    setIslem(false);
  }

  async function iptalGonder() {
    if (iptalNeden === "Diğer" && !iptalAciklama.trim()) return;
    setIslem(true);
    await onIptalEt(siparis, iptalNeden, iptalAciklama.trim());
    setIslem(false);

  return (
    <div style={styles.icerik}>
      <div style={styles.listeUstBaslik}>
        <button style={styles.geriButon} onClick={onGeri} aria-label="Geri">
          ←
        </button>
        <div>
          <div className="baslik-font" style={styles.listeBaslikYazi}>
            {siparis.no}
          </div>
          <div style={styles.ilerlemeYazi}>Oda {siparis.odaNo}</div>
        </div>
      </div>

      <div style={{ ...styles.lfUyariKutusu, background: `${slaRengi}1A`, color: slaRengi }}>
        {siparis.durum === "İptal"
          ? "İptal edildi"
          : `${gecen} dk geçti · Hedef ${slaHedefi} dk ${gecen > slaHedefi ? "— SLA AŞILDI" : ""}`}
      </div>

      <div style={styles.lfBilgiKarti}>
        <div style={styles.lfBilgiSatiri}>
          <span>Durum</span>
          <strong>{siparis.durum}</strong>
        </div>
        <div style={styles.lfBilgiSatiri}>
          <span>Misafir</span>
          <strong>{siparis.misafirAdi || "-"}</strong>
        </div>
        <div style={styles.lfBilgiSatiri}>
          <span>Ürünler</span>
          <strong>
            {siparis.kalemler.map((k, i) => (
              <div key={i}>
                {k.ad} x{k.adet} {k.not ? `(${k.not})` : ""}
              </div>
            ))}
          </strong>
        </div>
        <div style={styles.lfBilgiSatiri}>
          <span>Toplam (bilgi amaçlı)</span>
          <strong>{siparis.toplamTutar}₺</strong>
        </div>
        {siparis.misafirNotu && (
          <div style={styles.lfBilgiSatiri}>
            <span>Misafir Notu</span>
            <strong>{siparis.misafirNotu}</strong>
          </div>
        )}
        <div style={styles.lfBilgiSatiri}>
          <span>Sipariş Alan</span>
          <strong>{siparis.olusturanKullanici}</strong>
        </div>
        {siparis.iptalNedeni && (
          <div style={styles.lfBilgiSatiri}>
            <span>İptal Nedeni</span>
            <strong>{siparis.iptalNedeni}</strong>
          </div>
        )}
      </div>

      {/* Durum bazlı işlem butonları */}
      {siparis.durum === "Yeni" && (
        <button style={{ ...styles.anaButon, marginTop: 14, opacity: islem ? 0.7 : 1 }} disabled={islem} onClick={() => ilerlet("Onaylandı", { onaylanmaZamani: new Date().toISOString() }, "Sipariş onaylandı")}>

      {siparis.durum === "Onaylandı" && mutfakMi && (

      {siparis.durum === "Hazırlanıyor" && mutfakMi && (

      {siparis.durum === "Hazır" && roomServiceMi && (
        <button

      {siparis.durum === "Teslim Edildi" && (
        <div style={styles.basariMesaji}>✓ Teslim edildi ({lfZamanFormatla(siparis.teslimZamani)})</div>

      {iptalEdilebilirMi && (yoneticiMi || siparis.olusturanUserCode === user.userCode) && (
        <>

            <div style={styles.gmMaddeSatiri}>
              <Etiket>İPTAL NEDENİ</Etiket>
              <select style={styles.gmSecim} value={iptalNeden} onChange={(e) => setIptalNeden(e.target.value)}>
                {RS_IPTAL_NEDENLERI.map((n) => (
                  <option key={n} value={n}>
                    {n}

              {iptalNeden === "Diğer" && (
                <input
                  style={{ ...styles.epostaInput, marginTop: 8 }}
                  value={iptalAciklama}
                  onChange={(e) => setIptalAciklama(e.target.value)}
                  placeholder="Açıklama yazın"
                />
              )}
              <button style={{ ...styles.gmKucukSilButon, marginTop: 10 }} onClick={iptalGonder} disabled={islem}>
                İptali Onayla
              </button>
            </div>
          )}
        </>
      )}

      <button style={{ ...styles.adminDuzenleButon, marginTop: 14 }} onClick={() => setAuditAcik((a) => !a)}>
        📜 İşlem Geçmişi (Audit Log) {auditAcik ? "▲" : "▼"}
      </button>
      {auditAcik && (
        <div style={{ ...styles.gmMaddeSatiri, marginBottom: 24 }}>
          {siparis.auditLog.map((a, idx) => (
            <div key={idx} style={styles.zamanNotu}>
              {lfZamanFormatla(a.zaman)} — {a.kullanici} — {a.islem}
