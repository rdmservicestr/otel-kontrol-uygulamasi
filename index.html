          ))}
        </div>
      )}
    </div>
  );
}


/* ------------------------------------------------------------------
   UYANDIRMA SERVİSİ - yardımcı fonksiyonlar
-------------------------------------------------------------------*/
async function uynKayitlariGetir(hotelCode) {
  try {
    const liste = await window.storage.list(`uyandirma:${hotelCode}:`, true);
    const keys = (liste && liste.keys) || [];
    const kayitlar = [];
    for (const k of keys) {
      const r = await safeGet(k, true);
      if (r) {
        try {
          kayitlar.push(JSON.parse(r.value));
        } catch (e) {}
      }
    }
    return kayitlar;
  } catch (e) {
    return [];
  }
}

async function uynKayitKaydet(kayit) {
  await window.storage.set(`uyandirma:${kayit.hotelCode}:${kayit.no}`, JSON.stringify(kayit), true);
}

// Kayıttaki tarih ("YYYY-MM-DD") + saat ("HH:MM") bilgisinden planlanan an.
function uynPlanZamani(kayit) {
  const [y, m, d] = kayit.tarih.split("-").map(Number);
  const [hh, mm] = kayit.saat.split(":").map(Number);
  return new Date(y, m - 1, d, hh, mm, 0, 0);
}

// Saati gelmiş (veya geçmiş) ama henüz aranmamış mı?
function uynZamaniGeldiMi(kayit) {
  return kayit.durum === "Bekliyor" && uynPlanZamani(kayit) <= new Date();
}

function uynYarinTarihi() {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// Kısa uyarı sesi + titreşim (uygulama içi uyarı).
function uynBipSesi() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) {
      const ctx = new AC();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.7);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.75);
    }
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  } catch (e) {}
}

/* ------------------------------------------------------------------
   UYANDIRMA SERVİSİ - ana ekran (KPI + uyarı + liste + gezinme)
-------------------------------------------------------------------*/
function UyandirmaEkrani({ user, onGeri, toastGoster }) {
  const [gorunum, setGorunum] = useState("liste"); // liste | yeni | detay
  const [kayitlar, setKayitlar] = useState([]);
  const [yukleniyor, setYukleniyor] = useState(true);
  const [secilenNo, setSecilenNo] = useState(null);
  const [filtre, setFiltre] = useState("bugun");
  const [, setTick] = useState(0);

  const aramaYapabilirMi = UYN_ARAMA_DEPARTMANLARI.includes(user.department);
  const yoneticiMi = LF_YONETICI_POZISYONLARI.includes(user.pozisyon);

  useEffect(() => {
    yukle(true);
    const id = setInterval(() => {
      setTick((x) => x + 1);
      yukle(false);
    }, 15000);
    return () => clearInterval(id);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  async function yukle(goster) {
    if (goster) setYukleniyor(true);
    const veri = await uynKayitlariGetir(user.hotelCode);
    setKayitlar(veri);
    setYukleniyor(false);
  }

  async function talepOlustur(form) {
    const simdi = new Date();
    const yil = simdi.getFullYear();
    const sayac = kayitlar.filter((k) => k.no.includes(`-${yil}-`)).length + 1;
    const no = `UYN-${yil}-${String(sayac).padStart(4, "0")}`;
    const kayit = {
      no,
      hotelCode: user.hotelCode,
      hotelName: user.hotelName,
      tarih: form.tarih,
      saat: form.saat,
      odaNo: form.odaNo,
      aciklama: form.aciklama,
      durum: "Bekliyor",
      olusturanKullanici: user.name,
      olusturanUserCode: user.userCode,
      olusturmaZamani: simdi.toISOString(),
      denemeler: [],
      iptalNedeni: "",
      auditLog: [{ zaman: simdi.toISOString(), kullanici: user.name, islem: "Uyandırma talebi alındı" }],
    };
    await uynKayitKaydet(kayit);
    toastGoster(`✓ Uyandırma kaydedildi: ${no}`);
    await yukle(true);
    setGorunum("liste");
  }

  async function sonucIsaretle(kayit, sonuc, not) {
    const simdi = new Date();
    const guncel = {
      ...kayit,
      durum: sonuc,
      denemeler: [
        ...(kayit.denemeler || []),
        { zaman: simdi.toISOString(), sonuc, kullanici: user.name, not: not || "" },
      ],
      auditLog: [
        ...kayit.auditLog,
        { zaman: simdi.toISOString(), kullanici: user.name, islem: `Arama sonucu: ${sonuc}${not ? ` — ${not}` : ""}` },
      ],
    };
    await uynKayitKaydet(guncel);
    toastGoster(`✓ "${sonuc}" olarak işaretlendi`);
    await yukle(false);
  }

  async function iptalEt(kayit, neden, aciklama) {
    const simdi = new Date();
    const tamNeden = neden === "Diğer" ? `Diğer: ${aciklama}` : neden;
    const guncel = {
      ...kayit,
      durum: "İptal",
      iptalNedeni: tamNeden,
      auditLog: [
        ...kayit.auditLog,
        { zaman: simdi.toISOString(), kullanici: user.name, islem: `Uyandırma iptal edildi: ${tamNeden}` },
      ],
    };
    await uynKayitKaydet(guncel);
    toastGoster("✓ Uyandırma talebi iptal edildi");
    await yukle(false);
  }

  const secilenKayit = kayitlar.find((k) => k.no === secilenNo);
  const bugun = bugunTarihi();
  const yarin = uynYarinTarihi();
  const bugunKayitlari = kayitlar.filter((k) => k.tarih === bugun);
  const simdiAranacaklar = kayitlar
    .filter(uynZamaniGeldiMi)
    .sort((a, b) => uynPlanZamani(a) - uynPlanZamani(b));

  const artan = (a, b) => uynPlanZamani(a) - uynPlanZamani(b);
  const azalan = (a, b) => uynPlanZamani(b) - uynPlanZamani(a);
  let gosterilecekler = [];
  if (filtre === "bugun") gosterilecekler = bugunKayitlari.slice().sort(artan);
  if (filtre === "yarin") gosterilecekler = kayitlar.filter((k) => k.tarih === yarin).sort(artan);
  if (filtre === "tumu") gosterilecekler = kayitlar.slice().sort(azalan);
  if (filtre === "tamamlanan")
    gosterilecekler = kayitlar.filter((k) => UYN_KAPALI_DURUMLAR.includes(k.durum)).sort(azalan);

  if (gorunum === "yeni") {
    return <UYNYeniTalep mevcutKayitlar={kayitlar} onIptal={() => setGorunum("liste")} onKaydet={talepOlustur} />;
  }

  if (gorunum === "detay" && secilenKayit) {
    return (
      <UYNDetay
        kayit={secilenKayit}
        user={user}
        aramaYapabilirMi={aramaYapabilirMi}
        yoneticiMi={yoneticiMi}
        onGeri={() => {
          setGorunum("liste");
          setSecilenNo(null);
        }}
        onSonucIsaretle={sonucIsaretle}
        onIptalEt={iptalEt}
      />
    );
  }

  return (
    <div style={styles.icerik}>
      <div style={styles.listeUstBaslik}>
        <button style={styles.geriButon} onClick={onGeri} aria-label="Geri">
          ←
        </button>
        <div>
          <div className="baslik-font" style={styles.listeBaslikYazi}>
            Uyandırma Servisi
          </div>
          <div style={styles.ilerlemeYazi}>{user.hotelName}</div>
        </div>
      </div>

      <button style={{ ...styles.anaButon, marginTop: 14 }} onClick={() => setGorunum("yeni")}>
        + Yeni Uyandırma Talebi
      </button>

      {simdiAranacaklar.length > 0 && (
        <div style={styles.uynUyariKutusu}>
          <div style={{ fontWeight: 700, fontSize: 13 }}>⏰ ŞİMDİ ARANACAKLAR ({simdiAranacaklar.length})</div>
          {simdiAranacaklar.map((k) => (
            <button
              key={k.no}
              style={styles.uynUyariSatiri}
              onClick={() => {
                setSecilenNo(k.no);
                setGorunum("detay");
              }}
            >
              Oda {k.odaNo} — {k.saat} ({formatTarihSadece(k.tarih)}){k.aciklama ? ` — ${k.aciklama}` : ""}
            </button>
          ))}
        </div>
      )}

      <div style={styles.lfKpiIzgara}>
        {[
          ["Bugün Toplam", bugunKayitlari.length],
          ["Bekleyen", bugunKayitlari.filter((k) => k.durum === "Bekliyor").length],
          ["Cevap Verdi", bugunKayitlari.filter((k) => k.durum === "Cevap Verdi").length],
          ["Cevap Yok", bugunKayitlari.filter((k) => k.durum === "Cevap Yok").length],
          ["Geciken", simdiAranacaklar.length],
          ["İptal", bugunKayitlari.filter((k) => k.durum === "İptal").length],
        ].map(([etiket, sayi]) => (
          <div key={etiket} style={{ ...styles.lfKpiKart, cursor: "default" }}>
            <div style={styles.lfKpiSayi}>{sayi}</div>
            <div style={styles.lfKpiEtiket}>{etiket}</div>
          </div>
        ))}
      </div>

      <div style={{ display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
        {[
          ["bugun", "Bugün"],
          ["yarin", "Yarın"],
          ["tumu", "Tümü"],
          ["tamamlanan", "Tamamlanan"],
        ].map(([key, label]) => (
          <button
            key={key}
            style={{ ...styles.gmSekmeButon, flex: "none", padding: "7px 14px", ...(filtre === key ? styles.gmSekmeButonAktif : {}) }}
            onClick={() => setFiltre(key)}
          >
            {label}
          </button>
        ))}
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 14 }}>
        {yukleniyor ? (
          <div style={styles.merkezYukleniyor}>Yükleniyor…</div>
        ) : gosterilecekler.length === 0 ? (
          <div style={styles.bilgiKutusu}>Uyandırma kaydı bulunamadı.</div>
        ) : (
          gosterilecekler.map((k) => {
            const geldi = uynZamaniGeldiMi(k);
            const kalanDk = Math.round((uynPlanZamani(k) - new Date()) / 60000);
            let renk = "#2F7D5C";
            let etiket = k.durum;
            if (k.durum === "Bekliyor") {
              if (geldi) {
                renk = "#B7472A";
                etiket = "ŞİMDİ ARANACAK";
              } else if (kalanDk <= 5) {
                renk = "#B08D3E";
                etiket = `${kalanDk} dk kaldı`;
              }
            } else if (k.durum === "Cevap Yok") {
              renk = "#B08D3E";
            } else if (k.durum === "Ulaşılamadı") {
              renk = "#B7472A";
            } else if (k.durum === "İptal") {
              renk = "#9CA3AF";
            }
            return (
              <button
                key={k.no}
                style={{
                  ...styles.lfKayitKarti,
                  ...(geldi ? { borderColor: "#B7472A", borderWidth: 2, animation: "uynYanipSon 1.2s ease-in-out infinite" } : {}),
                }}
                onClick={() => {
                  setSecilenNo(k.no);
                  setGorunum("detay");
                }}
              >
                <div style={styles.lfKayitUst}>
                  <span style={styles.lfKayitNo}>
                    ⏰ {k.saat} · Oda {k.odaNo}
                  </span>
                  <span style={{ ...styles.lfDurumRozeti, color: renk, background: `${renk}1A` }}>{etiket}</span>
                </div>
                <div style={styles.lfKayitAciklama}>{k.aciklama ? k.aciklama : "Açıklama yok"}</div>
                <div style={styles.lfKayitAltBilgi}>
                  {formatTarihSadece(k.tarih)} · {k.no} · {(k.denemeler || []).length} arama
                </div>
              </button>
            );
          })
        )}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------
   UYANDIRMA SERVİSİ - yeni talep formu
-------------------------------------------------------------------*/
function UYNYeniTalep({ mevcutKayitlar, onIptal, onKaydet }) {
  const [tarih, setTarih] = useState(bugunTarihi());
  const [saat, setSaat] = useState("");
  const [odaNo, setOdaNo] = useState("");
  const [aciklama, setAciklama] = useState("");
  const [hata, setHata] = useState("");
  const [kaydediliyor, setKaydediliyor] = useState(false);

  async function kaydet() {
    setHata("");
    const oda = odaNo.trim();
    if (!tarih) {
      setHata("Tarih zorunludur.");
      return;
    }
    if (!saat) {
      setHata("Saat zorunludur.");
      return;
    }
    if (!oda) {
      setHata("Oda numarası zorunludur.");
      return;
    }
    const [y, m, d] = tarih.split("-").map(Number);
    const [hh, mm] = saat.split(":").map(Number);
    if (new Date(y, m - 1, d, hh, mm, 0, 0) < new Date()) {
      setHata("Geçmiş bir tarih/saat için uyandırma kaydedilemez.");
      return;
    }
    const mukerrer = mevcutKayitlar.some(
      (k) => k.odaNo === oda && k.tarih === tarih && k.saat === saat && k.durum !== "İptal"
    );
    if (mukerrer) {
      setHata("Bu oda için aynı tarih ve saatte zaten bir uyandırma kaydı var.");
      return;
    }
    setKaydediliyor(true);
    await onKaydet({ tarih, saat, odaNo: oda, aciklama: aciklama.trim() });
    setKaydediliyor(false);
  }

  return (
    <div style={styles.icerik}>
      <div style={styles.listeUstBaslik}>
        <button style={styles.geriButon} onClick={onIptal} aria-label="Geri">
          ←
        </button>
        <div className="baslik-font" style={styles.listeBaslikYazi}>
          Yeni Uyandırma Talebi
        </div>
      </div>

      <Etiket>TARİH (zorunlu)</Etiket>
      <input type="date" style={styles.epostaInput} value={tarih} min={bugunTarihi()} onChange={(e) => setTarih(e.target.value)} />

      <Etiket>SAAT (zorunlu)</Etiket>
      <input type="time" style={styles.epostaInput} value={saat} onChange={(e) => setSaat(e.target.value)} />

      <Etiket>ODA NUMARASI (zorunlu)</Etiket>
      <input style={styles.epostaInput} value={odaNo} onChange={(e) => setOdaNo(e.target.value)} placeholder="örn. 325" />

      <Etiket>AÇIKLAMA</Etiket>
      <textarea
        style={styles.aciklamaAlani}
        rows={3}
        maxLength={UYN_ACIKLAMA_MAX}
        value={aciklama}
        onChange={(e) => setAciklama(e.target.value)}
        placeholder="örn. 2 kez arayın, VIP misafir, ismiyle hitap edin"
      />
      <div style={styles.zamanNotu}>
        {aciklama.length}/{UYN_ACIKLAMA_MAX} karakter
      </div>

      {hata && <div style={styles.hataKutusu}>{hata}</div>}

      <button
        style={{ ...styles.anaButon, marginTop: 16, marginBottom: 24, opacity: kaydediliyor ? 0.7 : 1 }}
        onClick={kaydet}
        disabled={kaydediliyor}
      >
        {kaydediliyor ? "Kaydediliyor…" : "Talebi Kaydet"}
      </button>
    </div>
  );
}

/* ------------------------------------------------------------------
   UYANDIRMA SERVİSİ - kayıt detay ekranı
-------------------------------------------------------------------*/
function UYNDetay({ kayit, user, aramaYapabilirMi, yoneticiMi, onGeri, onSonucIsaretle, onIptalEt }) {
  const [not, setNot] = useState("");
  const [islem, setIslem] = useState(false);
  const [iptalAcik, setIptalAcik] = useState(false);
  const [iptalNeden, setIptalNeden] = useState(UYN_IPTAL_NEDENLERI[0]);
  const [iptalAciklama, setIptalAciklama] = useState("");
  const [auditAcik, setAuditAcik] = useState(false);

  const geldi = uynZamaniGeldiMi(kayit);
  const durumRengi = {
    Bekliyor: geldi ? "#B7472A" : "#2F7D5C",
    "Cevap Verdi": "#2F7D5C",
    "Cevap Yok": "#B08D3E",
    Ulaşılamadı: "#B7472A",
    İptal: "#9CA3AF",
  }[kayit.durum];
  const islemYapilabilir = kayit.durum === "Bekliyor" || kayit.durum === "Cevap Yok";
  const iptalEdebilir = islemYapilabilir && (yoneticiMi || kayit.olusturanUserCode === user.userCode);

  async function isaretle(sonuc) {
    setIslem(true);
    await onSonucIsaretle(kayit, sonuc, not.trim());
    setNot("");
    setIslem(false);
  }

  async function iptalGonder() {
    if (iptalNeden === "Diğer" && !iptalAciklama.trim()) return;
    setIslem(true);
    await onIptalEt(kayit, iptalNeden, iptalAciklama.trim());
    setIslem(false);
  }

  return (
    <div style={styles.icerik}>
      <div style={styles.listeUstBaslik}>
        <button style={styles.geriButon} onClick={onGeri} aria-label="Geri">
          ←
        </button>
        <div>
          <div className="baslik-font" style={styles.listeBaslikYazi}>
            {kayit.no}
          </div>
          <div style={styles.ilerlemeYazi}>
            Oda {kayit.odaNo} · {kayit.saat}
          </div>
        </div>
      </div>

      <div style={{ ...styles.lfUyariKutusu, background: `${durumRengi}1A`, color: durumRengi }}>
        {kayit.durum === "Bekliyor" && geldi ? "⏰ ŞİMDİ ARANACAK" : `Durum: ${kayit.durum}`}
      </div>

      <div style={styles.lfBilgiKarti}>
        <div style={styles.lfBilgiSatiri}>
          <span>Tarih / Saat</span>
          <strong>
            {formatTarihSadece(kayit.tarih)} · {kayit.saat}
          </strong>
        </div>
        <div style={styles.lfBilgiSatiri}>
          <span>Oda</span>
          <strong>{kayit.odaNo}</strong>
        </div>
        <div style={styles.lfBilgiSatiri}>
          <span>Açıklama</span>
          <strong>{kayit.aciklama || "-"}</strong>
        </div>
        <div style={styles.lfBilgiSatiri}>
          <span>Talebi Alan</span>
          <strong>{kayit.olusturanKullanici}</strong>
        </div>
        {kayit.iptalNedeni && (
          <div style={styles.lfBilgiSatiri}>
            <span>İptal Nedeni</span>
            <strong>{kayit.iptalNedeni}</strong>
          </div>
        )}
      </div>

      {islemYapilabilir && aramaYapabilirMi && (
        <div style={{ marginTop: 14 }}>
          <Etiket>NOT (isteğe bağlı)</Etiket>
          <input
            style={styles.epostaInput}
            value={not}
            onChange={(e) => setNot(e.target.value)}
            placeholder="örn. oda telefonu meşgul"
          />
          <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
            <button
              style={{ ...styles.anaButon, flex: 1, opacity: islem ? 0.7 : 1 }}
              disabled={islem}
              onClick={() => isaretle("Cevap Verdi")}
            >
              ✔ Cevap Verdi
            </button>
            <button
              style={{ ...styles.ikincilButon, flex: 1, opacity: islem ? 0.7 : 1 }}
              disabled={islem}
              onClick={() => isaretle("Cevap Yok")}
            >
              ✖ Cevap Yok
            </button>
          </div>
          {kayit.durum === "Cevap Yok" && (
            <button
              style={{ ...styles.gmKucukSilButon, width: "100%", marginTop: 8, padding: "10px 12px" }}
              disabled={islem}
              onClick={() => isaretle("Ulaşılamadı")}
            >
              🚫 Ulaşılamadı (kaydı kapat)
            </button>
          )}
        </div>
      )}

      {islemYapilabilir && !aramaYapabilirMi && (
        <div style={styles.bilgiKutusu}>
          Arama sonucunu yalnızca Ön Büro / Santral / Gece Müdürü kullanıcıları işaretleyebilir.
        </div>
      )}

      {kayit.denemeler && kayit.denemeler.length > 0 && (
        <>
          <Etiket>ARAMA GEÇMİŞİ ({kayit.denemeler.length})</Etiket>
          <div style={styles.gmMaddeSatiri}>
            {kayit.denemeler.map((d, i) => (
              <div key={i} style={styles.zamanNotu}>
                {lfZamanFormatla(d.zaman)} — {d.sonuc} — {d.kullanici}
                {d.not ? ` — ${d.not}` : ""}
              </div>
            ))}
          </div>
        </>
      )}

      {iptalEdebilir && (
        <>
          <button style={{ ...styles.adminDuzenleButon, marginTop: 14 }} onClick={() => setIptalAcik((a) => !a)}>
            ✕ Talebi İptal Et
          </button>
          {iptalAcik && (
            <div style={styles.gmMaddeSatiri}>
              <Etiket>İPTAL NEDENİ</Etiket>
              <select style={styles.gmSecim} value={iptalNeden} onChange={(e) => setIptalNeden(e.target.value)}>
                {UYN_IPTAL_NEDENLERI.map((n) => (
                  <option key={n} value={n}>
                    {n}
                  </option>
                ))}
              </select>
              {iptalNeden === "Diğer" && (
                <input
                  style={{ ...styles.epostaInput, marginTop: 8 }}
                  value={iptalAciklama}
                  onChange={(e) => setIptalAciklama(e.target.value)}
                  placeholder="Açıklama yazın (zorunlu)"
                />
              )}
              <button style={{ ...styles.gmKucukSilButon, marginTop: 10 }} onClick={iptalGonder} disabled={islem}>
                İptali Onayla
              </button>
            </div>
          )}
        </>
      )}

      <button style={{ ...styles.adminDuzenleButon, marginTop: 14 }} onClick={() => setAuditAcik((a) => !a)}>
        📜 İşlem Geçmişi (Audit Log) {auditAcik ? "▲" : "▼"}
      </button>
      {auditAcik && (
        <div style={{ ...styles.gmMaddeSatiri, marginBottom: 24 }}>
          {kayit.auditLog.map((a, idx) => (
            <div key={idx} style={styles.zamanNotu}>
              {lfZamanFormatla(a.zaman)} — {a.kullanici} — {a.islem}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------
   PAVILION REZERVASYON MODÜLÜ - yardımcı fonksiyonlar
-------------------------------------------------------------------*/
async function pavKayitlariGetir(hotelCode) {
  try {
    const liste = await window.storage.list(`pavilion:${hotelCode}:`, true);
    const keys = (liste && liste.keys) || [];
    const kayitlar = [];
    for (const k of keys) {
      const r = await safeGet(k, true);
      if (r) {
        try {
          kayitlar.push(JSON.parse(r.value));
        } catch (e) {}
      }
    }
    return kayitlar;
  } catch (e) {
    return [];
  }
}

async function pavKayitKaydet(kayit) {
  await window.storage.set(`pavilion:${kayit.hotelCode}:${kayit.no}`, JSON.stringify(kayit), true);
}

// Belirli bir pavilion + gün için geçerli (Rezerve / Kullanıldı) kaydı döner.
function pavAktifKayit(kayitlar, pavNo, tarih) {
  return (
    kayitlar.find((k) => k.pavilionNo === pavNo && k.tarih === tarih && PAV_AKTIF_DURUMLAR.includes(k.durum)) || null
  );
}

function pavTarihEkle(tarih, gun) {
  const [y, m, d] = tarih.split("-").map(Number);
  const dt = new Date(y, m - 1, d + gun);
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
}

function pavTarihKisa(tarih) {
  const [, m, d] = tarih.split("-");
  return `${d}.${m}`;
}

function pavGunAdi(tarih) {
  const [y, m, d] = tarih.split("-").map(Number);
  return ["Paz", "Pzt", "Sal", "Çar", "Per", "Cum", "Cmt"][new Date(y, m - 1, d).getDay()];
}

function pavPara(n) {
  return Number(n || 0).toLocaleString("tr-TR");
}

function pavDurumRengi(k) {
  if (!k) return PAV_RENKLER.bos;
  return k.durum === "Kullanıldı" ? PAV_RENKLER.kullanildi : PAV_RENKLER.rezerve;
}

function pavHexToRgb(hex) {
  const h = hex.replace("#", "");
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}

function pavPdfFontYukle(doc) {
  try {
    doc.addFileToVFS("TurkceFontRegular.ttf", TURKCE_FONT_REGULAR_B64);
    doc.addFont("TurkceFontRegular.ttf", "TurkceFont", "normal");
    doc.addFileToVFS("TurkceFontBold.ttf", TURKCE_FONT_BOLD_B64);
    doc.addFont("TurkceFontBold.ttf", "TurkceFont", "bold");
    return "TurkceFont";
  } catch (e) {
    return "helvetica";
  }
}

// Günlük rapor: üstte renkli pavilion çizelgesi (chart), altında ayrıntılı tablo ve toplamlar.
function pavPdfGunluk(kayitlar, tarih, hotelName, kullaniciAdi) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4" });
  const font = pavPdfFontYukle(doc);
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const m = 40;
  let y = m;

  const satirlar = PAV_LISTESI.map((p) => ({ p, k: pavAktifKayit(kayitlar, p.no, tarih) }));
  const doluSayisi = satirlar.filter((s) => s.k).length;
  const toplamKisi = satirlar.reduce((t, s) => t + (s.k ? Number(s.k.kisiSayisi) || 0 : 0), 0);
  const toplamUcret = satirlar.reduce((t, s) => t + (s.k ? Number(s.k.ucret) || 0 : 0), 0);

  doc.setFont(font, "bold");
  doc.setFontSize(17);
  doc.setTextColor(22, 50, 58);
  doc.text("Pavilion Rezervasyon Raporu", m, y + 6);
  doc.setDrawColor(176, 141, 62);
  doc.setLineWidth(1.2);
  doc.line(m, y + 14, W - m, y + 14);
  y += 32;

  doc.setFont(font, "normal");
  doc.setFontSize(10);
  doc.setTextColor(70, 70, 70);
  doc.text(`${hotelName}   |   Tarih: ${formatTarihSadece(tarih)}`, m, y);
  y += 14;
  doc.text(
    `Doluluk: ${doluSayisi}/${PAV_LISTESI.length}   |   Toplam kişi: ${toplamKisi}   |   Toplam ücret: ${pavPara(toplamUcret)} TL`,
    m,
    y
  );
  y += 14;
  doc.text(`Hazırlayan: ${kullaniciAdi}   |   ${new Date().toLocaleString("tr-TR")}`, m, y);
  y += 22;

  // --- Çizelge (chart) ---
  function kutulariCiz(baslik, liste) {
    doc.setFont(font, "bold");
    doc.setFontSize(11);
    doc.setTextColor(22, 50, 58);
    doc.text(baslik, m, y);
    y += 8;
    const kolon = 5;
    const bosluk = 8;
    const kw = (W - 2 * m - bosluk * (kolon - 1)) / kolon;
    const kh = 48;
    liste.forEach((p, i) => {
      const r = Math.floor(i / kolon);
      const c = i % kolon;
      const x = m + c * (kw + bosluk);
      const yy = y + r * (kh + bosluk);
      const k = pavAktifKayit(kayitlar, p.no, tarih);
      const [rr, gg, bb] = pavHexToRgb(pavDurumRengi(k));
      doc.setFillColor(rr, gg, bb);
      doc.roundedRect(x, yy, kw, kh, 5, 5, "F");
      doc.setTextColor(255, 255, 255);
      doc.setFont(font, "bold");
      doc.setFontSize(12);
      doc.text(p.no, x + 8, yy + 16);
      doc.setFont(font, "normal");
      doc.setFontSize(8);
      doc.text(k ? `Oda ${k.odaNo} - ${k.kisiSayisi} kişi` : "BOŞ", x + 8, yy + 29);
      if (k) doc.text(`${pavPara(k.ucret)} TL`, x + 8, yy + 40);
    });
    const satirSayisi = Math.ceil(liste.length / kolon);
    y += satirSayisi * (kh + bosluk) + 14;
  }

  PAV_ALANLAR.forEach((alan) => {
    const liste = PAV_LISTESI.filter((p) => p.alan === alan);
    kutulariCiz(`${alan} (${liste[0].no} - ${liste[liste.length - 1].no})`, liste);
  });

  // Gösterge
  [
    ["Boş", PAV_RENKLER.bos],
    ["Rezerve", PAV_RENKLER.rezerve],
    ["Kullanıldı", PAV_RENKLER.kullanildi],
  ].forEach(([etiket, renk], i) => {
    const [rr, gg, bb] = pavHexToRgb(renk);
    const x = m + i * 90;
    doc.setFillColor(rr, gg, bb);
    doc.rect(x, y - 8, 10, 10, "F");
    doc.setFont(font, "normal");
    doc.setFontSize(9);
    doc.setTextColor(70, 70, 70);
    doc.text(etiket, x + 15, y);
  });
  y += 20;

  // --- Ayrıntılı tablo ---
  const kolonlar = [
    { b: "Pavilion", w: 56 },
    { b: "Durum", w: 62 },
    { b: "Oda", w: 42 },
    { b: "Kişi", w: 34 },
    { b: "Ücret (TL)", w: 74 },
    { b: "Açıklama", w: W - 2 * m - 56 - 62 - 42 - 34 - 74 },
  ];
  const xKonum = [0, 56, 118, 160, 194, 268].map((v) => m + v);

  function baslikCiz() {
    doc.setFillColor(22, 50, 58);
    doc.rect(m, y, W - 2 * m, 20, "F");
    doc.setFont(font, "bold");
    doc.setFontSize(9);
    doc.setTextColor(255, 255, 255);
    kolonlar.forEach((c, i) => doc.text(c.b, xKonum[i] + 5, y + 13));
    y += 20;
  }

  if (y + 60 > H - 60) {
    doc.addPage();
    y = m;
  }
  baslikCiz();

  satirlar.forEach((s, i) => {
    const k = s.k;
    const aciklamaSatirlari = doc.splitTextToSize(k ? k.aciklama : "-", kolonlar[5].w - 10);
    const h = Math.max(20, aciklamaSatirlari.length * 10 + 10);
    if (y + h > H - 60) {
      doc.addPage();
      y = m;
      baslikCiz();
    }
    if (i % 2 === 0) {
      doc.setFillColor(246, 245, 241);
      doc.rect(m, y, W - 2 * m, h, "F");
    }
    doc.setFont(font, "bold");
    doc.setFontSize(9);
    doc.setTextColor(22, 50, 58);
    doc.text(s.p.no, xKonum[0] + 5, y + 13);
    const [rr, gg, bb] = pavHexToRgb(pavDurumRengi(k));
    doc.setTextColor(rr, gg, bb);
    doc.text(k ? k.durum : "Boş", xKonum[1] + 5, y + 13);
    doc.setFont(font, "normal");
    doc.setTextColor(40, 40, 40);
    doc.text(k ? String(k.odaNo) : "-", xKonum[2] + 5, y + 13);
    doc.text(k ? String(k.kisiSayisi) : "-", xKonum[3] + 5, y + 13);
    doc.text(k ? pavPara(k.ucret) : "-", xKonum[4] + 5, y + 13);
    doc.text(aciklamaSatirlari, xKonum[5] + 5, y + 13);
    y += h;
  });

  if (y + 24 > H - 60) {
    doc.addPage();
    y = m;
  }
  doc.setFillColor(230, 225, 210);
  doc.rect(m, y, W - 2 * m, 22, "F");
  doc.setFont(font, "bold");
  doc.setFontSize(9);
  doc.setTextColor(22, 50, 58);
  doc.text("TOPLAM", xKonum[0] + 5, y + 14);
  doc.text(`${doluSayisi} dolu`, xKonum[1] + 5, y + 14);
  doc.text(String(toplamKisi), xKonum[3] + 5, y + 14);
  doc.text(pavPara(toplamUcret), xKonum[4] + 5, y + 14);

  const sayfaSayisi = doc.getNumberOfPages();
  for (let i = 1; i <= sayfaSayisi; i++) {
    doc.setPage(i);
    doc.setFont(font, "normal");
    doc.setFontSize(8);
    doc.setTextColor(120, 120, 120);
    doc.text(`Sayfa ${i}/${sayfaSayisi}`, W / 2, H - 24, { align: "center" });
  }
  return doc;
}

// Haftalık rapor: yatay sayfada pavilion x gün matrisi.
function pavPdfHaftalik(kayitlar, baslangic, hotelName, kullaniciAdi) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4", orientation: "landscape" });
  const font = pavPdfFontYukle(doc);
  const W = doc.internal.pageSize.getWidth();
  const m = 36;
  let y = m;
  const gunler = Array.from({ length: 7 }, (_, i) => pavTarihEkle(baslangic, i));

  doc.setFont(font, "bold");
  doc.setFontSize(16);
  doc.setTextColor(22, 50, 58);
  doc.text("Pavilion Haftalık Rezervasyon Çizelgesi", m, y + 6);
  doc.setDrawColor(176, 141, 62);
  doc.setLineWidth(1.2);
  doc.line(m, y + 13, W - m, y + 13);
  y += 28;
  doc.setFont(font, "normal");
  doc.setFontSize(9);
  doc.setTextColor(70, 70, 70);
  doc.text(
    `${hotelName}   |   ${formatTarihSadece(gunler[0])} - ${formatTarihSadece(gunler[6])}   |   Hazırlayan: ${kullaniciAdi}   |   ${new Date().toLocaleString("tr-TR")}`,
    m,
    y
  );
  y += 14;

  const etiketW = 80;
  const hW = (W - 2 * m - etiketW) / 7;
  const hH = 23;

  // Başlık satırı
  doc.setFillColor(22, 50, 58);
  doc.rect(m, y, W - 2 * m, 20, "F");
  doc.setFont(font, "bold");
  doc.setFontSize(9);
  doc.setTextColor(255, 255, 255);
  doc.text("Pavilion", m + 6, y + 13);
  gunler.forEach((g, i) => {
    doc.text(`${pavGunAdi(g)} ${pavTarihKisa(g)}`, m + etiketW + i * hW + hW / 2, y + 13, { align: "center" });
  });
  y += 20;

  doc.setDrawColor(210, 205, 190);
  doc.setLineWidth(0.5);

  PAV_ALANLAR.forEach((alan) => {
    doc.setFillColor(230, 225, 210);
    doc.rect(m, y, W - 2 * m, 16, "F");
    doc.setFont(font, "bold");
    doc.setFontSize(9);
    doc.setTextColor(22, 50, 58);
    doc.text(alan, m + 6, y + 11);
    y += 16;

    PAV_LISTESI.filter((p) => p.alan === alan).forEach((p) => {
      doc.setFont(font, "bold");
      doc.setFontSize(9);
      doc.setTextColor(22, 50, 58);
      doc.rect(m, y, etiketW, hH, "S");
      doc.text(p.no, m + 6, y + 15);
      gunler.forEach((g, i) => {
        const k = pavAktifKayit(kayitlar, p.no, g);
        const x = m + etiketW + i * hW;
        if (!k) doc.setFillColor(232, 243, 237);
        else if (k.durum === "Kullanıldı") doc.setFillColor(244, 214, 208);
        else doc.setFillColor(245, 232, 198);
        doc.rect(x, y, hW, hH, "FD");
        if (k) {
          doc.setFont(font, "bold");
          doc.setFontSize(8);
          doc.setTextColor(22, 50, 58);
          doc.text(`Oda ${k.odaNo}  ${k.kisiSayisi} kişi`, x + 4, y + 10);
          doc.setFont(font, "normal");
          doc.setFontSize(7);
          doc.text(`${pavPara(k.ucret)} TL`, x + 4, y + 19);
        } else {
          doc.setFont(font, "normal");
          doc.setFontSize(8);
          doc.setTextColor(140, 150, 145);
          doc.text("-", x + hW / 2, y + 14, { align: "center" });
        }
      });
      y += hH;
    });
  });

  // Günlük toplam satırı
  doc.setFillColor(22, 50, 58);
  doc.rect(m, y, W - 2 * m, 24, "F");
  doc.setFont(font, "bold");
  doc.setFontSize(8);
  doc.setTextColor(255, 255, 255);
  doc.text("Günlük Toplam", m + 6, y + 15);
  gunler.forEach((g, i) => {
    const aktifler = PAV_LISTESI.map((p) => pavAktifKayit(kayitlar, p.no, g)).filter(Boolean);
    const ucret = aktifler.reduce((t, k) => t + (Number(k.ucret) || 0), 0);
    const x = m + etiketW + i * hW;
    doc.text(`${aktifler.length}/${PAV_LISTESI.length} dolu`, x + 4, y + 10);
    doc.setFont(font, "normal");
    doc.text(`${pavPara(ucret)} TL`, x + 4, y + 19);
    doc.setFont(font, "bold");
  });
  y += 36;

  // Gösterge
  [
    ["Boş", PAV_RENKLER.bos],
    ["Rezerve", PAV_RENKLER.rezerve],
    ["Kullanıldı", PAV_RENKLER.kullanildi],
  ].forEach(([etiket, renk], i) => {
    const [rr, gg, bb] = pavHexToRgb(renk);
    const x = m + i * 90;
    doc.setFillColor(rr, gg, bb);
    doc.rect(x, y - 8, 10, 10, "F");
    doc.setFont(font, "normal");
    doc.setFontSize(9);
    doc.setTextColor(70, 70, 70);
    doc.text(etiket, x + 15, y);
  });
  return doc;
}

// Restoran rezervasyon listesi PDF'i (bir veya tüm restoranlar, seçili gün)
function alacartePdf(restoranlar, tarih, rez, masalar, hotelName, kullaniciAdi) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4" });
  const font = pavPdfFontYukle(doc);
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const m = 36;
  let y = m;
  const kolonlar = [["Saat", 40], ["Masa", 34], ["Oda", 40], ["Misafir", 130], ["Kişi", 30], ["Durum", 52], ["Not / Yapan", 0]];
  kolonlar[kolonlar.length - 1][1] = W - 2 * m - kolonlar.slice(0, -1).reduce((t, k) => t + k[1], 0);

  function yeniSayfaGerekirse(ihtiyac) {
    if (y + ihtiyac > H - m) {
      doc.addPage();
      y = m;
    }
  }
  function kes(metin, genislik) {
    let t = String(metin == null ? "" : metin);
    while (t.length > 1 && doc.getTextWidth(t) > genislik - 6) t = t.slice(0, -1);
    return t;
  }
  function satir(hucreler, kalin, dolgu) {
    yeniSayfaGerekirse(16);
    if (dolgu) {
      doc.setFillColor(dolgu[0], dolgu[1], dolgu[2]);
      doc.rect(m, y - 11, W - 2 * m, 15, "F");
    }
    doc.setFont(font, kalin ? "bold" : "normal");
    let x = m;
    hucreler.forEach((h, i) => {
      doc.text(kes(h, kolonlar[i][1]), x + 3, y);
      x += kolonlar[i][1];
    });
    y += 15;
  }

  const hepsi = rez.filter((r) => restoranlar.includes(r.restoran));
  doc.setFont(font, "bold");
  doc.setFontSize(16);
  doc.setTextColor(22, 50, 58);
  doc.text(restoranlar.length === 1 ? `Alacarte Rezervasyon Listesi - ${restoranlar[0]}` : "Alacarte Rezervasyon Listesi - Tüm Restoranlar", m, y + 4);
  doc.setDrawColor(176, 141, 62);
  doc.setLineWidth(1.2);
  doc.line(m, y + 12, W - m, y + 12);
  y += 30;
  doc.setFont(font, "normal");
  doc.setFontSize(10);
  doc.setTextColor(70, 70, 70);
  doc.text(`${hotelName}   |   Tarih: ${formatTarihSadece(tarih)}`, m, y);
  y += 14;
  doc.text(`Hazırlayan: ${kullaniciAdi}   |   ${new Date().toLocaleString("tr-TR")}`, m, y);
  y += 20;

  restoranlar.forEach((ad) => {
    const liste = hepsi.filter((r) => r.restoran === ad);
    const aktif = liste.filter((r) => r.durum !== "İptal").sort((a, b) => (a.saat + String(1000 + a.masa_no)).localeCompare(b.saat + String(1000 + b.masa_no)));
    const iptal = liste.filter((r) => r.durum === "İptal");
    const toplamMasa = masalar.filter((x) => x.restoran === ad).length;
    const kisi = aktif.reduce((t, r) => t + (Number(r.kisi) || 0), 0);
    const geldi = aktif.filter((r) => r.durum === "Geldi").length;
    const gelmedi = aktif.filter((r) => r.durum === "Gelmedi").length;
    yeniSayfaGerekirse(70);
    doc.setFont(font, "bold");
    doc.setFontSize(12);
    doc.setTextColor(22, 50, 58);
    doc.text(`${ad} Restaurant`, m, y);
    y += 14;
    doc.setFont(font, "normal");
    doc.setFontSize(9);
    doc.setTextColor(70, 70, 70);
    doc.text(`Rezerve masa: ${aktif.length}/${toplamMasa}   |   Toplam kişi: ${kisi}   |   Geldi: ${geldi}   |   Gelmedi: ${gelmedi}   |   İptal: ${iptal.length}`, m, y);
    y += 16;
    doc.setFontSize(9);
    doc.setTextColor(30, 30, 30);
    satir(kolonlar.map((k) => k[0]), true, [232, 226, 208]);
    if (aktif.length === 0) satir(["Rezervasyon yok"], false);
    aktif.forEach((r, i) => {
      satir(
        [r.saat, String(r.masa_no), r.oda, r.misafir, String(r.kisi), r.durum, [r.notu, r.olusturan_adi].filter(Boolean).join(" / ")],
        r.durum === "Geldi",
        r.durum === "Geldi" ? [254, 202, 202] : i % 2 ? [247, 244, 235] : null
      );
    });
    if (iptal.length) {
      y += 6;
      yeniSayfaGerekirse(30);
      doc.setFont(font, "bold");
      doc.setTextColor(127, 29, 29);
      doc.text("İptal edilenler", m, y);
      y += 14;
      doc.setTextColor(30, 30, 30);
      iptal.forEach((r) => {
        satir(
          [r.saat, String(r.masa_no), r.oda, r.misafir, String(r.kisi), "İptal", `Iptal eden: ${r.iptal_eden_adi || "-"}${r.iptal_notu ? " - " + r.iptal_notu : ""}`.replace("Iptal", "İptal")],
          false,
          null
        );
      });
    }
    y += 16;
  });
  return doc;
}


function AlacarteEkrani({ user, onGeri, toastGoster }) {
  const [tarih, setTarih] = useState(bugunTarihi());
  const [restoran, setRestoran] = useState(null);
  const [veri, setVeri] = useState(null);
  const [hata, setHata] = useState("");
  const [sekme, setSekme] = useState("masalar"); // masalar | log
  const [loglar, setLoglar] = useState([]);
  const [form, setForm] = useState(null); // yeni rezervasyon formu {masa, kapasite, ...}
  const [detay, setDetay] = useState(null); // rezervasyon id
  const [mesgul, setMesgul] = useState(false);
  const [formHata, setFormHata] = useState("");
  const [onayGerek, setOnayGerek] = useState("");
  const [iptalNedeni, setIptalNedeni] = useState("");
  const [iptalAcik, setIptalAcik] = useState(false);
  const [sayac, setSayac] = useState(0);
  const [eposta, setEposta] = useState(() => {
    try {
      return window.localStorage.getItem("alacarte_eposta") || "";
    } catch (e) {
      return "";
    }
  });
  const [pdfMesaj, setPdfMesaj] = useState("");
  const [pdfLink, setPdfLink] = useState(null);
  const formRef = useRef(null);
  formRef.current = form;
  const tarihRef = useRef(tarih);
  tarihRef.current = tarih;

  async function yukle(sessiz) {
    try {
      const t = tarihRef.current;
      const v = await window.OtelRpc.cagir("alacarte_getir", { p_tarih: t });
      if (t !== tarihRef.current) return;
      setVeri(v);
      if (!sessiz) setHata("");
    } catch (e) {
      setHata(e.message);
    }
  }
  async function loglariYukle() {
    try {
      setLoglar(await window.OtelRpc.cagir("alacarte_log_getir", { p_tarih: null, p_limit: 150 }));
    } catch (e) {
      setHata(e.message);
    }
  }

  // Her 5 sn'de tazele (başkalarının sarı/kırmızı masaları görünsün)
  useEffect(() => {
    yukle(false);
    const t = setInterval(() => yukle(true), 5000);
    return () => clearInterval(t);
  }, [tarih]);
  useEffect(() => {
    if (sekme === "log") loglariYukle();
  }, [sekme]);

  // Form açıkken sarı kilidi yenile (her 20 sn) — en çok 3 dk; ekran kapanırsa kilidi bırak
  useEffect(() => {
    if (!form) return undefined;
    const baslangic = Date.now();
    const saniye = setInterval(() => {
      setSayac(Math.max(0, 180 - Math.floor((Date.now() - baslangic) / 1000)));
    }, 1000);
    const yenile = setInterval(async () => {
      const f = formRef.current;
      if (!f) return;
      if (Date.now() - baslangic > 180000) {
        kilidiBirak(f);
        setForm(null);
        setHata("Süre doldu (3 dk). Masa serbest bırakıldı, tekrar seçebilirsiniz.");
        return;
      }
      try {
        await window.OtelRpc.cagir("alacarte_kilit_al", { p_tarih: f.tarih, p_restoran: f.restoran, p_masa: f.masa });
      } catch (e) {
        setForm(null);
        setHata("Masa kilidi kaybedildi: " + e.message);
      }
    }, 20000);
    return () => {
      clearInterval(saniye);
      clearInterval(yenile);
    };
  }, [form && form.masa, form && form.restoran, form && form.tarih]);
  useEffect(
    () => () => {
      if (formRef.current) kilidiBirak(formRef.current);
    },
    []
  );

  function kilidiBirak(f) {
    window.OtelRpc.cagir("alacarte_kilit_birak", { p_tarih: f.tarih, p_restoran: f.restoran, p_masa: f.masa }).catch(() => {});
  }
  function formuKapat() {
    if (form) kilidiBirak(form);
    setForm(null);
    setFormHata("");
    setOnayGerek("");
    setTimeout(() => yukle(true), 300);
  }

  const bugun = (veri && veri.bugun) || bugunTarihi();
  const azami = (veri && veri.azami_tarih) || pavTarihEkle(bugun, 2);
  const yetki = (veri && veri.yetki) || {};
  const masalar = veri ? veri.masalar : [];
  const rez = veri ? veri.rez : [];
  const kilitler = veri ? veri.kilit : [];

  function tarihDegistir(t) {
    if (!t) return;
    if (t < bugun) t = bugun;
    if (t > azami) t = azami;
    if (form) formuKapat();
    setDetay(null);
    setTarih(t);
  }

  async function masayaDokun(m) {
    setHata("");
    const r = rez.find((x) => x.restoran === restoran && x.masa_no === m.masa_no && x.durum !== "İptal");
    if (r) {
      setDetay(r.id);
      setIptalAcik(false);
      setIptalNedeni("");
      return;
    }
    try {
      setMesgul(true);
      await window.OtelRpc.cagir("alacarte_kilit_al", { p_tarih: tarih, p_restoran: restoran, p_masa: m.masa_no });
      setSayac(180);
      setFormHata("");
      setOnayGerek("");
      setForm({ tarih, restoran, masa: m.masa_no, kapasite: m.kapasite, oda: "", ad: "", kisi: Math.min(2, m.kapasite), saat: "", not: "" });
      yukle(true);
    } catch (e) {
      setHata(e.message.startsWith("Bu masa") ? e.message : e.kod === "MASA_KILITLI" ? `Bu masayı şu an ${e.message} işlem yapıyor (sarı). Birkaç saniye sonra tekrar deneyin.` : e.message);
      yukle(true);
    } finally {
      setMesgul(false);
    }
  }

  async function kaydet(limitOnay) {
    const f = form;
    setFormHata("");
    if (!/^[0-9]{3,4}$/.test(f.oda.trim())) return setFormHata("Oda numarası 3 veya 4 haneli olmalı.");
    if (f.ad.trim().length < 2) return setFormHata("İsim soyisim yazın.");
    if (!f.kisi || f.kisi < 1) return setFormHata("Kişi sayısını girin.");
    if (f.kisi > f.kapasite) return setFormHata(`Bu masa en fazla ${f.kapasite} kişilik.`);
    if (!f.saat) return setFormHata("Saat seçin.");
    setMesgul(true);
    try {
      await alacartePmsOdaBilgi(f.oda, f.tarih); // PMS hazır olunca burada oda doğrulaması yapılacak
      const r = await window.OtelRpc.cagir("alacarte_kaydet", {
        p_tarih: f.tarih, p_restoran: f.restoran, p_masa: f.masa, p_oda: f.oda.trim(), p_misafir: f.ad.trim(),
        p_kisi: f.kisi, p_saat: f.saat, p_not: f.not.trim() || null, p_limit_onay: !!limitOnay,
      });
      setForm(null);
      setOnayGerek("");
      toastGoster(`✓ ${f.restoran} Masa ${f.masa} rezerve edildi${r && r.limit_asildi ? " (7 gün kuralı aşıldı)" : ""}`);
      yukle(true);
    } catch (e) {
      if (e.kod === "ODA_LIMIT_ONAY") setOnayGerek(e.message);
      else if (e.kod === "ODA_LIMIT") setFormHata(`Bu oda 7 gün içinde zaten bir Alacarte rezervasyonuna sahip: ${e.message}. Yalnızca Müdür izin verebilir.`);
      else if (e.kod === "MASA_DOLU" || e.kod === "MASA_KILITLI") {
        setForm(null);
        setHata(e.kod === "MASA_DOLU" ? "Bu masa az önce başkası tarafından rezerve edildi." : "Masa kilidiniz süresi doldu ve başkası aldı.");
        yukle(true);
      } else setFormHata(e.message);
    } finally {
      setMesgul(false);
    }
  }

  async function durumDegistir(r, durum, not) {
    setMesgul(true);
    try {
      await window.OtelRpc.cagir("alacarte_durum", { p_id: r.id, p_durum: durum, p_not: not || null });
      toastGoster(`✓ ${durum}`);
      setIptalAcik(false);
      setIptalNedeni("");
      if (durum === "İptal") setDetay(null);
      yukle(true);
    } catch (e) {
      setHata(e.message);
    } finally {
      setMesgul(false);
    }
  }

  const rest = ALACARTE_RESTORANLAR.find((x) => x.ad === restoran);
  const aktifRez = (ad) => rez.filter((x) => x.restoran === ad && x.durum !== "İptal");
  const iptaller = rez.filter((x) => x.durum === "İptal" && (!restoran || x.restoran === restoran));
  const detayRez = detay ? rez.find((x) => x.id === detay) : null;
  const kutu = { background: "#fff", border: "1px solid #E2DCCC", borderRadius: 12, padding: 12, marginTop: 10 };
  const girdi = { width: "100%", padding: "11px 12px", borderRadius: 10, border: "1.5px solid #D6CFBD", fontSize: 16, boxSizing: "border-box", background: "#fff" };

  function pdfOlustur(restoranlar, epostaGonder) {
    setPdfMesaj("");
    setPdfLink(null);
    if (!(window.jspdf && window.jspdf.jsPDF)) {
      setPdfMesaj("PDF oluşturucu henüz hazırlanıyor, birkaç saniye sonra tekrar deneyin.");
      return;
    }
    const adres = eposta.trim();
    if (epostaGonder && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(adres)) {
      setPdfMesaj("Lütfen geçerli bir e-posta adresi yazın.");
      return;
    }
    try {
      if (epostaGonder) {
        try {
          window.localStorage.setItem("alacarte_eposta", adres);
        } catch (e) {}
      }
      const doc = alacartePdf(restoranlar, tarih, rez, masalar, user.hotelName, user.name);
      const ad = `alacarte-${restoranlar.length === 1 ? restoranlar[0].toLowerCase() : "tum-restoranlar"}-${tarih}.pdf`;
      try {
        doc.save(ad);
      } catch (e) {}
      try {
        const url = doc.output("bloburl");
        setPdfLink({ url: url.toString ? url.toString() : url, ad });
      } catch (e) {}
      if (epostaGonder) {
        const konu = encodeURIComponent(`${user.hotelName} - Alacarte Rezervasyon Listesi - ${alacarteTarihYaz(tarih)}`);
        const govde = encodeURIComponent(
          `Merhaba,\n\n${alacarteTarihYaz(tarih)} tarihli ${restoranlar.length === 1 ? restoranlar[0] + " Restaurant" : "tüm Alacarte restoranları"} rezervasyon listesi PDF olarak cihaza indirildi.\nLütfen e-posta uygulamasında az önce indirilen "${ad}" dosyasını bu mesaja ekleyip gönderin.\n\nOtel: ${user.hotelName}\nHazırlayan: ${user.name}`
        );
        window.location.href = `mailto:${adres}?subject=${konu}&body=${govde}`;
        setPdfMesaj("PDF indirildi ve e-posta uygulamanız açıldı. İndirilen dosyayı mesaja ekleyip gönderin.");
      } else {
        setPdfMesaj("PDF hazır. İnmediyse aşağıdaki bağlantıya dokunun.");
      }
    } catch (e) {
      setPdfMesaj("PDF oluşturulurken hata oluştu: " + (e && e.message ? e.message : String(e)));
    }
  }
  function pdfKutusu(restoranlar, baslik) {
    return (
      <div style={{ ...kutu, marginTop: 14 }}>
        <div style={styles.etiket}>{baslik}</div>
        <input style={girdi} type="email" inputMode="email" placeholder="Alıcı e-posta (isteğe bağlı)" value={eposta} onChange={(e) => setEposta(e.target.value)} />
        <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
          <button style={{ ...styles.ikincilButon, flex: 1 }} onClick={() => pdfOlustur(restoranlar, false)}>📄 PDF indir</button>
          <button style={{ ...styles.anaButon, flex: 1 }} onClick={() => pdfOlustur(restoranlar, true)}>✉️ PDF + E-posta</button>
        </div>
        {pdfMesaj && <div style={{ ...styles.ilerlemeYazi, marginTop: 8 }}>{pdfMesaj}</div>}
        {pdfLink && (
          <a href={pdfLink.url} target="_blank" rel="noreferrer" style={{ display: "block", marginTop: 6, fontSize: 13, color: "#0F766E", fontWeight: 700 }}>
            {pdfLink.ad} (aç / indir)
          </a>
        )}
      </div>
    );
  }

  function masaStili(m) {
    const r = rez.find((x) => x.restoran === restoran && x.masa_no === m.masa_no && x.durum !== "İptal");
    const k = kilitler.find((x) => x.restoran === restoran && x.masa_no === m.masa_no);
    const taban = { padding: "10px 4px", borderRadius: 12, textAlign: "center", cursor: "pointer", minHeight: 74, border: "2px solid transparent", fontSize: 12, lineHeight: 1.25 };

/* ------------------------------------------------------------------
   SERVİS TAKİP (Bebek Kamerası / PS Player) — yalnızca 5557.
   Kurallar sunucuda (supabase/servis/06*_servis.sql) uygulanır; bu ekran yalnızca gösterir ve çağırır.
-------------------------------------------------------------------*/
const SERVIS_OTELLER = ["5557"];
const SERVIS_DEPARTMANLAR = ["Misafir Deneyimi & Kalite", "Önbüro", "IT / Bilgi Teknolojileri", "Genel Müdürlük"];
const SERVIS_ALICILAR = ["MISAFIR ILISKILERI MUDURU", "BILGI TEKNOLOJILERI MUDURU", "GENEL MUDUR YARDIMCISI"];
const SERVIS_URUNLER = [
  { kod: "BK", ad: "Bebek Kamerası", ikon: "👶", renk: "#0F766E" },
  { kod: "PS", ad: "PS Player", ikon: "🎮", renk: "#6D28D9" },
];
const SERVIS_SAATLER = (() => {
  const l = [];
  for (let m = 8 * 60; m <= 18 * 60; m += 30) l.push(`${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`);
  return l;
})();
function servisKullanabilir(user) {
  return !!user && SERVIS_OTELLER.includes(user.hotelCode) && SERVIS_DEPARTMANLAR.includes(user.department);
}
function servisAliciMi(user) {
  return servisKullanabilir(user) && SERVIS_ALICILAR.includes(pozAnahtar(user.bolum));
}
function servisUrun(kod) {
  return SERVIS_URUNLER.find((u) => u.kod === kod) || SERVIS_URUNLER[0];
}
function servisParca(ms) {
  const f = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Istanbul", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false });
  const o = {};
  f.formatToParts(new Date(ms)).forEach((p) => {
    o[p.type] = p.value;
  });
  return { tarih: `${o.year}-${o.month}-${o.day}`, saat: `${o.hour === "24" ? "00" : o.hour}:${o.minute}` };
}
function servisKisa(iso) {
  if (!iso) return "";
  const p = servisParca(Date.parse(iso));
  return `${p.tarih.slice(8, 10)}.${p.tarih.slice(5, 7)} ${p.saat}`;
}
function servisIso(tarih, saat) {
  return `${tarih}T${saat}:00+03:00`;
}
function servisNo(urun, no) {
  if (no === null || no === undefined) return "Cihaz atanmadı";
  return `${urun}-${String(no).padStart(2, "0")}`;
}
function servisDurum(r, simdi) {
  if (r.durum === "Rezerve") {
    const gec = Date.parse(r.kurulum_zamani) < simdi - 30 * 60000;
    return gec ? { ad: "Teslim gecikti", renk: "#B45309" } : { ad: "Atama bekliyor", renk: "#2563EB" };
  }
  if (r.durum === "Teslim") {
    return Date.parse(r.iade_zamani) <= simdi ? { ad: "İADE GECİKMİŞ", renk: "#B91C1C" } : { ad: "Misafirde", renk: "#0369A1" };
  }
  if (r.durum === "Iade") return { ad: "BT onayı bekliyor", renk: "#B45309" };
  if (r.durum === "Tamam") return { ad: "Tamamlandı", renk: "#15803D" };
  return { ad: "İptal", renk: "#6B7280" };
}
function servisEnvanter(veri, urun) {
  const birimler = veri.birimler.filter((b) => b.urun === urun);
  const disarda = new Map();
  veri.rez.forEach((r) => {
    if (r.urun === urun && (r.durum === "Teslim" || r.durum === "Iade")) disarda.set(r.birim_no, r);
  });
  const s = { toplam: birimler.length, dolu: 0, onay: 0, oos: 0, bos: 0, disarda, birimler };
  birimler.forEach((b) => {
    if (b.durum === "OOServis") s.oos++;
    else {
      const r = disarda.get(b.no);
      if (!r) s.bos++;
      else if (r.durum === "Teslim") s.dolu++;
      else s.onay++;
    }
  });
  return s;
}
function servisBugunSayilari(veri, urun, simdi) {
  const bugun = servisParca(simdi).tarih;
  const rez = veri.rez.filter((r) => r.urun === urun);
  const tarihi = (iso) => servisParca(Date.parse(iso)).tarih;
  return {
    teslim: rez.filter((r) => r.durum === "Rezerve" && tarihi(r.kurulum_zamani) <= bugun).length,
    geri: rez.filter((r) => r.durum === "Teslim" && tarihi(r.iade_zamani) === bugun && Date.parse(r.iade_zamani) > simdi).length,
    gecikmis: rez.filter((r) => r.durum === "Teslim" && Date.parse(r.iade_zamani) <= simdi).length,
    ileri: rez.filter((r) => r.durum === "Rezerve" && tarihi(r.kurulum_zamani) > bugun).length,
  };
}

// ---- Alarm sesi (uygulama açıkken) ----
let servisSesBaglami = null;
function servisSesAc() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!servisSesBaglami) servisSesBaglami = new AC();
    if (servisSesBaglami.state === "suspended") servisSesBaglami.resume();
  } catch (e) {}
}
function servisAlarmSesi() {
  try {
    servisSesAc();
    const ctx = servisSesBaglami;
    if (ctx) {
      const t = ctx.currentTime;
      [0, 0.35, 0.7].forEach((d, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "square";
        o.frequency.value = i % 2 ? 988 : 784;
        g.gain.setValueAtTime(0.0001, t + d);
        g.gain.exponentialRampToValueAtTime(0.35, t + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.3);
        o.connect(g);
        g.connect(ctx.destination);
        o.start(t + d);
        o.stop(t + d + 0.32);
      });
    }
    if (navigator.vibrate) navigator.vibrate([400, 150, 400, 150, 400]);
  } catch (e) {}
}
function servisSusturOku() {
  try {
    return JSON.parse(window.localStorage.getItem("servis_sustur") || "{}") || {};
  } catch (e) {
    return {};
  }
}
function servisSusturYaz(o) {
  try {
    window.localStorage.setItem("servis_sustur", JSON.stringify(o));
  } catch (e) {}
}

// Alıcılar (Misafir İlişkileri Müdürü, BT Müdürü, Genel Müdür Yardımcısı) için iade alarmı. Uygulama açıkken her ekranda çalışır.

  const oncekiRef = useRef("");
  useEffect(() => {
    let durdu = false;
    const ac = () => servisSesAc();
    document.addEventListener("pointerdown", ac);
    async function cek() {
      try {
        const v = await window.OtelRpc.cagir("servis_alarm_getir");
        if (durdu) return;
        setFark(Date.parse(v.simdi) - Date.now());
        setListe(v.liste || []);
      } catch (e) {}
    }
    cek();
    const t = setInterval(cek, 20000);
    const g = () => {
      if (document.visibilityState === "visible") cek();
    };
    document.addEventListener("visibilitychange", g);
    const sn = setInterval(() => yenile((n) => n + 1), 5000);
    return () => {
      durdu = true;
      clearInterval(t);
      clearInterval(sn);
      document.removeEventListener("visibilitychange", g);
      document.removeEventListener("pointerdown", ac);
    };
  }, []);
  const simdi = Date.now() + fark;
  const sustur = servisSusturOku();
  const caliyor = liste.filter((x) => !(sustur[x.id] && sustur[x.id] > simdi));
  const imza = caliyor.map((x) => x.id).join(",");
  useEffect(() => {
    if (!caliyor.length) {
      oncekiRef.current = "";
      return undefined;
    }
    servisAlarmSesi();
    const t = setInterval(servisAlarmSesi, 4000);
    if (imza !== oncekiRef.current) {
      oncekiRef.current = imza;
      try {
        const metin = `İade zamanı geldi: ${caliyor.map((x) => `${servisNo(x.urun, x.birim_no)} Oda ${x.oda}`).join(", ")}`;
        if (typeof Notification !== "undefined" && Notification.permission === "granted") {
          if (navigator.serviceWorker && navigator.serviceWorker.ready) {
            navigator.serviceWorker.ready.then((r) => r.showNotification("Servis Takip - İade Alarmı", { body: metin, tag: "servis-alarm", requireInteraction: true })).catch(() => {});
          } else new Notification("Servis Takip - İade Alarmı", { body: metin });
        }
      } catch (e) {}
    }
    return () => clearInterval(t);
  }, [imza]);
  if (!caliyor.length) return null;
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 10000, background: "rgba(127,29,29,0.96)", color: "#fff", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 20, boxSizing: "border-box", textAlign: "center" }} data-testid="servis-alarm">
      <div style={{ fontSize: 56 }}>⏰</div>
      <div className="baslik-font" style={{ fontSize: 24, fontWeight: 800, marginTop: 8 }}>İADE ZAMANI GELDİ</div>
      <div style={{ marginTop: 14, width: "100%", maxWidth: 420, maxHeight: "40vh", overflowY: "auto" }}>
        {caliyor.map((x) => {
          const dk = Math.max(0, Math.floor((simdi - Date.parse(x.iade_zamani)) / 60000));
          return (
            <div key={x.id} style={{ background: "rgba(255,255,255,0.14)", borderRadius: 12, padding: "10px 12px", marginBottom: 8, fontSize: 16, fontWeight: 700 }}>
              {servisUrun(x.urun).ikon} {servisUrun(x.urun).ad} {servisNo(x.urun, x.birim_no)} · Oda {x.oda}
              <div style={{ fontSize: 13, fontWeight: 500, opacity: 0.9 }}>
                İade saati {servisKisa(x.iade_zamani)} · {dk > 0 ? `${dk} dk gecikmiş` : "şimdi"}
              </div>
            </div>
          );
        })}
      </div>
      <button
        style={{ marginTop: 14, width: "100%", maxWidth: 420, padding: "14px 16px", borderRadius: 14, border: "none", background: "#fff", color: "#7F1D1D", fontSize: 16, fontWeight: 800 }}
        onClick={() => {
          onGit();
          const o = servisSusturOku();
          caliyor.forEach((x) => (o[x.id] = Date.now() + fark + 30 * 60000));
          servisSusturYaz(o);
          yenile((n) => n + 1);
        }}
      >
        Servis Takip'e git
      </button>
      <button
        style={{ marginTop: 10, width: "100%", maxWidth: 420, padding: "12px 16px", borderRadius: 14, border: "2px solid #fff", background: "transparent", color: "#fff", fontSize: 15, fontWeight: 700 }}
        onClick={() => {
          const o = servisSusturOku();
          caliyor.forEach((x) => (o[x.id] = Date.now() + fark + 30 * 60000));
          servisSusturYaz(o);
          yenile((n) => n + 1);
        }}
      >
        Sustur (30 dk sonra tekrar çalar)
      </button>
    </div>
  );
}

// ---- PDF ----
function servisPdf(urunKod, veri, simdi, hotelName, kullaniciAdi) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4" });
  const font = pavPdfFontYukle(doc);
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const m = 36;
  let y = m;
  const urun = servisUrun(urunKod);
  const env = servisEnvanter(veri, urunKod);
  const sayi = servisBugunSayilari(veri, urunKod, simdi);
  const bugun = servisParca(simdi).tarih;
  function yeniSayfa(ihtiyac) {
    if (y + ihtiyac > H - m) {
      doc.addPage();
      y = m;
    }
  }
  function tablo(kolonlar, satirlar) {
    const toplam = W - 2 * m;
    const sabit = kolonlar.slice(0, -1).reduce((t, k) => t + k[1], 0);
    const gen = kolonlar.map((k, i) => (i === kolonlar.length - 1 ? toplam - sabit : k[1]));
    const kes = (t, g) => {
      let x = String(t == null ? "" : t);
      while (x.length > 1 && doc.getTextWidth(x) > g - 6) x = x.slice(0, -1);
      return x;
    };
    const satir = (h, kalin, dolgu) => {
      yeniSayfa(16);
      if (dolgu) {
        doc.setFillColor(dolgu[0], dolgu[1], dolgu[2]);
        doc.rect(m, y - 11, toplam, 15, "F");
      }
      doc.setFont(font, kalin ? "bold" : "normal");
      let x = m;
      h.forEach((v, i) => {
        doc.text(kes(v, gen[i]), x + 3, y);
        x += gen[i];
      });
      y += 15;
    };
    doc.setFontSize(9);
    doc.setTextColor(30, 30, 30);
    satir(kolonlar.map((k) => k[0]), true, [232, 226, 208]);
    if (!satirlar.length) satir(["Kayıt yok"], false);
    satirlar.forEach((s, i) => satir(s, false, i % 2 ? [247, 244, 235] : null));
  }
  doc.setFont(font, "bold");
  doc.setFontSize(16);
  doc.setTextColor(22, 50, 58);
  doc.text(`Servis Takip - ${urun.ad}`, m, y + 4);
  doc.setDrawColor(176, 141, 62);
  doc.setLineWidth(1.2);
  doc.line(m, y + 12, W - m, y + 12);
  y += 30;
  doc.setFont(font, "normal");
  doc.setFontSize(10);
  doc.setTextColor(70, 70, 70);
  doc.text(`${hotelName}   |   Tarih: ${formatTarihSadece(bugun)}   |   Hazırlayan: ${kullaniciAdi}   |   ${new Date().toLocaleString("tr-TR")}`, m, y);
  y += 18;
  doc.setFont(font, "bold");
  doc.setFontSize(11);
  doc.text(`Envanter: ${env.toplam} adet   |   Dolu: ${env.dolu}   |   Boş: ${env.bos}   |   BT onayı bekleyen: ${env.onay}   |   OOServis: ${env.oos}`, m, y);
  y += 14;
  doc.setFont(font, "normal");
  doc.setFontSize(10);
  doc.text(`Bugün teslim edilecek: ${sayi.teslim}   |   Bugün geri alınacak: ${sayi.geri}   |   Gecikmiş: ${sayi.gecikmis}   |   İleri tarihli rezervasyon: ${sayi.ileri}`, m, y);
  y += 22;

  doc.setFont(font, "bold");
  doc.setFontSize(12);
  doc.setTextColor(22, 50, 58);
  doc.text("Cihaz durumu", m, y);
  y += 14;
  const cihazSatirlari = env.birimler.map((b) => {
    const r = env.disarda.get(b.no);
    if (b.durum === "OOServis") return [servisNo(urunKod, b.no), "OOServis", "", "", b.notu || ""];
    if (!r) return [servisNo(urunKod, b.no), "Boş", "", "", ""];
    const d = servisDurum(r, simdi);
    return [servisNo(urunKod, b.no), d.ad, `Oda ${r.oda}`, r.misafir, `İade ${servisKisa(r.iade_zamani)}`];
  });
  tablo([["Cihaz", 50], ["Durum", 100], ["Oda", 55], ["Misafir", 150], ["İade / Not", 0]], cihazSatirlari);
  y += 16;
  yeniSayfa(60);
  doc.setFont(font, "bold");
  doc.setFontSize(12);
  doc.setTextColor(22, 50, 58);
  doc.text("Rezervasyonlar", m, y);
  y += 14;
  const rezSatirlari = veri.rez
    .filter((r) => r.urun === urunKod && r.durum !== "İptal" && r.durum !== "Tamam")
    .sort((a, b) => Date.parse(a.kurulum_zamani) - Date.parse(b.kurulum_zamani))
    .map((r) => [`Oda ${r.oda}`, r.misafir, servisNo(urunKod, r.birim_no), servisKisa(r.kurulum_zamani), servisKisa(r.iade_zamani), servisDurum(r, simdi).ad, r.notu || ""]);
  tablo([["Oda", 50], ["Misafir", 120], ["Cihaz", 48], ["Kurulum", 72], ["İade", 72], ["Durum", 90], ["Not", 0]], rezSatirlari);
  return doc;
}

// ---- Ekran ----
function ServisTakipEkrani({ user, onGeri, toastGoster }) {
  const [veri, setVeri] = useState(null);
  const [fark, setFark] = useState(0);
  const [, yenile] = useState(0);
  const [hata, setHata] = useState("");
  const [sekme, setSekme] = useState("pano");
  const [filtre, setFiltre] = useState("aktif");
  const [urunFiltre, setUrunFiltre] = useState("hepsi");
  const [mesgul, setMesgul] = useState(false);
  const [loglar, setLoglar] = useState([]);
  const [acik, setAcik] = useState(null); // {id, tur}
  const [neden, setNeden] = useState("");
  const [birimAcik, setBirimAcik] = useState(null);
  const [atamaNo, setAtamaNo] = useState({});
  const [oosNot, setOosNot] = useState("");
  const [eposta, setEposta] = useState(() => {
    try {
      return window.localStorage.getItem("servis_eposta") || "";
    } catch (e) {
      return "";
    }
  });
  const [pdfMesaj, setPdfMesaj] = useState("");
  const [pdfLink, setPdfLink] = useState(null);

  async function yukle() {
    try {
      const v = await window.OtelRpc.cagir("servis_getir");
      setVeri(v);
      setFark(Date.parse(v.simdi) - Date.now());
    } catch (e) {
      setHata(e.message);
    }
  }
  useEffect(() => {
    yukle();
    const t = setInterval(yukle, 10000);
    const sn = setInterval(() => yenile((n) => n + 1), 30000);
    return () => {
      clearInterval(t);
      clearInterval(sn);
    };
  }, []);
  const geriVar = !!(veri && veri.rez.some((r) => r.geri_bitis && r.durum === "Rezerve" && Date.parse(r.geri_bitis) > Date.now() + fark));
  useEffect(() => {
    if (!geriVar) return;
    const t = setInterval(() => yenile((n) => n + 1), 1000);
    return () => clearInterval(t);
  }, [geriVar]);
  useEffect(() => {
    if (sekme !== "log") return;
    window.OtelRpc.cagir("servis_log_getir", { p_limit: 150 }).then(setLoglar).catch((e) => setHata(e.message));
  }, [sekme]);

  const simdi = Date.now() + fark;
  const yetki = (veri && veri.yetki) || {};
  const kutu = { background: "#fff", border: "1px solid #E2DCCC", borderRadius: 12, padding: 12, marginTop: 10 };
  const girdi = { width: "100%", padding: "11px 12px", borderRadius: 10, border: "1.5px solid #D6CFBD", fontSize: 16, boxSizing: "border-box", background: "#fff" };

  async function islem(ad, args, basari) {
    setMesgul(true);
    setHata("");
    try {
      const r = await window.OtelRpc.cagir(ad, args);
      if (basari) toastGoster(typeof basari === "function" ? basari(r) : basari);
      setAcik(null);
      setNeden("");
      await yukle();
      return r;
    } catch (e) {
      setHata(e.message);
      return null;
    } finally {
      setMesgul(false);
    }
  }

  function pdfOlustur(urunKod, epostaGonder) {
    setPdfMesaj("");
    setPdfLink(null);
    if (!(window.jspdf && window.jspdf.jsPDF)) return setPdfMesaj("PDF oluşturucu henüz hazırlanıyor, birkaç saniye sonra tekrar deneyin.");
    const adres = eposta.trim();
    if (epostaGonder && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(adres)) return setPdfMesaj("Lütfen geçerli bir e-posta adresi yazın.");
    try {
      const doc = servisPdf(urunKod, veri, simdi, user.hotelName, user.name);
      const ad = `servis-${urunKod === "PS" ? "ps-player" : "bebek-kamerasi"}-${servisParca(simdi).tarih}.pdf`;
      try {
        doc.save(ad);
      } catch (e) {}
      try {
        const url = doc.output("bloburl");
        setPdfLink({ url: url.toString ? url.toString() : url, ad });
      } catch (e) {}
      if (epostaGonder) {
        try {
          window.localStorage.setItem("servis_eposta", adres);
        } catch (e) {}
        const konu = encodeURIComponent(`${user.hotelName} - ${servisUrun(urunKod).ad} Servis Takip Listesi - ${formatTarihSadece(servisParca(simdi).tarih)}`);
        const govde = encodeURIComponent(`Merhaba,\n\n${servisUrun(urunKod).ad} servis takip listesi PDF olarak cihaza indirildi.\nLütfen e-posta uygulamasında az önce indirilen "${ad}" dosyasını bu mesaja ekleyip gönderin.\n\nOtel: ${user.hotelName}\nHazırlayan: ${user.name}`);
        window.location.href = `mailto:${adres}?subject=${konu}&body=${govde}`;
        setPdfMesaj("PDF indirildi ve e-posta uygulamanız açıldı. İndirilen dosyayı mesaja ekleyip gönderin.");
      } else setPdfMesaj("PDF hazır. İnmediyse aşağıdaki bağlantıya dokunun.");
    } catch (e) {
      setPdfMesaj("PDF oluşturulurken hata oluştu: " + (e && e.message ? e.message : String(e)));
    }
  }

  function rezSatiri(r) {
    const u = servisUrun(r.urun);
    const d = servisDurum(r, simdi);
    const bugun = servisParca(simdi).tarih;
    const kurulumGunu = servisParca(Date.parse(r.kurulum_zamani)).tarih;
    const ac = acik && acik.id === r.id ? acik.tur : null;
    return (
      <div key={r.id} data-testid={`rez-${r.oda}-${r.urun}`} style={{ ...kutu, borderLeft: `5px solid ${d.renk}` }}>
        <div style={{ display: "flex", justifyContent: "space-between", gap: 8, alignItems: "flex-start" }}>
          <div style={{ fontWeight: 800, fontSize: 15 }}>
            {u.ikon} {servisNo(r.urun, r.birim_no)} · Oda {r.oda}
          </div>
          <div style={{ background: d.renk, color: "#fff", borderRadius: 8, fontSize: 11, fontWeight: 800, padding: "3px 8px", whiteSpace: "nowrap" }}>{d.ad}</div>
        </div>
        <div style={{ fontSize: 14, marginTop: 2 }}>{r.misafir}</div>
        <div style={{ fontSize: 12, color: "#4B5563", marginTop: 2 }}>
          Kurulum {servisKisa(r.kurulum_zamani)} → İade {servisKisa(r.iade_zamani)}
          {r.urun === "PS" ? " (24 saat)" : ""}
        </div>
        {r.notu && <div style={{ fontSize: 12, color: "#4B5563" }}>Not: {r.notu}</div>}
        <div style={{ fontSize: 11, color: "#6B7280", marginTop: 4 }}>
          Kaydeden: {r.olusturan_adi} · {servisKisa(r.olusturma_zamani)}
          {r.limit_asildi ? " · 2. rezervasyon (Müdür onayı)" : ""}
          {r.teslim_zamani ? ` · Teslim: ${r.teslim_eden} ${servisKisa(r.teslim_zamani)}` : ""}
          {r.iade_alindi_zamani ? ` · İade alan: ${r.iade_alan} ${servisKisa(r.iade_alindi_zamani)}` : ""}
          {r.iptal_zamani ? ` · İptal: ${r.iptal_eden}${r.iptal_notu ? " (" + r.iptal_notu + ")" : ""}` : ""}
        </div>
        <div style={{ display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
          {r.durum === "Rezerve" && r.geri_bitis && Date.parse(r.geri_bitis) > simdi && (
            <button data-testid={`geri-${r.oda}-${r.urun}`} style={{ ...styles.ikincilButon, flex: 1, minWidth: 140, color: "#B45309", borderColor: "#B45309" }} disabled={mesgul} onClick={() => islem("servis_geri_al", { p_id: r.id }, "✓ Rezervasyon geri alındı")}>
              ↩ Geri al ({Math.floor((Date.parse(r.geri_bitis) - simdi) / 60000)}:{String(Math.max(0, Math.floor(((Date.parse(r.geri_bitis) - simdi) % 60000) / 1000))).padStart(2, "0")})
            </button>
          )}
          {r.durum === "Rezerve" && yetki.bt && (
            <>
              <button data-testid={`ata-${r.oda}-${r.urun}`} style={{ ...styles.anaButon, flex: 1, minWidth: 140, opacity: bugun < kurulumGunu ? 0.5 : 1 }} disabled={mesgul || bugun < kurulumGunu} onClick={() => setAcik({ id: r.id, tur: "ata" })}>
                {bugun < kurulumGunu ? "Kurulum gününde atanır" : "Cihaz Ata ve Teslim Et"}
              </button>
              <button style={{ ...styles.ikincilButon, flex: 1, minWidth: 90, color: "#B91C1C", borderColor: "#B91C1C" }} onClick={() => setAcik({ id: r.id, tur: "iptal" })}>
                İptal
              </button>
            </>
          )}
          {r.durum === "Rezerve" && !yetki.bt && !(r.geri_bitis && Date.parse(r.geri_bitis) > simdi) && (
            <div style={{ fontSize: 12, color: "#2563EB", fontWeight: 700 }}>Cihazı BT Müdürü atayıp teslim edecek</div>
          )}
          {r.durum === "Teslim" &&
            (yetki.bt ? (
              <button data-testid={`iade-${r.oda}-${r.urun}`} style={{ ...styles.anaButon, flex: 1, background: "#15803D" }} disabled={mesgul} onClick={() => islem("servis_iade", { p_id: r.id }, "✓ İade alındı, cihaz hazır")}>
                ✓ İade Al
              </button>
            ) : (
              <div style={{ fontSize: 12, color: "#0369A1", fontWeight: 700 }}>İadeyi BT Müdürü alır</div>
            ))}
        </div>
        {ac === "ata" && (() => {
          const e = servisEnvanter(veri, r.urun);
          const bos = e.birimler.filter((b) => b.durum === "Hazir" && !e.disarda.has(b.no));
          const secili = atamaNo[r.id] !== undefined ? atamaNo[r.id] : bos.length ? bos[0].no : "";
          return (
            <div style={{ marginTop: 8 }}>
              {bos.length === 0 ? (
                <div style={styles.hataKutusu}>Atanabilecek boş ve hazır cihaz yok (cihazlar misafirde ya da OOServis).</div>
              ) : (
                <>
                  <div style={styles.etiket}>CİHAZ SEÇ ({bos.length} boş)</div>
                  <select data-testid="ata-secim" style={girdi} value={secili} onChange={(ev) => setAtamaNo({ ...atamaNo, [r.id]: Number(ev.target.value) })}>
                    {bos.map((b) => (<option key={b.no} value={b.no}>{servisNo(r.urun, b.no)}</option>))}
                  </select>
                </>
              )}
              <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                <button style={{ ...styles.ikincilButon, flex: 1 }} onClick={() => setAcik(null)}>Vazgeç</button>
                <button data-testid="ata-onay" style={{ ...styles.anaButon, flex: 1 }} disabled={mesgul || bos.length === 0} onClick={() => islem("servis_ata_teslim", { p_id: r.id, p_birim: Number(secili) }, (x) => `✓ ${servisNo(r.urun, x.birim_no)} atandı ve teslim edildi`)}>Teslim Et</button>
              </div>
            </div>
          );
        })()}
        {ac === "iptal" && (
          <div style={{ marginTop: 8 }}>
            <input style={girdi} placeholder="İptal nedeni (isteğe bağlı)" maxLength={120} value={neden} onChange={(e) => setNeden(e.target.value)} />
            <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
              <button style={{ ...styles.ikincilButon, flex: 1 }} onClick={() => setAcik(null)}>Vazgeç</button>
              <button style={{ ...styles.anaButon, flex: 1, background: "#B91C1C" }} disabled={mesgul} onClick={() => islem("servis_iptal", { p_id: r.id, p_not: neden }, "✓ İptal edildi")}>İptali Onayla</button>
            </div>
          </div>
        )}
      </div>
    );
  }

  const bugunTarih = servisParca(simdi).tarih;
  const aktifRez = veri ? veri.rez.filter((r) => ["Rezerve", "Teslim", "Iade"].includes(r.durum)) : [];
  function listeSatirlari() {
    let l = veri ? veri.rez.slice() : [];
    if (urunFiltre !== "hepsi") l = l.filter((r) => r.urun === urunFiltre);
    if (filtre === "aktif") l = l.filter((r) => ["Rezerve", "Teslim", "Iade"].includes(r.durum));
    else if (filtre === "rezerve") l = l.filter((r) => r.durum === "Rezerve");
    else if (filtre === "misafirde") l = l.filter((r) => r.durum === "Teslim");
    else if (filtre === "bitti") l = l.filter((r) => r.durum === "Tamam" || r.durum === "İptal");
    return l.sort((a, b) => Date.parse(a.kurulum_zamani) - Date.parse(b.kurulum_zamani));
  }

  const sekmeler = [["pano", "Pano"], ["yeni", "+ Yeni"], ["liste", "Liste"], ["envanter", "Envanter"], ["log", "Geçmiş"]];
  return (
    <div style={styles.icerik}>
      <div style={styles.listeUstBaslik}>
        <button style={styles.geriButon} onClick={onGeri} aria-label="Geri">←</button>

function ServisYeniForm({ veri, simdi, girdi, kutu, onBitti }) {
  const bugun = servisParca(simdi).tarih;
  const azami = veri.azami_tarih;
  const esik = servisParca(simdi - 15 * 60000).saat;
  const bugunSaatleri = SERVIS_SAATLER.filter((s) => s >= esik);
  const bugunAcik = bugunSaatleri.length > 0;
  const [f, setF] = useState({
    urun: "BK",
    oda: "",
    ad: "",
    kTarih: bugunAcik || bugun >= azami ? bugun : servisParca(simdi + 86400000).tarih,
    kSaat: bugunAcik ? bugunSaatleri[0] : SERVIS_SAATLER[0],
    iTarih: "",
    iSaat: "10:00",
    not: "",
  });
  const [hata, setHata] = useState("");
  const [onayMetni, setOnayMetni] = useState("");
  const [mesgul, setMesgul] = useState(false);
  const [musait, setMusait] = useState(null);
  const ps = f.urun === "PS";
  const kIso = f.kTarih && f.kSaat ? servisIso(f.kTarih, f.kSaat) : null;
  const psIade = kIso ? new Date(Date.parse(kIso) + 86400000).toISOString() : null;
  const iIso = ps ? psIade : f.iTarih ? servisIso(f.iTarih, f.iSaat) : null;
  const saatler = f.kTarih === bugun ? bugunSaatleri : SERVIS_SAATLER;
  useEffect(() => {
    setMusait(null);
    if (!kIso || !iIso || Date.parse(iIso) <= Date.parse(kIso)) return undefined;
    let iptal = false;
    const t = setTimeout(() => {
      window.OtelRpc.cagir("servis_musait", { p_urun: f.urun, p_kurulum: kIso, p_iade: new Date(Date.parse(iIso)).toISOString() })
        .then((n) => !iptal && setMusait(n))
        .catch(() => {});
    }, 300);
    return () => {
      iptal = true;
      clearTimeout(t);
    };
  }, [f.urun, kIso, iIso]);

  async function kaydet(onay) {
    setHata("");
    if (!/^[0-9]{3,4}$/.test(f.oda.trim())) return setHata("Oda numarası 3 veya 4 haneli olmalı.");
    if (f.ad.trim().length < 2) return setHata("İsim soyisim yazın.");
    if (!kIso) return setHata("Kurulum tarihi ve saatini seçin.");
    if (!ps && !f.iTarih) return setHata("Bebek kamerası için iade tarihini seçin.");
    setMesgul(true);
    try {
      const r = await window.OtelRpc.cagir("servis_rezerve", {
        p_urun: f.urun, p_oda: f.oda.trim(), p_misafir: f.ad.trim(), p_kurulum: kIso,
        p_iade: ps ? null : new Date(Date.parse(iIso)).toISOString(), p_not: f.not.trim() || null, p_onay: !!onay,
      });
      await onBitti(`✓ ${servisUrun(f.urun).ad} rezerve edildi · İade ${servisKisa(r.iade_zamani)} · 3 dk içinde geri alabilirsiniz`);
    } catch (e) {
      if (e.kod === "ODA_LIMIT_ONAY") setOnayMetni(e.message);
      else if (e.kod === "ODA_LIMIT") setHata(`Bu oda için ${servisUrun(f.urun).ad} zaten aktif rezerve: ${e.message}. İkinci rezervasyonu yalnızca Müdür yapabilir.`);
      else setHata(e.message);
    } finally {
      setMesgul(false);
    }
  }
  const btn = (aktif, renk) => ({ flex: 1, padding: "12px 6px", borderRadius: 12, border: `2px solid ${renk}`, background: aktif ? renk : "#fff", color: aktif ? "#fff" : renk, fontWeight: 800, fontSize: 14 });
  return (
    <div style={{ marginTop: 6 }}>
      <Etiket>ÜRÜN</Etiket>
      <div style={{ display: "flex", gap: 8 }}>
        {SERVIS_URUNLER.map((u) => (
          <button key={u.kod} style={btn(f.urun === u.kod, u.renk)} onClick={() => { setF({ ...f, urun: u.kod }); setOnayMetni(""); }}>{u.ikon} {u.ad}</button>
        ))}
      </div>
      <Etiket>ODA NUMARASI (3-4 hane)</Etiket>
      <input style={girdi} inputMode="numeric" maxLength={4} placeholder="örn. 1204" value={f.oda} onChange={(e) => { setF({ ...f, oda: e.target.value.replace(/\D/g, "").slice(0, 4) }); setOnayMetni(""); }} />
      <Etiket>ADI SOYADI</Etiket>
      <input style={girdi} maxLength={80} value={f.ad} onChange={(e) => setF({ ...f, ad: e.target.value })} />
      <Etiket>KURULUM (MİSAFİRE TESLİM) · TARİH VE SAAT (08:00–18:00)</Etiket>
      <div style={{ display: "flex", gap: 8 }}>
        <input type="date" style={{ ...girdi, flex: 1 }} min={bugun} max={azami} value={f.kTarih} onChange={(e) => { const d = e.target.value; const gecerli = d === bugun ? bugunSaatleri : SERVIS_SAATLER; setF({ ...f, kTarih: d, kSaat: gecerli.includes(f.kSaat) ? f.kSaat : gecerli[0] || f.kSaat }); }} />
        <select style={{ ...girdi, width: 110 }} value={f.kSaat} onChange={(e) => setF({ ...f, kSaat: e.target.value })}>
          {saatler.map((s) => (<option key={s} value={s}>{s}</option>))}
        </select>
      </div>
      <Etiket>İADE (MİSAFİRDEN ALIŞ)</Etiket>
      {ps ? (
        <div style={{ ...girdi, background: "#F3F0FF", borderColor: "#6D28D9", fontWeight: 700 }} data-testid="ps-iade">
          {psIade ? `${servisKisa(psIade)} (otomatik, 24 saat sonra)` : "-"}
        </div>
      ) : (
        <div style={{ display: "flex", gap: 8 }}>
          <input type="date" style={{ ...girdi, flex: 1 }} min={f.kTarih || bugun} value={f.iTarih} onChange={(e) => setF({ ...f, iTarih: e.target.value })} />
          <select style={{ ...girdi, width: 110 }} value={f.iSaat} onChange={(e) => setF({ ...f, iSaat: e.target.value })}>
            {SERVIS_SAATLER.map((s) => (<option key={s} value={s}>{s}</option>))}
          </select>
        </div>
      )}
      <Etiket>NOT (isteğe bağlı)</Etiket>
      <textarea style={{ ...girdi, minHeight: 56 }} maxLength={300} value={f.not} onChange={(e) => setF({ ...f, not: e.target.value })} />
      {musait !== null && (
        <div style={{ marginTop: 10, fontSize: 13, fontWeight: 700, color: musait ? "#15803D" : "#B91C1C" }} data-testid="musait">
          {musait ? `Bu aralıkta boş ${servisUrun(f.urun).ad}: ${musait} adet` : `Bu aralıkta boş ${servisUrun(f.urun).ad} yok`}
        </div>
      )}
      {hata && <div style={styles.hataKutusu}>{hata}</div>}
      {onayMetni && (
        <div style={{ ...styles.hataKutusu, background: "#FEF3C7", color: "#92400E" }}>
          Bu oda için aktif bir {servisUrun(f.urun).ad} rezervasyonu var: <b>{onayMetni}</b>. Müdür olarak ikinci rezervasyonu yapmak istiyor musunuz?
          <button style={{ ...styles.anaButon, marginTop: 8 }} disabled={mesgul} onClick={() => kaydet(true)}>Evet, ikinci rezervasyonu kaydet</button>
        </div>
      )}
      <button style={{ ...styles.anaButon, marginTop: 14 }} disabled={mesgul} onClick={() => kaydet(false)}>{mesgul ? "Kaydediliyor…" : "Rezervasyonu Kaydet"}</button>
    </div>
  );
}

  { k: "GIS", ad: "Kusma / İshal / Mide", ikon: "🤢" },
  { k: "ATES_ENF", ad: "Ateş / Enfeksiyon / Boğaz-Kulak", ikon: "🌡️" },
