veya ilgili sorumluya bildirilmesi."]}]},{"ad":"MİNİBAR ŞEFİ","bolumler":[{"harf":"A","baslik":"Operasyon planlaması","maddeler":["Günlük minibar kontrol ve dolum programının hazırlanması.","Minibar personelinin oda ve kat bazında görev dağılımının yapılması.","Doluluk, giriş ve çıkış hareketlerine göre öncelikli oda listesinin oluşturulması.","Minibar hizmetinin kat hizmetleri ve ön büro ile koordineli yürütülmesinin sağlanması."]},{"harf":"B","baslik":"Ürün ve kalite kontrolü","maddeler":["Minibar ürün çeşitleri ve dolum standartlarının uygulanmasının denetlenmesi.","Ürün son tüketim tarihlerinin ve stok rotasyonunun kontrol edilmesi.","Minibar dolaplarının temizliği ve soğutma performansının takip edilmesi.","Hasarlı, eksik veya standart dışı ürünlerin ayrılmasının sağlanması."]},{"harf":"C","baslik":"Stok ve kayıt","maddeler":["Depodan teslim alınan minibar ürünlerinin kayıtlarla karşılaştırılması.","Oda tüketimlerinin doğru kaydedilmesinin ve sisteme zamanında işlenmesinin denetlenmesi.","Fiziksel ürün sayımı ile sistem bakiyelerinin karşılaştırılması.","Ürün kaybı, tüketim farkı ve olağan dışı stok hareketlerinin araştırılması.","Kritik ürün seviyelerinin takip edilerek zamanında ikmal talebi oluşturulması."]},{"harf":"D","baslik":"Personel ve misafir hizmeti","maddeler":["Minibar personelinin hijyen, oda giriş ve misafir mahremiyeti kurallarına uygun çalışmasının denetlenmesi.","Misafir minibar taleplerinin ve şikâyetlerinin zamanında karşılanmasının takip edilmesi.","Yanlış ücretlendirme veya hatalı tüketim kayıtlarının düzeltilmesinin sağlanması.","Personelin görev performansının ve tamamlanan oda sayısının değerlendirilmesi."]},{"harf":"E","baslik":"Raporlama ve bakım","maddeler":["Arızalı minibarların teknik servise bildirilmesinin ve çözümünün takip edilmesi.","Günlük tüketim, dolum, stok farkı ve fire raporlarının hazırlanması.","Minibar operasyonunun maliyet, hız ve hizmet kalitesi açısından iyileştirilmesinin takip edilmesi."]}]},{"ad":"MİSAFİR İLİŞKİLERİ MÜDÜR YARDIMCISI","bolumler":[{"harf":"A","baslik":"Günlük misafir takibi","maddeler":["Günlük VIP, özel misafir ve kutlama listelerinin kontrol edilmesi.","Özel karşılama, oda hazırlığı ve ikram taleplerinin ilgili departmanlarla koordine edilmesi.","Misafir memnuniyeti aramalarının ve planlı ziyaretlerin takibinin yapılması.","Konaklama sırasında özel ilgi gerektiren misafirlerin ihtiyaçlarının izlenmesi."]},{"harf":"B","baslik":"Şikâyet yönetimi","maddeler":["Yeni şikâyetlerin kayıt altına alınmasının ve ilgili departmana yönlendirilmesinin sağlanması.","Şikâyetlere yönelik aksiyonların hedef süre içinde tamamlanmasının takip edilmesi.","Çözümü geciken şikâyetlerin ilgili yöneticiye yükseltilmesi.","Misafire verilen geri dönüşlerin doğru, zamanında ve profesyonel olmasının kontrol edilmesi.","Tekrarlayan şikâyetlerin nedenlerinin belirlenmesi için ilgili departmanlarla koordinasyon kurulması."]},{"harf":"C","baslik":"Ekip yönetimi","maddeler":["Misafir ilişkileri personelinin vardiya ve görev dağılımının yapılması.","Personelin iletişim, görünüm ve hizmet standartlarına uygunluğunun denetlenmesi.","Günlük misafir temas noktalarının ve bekleyen işlerin takip edilmesi.","Personelin yabancı dil, iletişim ve problem çözme ihtiyaçlarının belirlenmesi."]},{"harf":"D","baslik":"İletişim ve koordinasyon","maddeler":["Ön büro, kat hizmetleri, yiyecek içecek ve diğer departmanlarla misafir bilgisi koordinasyonunun sağlanması.","Misafir taleplerinin yetki ve gizlilik kurallarına uygun paylaşılmasının kontrol edilmesi.","Çevrim içi yorum ve anket geri bildirimlerinin günlük olarak değerlendirilmesi.","Özel durumların ve önemli misafir ilişkileri olaylarının müdüre bildirilmesi."]},{"harf":"E","baslik":"Raporlama","maddeler":["Sen Günlük şikâyet, talep ve çözüm kayıtlarının doğruluğunun kontrol edilmesi.","Misafir memnuniyeti ve çözüm sürelerinin takip edilmesi.","Vardiya sonunda açık konuların ve gerekli aksiyonların misafir ilişkileri müdürüne aktarılması."]}]},{"ad":"MİSAFİR İLİŞKİLERİ MÜDÜRÜ","bolumler":[{"harf":"A","baslik":"Misafir deneyimi yönetimi","maddeler":["Günlük misafir memnuniyeti ve özel ilgi gerektiren misafir planının oluşturulması.","VIP ve özel misafir hizmetlerinin işletme standartlarına uygun yürütülmesinin sağlanması.","Misafir geri bildirimlerinin konaklama aşamalarına göre analiz edilmesi.","Misafir memnuniyetini etkileyen kritik hizmet noktalarının belirlenmesi."]},{"harf":"B","baslik":"Şikâyet ve kriz yönetimi","maddeler":["Kritik misafir şikâyetlerinin değerlendirilmesi ve çözüm stratejisinin belirlenmesi.","Şikâyetlerin sorumlu departman ve hedef çözüm süreleriyle takip edilmesinin sağlanması.","Tekrarlayan şikâyetlerde kök neden analizinin yapılması ve düzeltici faaliyetlerin başlatılması.","Ciddi olaylarda ilgili yöneticilerle koordinasyon kurulması ve kayıtların eksiksiz tutulmasının sağlanması.","Misafire verilen yanıtların doğruluk, tutarlılık ve kurumsal iletişim standartlarına uygunluğunun kontrol edilmesi."]},{"harf":"C","baslik":"Ekip ve hizmet standartları","maddeler":["Misafir ilişkileri ekibinin görev, vardiya ve performans hedeflerinin belirlenmesi.","Personelin iletişim, yabancı dil ve problem çözme yetkinliklerinin geliştirilmesinin sağlanması.","Misafir ilişkileri süreçlerinin diğer departmanlarla uyumlu yürütülmesinin denetlenmesi.","Misafir mahremiyeti ve kişisel verilerin korunması kurallarının uygulanmasının sağlanması."]},{"harf":"D","baslik":"İtibar ve geri bildirim yönetimi","maddeler":["Çevrim içi yorumların, anketlerin ve acente geri bildirimlerinin analiz edilmesi.","Olumsuz yorumlara verilecek yanıtların doğruluk ve profesyonellik açısından kontrol edilmesi.","Misafirlerden geri bildirim talep edilmesi süreçlerinde gönüllülük ve platform kurallarına uyulmasının sağlanması.","Misafir memnuniyetini artıracak iyileştirme önerilerinin ilgili departmanlarla geliştirilmesi."]},{"harf":"E","baslik":"Performans ve raporlama","maddeler":["Şikâyet sayısı, çözüm süresi, tekrar eden sorunlar ve memnuniyet puanlarının takip edilmesi.","Günlük ve dönemsel misafir ilişkileri raporlarının hazırlanması.","Misafir deneyimi performansı ve iyileştirme planlarının genel müdüre sunulması."]}]},{"ad":"MİSAFİR İLİŞKİLERİ ŞEFİ","bolumler":[{"harf":"A","baslik":"Günlük operasyon","maddeler":["Günlük görev ve vardiya planının kontrol edilmesi.","Misafir ilişkileri masasının ve iletişim araçlarının hizmete hazır tutulması.","VIP, kutlama ve özel talep listelerinin güncellenmesi.","Bekleyen misafir taleplerinin ve departmanlara iletilen işlerin takibinin yapılması."]},{"harf":"B","baslik":"Misafir iletişimi","maddeler":["Misafirlerin taleplerine nazik ve zamanında yanıt verilmesinin sağlanması.","Misafirlerin otel hizmetleri ve etkinlikleri hakkında doğru bilgilendirilmesinin kontrol edilmesi.","Özel taleplerin ilgili departmana eksiksiz iletilmesinin sağlanması.","Misafir memnuniyeti görüşmelerinin belirlenen plana göre yürütülmesinin takip edilmesi."]},{"harf":"C","baslik":"Şikâyet ve çözüm takibi","maddeler":["Şikâyet kayıtlarının eksiksiz tutulmasının kontrol edilmesi.","İlgili departmanların çözüm aksiyonlarının takip edilmesi.","Süresinde çözülmeyen şikâyetlerin müdür yardımcısına aktarılması.","Misafirle yapılan geri bildirim görüşmelerinin kayıt altına alınmasının sağlanması."]},{"harf":"D","baslik":"Ekip ve koordinasyon","maddeler":["Personelin hizmet standartları ve vardiya görevlerine uygun çalışmasının denetlenmesi.","Ön büro ve diğer departmanlarla günlük bilgi akışının sağlanması.","Misafir bilgilerinin yalnızca yetkili kişilerle ve gerekli ölçüde paylaşılmasının kontrol edilmesi.","Misafir ilişkileri alanında kullanılan formların ve kayıtların düzenli tutulmasının sağlanması."]},{"harf":"E","baslik":"Raporlama","maddeler":["Günlük misafir talep ve şikâyet sayılarının takip edilmesi.","Açık ve kapanan şikâyetlerin durumunun kontrol edilmesi.","Misafir memnuniyetini etkileyen tekrar eden sorunların belirlenmesi.","Vardiya sonunda önemli olaylar ve bekleyen işlerin müdür yardımcısına raporlanması."]}]},{"ad":"MİSAFİR İLİŞKİLERİ UZMAN YARDIMCISI","bolumler":[{"harf":"A","baslik":"Kayıt ve bilgi hazırlığı","maddeler":["Günlük misafir listelerinin ve özel taleplerin güncel tutulması.","VIP, kutlama ve özel karşılama bilgilerinin ilgili sistemlere doğru girilmesi.","Misafir bilgilendirme materyallerinin güncelliğinin kontrol edilmesi.","Misafir ilişkileri kayıtlarının belirlenen dosyalama prosedürüne göre tutulması."]},{"harf":"B","baslik":"Misafir iletişimi","maddeler":["Misafirlerden gelen soru ve taleplerin doğru şekilde alınması.","Yetki sınırları içinde doğru bilgi verilmesi, diğer taleplerin ilgili personele aktarılması.","Misafirlerin etkinlik, restoran ve otel hizmetleri hakkında güncel bilgilendirilmesi.","Özel taleplerin doğru departmana ve doğru zamanda iletilmesi."]},{"harf":"C","baslik":"Şikâyet ve talep takibi","maddeler":["Misafir şikâyetlerinin ilgili sisteme eksiksiz kaydedilmesi.","Şikâyetlerin sorumlu departmana iletilme durumunun kontrol edilmesi.","Açık taleplerin ve bekleyen geri dönüşlerin takip edilmesi.","Tamamlanan aksiyonların ilgili kayıtlara işlenmesi."]},{"harf":"D","baslik":"Gizlilik ve hizmet standardı","maddeler":["Misafir bilgilerinin gizlilik ve erişim kurallarına uygun işlenmesi.","Misafirlerle yazılı ve sözlü iletişimde kurumsal dil standartlarının uygulanması.","Misafir ilişkileri alanının düzenli ve hizmete hazır tutulması.","Misafir şikâyeti veya acil durumlarda sorumlu kişiye gecikmeden haber verilmesi."]},{"harf":"E","baslik":"Destek ve raporlama","maddeler":["Memnuniyet anketlerinin ve geri bildirim formlarının hazırlanmasına destek verilmesi.","Günlük misafir taleplerinin ve şikâyetlerin istatistiklerinin hazırlanması.","Vardiya sonunda açık kalan taleplerin ve önemli notların devredilmesi.","Günlük işlerin tamamlanma durumunun misafir ilişkileri şefine bildirilmesi."]}]},{"ad":"MUHASEBE GÖREVLİSİ","bolumler":[{"harf":"A","baslik":"Belge ve kayıt işlemleri","maddeler":["Muhasebeye ulaşan faturaların ve belgelerin eksiksizlik açısından kontrol edilmesi.","Belgelerin doğru tarih, firma ve muhasebe hesabıyla kaydedilmesi.","Faturaların ilgili sipariş, teslimat veya hizmet belgeleriyle eşleştirilmesi.","Muhasebe kayıtlarına dayanak olan belgelerin düzenli arşivlenmesi."]},{"harf":"B","baslik":"Günlük finansal işlemler","maddeler":["Kasa ve banka hareketlerinin ilgili belgelerle karşılaştırılması.","Tahsilat ve ödeme kayıtlarının doğru hesaplara işlenmesi.","Mükerrer fatura, yanlış tutar veya hatalı hesap kodu risklerinin kontrol edilmesi.","Masraf belgelerinin onay ve yetki prosedürlerine uygunluğunun incelenmesi."]},{"harf":"C","baslik":"Cari hesap ve mutabakat","maddeler":["Cari hesap hareketlerinin doğru kaydedilmesi.","Tedarikçi ve müşteri hesaplarındaki farkların tespit edilerek sorumluya bildirilmesi.","Banka ve cari hesap mutabakatlarının hazırlanmasına destek verilmesi.","Eksik veya hatalı belgeler için ilgili departmanlardan düzeltme talep edilmesi."]},{"harf":"D","baslik":"Mevzuat ve iç kontrol","maddeler":["Vergi ve muhasebe kayıtlarının ilgili mevzuat ve şirket prosedürlerine uygun hazırlanmasına destek verilmesi.","Finansal belgelerin gizlilik ve erişim kurallarına uygun korunması.","Muhasebe sisteminde yapılan kayıt ve düzeltmelerin izlenebilirliğinin korunması.","Yetkisiz ödeme veya kayıt değişikliği yapılmamasının sağlanması."]},{"harf":"E","baslik":"Raporlama ve kapanış","maddeler":["Günlük muhasebe işlemlerinin belirlenen sürelerde tamamlanması.","Ay sonu kapanışları için gerekli belge ve hesap kontrollerinin yapılması.","Eksik belge, açık hesap ve kayıt farklılıklarının muhasebe şefine bildirilmesi.","Sorumlu muhasebe yöneticisinin talep ettiği rapor ve belgelerin hazırlanması."]}]},{"ad":"MUHASEBE MÜDÜR YARDIMCISI","bolumler":[{"harf":"A","baslik":"Muhasebe iş akışı","maddeler":["Günlük muhasebe işlemlerinin görev dağılımına ve takvime uygun yürütülmesinin kontrol edilmesi.","Fatura, banka, kasa ve cari hesap kayıtlarının eksiksizliğinin denetlenmesi.","Muhasebe personelinin işlem ve belge takibinin koordine edilmesi.","Bekleyen muhasebe kayıtlarının ve eksik belgelerin takip edilmesi."]},{"harf":"B","baslik":"Hesap ve mutabakat kontrolü","maddeler":["Banka hesaplarının ve ilgili muhasebe kayıtlarının karşılaştırılmasının sağlanması.","Cari hesap mutabakatlarının zamanında tamamlanmasının takip edilmesi.","Kasa ve diğer finansal hesapların bakiyelerinin kontrol edilmesi.","Muhasebe hesaplarındaki olağan dışı hareketlerin incelenmesi.","Hesaplar arası mahsup ve düzeltme kayıtlarının dayanak belgelerinin kontrol edilmesi."]},{"harf":"C","baslik":"Dönem kapanışı ve mevzuat","maddeler":["Aylık kapanış takviminin takip edilmesi.","Tahakkuk, gider karşılığı ve dönem ayırıcı kayıtların ilgili prosedürlere göre kontrol edilmesi.","Vergi ve yasal bildirimler için gereken muhasebe verilerinin hazırlanmasının takip edilmesi.","Finansal kayıtların ilgili mevzuat ve şirket politikalarına uygunluğunun kontrol edilmesi."]},{"harf":"D","baslik":"İç kontrol ve personel","maddeler":["Ödeme, kayıt ve onay süreçlerinde yetki sınırlarının uygulanmasının kontrol edilmesi.","Mükerrer işlem ve hatalı kayıt risklerinin değerlendirilmesi.","Muhasebe personelinin iş yükü ve görev tamamlama performansının izlenmesi.","Finansal belge ve kayıtların gizlilik standartlarına uygun korunmasının sağlanması."]},{"harf":"E","baslik":"Raporlama","maddeler":["Dönemsel hesap mutabakatlarının ve kapanış sonuçlarının değerlendirilmesi.","Eksik, hatalı veya riskli işlemlerin muhasebe müdürüne bildirilmesi.","Muhasebe süreçlerinin hızını, doğruluğunu ve kontrol kalitesini artıracak iyileştirmelerin takip edilmesi."]}]},{"ad":"MUHASEBE ŞEFİ","bolumler":[{"harf":"A","baslik":"Günlük muhasebe kontrolü","maddeler":["Günlük muhasebe kayıtlarının zamanında ve doğru yapıldığının kontrol edilmesi.","Fatura ve masraf belgelerinin onay ve belge bütünlüğü açısından incelenmesi.","Kasa, banka ve cari hesap kayıtlarının kontrol edilmesi.","Muhasebe hesaplarının doğru maliyet merkezi ve hesap kodlarıyla eşleştirilmesinin sağlanması."]},{"harf":"B","baslik":"Mutabakat ve hesap takibi","maddeler":["Banka ve cari hesap mutabakatlarının hazırlanmasının koordine edilmesi.","Muhasebe hesaplarındaki bakiye farklılıklarının araştırılması.","Açık hesaplar, bekleyen tahsilatlar ve ödemelerin takip edilmesi.","Mükerrer veya hatalı muhasebe kayıtlarının düzeltilmesinin sağlanması."]},{"harf":"C","baslik":"Dönem sonu işlemleri","maddeler":["Ay sonu kapanış işlemlerinin takvime uygun yürütülmesinin sağlanması.","Tahakkuk ve dönem ayırıcı kayıtların dayanak belgelerle kontrol edilmesi.","Sabit kıymet ve amortisman kayıtlarının ilgili prosedürlere göre kontrol edilmesi.","Stok ve maliyet kayıtlarının ilgili departmanlarla mutabakatının sağlanması."]},{"harf":"D","baslik":"İç kontrol ve ekip yönetimi","maddeler":["Muhasebe personelinin iş dağılımı ve kayıt kalitesinin denetlenmesi.","Finansal işlem onaylarının yetki limitlerine uygunluğunun kontrol edilmesi.","Vergi, bordro ve diğer muhasebe süreçlerinde gerekli verilerin zamanında hazırlanmasının takip edilmesi.","Muhasebe kayıtlarının gizlilik ve arşivleme kurallarına uygun tutulmasının sağlanması."]},{"harf":"E","baslik":"Raporlama ve iyileştirme","maddeler":["Dönemsel hesap kontrollerinin sonuçlarının belgelenmesi.","Hatalı kayıt ve mutabakat farklarının nedenlerinin raporlanması.","Denetim için gerekli muhasebe belgelerinin hazır bulundurulmasının sağlanması.","Muhasebe müdürüne finansal kayıtların durumu ve açık konular hakkında rapor sunulması."]}]},{"ad":"ÖN BÜRO ŞEFİ","bolumler":[{"harf":"A","baslik":"Vardiya ve operasyon","maddeler":["Vardiya başlangıcında önceki vardiyadan devralınan açık konuların kontrol edilmesi.","Resepsiyon personelinin görev ve banko dağılımının yapılması.","Günlük giriş, çıkış, grup ve VIP listelerinin kontrol edilmesi.","Oda durumlarının PMS kayıtlarıyla karşılaştırılmasının sağlanması."]},{"harf":"B","baslik":"Giriş ve çıkış işlemleri","maddeler":["Check-in işlemlerinin kimlik doğrulama ve kayıt prosedürlerine uygun yürütülmesinin denetlenmesi.","Check-out işlemlerinde hesap, ödeme ve fatura süreçlerinin doğru tamamlanmasının kontrol edilmesi.","Erken giriş, geç çıkış ve oda değişikliği taleplerinin yetki kurallarına uygun yönetilmesinin sağlanması.","Oda anahtarı ve kartlarının doğru oda ve yetkiyle eşleştirilmesinin kontrol edilmesi."]},{"harf":"C","baslik":"Misafir hizmeti ve sorun çözümü","maddeler":["Misafir taleplerinin doğru departmanlara yönlendirilmesinin sağlanması.","Bekleyen şikâyet ve çözüm aksiyonlarının takip edilmesi.","Resepsiyonda oluşan yoğunluk ve kuyrukların yönetilmesi.","Özel durumların ve kritik misafir şikâyetlerinin ön büro müdürüne aktarılması."]},{"harf":"D","baslik":"Finansal ve sistem kontrolü","maddeler":["Kasa devir ve teslim işlemlerinin prosedüre uygun yapılmasının denetlenmesi.","Oda ücretleri, indirimler ve hesap düzeltmelerinin yetkili onaylara uygunluğunun kontrol edilmesi.","PMS ve ödeme sistemlerinde yaşanan sorunların ilgili birime bildirilmesinin sağlanması.","Misafir bilgilerinin gizlilik ve veri koruma kurallarına uygun işlenmesinin denetlenmesi."]},{"harf":"E","baslik":"Raporlama","maddeler":["Vardiya raporlarının ve günlük ön büro kayıtlarının kontrol edilmesi.","No-show, iptal, oda değişikliği ve diğer kritik işlemlerin takibinin yapılması.","Personel performansı ve hizmet standartlarının değerlendirilmesi.","Vardiya sonunda açık işlemlerin ve önemli gelişmelerin ön büro yönetimine raporlanması."]}]},{"ad":"ÖNBÜRO MÜDÜR YARDIMCISI","bolumler":[{"harf":"A","baslik":"Günlük operasyon yönetimi","maddeler":["Günlük oda doluluk, giriş, çıkış ve konaklama hareketlerinin takip edilmesi.","Ön büro vardiya planının ve personel dağılımının kontrol edilmesi.","VIP, grup ve özel misafir hazırlıklarının ilgili departmanlarla koordine edilmesi.","Oda durumlarının PMS ve kat hizmetleri kayıtlarıyla karşılaştırılmasının sağlanması."]},{"harf":"B","baslik":"Misafir kabul ve hesap işlemleri","maddeler":["Check-in ve check-out süreçlerinin hizmet standartlarına uygunluğunun denetlenmesi.","Oda fiyatı, konaklama paketi ve rezervasyon koşullarının doğru uygulanmasının kontrol edilmesi.","Kasa, ödeme ve hesap kapatma işlemlerinin prosedürlere uygun yürütülmesinin sağlanması.","Oda değişikliği, ücret düzeltmesi ve indirim işlemlerinin yetki kurallarına uygunluğunun denetlenmesi."]},{"harf":"C","baslik":"Misafir memnuniyeti","maddeler":["Ön büroya iletilen şikâyetlerin ve çözüm sürelerinin takip edilmesi.","Misafir taleplerinin ilgili departmanlara zamanında iletilmesinin sağlanması.","Yoğun saatlerde banko hizmetinin ve bekleme sürelerinin kontrol edilmesi.","Tekrarlayan operasyonel sorunların nedenlerinin belirlenerek müdüre aktarılması."]},{"harf":"D","baslik":"Sistem ve kontrol","maddeler":["PMS, POS ve ödeme sistemlerindeki operasyonel aksaklıkların takip edilmesi.","Misafir bilgilerinin ve finansal kayıtların güvenliğinin korunmasının denetlenmesi.","Rezervasyon, oda blokajı ve özel talep kayıtlarının doğruluğunun kontrol edilmesi.","Vardiya devirlerinin ve bekleyen işlerin eksiksiz yapılmasının sağlanması."]},{"harf":"E","baslik":"Performans ve raporlama","maddeler":["Ön büro personelinin hizmet kalitesi ve işlem doğruluğunun değerlendirilmesi.","Günlük operasyon raporlarının ve önemli olay kayıtlarının kontrol edilmesi.","Misafir memnuniyeti ve hizmet hızı göstergelerinin takip edilmesi.","Günlük operasyon sonuçlarının ve iyileştirme ihtiyaçlarının ön büro müdürüne sunulması."]}]},{"ad":"ÖNBÜRO MÜDÜRÜ","bolumler":[{"harf":"A","baslik":"Operasyon planlama","maddeler":["Ön büro operasyonlarının günlük doluluk, rezervasyon hareketleri ve işletme hedeflerine göre planlanması.","Personel kadrosu, vardiya düzeni ve görev dağılımının operasyon ihtiyacına uygun belirlenmesi.","Oda envanteri, oda blokajları ve özel oda taleplerinin kontrol edilmesi.","Ön büro ile rezervasyon, kat hizmetleri ve gelir yönetimi arasındaki koordinasyonun sağlanması."]},{"harf":"B","baslik":"Misafir deneyimi","maddeler":["Check-in ve check-out süreçlerinin hız, doğruluk ve misafir memnuniyeti açısından değerlendirilmesi.","VIP, grup ve özel misafir süreçlerinin eksiksiz yürütülmesinin sağlanması.","Kritik misafir şikâyetlerinin yönetilmesi ve düzeltici aksiyonların takip edilmesi.","Ön büro hizmet standartlarının tüm vardiyalarda tutarlı uygulanmasının denetlenmesi."]},{"harf":"C","baslik":"Finansal ve sistem kontrolü","maddeler":["Oda fiyatı, paket, indirim ve ücretsiz hizmet işlemlerinin yetki kurallarına uygunluğunun denetlenmesi.","Kasa, ödeme, hesap kapatma ve gelir kayıtlarının kontrol süreçlerinin uygulanmasının sağlanması.","PMS, ödeme sistemleri ve ön büro raporlarının doğruluğunun takip edilmesi.","Misafir verileri ve finansal bilgilere erişim yetkilerinin kontrol edilmesi."]},{"harf":"D","baslik":"Ekip ve kalite yönetimi","maddeler":["Ön büro personelinin performans, eğitim ve gelişim ihtiyaçlarının değerlendirilmesi.","Yoğun dönemler ve olağan dışı durumlar için operasyonel planların hazırlanması.","İşlem hataları, uzun bekleme süreleri ve tekrar eden şikâyetler için iyileştirme çalışmalarının yürütülmesi.","Personelin iletişim, gizlilik ve profesyonel davranış standartlarına uyumunun sağlanması."]},{"harf":"E","baslik":"Raporlama ve sonuç takibi","maddeler":["Günlük doluluk, oda hareketleri, şikâyetler ve operasyonel performans raporlarının değerlendirilmesi.","No-show, iptal, oda değişikliği ve hesap düzeltmelerinin analiz edilmesi.","Ön büro hizmet performansının bütçe ve misafir deneyimi hedefleriyle karşılaştırılması.","Departman sonuçlarının ve iyileştirme planlarının genel müdüre raporlanması."]}]},{"ad":"RESEPSİYONİST","bolumler":[{"harf":"A","baslik":"Vardiya hazırlığı","maddeler":["Vardiya devir teslim bilgilerinin ve açık konuların kontrol edilmesi.","Günlük giriş, çıkış, VIP ve grup listelerinin incelenmesi.","PMS, telefon, kartlı geçiş ve ödeme sistemlerinin çalışır durumda olduğunun kontrol edilmesi.","Bankonun ve misafir karşılama alanının düzenli tutulması."]},{"harf":"B","baslik":"Check-in işlemleri","maddeler":["Misafir kimlik ve rezervasyon bilgilerinin işletme prosedürlerine uygun doğrulanması.","Konaklama tarihleri, oda tipi ve rezervasyon koşullarının kontrol edilmesi.","Gerekli kayıt ve bildirim işlemlerinin mevzuata uygun tamamlanması.","Oda hazır olma durumunun ilgili sistemden veya kat hizmetlerinden doğrulanması.","Misafire oda, hizmetler ve temel otel bilgileri hakkında doğru bilgi verilmesi."]},{"harf":"C","baslik":"Check-out ve ödeme","maddeler":["Misafir hesabının konaklama ve tüketim kayıtlarıyla karşılaştırılması.","Ödeme işlemlerinin doğru tutar ve yetkili yöntemlerle tamamlanması.","Fatura ve hesap belgelerinin işletme prosedürlerine uygun hazırlanması.","Hesap uyuşmazlıklarının çözümü için yetkili sorumluya başvurulması."]},{"harf":"D","baslik":"Misafir talepleri ve güvenlik","maddeler":["Telefon, e-posta ve yüz yüze gelen misafir taleplerinin doğru kaydedilmesi.","Şikâyetlerin sakin ve profesyonel şekilde karşılanarak ilgili kişiye iletilmesi.","Oda anahtarı ve kartlarının kimlik ve yetki doğrulamasına uygun teslim edilmesi.","Misafir bilgilerinin ve oda numaralarının gizlilik kurallarına uygun korunması."]},{"harf":"E","baslik":"Kayıt ve devir","maddeler":["Rezervasyon değişiklikleri, oda değişiklikleri ve özel taleplerin sisteme doğru işlenmesi.","Kasa, bekleyen işlem ve vardiya kayıtlarının eksiksiz hazırlanması.","Vardiya sonunda açık taleplerin ve önemli olayların sonraki vardiyaya aktarılması."]}]},{"ad":"RESTORAN KAPTANI","bolumler":[{"harf":"A","baslik":"Servis organizasyonu","maddeler":["Günlük servis öncesinde garsonların masa ve istasyon dağılımının yapılması.","Restoranın masa düzeni, servis ekipmanı ve genel görünümünün kontrol edilmesi.","Personelin üniforma, kişisel bakım ve vardiya hazırlığının denetlenmesi.","Servis başlamadan önce menü, ürün bulunabilirliği ve özel talepler hakkında ekibin bilgilendirilmesi."]},{"harf":"B","baslik":"Servis kalitesi","maddeler":["Misafir karşılama ve masa yönlendirme süreçlerinin standartlara uygunluğunun kontrol edilmesi.","Siparişlerin doğru alınması ve mutfağa eksiksiz iletilmesinin takip edilmesi.","Yiyecek ve içeceklerin doğru masa ve misafire teslim edilmesinin denetlenmesi.","Servis süreleri ve geciken siparişlerin takip edilmesi.","Masa temizliği ve servis yenileme işlemlerinin zamanında yapılmasının sağlanması."]},{"harf":"C","baslik":"Misafir memnuniyeti","maddeler":["Misafir taleplerinin servis boyunca takip edilmesinin sağlanması.","Alerjen ve özel beslenme bildirimlerinin mutfak ekibine doğru aktarılmasının kontrol edilmesi.","Misafir şikâyetlerine ilk müdahalenin yapılması ve gerektiğinde yöneticinin bilgilendirilmesi.","Servis sırasında oluşan yanlış sipariş ve ürün sorunlarının düzeltilmesinin takip edilmesi."]},{"harf":"D","baslik":"Hijyen ve güvenlik","maddeler":["Servis alanlarının hijyen ve temizlik standartlarına uygunluğunun denetlenmesi.","Temiz ve kirli ekipmanların ayrı tutulmasının sağlanması.","Sıcak servis, cam kırılması ve kaygan zemin risklerine yönelik tedbirlerin kontrol edilmesi.","Personelin servis ekipmanlarını güvenli ve doğru kullanmasının denetlenmesi."]},{"harf":"E","baslik":"Kapanış ve raporlama","maddeler":["Servis sonunda masa, istasyon ve ekipmanların kontrol edilmesi.","Personel performansı, sipariş hataları ve misafir geri bildirimlerinin değerlendirilmesi.","Günlük servis sonuçlarının ve açık konuların restoran şefine raporlanması."]}]},{"ad":"RESTORAN ŞEFİ","bolumler":[{"harf":"A","baslik":"Operasyon planlaması","maddeler":["Günlük restoran servis planının doluluk ve beklenen misafir sayısına göre hazırlanması.","Personel kadrosu, vardiya ve istasyon dağılımının belirlenmesi.","Restoran açılış, servis ve kapanış prosedürlerinin uygulanmasının denetlenmesi.","Menü, ürün bulunabilirliği ve servis kapasitesinin kontrol edilmesi."]},{"harf":"B","baslik":"Servis ve misafir deneyimi","maddeler":["Restoran kaptanlarının görev dağılımı ve servis yönetiminin takip edilmesi.","Karşılama, sipariş alma, ürün teslimi ve masa toplama standartlarının denetlenmesi.","Servis hızının ve sipariş doğruluğunun değerlendirilmesi.","Misafir şikâyetleri ve tekrar eden servis sorunları için düzeltici faaliyetlerin başlatılması."]},{"harf":"C","baslik":"Hijyen ve güvenlik","maddeler":["Restoranın temizlik ve hijyen standartlarının uygulanmasının denetlenmesi.","Servis ekipmanlarının temizliği, durumu ve yeterliliğinin kontrol edilmesi.","Alerjen ve özel beslenme taleplerinin mutfakla koordineli yönetilmesinin sağlanması.","Acil durum, kayma ve sıcak servis risklerine karşı gerekli tedbirlerin uygulanmasının kontrol edilmesi."]},{"harf":"D","baslik":"Stok ve maliyet","maddeler":["Servis malzemeleri, içecekler ve sarf ürünlerinin stok seviyelerinin takip edilmesi.","Kırık, kayıp ve fire kayıtlarının incelenmesi.","Personel vardiya maliyetleri ile servis kapasitesi arasındaki dengenin değerlendirilmesi.","Restoran tüketim ve satış verilerinin ilgili raporlarla karşılaştırılması."]},{"harf":"E","baslik":"Performans ve raporlama","maddeler":["Restoran kaptanları ve garsonların hizmet performansının değerlendirilmesi.","Misafir memnuniyeti, servis süresi ve sipariş hata oranlarının takip edilmesi.","Restoran operasyonundaki iyileştirme ihtiyaçlarının belirlenmesi.","Günlük ve dönemsel performans sonuçlarının yiyecek içecek yönetimine raporlanması."]}]},{"ad":"SAHİLCİ","bolumler":[{"harf":"A","baslik":"Plaj hazırlığı","maddeler":["Plaj alanının günlük açılış öncesinde temizliğinin kontrol edilmesi.","Şezlong ve şemsiyelerin düzenli ve güvenli şekilde yerleştirilmesi.","Plaj geçiş yollarının, acil erişim noktalarının ve cankurtaran alanlarının açık tutulması.","Şezlong, şemsiye ve diğer plaj ekipmanlarının sağlamlığının kontrol edilmesi."]},{"harf":"B","baslik":"Misafir hizmeti","maddeler":["Misafirlerin plaj alanında nazik şekilde karşılanması.","Şezlong ve şemsiye taleplerinin işletme prosedürlerine göre karşılanması.","Misafir eşyalarının güvenliği konusunda dikkatli davranılması.","Plajdaki eksik ekipman ve hizmet taleplerinin ilgili sorumluya bildirilmesi."]},{"harf":"C","baslik":"Güvenlik ve çevre","maddeler":["Plaj alanındaki kırık ekipman, cam, kesici atık ve benzeri tehlikelerin tespit edilmesi.","Deniz ve sahil koşullarındaki gözle görülür risklerin cankurtaran veya güvenlik ekibine bildirilmesi.","Kaygan zemin ve yoğun geçiş noktalarında gerekli uyarıların yapılması.","Plaj alanının çevre temizliği ve atık toplama kurallarına uygun tutulması.","Şezlong ve şemsiyelerin rüzgâr ve hava koşullarına uygun güvenli konumlandırılmasının sağlanması."]},{"harf":"D","baslik":"Ekipman ve düzen","maddeler":["Şezlong minderlerinin ve plaj tekstillerinin temiz tutulmasının sağlanması.","Hasarlı şezlong, şemsiye ve ekipmanların kullanımdan ayrılması.","Plaj ekipmanlarının gün sonunda belirlenen düzende toplanması veya sabitlenmesi.","Depolama alanlarının temiz ve düzenli tutulması."]},{"harf":"E","baslik":"Bildirim ve devir","maddeler":["Günlük ekipman eksiklerinin ve hasarların kayıt altına alınması.","Misafir şikâyetleri ve güvenlik olaylarının ilgili sorumluya bildirilmesi.","Vardiya sonunda plajın durumu ve devam eden ihtiyaçların devredilmesi."]}]},{"ad":"SATIN ALMA MÜDÜRÜ","bolumler":[{"harf":"A","baslik":"Satın alma planlaması","maddeler":["Departmanlardan gelen satın alma taleplerinin ihtiyaç, bütçe ve stok açısından değerlendirilmesi.","Satın alma önceliklerinin operasyonel önem ve teslimat sürelerine göre belirlenmesi.","Onaylı satın alma prosedürleri ve yetki limitlerinin uygulanmasının sağlanması.","Kritik ürünler için alternatif tedarikçi ve tedarik sürekliliği planlarının hazırlanması."]},{"harf":"B","baslik":"Tedarikçi yönetimi","maddeler":["Tedarikçi seçiminde fiyat, kalite, teslimat performansı ve güvenilirliğin değerlendirilmesi.","Tekliflerin karşılaştırılabilir ürün ve hizmet koşullarına göre analiz edilmesi.","Tedarikçi sözleşmeleri, fiyat listeleri ve ödeme koşullarının takip edilmesi.","Tedarikçi performansının teslimat doğruluğu, kalite ve zamanında teslim göstergeleriyle değerlendirilmesi.","Tedarikçi kaynaklı kalite sorunları ve gecikmeler için düzeltici aksiyonların yürütülmesi."]},{"harf":"C","baslik":"Maliyet ve bütçe kontrolü","maddeler":["Satın alma fiyatlarının bütçe ve geçmiş dönem verileriyle karşılaştırılması.","Fiyat artışlarının gerekçelerinin araştırılması ve maliyet etkisinin raporlanması.","Toplu alım, alternatif ürün ve sözleşme iyileştirme fırsatlarının değerlendirilmesi.","Satın alma kararlarında toplam sahip olma maliyeti ve kalite risklerinin dikkate alınması."]},{"harf":"D","baslik":"Mal kabul ve stok koordinasyonu","maddeler":["Siparişlerin doğru miktar ve tarihte teslim edilmesinin takip edilmesi.","Mal kabulde tespit edilen eksik, hasarlı ve uygunsuz ürünlerin tedarikçiyle çözümünün sağlanması.","Depo ve departmanlarla kritik stok ve teslimat planlamasının koordine edilmesi.","Sipariş, teslimat ve fatura bilgilerinin birbiriyle tutarlılığının kontrol edilmesi."]},{"harf":"E","baslik":"Etik ve raporlama","maddeler":["Tedarikçi ilişkilerinde çıkar çatışması ve uygunsuz menfaat risklerinin önlenmesine yönelik kontrollerin uygulanması.","Satın alma bütçesi, tasarruf, teslimat performansı ve açık sipariş raporlarının hazırlanması.","Satın alma süreçlerinin maliyet, kalite ve tedarik güvenilirliği açısından iyileştirilmesinin takip edilmesi."]}]},{"ad":"SES IŞIK ŞEFİ","bolumler":[{"harf":"A","baslik":"Teknik hazırlık","maddeler":["Günlük etkinlik programına göre ses ve ışık hazırlık planının oluşturulması.","Ses mikseri, hoparlör, mikrofon ve ışık ekipmanlarının çalışır durumda olduğunun kontrol edilmesi.","Kablo, bağlantı, güç kaynağı ve sinyal hatlarının etkinlik öncesinde kontrol edilmesi.","Sahne ve etkinlik alanındaki ekipman yerleşiminin güvenli ve düzenli olmasının sağlanması."]},{"harf":"B","baslik":"Ses kalitesi","maddeler":["Mikrofon ve müzik seviyelerinin etkinlik türüne ve alan koşullarına uygun ayarlanması.","Ses sisteminin parazit, kesinti ve kanal sorunları açısından test edilmesi.","Konuşma, gösteri ve müzik içeriklerinin anlaşılır duyulmasının sağlanması.","Ses seviyelerinin işletme politikaları ve geçerli sınırlar içinde tutulmasının takip edilmesi."]},{"harf":"C","baslik":"Işık ve sahne yönetimi","maddeler":["Işık armatürlerinin, kontrol sistemlerinin ve sahne efektlerinin işlevselliğinin kontrol edilmesi.","Gösteri akışına uygun ışık senaryolarının hazırlanması.","Sahne geçişleri ve efektlerin programla uyumlu uygulanmasının sağlanması.","Işık ekipmanlarının sabitleme ve kullanım güvenliğinin kontrol edilmesi."]},{"harf":"D","baslik":"İş güvenliği ve bakım","maddeler":["Kabloların geçiş yollarında takılma riski oluşturmayacak şekilde yerleştirilmesinin sağlanması.","Elektrik ve yüksekte çalışma işlerinde yetki ve güvenlik prosedürlerine uyulmasının denetlenmesi.","Arızalı ekipmanların kullanımdan ayrılması ve teknik servis prosedürüne göre bildirilmesi.","Ekipmanların temizliği, uygun depolanması ve hasara karşı korunmasının sağlanması."]},{"harf":"E","baslik":"Ekip ve raporlama","maddeler":["Teknik ekip üyelerinin görev ve etkinlik sırasına göre organize edilmesi.","Gösteri öncesi prova ve teknik testlerin zamanında tamamlanmasının kontrol edilmesi.","Etkinlik sırasında yaşanan teknik aksaklıkların kayıt altına alınması.","Ekipman arızaları, bakım ihtiyaçları ve performans sonuçlarının eğlence yönetimine raporlanması."]}]},{"ad":"SPOR ANİMATÖRÜ","bolumler":[{"harf":"A","baslik":"Aktivite hazırlığı","maddeler":["Günlük spor aktivitesi programının ve saatlerinin kontrol edilmesi.","Aktivite alanının etkinlik öncesinde güvenlik açısından incelenmesi.","Spor ekipmanlarının eksiksiz ve kullanılabilir durumda olduğunun kontrol edilmesi.","Aktivite kurallarının ve gerekli güvenlik bilgilendirmelerinin hazırlanması."]},{"harf":"B","baslik":"Aktivite uygulaması","maddeler":["Katılımcıların aktivite türüne uygun şekilde bilgilendirilmesi.","Isınma ve aktivite başlangıç prosedürlerinin uygulanması.","Hareketlerin katılımcıların beceri düzeylerine uygun gösterilmesi.","Aktivitenin belirlenen süre ve programa uygun yürütülmesi.","Katılımcıların kurallara uygun ve güvenli hareket etmesinin gözetilmesi."]},{"harf":"C","baslik":"Misafir iletişimi","maddeler":["Misafirlerin aktivitelere gönüllü katılımının teşvik edilmesi.","Katılımcılara saygılı, kapsayıcı ve profesyonel yaklaşım gösterilmesi.","Fiziksel yeterlilik ve özel ihtiyaçlarla ilgili bildirimlerin dikkate alınması.","Misafirlerden gelen soruların doğru yanıtlanması veya sorumlu kişiye yönlendirilmesi."]},{"harf":"D","baslik":"Güvenlik ve ekipman","maddeler":["Aktivite sırasında yaralanma ve aşırı zorlanma belirtilerinin gözlemlenmesi.","Hasarlı spor ekipmanlarının kullanılmaması ve bildirilmesi.","Aktivite alanındaki kayma, çarpışma ve çevresel risklerin kontrol edilmesi.","Yaralanma veya acil durumlarda eğitim ve görev sınırlarına uygun prosedürlerin uygulanması."]},{"harf":"E","baslik":"Kapanış ve kayıt","maddeler":["Kullanılan ekipmanların toplanması ve uygun şekilde muhafaza edilmesi.","Aktivite katılımının ve yaşanan aksaklıkların kayıt altına alınması.","Ekipman eksikliği, güvenlik riski ve misafir geri bildirimlerinin animasyon şefine bildirilmesi."]}]},{"ad":"TAŞIYICI / PORTÖR","bolumler":[{"harf":"A","baslik":"Taşıma öncesi hazırlık","maddeler":["Taşınacak eşya, malzeme veya ekipmanın teslim talimatının kontrol edilmesi.","Taşıma güzergâhının güvenli ve geçişe uygun olduğunun kontrol edilmesi.","Taşıma arabası ve yardımcı ekipmanların kullanılabilirliğinin kontrol edilmesi.","Taşınacak yükün ağırlık ve boyut açısından uygun taşıma yönteminin belirlenmesi."]},{"harf":"B","baslik":"Taşıma işlemi","maddeler":["Eşyaların taşıma sırasında devrilme ve düşme riskine karşı güvenli yerleştirilmesi.","Yüklerin elle taşınmasında uygun kaldırma ve taşıma tekniklerinin uygulanması.","Taşıma sırasında duvar, kapı, mobilya ve diğer eşyalara zarar verilmesinin önlenmesi.","Eşyaların doğru oda, depo veya departmana teslim edilmesi.","Teslimat sırasında eşya miktarı ve görünür hasar durumunun kontrol edilmesi."]},{"harf":"C","baslik":"Güvenlik ve düzen","maddeler":["Acil çıkışlar ve misafir geçiş yollarının yüklerle kapatılmamasının sağlanması.","Merdiven, rampa ve asansörlerde güvenli taşıma kurallarına uyulması.","Hasarlı veya ağır ekipmanların uygun araç olmadan taşınmaması.","Taşıma sırasında oluşan hasar, düşme veya yaralanma risklerinin derhal bildirilmesi."]},{"harf":"D","baslik":"Ekipman ve iş disiplini","maddeler":["Taşıma arabalarının temiz ve çalışır durumda tutulması.","Taşıma ekipmanlarının iş bitiminde belirlenen alana bırakılması.","Taşıma alanlarında ambalaj ve atıkların birikmesinin önlenmesi.","İş güvenliği talimatlarına ve kişisel koruyucu ekipman gerekliliklerine uyulması."]},{"harf":"E","baslik":"Teslim ve kayıt","maddeler":["Teslim edilen malzemelerin ilgili kişiye veya departmana bildirilmesi.","Eksik, hasarlı veya yanlış teslimatların sorumluya aktarılması.","Tamamlanmayan taşıma işleri ve bekleyen taleplerin vardiya devrinde bildirilmesi."]}]},{"ad":"TEKNİK HAVUZCU","bolumler":[{"harf":"A","baslik":"Günlük havuz kontrolleri","maddeler":["Havuz çevresinde görünür tehlike, kırık ekipman ve kayma risklerinin kontrol edilmesi.","Havuz suyu sıcaklığının ilgili havuz standardına göre ölçülmesi ve kaydedilmesi.","Su berraklığı ve görünür kirlilik durumunun kontrol edilmesi.","Havuz suyu pH ve dezenfektan ölçümlerinin belirlenen prosedür ve sıklıkta yapılması.","Ölçüm sonuçlarının işletme limitleriyle karşılaştırılarak kayıt altına alınması."]},{"harf":"B","baslik":"Teknik sistemler","maddeler":["Havuz pompaları ve filtrasyon sistemlerinin çalışma durumunun kontrol edilmesi.","Filtre basınçları ve su sirkülasyonunun üretici talimatları ve işletme prosedürlerine göre takip edilmesi.","Havuz suyu besleme, tahliye ve denge tankı sistemlerinde görünür kaçakların kontrol edilmesi.","Otomatik dozaj sistemlerinin ve ölçüm ekipmanlarının çalışma durumunun izlenmesi."]},{"harf":"C","baslik":"Kimyasal ve iş güvenliği","maddeler":["Havuz kimyasallarının etiketli ve uygun depolama koşullarında muhafaza edilmesinin sağlanması.","Kimyasal ürünlerin birbirine karıştırılmaması ve üretici güvenlik talimatlarına uyulması.","Kimyasal uygulamalarda uygun kişisel koruyucu ekipman kullanılması.","Kimyasal dökülmesi veya limit dışı ölçüm durumunda ilgili acil durum prosedürünün uygulanması."]},{"harf":"D","baslik":"Hijyen ve güvenlik","maddeler":["Havuz çevresindeki ızgara, taşma kanalı ve su tahliye noktalarının kontrol edilmesi.","Havuz emiş ızgaraları ve diğer güvenlik donanımlarında görünür hasar olup olmadığının kontrol edilmesi.","Havuz teknik odasının düzen, havalandırma ve güvenlik koşullarının kontrol edilmesi.","Su kalitesi uygunsuzluğu veya teknik risk durumunda havuzun kullanıma kapatılması kararının yetkili prosedüre göre alınması için derhal sorumluya haber verilmesi."]},{"harf":"E","baslik":"Kayıt ve bakım","maddeler":["Su ölçüm sonuçları ve teknik kontrollerin kayıtlarının tutulması.","Arızaların, bakım ihtiyaçlarının ve kullanılan kimyasalların ilgili kayıt sistemine işlenmesi.","Ölçüm cihazı arızaları ve teknik sorunların teknik şef veya havuz sorumlusuna bildirilmesi."]}]},{"ad":"TEKNİK MÜDÜR","bolumler":[{"harf":"A","baslik":"Teknik operasyon ve bakım","maddeler":["Otelin tüm teknik sistemlerine ilişkin günlük çalışma ve arıza raporlarının incelenmesi.","Elektrik, mekanik, HVAC, su, havuz ve diğer kritik sistemlerin bakım planlarının kontrol edilmesi.","Kritik ekipmanlar için önleyici bakım ve yedek parça planlarının güncel tutulmasının sağlanması.","Tekrarlayan arızaların kök nedenlerinin araştırılmasının ve kalıcı çözümlerin uygulanmasının sağlanması."]},{"harf":"B","baslik":"Güvenlik ve mevzuat","maddeler":["Teknik alanların ve ekipmanların iş güvenliği kurallarına uygunluğunun denetlenmesi.","Yangın algılama, acil aydınlatma ve diğer güvenlik sistemlerinin kontrol ve test takviminin takip edilmesi.","Elektrik ve mekanik sistemlerde yetkisiz müdahalelerin önlenmesinin sağlanması.","Teknik bakım ve test kayıtlarının ilgili mevzuat ve işletme prosedürlerine uygun tutulmasının denetlenmesi."]},{"harf":"C","baslik":"Enerji ve kaynak yönetimi","maddeler":["Elektrik, su, yakıt ve diğer enerji tüketimlerinin dönemsel analizinin yapılması.","Olağan dışı tüketim artışlarının nedenlerinin araştırılması.","Enerji verimliliği projelerinin maliyet ve geri dönüş açısından değerlendirilmesi.","Su kaçakları, ekipman verimsizliği ve kaynak kayıplarının azaltılmasına yönelik aksiyonların planlanması."]},{"harf":"D","baslik":"Ekip ve tedarikçi yönetimi","maddeler":["Teknik müdür yardımcıları, şefler ve teknik personelin görev dağılımının belirlenmesi.","Teknik ekibin eğitim, yetkinlik ve performans ihtiyaçlarının değerlendirilmesi.","Dış servis sağlayıcıların bakım sözleşmeleri ve hizmet performanslarının takip edilmesi.","Teknik yatırım ve yenileme taleplerinin önceliklendirilmesi."]},{"harf":"E","baslik":"Bütçe ve raporlama","maddeler":["Teknik servis bütçesi, bakım giderleri ve yedek parça maliyetlerinin takip edilmesi.","Kritik arızalar, iş emirleri ve bakım tamamlama oranlarının değerlendirilmesi.","Teknik sistemlerin hizmet sürekliliği ve risk durumunun üst yönetime raporlanması.","Teknik altyapı ve enerji verimliliği için yıllık iyileştirme planının hazırlanması."]}]},{"ad":"TEKNİK MÜDÜR YARDIMCISI","bolumler":[{"harf":"A","baslik":"Günlük teknik iş planı","maddeler":["Günlük teknik iş emirlerinin ve öncelikli arızaların kontrol edilmesi.","Teknik personelin görev dağılımının ve iş tamamlama takibinin yapılması.","Kritik ekipmanların çalışma durumunun bakım planına göre kontrol edilmesi.","Devam eden bakım ve onarım işlerinin takvim ve iş güvenliği açısından izlenmesi."]},{"harf":"B","baslik":"Arıza ve bakım takibi","maddeler":["Arıza bildirimlerinin doğru kategorize edilmesinin ve önceliklendirilmesinin sağlanması.","Teknik müdahalelerin iş emri üzerinden takip edilmesi.","Onarım sonrası ekipmanların güvenli çalışmasının doğrulanmasının sağlanması.","Tekrarlayan arızaların ve uzun süren iş emirlerinin nedenlerinin araştırılması.","Periyodik bakım planlarının zamanında uygulanmasının takip edilmesi."]},{"harf":"C","baslik":"Teknik sistem ve güvenlik","maddeler":["Elektrik, mekanik, klima ve su sistemlerinde tespit edilen kritik risklerin değerlendirilmesi.","Teknik alanlarda düzen, erişim ve iş güvenliği standartlarının kontrol edilmesi.","Yetkisiz müdahale risklerine karşı teknik odaların ve ekipmanların korunmasının sağlanması.","Acil durum sistemlerinin bakım ve test kayıtlarının takip edilmesi."]},{"harf":"D","baslik":"Malzeme ve ekip yönetimi","maddeler":["Yedek parça ve sarf malzeme ihtiyaçlarının belirlenmesi.","Teknik personelin ekipman ve kişisel koruyucu donanım kullanımının kontrol edilmesi.","Dış servis sağlayıcıların sahadaki işlerinin ve teslimatlarının takip edilmesi.","Teknik personelin performans ve eğitim ihtiyaçlarının belirlenmesi."]},{"harf":"E","baslik":"Raporlama","maddeler":["Günlük arıza ve bakım kayıtlarının eksiksiz tutulmasının sağlanması.","İş emri tamamlama süresi ve tekrar arıza oranlarının değerlendirilmesi.","Kritik arızalar, gecikmeler ve teknik risklerin teknik müdüre raporlanması."]}]},{"ad":"TEKNİK ŞEF","bolumler":[{"harf":"A","baslik":"İş emri ve ekip organizasyonu","maddeler":["Günlük arıza ve bakım iş emirlerinin kontrol edilmesi.","Teknik personelin uzmanlık alanlarına göre görevlendirilmesi.","Acil, yüksek öncelikli ve rutin işlerin doğru sıralanması.","İş emirlerinin tamamlanma sürelerinin ve açık işlerin takip edilmesi."]},{"harf":"B","baslik":"Teknik uygulama","maddeler":["Onarım öncesinde arızanın ve gerekli yedek parçaların değerlendirilmesi.","Teknik müdahalelerin üretici talimatları ve işletme prosedürlerine uygun yürütülmesinin kontrol edilmesi.","Onarım sonrası ekipmanın işlev ve güvenlik kontrollerinin yapılmasının sağlan i açısından değerlendirilmesi."]},{"harf":"E","baslik":"Performans ve raporlama","maddeler":["F&B şefleri ve kaptanlarının performans sonuçlarının değerlendirilmesi.","Misafir memnuniyeti, servis hızı ve kalite göstergelerinin takip edilmesi.","Günlük operasyonel sorunların ve iyileştirme ihtiyaçlarının kayıt altına alınması.","F&B müdürüne günlük performans, kritik sorunlar ve aksiyonlar hakkında rapor sunulması."]}]},{"ad":"YİYECEK İÇECEK MÜDÜRÜ","bolumler":[{"harf":"A","baslik":"Strateji ve operasyon yönetimi","maddeler":["Yiyecek içecek operasyonlarının işletme konsepti, bütçesi ve hizmet hedefleri doğrultusunda yönetilmesi.","Restoran, bar, banket ve diğer F&B noktalarının çalışma planlarının onaylanması.","Doluluk tahminleri ve misafir profiline göre servis kapasitesi ile personel planlamasının yapılması.","Menü, içecek konsepti ve hizmet standartlarının işletme stratejisiyle uyumunun değerlendirilmesi."]},{"harf":"B","baslik":"Misafir deneyimi ve kalite","maddeler":["Yiyecek ve içecek hizmetlerinde kalite ve sunum standartlarının tüm noktalarda uygulanmasının sağlanması.","Misafir şikâyetleri, anketleri ve çevrim içi geri bildirimlerin analiz edilmesi.","Servis süreleri, sipariş doğruluğu ve ürün bulunabilirliği göstergelerinin takip edilmesi.","Mutfak, restoran, bar ve diğer departmanlar arasındaki koordinasyonun geliştirilmesi."]},{"harf":"C","baslik":"Finansal ve maliyet kontrolü","maddeler":["F&B bütçesi, gelirleri, maliyetleri ve departman giderlerinin düzenli değerlendirilmesi.","Yiyecek ve içecek maliyet oranlarının hedeflerle karşılaştırılması.","Fire, stok kaybı ve tüketim sapmalarının analiz edilmesi.","Satın alma ve tedarikçi performansının maliyet ve kalite açısından değerlendirilmesi.","İş gücü maliyetlerinin servis kalitesi ve kapasite ihtiyaçlarıyla dengelenmesi."]},{"harf":"D","baslik":"Hijyen ve ekip yönetimi","maddeler":["Gıda güvenliği, hijyen ve iş güvenliği uygulamalarının ilgili yöneticilerle denetlenmesi.","F&B yöneticileri ve şeflerinin performanslarının değerlendirilmesi.","Personel eğitimleri, yetkinlik gelişimi ve kariyer planlarının desteklenmesi.","Servis ekipmanı, mutfak altyapısı ve diğer operasyonel ihtiyaçların yatırım planına alınması."]},{"harf":"E","baslik":"Raporlama ve gelişim","maddeler":["F&B performans göstergelerinin bütçe ve geçmiş dönemlerle karşılaştırmalı analiz edilmesi.","Operasyonel verimlilik, misafir memnuniyeti ve maliyet kontrolü için iyileştirme projelerinin yürütülmesi.","Departman performansı, riskler ve gelecek dönem ihtiyaçlarının genel müdüre raporlanması."]}]}];

// Organizasyon şemasındaki ad ile liste adı farklı olanlar (normalize edilmiş ad -> liste adı)
const POZISYON_TAKMA_ADLARI = {
  GARSON: "RESTAURANT GARSONU",
  "BAR MUDURU": "BAR YONETICISI",
  "MINI KLUB ANIMATORU": "MINI CLUB ANIMATORU",
  BOYACI: "TEKNIK SERVIS / BOYACI",
};

function pozAnahtar(ad) {
  const harita = { İ: "I", I: "I", ı: "I", Ş: "S", ş: "S", Ğ: "G", ğ: "G", Ü: "U", ü: "U", Ö: "O", ö: "O", Ç: "C", ç: "C" };
  return String(ad || "")
    .split("")
    .map((c) => harita[c] || c)
    .join("")
    .toUpperCase()
    .replace(/[^A-Z0-9 ]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

const POZISYON_INDEKSI = (() => {
  const m = {};
  POZISYON_LISTELERI.forEach((p) => {
    m[pozAnahtar(p.ad).replace(/ /g, "")] = p;
  });
  return m;
})();

// Kullanıcının Bölüm (pozisyon adı) alanına göre kendi kontrol listesini bulur; yoksa null.
function kullaniciPozisyonListesi(kullanici) {
  if (!kullanici || !kullanici.bolum) return null;
  const k = pozAnahtar(kullanici.bolum);
  const hedef = POZISYON_TAKMA_ADLARI[k] ? pozAnahtar(POZISYON_TAKMA_ADLARI[k]) : k;
  return POZISYON_INDEKSI[hedef.replace(/ /g, "")] || null;
}

// Pozisyon listesi olan kullanıcının kaydı kendisine özeldir ve oda bazlı sistem yerine geçer.
function odaBazliKullaniciMi(kullanici) {
  return !!(kullanici && DEPARTMAN_ODA_BAZLI[kullanici.department] && !kullaniciPozisyonListesi(kullanici));
}

// Günlük kayıt anahtarı: pozisyon listeli kullanıcıda kullanıcıya özel, diğerlerinde departman ortak.
function gunlukKayitAnahtari(kullanici, tarih) {
  return kullaniciPozisyonListesi(kullanici)
    ? `checklist:${kullanici.hotelCode}:${kullanici.department}:${kullanici.userCode}:${tarih}`
    : `checklist:${kullanici.hotelCode}:${kullanici.department}:${tarih}`;
}

function pozisyonGorevleriOlustur(poz) {
  const bolumler = poz.bolumler.map((b) => ({ harf: b.harf, baslik: b.baslik, maddeler: b.maddeler }));
  const gorevler = bolumlerdenGorevOlustur(bolumler).map((g) => ({ ...g, aciklamaZorunlu: true }));
  return gorevler;
}

// Bir departmanın toplam kontrol noktası sayısını döner (bölümlü ya da düz fark etmez).
function departmanToplamMaddeSayisi(department) {
  if (DEPARTMAN_BOLUMLERI[department]) {
    return DEPARTMAN_BOLUMLERI[department].reduce((toplam, b) => toplam + b.maddeler.length, 0);
  }
  return (DEPARTMAN_LISTELERI_CALISMA[department] || []).length;
}

// Bölümlü bir departman için düz (flat) görev dizisi üretir; her göreve
// hangi bölüme ait olduğu bilgisini (bolum harfi + başlığı) ekler.
function bolumlerdenGorevOlustur(bolumler) {
  const gorevler = [];
  let sayac = 1;
  bolumler.forEach((bolum) => {
    bolum.maddeler.forEach((madde) => {
      const isObj = typeof madde === "object" && madde !== null;
      const tip = isObj ? madde.tip || "evethayir" : "evethayir";
      const text = isObj ? madde.text : madde;
      const gorev = {
        id: sayac++,
        text,
        tip,
        status: null,
        zaman: null,
        aciklama: "",
        photo: null,
        bolum: bolum.harf,
        bolumBaslik: bolum.baslik,
      };
      if (tip === "sayisal") {
        const alanEtiketleri = (isObj && madde.alanlar) || [text];
        gorev.alanlar = alanEtiketleri.map((label) => ({ label, deger: "" }));
      }
      if (tip === "metin") {
        gorev.metinDeger = "";
      }
      gorevler.push(gorev);
    });
  });
  return gorevler;
}

function bolumluGorevleriOlustur(department) {
  return bolumlerdenGorevOlustur(DEPARTMAN_BOLUMLERI[department]);
}

// Bir görevin "tamamlandı" sayılıp sayılmayacağını, madde tipine göre belirler:
// - evethayir: OLUMLU/OLUMSUZ işaretlenmiş olması yeterli
// - sayisal: tüm alt alanlara değer girilmiş olması gerekir
// - metin: metin alanına bir şey yazılmış olması gerekir
function gorevTamamMi(t) {
  if (t.tip === "sayisal") {
    return (t.alanlar || []).every((a) => a.deger && a.deger.trim() !== "");
  }
  if (t.tip === "metin") {
    return !!(t.metinDeger && t.metinDeger.trim() !== "");
  }
  // Pozisyon listelerinde OLUMSUZ cevap açıklama girilmeden tamamlanmış sayılmaz.
  if (t.aciklamaZorunlu && t.status === "olumsuz") {
    return !!(t.aciklama && t.aciklama.trim() !== "");
  }
  return !!t.status;
}

// Bir günlük kaydın toplam "tamamlanan" ve "toplam" madde sayısını döner.
// Oda bazlı departmanlarda (record.odalar) tüm odalardaki maddeler toplanır;
// diğerlerinde doğrudan record.tasks kullanılır.
function kayitTamamlananSayisi(record) {
  if (!record) return 0;
  if (record.odalar) {
    return record.odalar.reduce((t, o) => t + o.gorevler.filter((g) => gorevTamamMi(g)).length, 0);
  }
  return (record.tasks || []).filter((t) => gorevTamamMi(t)).length;
}

function kayitToplamMaddeSayisi(record) {
  if (!record) return 0;
  if (record.odalar) {
    return record.odalar.reduce((t, o) => t + o.gorevler.length, 0);
  }
  return (record.tasks || []).length;
}

// Bir kullanıcının "bölüm" alanı varsa (örn. Teknik Servis'te sadece
// Elektrik'ten sorumlu), ilerleme sayımı da o kullanıcının kendi bölümüyle
// sınırlı tutulur. Pozisyon yoksa (veya bölümlü/oda bazlı olmayan bir
// departmansa) normal davranışa (departmanın tamamı) geri döner.
function kayitTamamlananSayisiKullanici(record, kullanici) {
  if (!record || !kullanici || !kullanici.bolum || !record.tasks || record.pozisyonKaydi) {
    return kayitTamamlananSayisi(record);
  }
  return record.tasks.filter((t) => t.bolum === kullanici.bolum && gorevTamamMi(t)).length;
}

function kayitToplamMaddeSayisiKullanici(record, kullanici) {
  if (!record || !kullanici || !kullanici.bolum || !record.tasks || record.pozisyonKaydi) {
    return kayitToplamMaddeSayisi(record);
  }
  return record.tasks.filter((t) => t.bolum === kullanici.bolum).length;
}

// Bir departman + harf kodundan bölüm başlığını bulur (örn. "Teknik Servis","A" -> "Elektrik Sistemleri").
function bolumBasligiBul(department, harf) {
  const bolum = (DEPARTMAN_BOLUMLERI[department] || []).find((b) => b.harf === harf);
  return bolum ? bolum.baslik : harf;
}

// Kullanıcı kodları oteller arasında tekrar edebildiği için anahtar "otel:kullanıcı" biçimindedir.
const KULLANICI_LOGOLARI = {
  "5556:1113": PERGE_LOGO_B64, // Ercan (Genel Müdürlük)
};
// Otelin tüm kullanıcılarının göreceği logolar.
const OTEL_LOGOLARI = {
  "5557": SIDERA_LOGO_B64, // Sidera Kirman Premium
};
function logoBul(otelKodu, kullaniciKodu) {
  return KULLANICI_LOGOLARI[`${otelKodu}:${kullaniciKodu}`] || OTEL_LOGOLARI[otelKodu] || null;
}
// PNG başlığından en/boy oranı (logo yatay ya da kare olabilir)
function logoOrani(b64) {
  try {
    const b = atob(b64.slice(0, 40));
    const w = (b.charCodeAt(16) << 24) | (b.charCodeAt(17) << 16) | (b.charCodeAt(18) << 8) | b.charCodeAt(19);
    const h = (b.charCodeAt(20) << 24) | (b.charCodeAt(21) << 16) | (b.charCodeAt(22) << 8) | b.charCodeAt(23);
    return w > 0 && h > 0 ? w / h : 1;
  } catch (e) {
    return 1;
  }
}

async function safeGet(key, shared) {
  try {
    const res = await window.storage.get(key, shared);
    return res || null;
  } catch (e) {
    return null;
  }
}

function bugunTarihi() {
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${yyyy}-${mm}-${dd}`;
}

function pencereDurumu(department) {
  const pencere = DEPARTMAN_ZAMAN_PENCERELERI[department];
  if (ZAMANLAMA_DEVRE_DISI || !pencere) return "aktif";
  const simdi = new Date();
  const saat = simdi.getHours() + simdi.getMinutes() / 60;
  if (saat < pencere.baslangic) return "once";
  if (saat >= pencere.bitis) return "sonra";
  return "aktif";
}

function formatTarih(iso) {
  const d = new Date(iso);
  return d.toLocaleString("tr-TR", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function saatGectiMi(saatStr) {
  const [h, m] = saatStr.split(":").map(Number);
  const simdi = new Date();
  const hedef = new Date();
  hedef.setHours(h, m, 0, 0);
  return simdi >= hedef;
}

// PDF'e fotoğraf eklenebilmesi için imzalı depo adreslerini data-URL'ye çevirir.
async function fotograflariGomuluYap(kayit) {
  const coz = async (foto) => {
    if (!foto || String(foto).startsWith("data:")) return foto;
    try {
      return await window.OtelDepo.dataUrlYap(foto);
    } catch (e) {
      return null; // fotoğraf alınamazsa PDF yine de oluşsun
    }
  };
  const k = { ...kayit };
  if (Array.isArray(k.tasks)) {
    k.tasks = await Promise.all(k.tasks.map(async (t) => (t && t.photo ? { ...t, photo: await coz(t.photo) } : t)));
  }
  if (Array.isArray(k.odalar)) {
    k.odalar = await Promise.all(
      k.odalar.map(async (o) => ({
        ...o,
        gorevler: await Promise.all(
          (o.gorevler || []).map(async (g) => (g && g.photo ? { ...g, photo: await coz(g.photo) } : g))
        ),
      }))
    );
  }
  return k;
}

function formatTarihSadece(dateStr) {
  const [y, m, d] = dateStr.split("-");
  return `${d}.${m}.${y}`;
}

// ---- Sürüm denetimi ve güncelleme ----
// Sürüm numarası derleme sırasında gömülür; GitHub'daki version.json ile karşılaştırılır.
const UYGULAMA_SURUMU = (typeof window !== "undefined" && window.UYGULAMA_SURUMU) || "";
let bekleyenSurum = null;
const surumDinleyicileri = new Set();

async function surumDenetle() {
  // true: yeni sürüm var, false: güncel, null: denetlenemedi (çevrimdışı vb.)
  if (!UYGULAMA_SURUMU) return null;
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return null;
    const j = await r.json();
    if (!j || !j.surum) return null;
    if (String(j.surum) !== String(UYGULAMA_SURUMU)) {
      bekleyenSurum = String(j.surum);
      surumDinleyicileri.forEach((f) => f());
      return true;
    }
    return false;
  } catch (e) {
    return null;
  }
}

// Yalnızca uygulamanın kendi depolama alanını temizler (önbellek, service worker, yerel veri) ve sayfayı sıfırdan yükler.
// Giriş oturumu (sb- ile başlayan anahtarlar) korunur; veriler zaten sunucudadır.
async function uygulamayiGuncelle(yeni) {
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      const kayitlar = await navigator.serviceWorker.getRegistrations();
      await Promise.all(kayitlar.map((k) => k.unregister()));
    }
  } catch (e) {}
  try {
    if (window.caches) {
      const adlar = await caches.keys();
      await Promise.all(adlar.map((a) => caches.delete(a)));
    }
  } catch (e) {}
  try {
    Object.keys(localStorage)
      .filter((k) => k.indexOf("sb-") !== 0)
      .forEach((k) => localStorage.removeItem(k));
  } catch (e) {}
  try {
    sessionStorage.clear();
  } catch (e) {}
  try {
    if (indexedDB && indexedDB.databases) {
      const dbler = await indexedDB.databases();
      dbler.forEach((d) => d.name && indexedDB.deleteDatabase(d.name));
    }
  } catch (e) {}
  window.location.replace(window.location.pathname + "?s=" + encodeURIComponent(yeni || Date.now()));
}

function GuncellemeUyarisi() {
  const [, yenile] = useState(0);
  const [isleniyor, setIsleniyor] = useState(false);
  useEffect(() => {
    try {
      if (window.location.search.indexOf("s=") !== -1) {
        window.history.replaceState(null, "", window.location.pathname); // adres çubuğunu temizle
      }
    } catch (e) {}
    const f = () => yenile((n) => n + 1);
    surumDinleyicileri.add(f);
    surumDenetle();
    const zaman = setInterval(surumDenetle, 5 * 60 * 1000);
    const gorunur = () => {
      if (document.visibilityState === "visible") surumDenetle();
    };
    document.addEventListener("visibilitychange", gorunur);
    return () => {
      surumDinleyicileri.delete(f);
      clearInterval(zaman);
      document.removeEventListener("visibilitychange", gorunur);
    };
  }, []);
  if (!bekleyenSurum) return null;
  return (
    <div
      style={{
        position: "fixed", top: 0, left: 0, right: 0, zIndex: 9999, background: "#b45309", color: "#fff",
        padding: "10px 14px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10,
        fontSize: 14, boxShadow: "0 2px 8px rgba(0,0,0,.3)",
      }}
    >
      <span>🔔 Yeni sürüm var (v{bekleyenSurum})</span>
      <button
        disabled={isleniyor}
        onClick={() => {
          setIsleniyor(true);
          uygulamayiGuncelle(bekleyenSurum);
        }}
        style={{ background: "#fff", color: "#b45309", border: "none", borderRadius: 8, padding: "8px 14px", fontWeight: 700, fontSize: 14 }}
      >
        {isleniyor ? "Güncelleniyor…" : "GÜNCELLE"}
      </button>
    </div>
  );
}

function SurumAlani() {
  const [durum, setDurum] = useState("");
  return (
    <div style={{ textAlign: "center", fontSize: 12, opacity: 0.7, marginTop: 14 }}>
      Sürüm {UYGULAMA_SURUMU ? "v" + UYGULAMA_SURUMU : "-"}
      {UYGULAMA_SURUMU && (
        <>
          {" · "}
          <span
            style={{ textDecoration: "underline", cursor: "pointer" }}
            onClick={async () => {
              setDurum("Denetleniyor…");
              const r = await surumDenetle();
              setDurum(r === false ? "Güncelsiniz ✓" : r === null ? "Denetlenemedi" : "");
            }}
          >
            Güncellemeyi denetle
          </span>
          {durum ? " · " + durum : ""}
        </>
      )}
    </div>
  );
}

  const [uyandirmaGeciken, setUyandirmaGeciken] = useState([]);

        .filter(uynZamaniGeldiMi)
        .sort((a, b) => uynPlanZamani(a) - uynPlanZamani(b));
      setUyandirmaGeciken(geciken);
      if (geciken.length > oncekiUyandirmaSayisi.current) uynBipSesi();
      oncekiUyandirmaSayisi.current = geciken.length;
    }
    kontrolEt();
    const id = setInterval(kontrolEt, 20000);
    return () => {

  async function bekleyenGorevleriGetir(user) {
    try {
      const liste = await window.storage.list(`gorev:${user.hotelCode}:${user.userCode}:`, true);
      const keyler = (liste && liste.keys) || [];
      const gorevler = [];
      for (const k of keyler) {
        const r = await safeGet(k, true);
        if (r) {
          try {
            const veri = JSON.parse(r.value);
            if (veri.durum === "bekliyor") gorevler.push({ ...veri, key: k });
          } catch (e) {}
        }
      }
      setBekleyenGorevler(gorevler);
    } catch (e) {}
  }

  async function gorevKabulEt(gorev) {

  async function bugununKaydiniYukle(user) {
    setKayitYukleniyor(true);
    const tarih = bugunTarihi();
    const key = gunlukKayitAnahtari(user, tarih);
    const pozListesi = kullaniciPozisyonListesi(user);
    let mevcut = null;
    try {
      mevcut = await window.storage.get(key, true);
    } catch (e) {
      // "Kayıt yok" ile "sunucuya ulaşılamadı" karıştırılmaz: ulaşılamıyorsa
      // boş kayıt açıp mevcut kaydın üzerine yazmayız.
      setListeHatasi("Bağlantı hatası: bugünün kaydı yüklenemedi. İnternetinizi kontrol edip uygulamayı yeniden açın.");
      toastGoster("⚠ Bağlantı hatası: bugünün kaydı yüklenemedi");
      setRecord(null);
      setKayitYukleniyor(false);
      return;
    }
    const odaBazliMi = odaBazliKullaniciMi(user);

    if (mevcut) {
      const veri = JSON.parse(mevcut.value);
      const uyumlu = pozListesi
        ? !!(veri.pozisyonKaydi && veri.pozisyonKaydi.ad === pozListesi.ad && Array.isArray(veri.tasks) && veri.tasks.length === 20)
        : odaBazliMi
        ? Array.isArray(veri.odalar)
        : veri.tasks && !veri.pozisyonKaydi && veri.tasks.length === departmanToplamMaddeSayisi(user.department);
      if (uyumlu) {
        if (!odaBazliMi) {
          veri.tasks = veri.tasks.map((t) => ({ zaman: null, ...t }));
        }
        veri.remindedTasks = veri.remindedTasks || [];
        setRecord(veri);
        setKayitYukleniyor(false);
        return;
      }
      // Kontrol listesi güncellendiği için (madde sayısı değişti), bu güne ait
      // eski kayıt yeni şablona göre sıfırdan oluşturuluyor.
    }

    const temelKayit = {
      key,
      date: tarih,
      hotelCode: user.hotelCode,
      hotelName: user.hotelName,
      department: user.department,
      userCode: user.userCode,
      userName: user.name,
      remindedTasks: [],
      tamamlandiMi: false,
      tamamlanmaZamani: null,
      sonGuncelleme: new Date().toISOString(),
    };

    if (odaBazliMi) {
      // Oda bazlı departmanlarda her gün boş bir "kontrol noktası" listesiyle
      // başlanır; kullanıcı o gün hangi odaları kontrol edecekse kendisi ekler.
      setRecord({ ...temelKayit, odalar: [] });
      setKayitYukleniyor(false);
      return;
    }

    if (pozListesi) {
      setRecord({
        ...temelKayit,
        pozisyonKaydi: { ad: pozListesi.ad, bolumler: pozListesi.bolumler.map((b) => ({ harf: b.harf, baslik: b.baslik })) },
        tasks: pozisyonGorevleriOlustur(pozListesi),
      });
      setKayitYukleniyor(false);
      return;
    }

    const guncelMaddeSayisi = departmanToplamMaddeSayisi(user.department);
    if (guncelMaddeSayisi === 0) {
      setRecord(null);
      setKayitYukleniyor(false);
      return;
    }

    const yeniTasks = DEPARTMAN_BOLUMLERI[user.department]
      ? bolumluGorevleriOlustur(user.department)
      : DEPARTMAN_LISTELERI_CALISMA[user.department].map((text, i) => ({
          id: i + 1,
          text,
          status: null,
          zaman: null,
          aciklama: "",
          photo: null,
        }));

    setRecord({ ...temelKayit, tasks: yeniTasks });
    setKayitYukleniyor(false);
  }

  // Otomatik kaydetme: kontrol listesi ekranındayken her değişiklikte
  // kısa bir gecikmeyle arka planda kaydeder. "Bitir" tuşuna basılmasa da
  // veriler kaybolmaz; 08:00-16:00 arasında istediği zaman kaldığı yerden devam edebilir.
  useEffect(() => {
    if (!record || screen !== "checklist") return;
    if (autosaveTimer.current) clearTimeout(autosaveTimer.current);
    autosaveTimer.current = setTimeout(() => {
      window.storage.set(
        record.key,
        JSON.stringify({ ...record, sonGuncelleme: new Date().toISOString() }),
        true
      ).catch(() => toastGoster("⚠ Kaydedilemedi: bağlantıyı kontrol edin"));
    }, 600);
    return () => clearTimeout(autosaveTimer.current);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [record]);

  // Saatli hatırlatma kontrolü: HATIRLATMALAR'da tanımlı bir madde, tanımlı
  // saati geçtiği halde hâlâ işaretlenmediyse bir kere bildirim gönderir.
  // NOT: Bu bildirim yalnızca uygulama açıkken (ön planda ya da arka plan
  // sekmesinde) çalışır; tarayıcı tamamen kapalıyken gerçek bir OS alarmı
  // gibi çalışmaz (bunun için sunucu taraflı push bildirimi gerekir).
  useEffect(() => {
    if (!record || !record.tasks) return;
    const hatirlatmalar = record.pozisyonKaydi ? null : HATIRLATMALAR[record.department];
    if (!hatirlatmalar) return;
    const zatenBildirilenler = record.remindedTasks || [];
    const yeniBildirilecekler = [];
    record.tasks.forEach((t) => {
      const saat = hatirlatmalar[t.id];
      if (saat && !t.status && saatGectiMi(saat) && !zatenBildirilenler.includes(t.id)) {
        yeniBildirilecekler.push({ id: t.id, text: t.text, saat });
      }
    });
    if (yeniBildirilecekler.length === 0) return;

    yeniBildirilecekler.forEach((b) => {
      if (typeof Notification !== "undefined" && Notification.permission === "granted") {
        try {
          new Notification("Kontrol Hatırlatması", {
            body: `"${b.text}" maddesi saat ${b.saat} itibarıyla tamamlanmış olmalıydı, henüz işaretlenmedi.`,
            icon: "icon-192-v2.png",
          });
        } catch (e) {}
      }
      telegramMesajGonder(
        `⏰ Kontrol Hatırlatması\n${record.hotelName} — ${record.department}\n\nMadde ${b.id}: ${b.text}\n\nSaat ${b.saat} itibarıyla tamamlanmış olmalıydı, henüz işaretlenmedi.`
      );
    });

    setRecord((prev) => ({
      ...prev,
      remindedTasks: [...(prev.remindedTasks || []), ...yeniBildirilecekler.map((b) => b.id)],
    }));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [record]);

  // Kat Hizmetleri kullanıcıları için, Genel Müdürlük'ten yeni bir oda görevi
  // gelip gelmediğini periyodik olarak kontrol eder (uygulama açıkken).
  useEffect(() => {
    if (!currentUser || !odaBazliKullaniciMi(currentUser)) return;
    bekleyenGorevleriGetir(currentUser);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [tick]);

  function setStatus(id, status) {
    setRecord((prev) => ({
      ...prev,
      tasks: prev.tasks.map((t) => {
        if (t.id !== id) return t;
        const yeniDurum = t.status === status ? null : status;
        return {
          ...t,
          status: yeniDurum,
          zaman: yeniDurum ? new Date().toLocaleTimeString("tr-TR", { hour12: false }) : null,
          isaretleyen: yeniDurum && currentUser ? currentUser.name : null,
        };
      }),
    }));
  }

  function setAciklama(id, value) {
    setRecord((prev) => ({
      ...prev,
      tasks: prev.tasks.map((t) => (t.id === id ? { ...t, aciklama: value } : t)),
    }));
  }

  function setSayisalDeger(id, alanIndex, value) {
    const temiz = value.replace(/\D/g, "").slice(0, 3);
    setRecord((prev) => ({
      ...prev,
      tasks: prev.tasks.map((t) =>
        t.id === id
          ? { ...t, alanlar: t.alanlar.map((a, i) => (i === alanIndex ? { ...a, deger: temiz } : a)) }
          : t
      ),
    }));
  }

  function setMetinDeger(id, value) {
    const temiz = value.slice(0, 50);
    setRecord((prev) => ({
      ...prev,
      tasks: prev.tasks.map((t) => (t.id === id ? { ...t, metinDeger: temiz } : t)),
    }));
  }

  // --- Oda bazlı (Kat Hizmetleri) departmanlar için ---

  function odaEkle(odaKodu, ekstra) {
    setRecord((prev) => {
      const mevcutOdalar = prev.odalar || [];
      if (mevcutOdalar.length >= ODA_BAZLI_MAX_NOKTA) return prev;
      if (mevcutOdalar.some((o) => o.oda === odaKodu)) return prev;
      const yeniOda = {
        oda: odaKodu,
        gorevler: bolumlerdenGorevOlustur(KAT_HIZMETLERI_BOLUMLER),
        ...(ekstra || {}),
      };
      return { ...prev, odalar: [...mevcutOdalar, yeniOda] };
    });
  }

  function odaGorevDurumAyarla(odaKodu, gorevId, status) {
    setRecord((prev) => ({
      ...prev,
      odalar: prev.odalar.map((o) => {
        if (o.oda !== odaKodu) return o;
        return {
          ...o,
          gorevler: o.gorevler.map((g) => {
            if (g.id !== gorevId) return g;
            const yeniDurum = g.status === status ? null : status;
            return {
              ...g,
              status: yeniDurum,
              zaman: yeniDurum ? new Date().toLocaleTimeString("tr-TR", { hour12: false }) : null,
              isaretleyen: yeniDurum && currentUser ? currentUser.name : null,
            };
          }),
        };
      }),
    }));
  }

  function odaGorevAciklamaAyarla(odaKodu, gorevId, value) {
    setRecord((prev) => ({
      ...prev,
      odalar: prev.odalar.map((o) =>
        o.oda !== odaKodu
          ? o
          : { ...o, gorevler: o.gorevler.map((g) => (g.id === gorevId ? { ...g, aciklama: value } : g)) }
      ),
    }));
  }

  function odaGorevFotoAyarla(odaKodu, gorevId, dataUrl) {
    setRecord((prev) => ({
      ...prev,
      odalar: prev.odalar.map((o) =>
        o.oda !== odaKodu
          ? o
          : { ...o, gorevler: o.gorevler.map((g) => (g.id === gorevId ? { ...g, photo: dataUrl } : g)) }
      ),
    }));
  }

  function handleOdaFotoSecildi(odaKodu, gorevId, file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 700;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.6);
        odaGorevFotoAyarla(odaKodu, gorevId, dataUrl);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function removePhoto(id) {
    setRecord((prev) => ({
      ...prev,
      tasks: prev.tasks.map((t) => (t.id === id ? { ...t, photo: null } : t)),
    }));
  }

  function handlePhotoSelect(id, file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 700;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.6);
        setRecord((prev) => ({
          ...prev,
          tasks: prev.tasks.map((t) => (t.id === id ? { ...t, photo: dataUrl } : t)),
        }));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
