<style>
  html, body { margin: 0; padding: 0; background: #EDEAE2; min-height: 100%; font-family: sans-serif; }

  #hataKutusu {
    display: none;
    max-width: 600px;
    margin: 24px auto;

    border: 1px solid #E3B7AA;

  }
  #hataKutusu b { display:block; margin-bottom:6px; font-size:14px; }

<div id="hataKutusu"><b>Bir hata oluştu:</b><span id="hataMetni"></span></div>

<script>
/* ===== Supabase depolama katmanı + giriş (window.storage ve window.OtelAuth) ===== */
window.UYGULAMA_SURUMU = "1.11";
(function () {
  var SB_URL = "https://sxudiskddwgdmuidchzm.supabase.co";
  var SB_KEY = "sb_publishable_PYTHyoTYqLWrU2rxuGq57w_owrx_qOq"; // yalnızca publishable/anon anahtar; secret key ASLA buraya yazılmaz
  var EPOSTA_ALANI = "otel.example.com";
  var istemci = null;

  function sb() {
    if (istemci) return istemci;
    if (!window.supabase || !window.supabase.createClient) {
      throw new Error("Veritabanı kütüphanesi yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.");
    }
    istemci = window.supabase.createClient(SB_URL, SB_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
    });
    return istemci;
  }

  // ---- kısa ömürlü önbellek: list() ile gelen değerler hemen ardından yapılan get() çağrılarında yeniden istenmez ----
  var onbellek = new Map();
  var OMUR_MS = 4000;
  function oYaz(key, str) { onbellek.set(key, { t: Date.now(), value: str }); }
  function oOku(key) {
    var e = onbellek.get(key);
    return e && Date.now() - e.t < OMUR_MS ? e : null;
  }

  function anahtarOtel(key) {
    if (key.indexOf("ozeldept:") === 0) return "*"; // tüm otellerde ortak şablonlar
    var p = key.split(":");
    if (/^\d{4}$/.test(p[1] || "")) return p[1];
    throw new Error("Bilinmeyen kayıt anahtarı: " + key);
  }
  // ---- Fotoğraf deposu (Supabase Storage, özel kova "fotograflar") ----
  // Uygulamanın geri kalanı fotoğrafı hâlâ "data:image/..." olarak üretir/gösterir.
  // Kayıt yazılırken data-URL'ler depoya yüklenip "depo:<yol>" referansına çevrilir;
  // kayıt okunurken referanslar 12 saatlik imzalı adreslere çevrilir (img etiketi doğrudan gösterir).
  var KOVA = "fotograflar";
  var IMZA_SN = 43200;
  var imzaOnbellek = new Map(); // yol -> { url, t }
  var yuklenenler = new Map(); // otel|dataUrl -> "depo:yol"

  function imzaYolu(s) {
    var m = /\/object\/sign\/fotograflar\/([^?]+)\?/.exec(s);
    return m ? decodeURIComponent(m[1]) : null;
  }
  async function ozetHex(buf) {
    if (window.crypto && window.crypto.subtle) {
      var h = await window.crypto.subtle.digest("SHA-256", buf);
      return Array.prototype.map.call(new Uint8Array(h), function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
    }
    return Date.now().toString(16) + Math.random().toString(16).slice(2);
  }
  async function fotoYukle(otel, dataUrl) {
    var onceki = yuklenenler.get(otel + "|" + dataUrl);
    if (onceki) return onceki;
    var blob = await (await fetch(dataUrl)).blob();
    var yol = otel + "/" + (await ozetHex(await blob.arrayBuffer())) + ".jpg";
    var r = await sb().storage.from(KOVA).upload(yol, blob, { contentType: blob.type || "image/jpeg", upsert: false });
    if (r.error) {
      var m = (r.error.message || "") + " " + (r.error.statusCode || "") + " " + (r.error.status || "");
      if (!/exists|duplicate|409/i.test(m)) throw new Error("Fotoğraf yüklenemedi: " + hataMesaji(r.error));
    }
    var ref = "depo:" + yol;
    yuklenenler.set(otel + "|" + dataUrl, ref);
    return ref;
  }
  async function fotolariYukle(deger, otel) {
    if (typeof deger === "string") {
      if (deger.indexOf("data:image/") === 0) return await fotoYukle(otel, deger);
      if (deger.indexOf("http") === 0) {
        var p = imzaYolu(deger); // imzalı adres geri yazılırsa referansa dönüştür
        if (p) return "depo:" + p;
      }
      return deger;
    }
    if (Array.isArray(deger)) {
      var d = [];
      for (var i = 0; i < deger.length; i++) d.push(await fotolariYukle(deger[i], otel));
      return d;
    }
    if (deger && typeof deger === "object") {
      var o = {};
      for (var k in deger) o[k] = await fotolariYukle(deger[k], otel);
      return o;
    }
    return deger;
  }
  function depoYollari(deger, kume) {
    if (typeof deger === "string") { if (deger.indexOf("depo:") === 0) kume[deger.slice(5)] = 1; }
    else if (Array.isArray(deger)) deger.forEach(function (x) { depoYollari(x, kume); });
    else if (deger && typeof deger === "object") Object.keys(deger).forEach(function (k) { depoYollari(deger[k], kume); });
  }
  async function imzaYenile(yollar) {
    var esik = (IMZA_SN - 3600) * 1000;
    var eksik = yollar.filter(function (y) { var e = imzaOnbellek.get(y); return !e || Date.now() - e.t > esik; });
    if (!eksik.length) return;
    var r = await sb().storage.from(KOVA).createSignedUrls(eksik, IMZA_SN);
    if (r.error) throw new Error(hataMesaji(r.error));
    r.data.forEach(function (x) { if (x.signedUrl && x.path) imzaOnbellek.set(x.path, { url: x.signedUrl, t: Date.now() }); });
  }
  function depoCoz(deger) {
    if (typeof deger === "string") {
      if (deger.indexOf("depo:") === 0) { var e = imzaOnbellek.get(deger.slice(5)); return e ? e.url : deger; }
      return deger;
    }
    if (Array.isArray(deger)) return deger.map(depoCoz);
    if (deger && typeof deger === "object") { var o = {}; Object.keys(deger).forEach(function (k) { o[k] = depoCoz(deger[k]); }); return o; }
    return deger;
  }
  async function okumaHazirla(degerler) {
    var kume = {};
    degerler.forEach(function (v) { depoYollari(v, kume); });
    var yollar = Object.keys(kume);
    if (yollar.length) await imzaYenile(yollar);
  }

  function likeKacis(s) { return s.replace(/[\\%_]/g, "\\$&"); }
  function hataMesaji(e) { return (e && e.message) || String(e); }

  // ---- kullanıcı / otel kayıtları sanaldır: profiles ve hotels tablolarından okunur (şifre YOKTUR) ----
  function profilKaydi(p) {
    var k = { hotelCode: p.hotel_code, userCode: p.user_code, name: p.name, department: p.department };
    if (p.bolum) k.bolum = p.bolum;
    if (p.pozisyon) k.pozisyon = p.pozisyon;
    return k;
  }
  async function sanalKullanicilar(prefix) {
    var r = await sb().from("profiles").select("hotel_code,user_code,name,department,bolum,pozisyon").eq("active", true);
    if (r.error) throw new Error(hataMesaji(r.error));
    var keys = [];
    r.data.forEach(function (p) {
      var key = "users:" + p.hotel_code + ":" + p.user_code;
      if (key.indexOf(prefix) !== 0) return;
      oYaz(key, JSON.stringify(profilKaydi(p)));
      keys.push(key);
    });
    return { keys: keys, prefix: prefix };
  }
  async function sanalOteller(prefix) {
    var r = await sb().from("hotels").select("code,name").eq("active", true);
    if (r.error) throw new Error(hataMesaji(r.error));
    var keys = [];
    r.data.forEach(function (h) {
      var key = "hotels:" + h.code;
      if (key.indexOf(prefix) !== 0) return;
      oYaz(key, JSON.stringify({ code: h.code, name: h.name }));
      keys.push(key);
    });
    return { keys: keys, prefix: prefix };
  }

  window.storage = {
    async get(key) {
      var c = oOku(key);
      if (c) return { key: key, value: c.value };
      var p = key.split(":");
      if (p[0] === "users" && p.length === 3) {
        var u = await sb().from("profiles").select("hotel_code,user_code,name,department,bolum,pozisyon")
          .eq("hotel_code", p[1]).eq("user_code", p[2]).eq("active", true).maybeSingle();
        if (u.error) throw new Error(hataMesaji(u.error));
        return u.data ? { key: key, value: JSON.stringify(profilKaydi(u.data)) } : null;
      }
      if (p[0] === "hotels" && p.length === 2) {
        var h = await sb().from("hotels").select("code,name").eq("code", p[1]).maybeSingle();
        if (h.error) throw new Error(hataMesaji(h.error));
        return h.data ? { key: key, value: JSON.stringify(h.data) } : null;
      }
      var r = await sb().from("kv_store").select("value").eq("hotel_code", anahtarOtel(key)).eq("key", key).maybeSingle();
      if (r.error) throw new Error(hataMesaji(r.error)); // "kayıt yok" ile "ulaşılamadı" ASLA karıştırılmaz
      if (!r.data) return null;
      await okumaHazirla([r.data.value]);
      var s = JSON.stringify(depoCoz(r.data.value));
      oYaz(key, s);
      return { key: key, value: s };
    },

    async set(key, value) {
      if (key.indexOf("users:") === 0 || key.indexOf("hotels:") === 0) {
        throw new Error("Kullanıcı ve otel kayıtları bu sürümde uygulamadan değiştirilemez (güvenlik gereği sunucu tarafında yönetilir).");
      }
      var otel = anahtarOtel(key);
      var govde = JSON.parse(value);
      if (otel !== "*") govde = await fotolariYukle(govde, otel); // fotoğraflar depoya, kayda yalnızca referans
      var r = await sb().rpc("kv_set", {
        p_hotel: otel, p_key: key, p_value: govde, p_expected: null,
      });
      if (r.error) throw new Error(hataMesaji(r.error));
      oYaz(key, value);
      return { key: key, value: value };
    },

    async delete(key) {
      var r = await sb().from("kv_store").delete().eq("hotel_code", anahtarOtel(key)).eq("key", key);
      if (r.error) throw new Error(hataMesaji(r.error));
      onbellek.delete(key);
      return { key: key, deleted: true };
    },

    async list(prefix) {
      prefix = prefix || "";
      if (prefix.indexOf("users:") === 0) return sanalKullanicilar(prefix);
      if (prefix.indexOf("hotels:") === 0) return sanalOteller(prefix);
      var r = await sb().from("kv_store").select("key,value")
        .eq("hotel_code", anahtarOtel(prefix)).like("key", likeKacis(prefix) + "%").limit(1000);
      if (r.error) throw new Error(hataMesaji(r.error));
      await okumaHazirla(r.data.map(function (x) { return x.value; }));
      var keys = r.data.map(function (x) { oYaz(x.key, JSON.stringify(depoCoz(x.value))); return x.key; });
      return { keys: keys, prefix: prefix };
    },
  };

  // ---- Giriş / oturum ----
  async function profilYukle() {
    var s = await sb().auth.getSession();
    var oturum = s.data && s.data.session;
    if (!oturum) return null;
    var r = await sb().from("profiles")
      .select("hotel_code,user_code,name,department,bolum,pozisyon,is_admin,active,must_change_pin")
      .eq("id", oturum.user.id).maybeSingle();
    if (r.error) throw new Error(hataMesaji(r.error));
    if (!r.data || !r.data.active) {
      await sb().auth.signOut();
      return null;
    }
    var h = await sb().from("hotels").select("name").eq("code", r.data.hotel_code).maybeSingle();
    var p = r.data;
    return {
      hotelCode: p.hotel_code, userCode: p.user_code, name: p.name, department: p.department,
      bolum: p.bolum || undefined, pozisyon: p.pozisyon || undefined,
      hotelName: (h.data && h.data.name) || p.hotel_code,
      isAdmin: !!p.is_admin, mustChangePin: !!p.must_change_pin,
    };
  }

  function pinZayifMi(pin) {
    return /^(\d)\1{5}$/.test(pin) || "0123456789".indexOf(pin) >= 0 || "9876543210".indexOf(pin) >= 0;
  }

  window.OtelAuth = {
    pinZayifMi: pinZayifMi,
    async restore() {
      try { return await profilYukle(); } catch (e) { return null; }
    },
    async signIn(otel, kod, pin) {
      var r = await sb().auth.signInWithPassword({ email: otel + "-" + kod + "@" + EPOSTA_ALANI, password: pin });
      if (r.error) {
        var m = (r.error.message || "").toLowerCase();
        if (r.error.status === 429 || m.indexOf("rate") >= 0) throw new Error("Çok fazla deneme yapıldı. Lütfen birkaç dakika bekleyin.");
        if (m.indexOf("invalid") >= 0 || r.error.status === 400) throw new Error("Otel kodu, kullanıcı kodu veya PIN hatalı.");
        throw new Error("Bağlantı hatası. İnternetinizi kontrol edip tekrar deneyin.");
      }
      var kullanici = await profilYukle();
      if (!kullanici) throw new Error("Bu kullanıcı pasif veya tanımlı değil. Yöneticinize başvurun.");
      return kullanici;
    },
    async changePin(yeni) {
      if (!/^\d{6}$/.test(yeni)) throw new Error("PIN 6 haneli rakamlardan oluşmalıdır.");
      if (pinZayifMi(yeni)) throw new Error("Çok kolay bir PIN (örn. 111111, 123456). Başka bir PIN seçin.");
      var r = await sb().auth.updateUser({ password: yeni });
      if (r.error) {
        if ((r.error.message || "").toLowerCase().indexOf("different") >= 0) throw new Error("Yeni PIN, geçici PIN'den farklı olmalıdır.");
        throw new Error("PIN değiştirilemedi: " + hataMesaji(r.error));
      }
      var r2 = await sb().rpc("pin_degistirildi");
      if (r2.error) throw new Error("PIN değişti ama kayıt güncellenemedi: " + hataMesaji(r2.error));
    },
    // Gönüllü PIN değişimi: önce mevcut PIN doğrulanır (başkası açık bir telefondan değiştiremesin)
    async changePinWithCurrent(mevcut, yeni) {
      if (!/^\d{6}$/.test(mevcut)) throw new Error("Mevcut PIN 6 haneli olmalıdır.");
      var oturum = await sb().auth.getSession();
      var email = oturum.data && oturum.data.session && oturum.data.session.user.email;
      if (!email) throw new Error("Oturum bulunamadı. Lütfen yeniden giriş yapın.");
      var d = await sb().auth.signInWithPassword({ email: email, password: mevcut });
      if (d.error) {
        var m = (d.error.message || "").toLowerCase();
        if (d.error.status === 429 || m.indexOf("rate") >= 0) throw new Error("Çok fazla deneme yapıldı. Lütfen birkaç dakika bekleyin.");
        if (m.indexOf("invalid") >= 0 || d.error.status === 400) throw new Error("Mevcut PIN hatalı.");
        throw new Error("Bağlantı hatası. İnternetinizi kontrol edip tekrar deneyin.");
      }
      if (mevcut === yeni) throw new Error("Yeni PIN, mevcut PIN'den farklı olmalıdır.");
      await window.OtelAuth.changePin(yeni);
    },
    async signOut() {
      onbellek.clear();
      try { await sb().auth.signOut(); } catch (e) {}
    },
  };

  // PDF için: imzalı fotoğraf adresini data-URL'ye çevirir (jsPDF adresten resim ekleyemez)
  window.OtelDepo = {
    async dataUrlYap(url) {
      var blob = await (await fetch(url)).blob();
      return await new Promise(function (res, rej) {
        var fr = new FileReader();
        fr.onload = function () { res(fr.result); };
        fr.onerror = rej;
        fr.readAsDataURL(blob);
      });
    },
  };

  // ---- Alacarte vb. sunucu fonksiyonları (RPC). Hata iletisi "KOD|Türkçe mesaj" biçimindedir ----
  window.OtelRpc = {
    async cagir(ad, args) {
      var r = await sb().rpc(ad, args || {});
      if (r.error) {
        var m = String(r.error.message || r.error);
        var i = m.indexOf("|");
        var e = new Error(i > 0 && /^[A-Z_]+$/.test(m.slice(0, i)) ? m.slice(i + 1) : (/fetch|network/i.test(m) ? "Bağlantı hatası. İnternetinizi kontrol edin." : m));
        e.kod = i > 0 ? m.slice(0, i) : "";
        throw e;
      }
      return r.data;
    },
  };

  // ---- Sunucu fonksiyonu "yonetim": kullanıcı/PIN yönetimi ve Telegram ----
  window.OtelYonetim = {
    // Pasif kullanıcılar: RLS gereği Genel Müdür yalnızca kendi otelini, admin hepsini görür
    async pasifKullanicilar() {
      var r = await sb().from("profiles").select("hotel_code,user_code,name,department,bolum,pozisyon").eq("active", false);
      if (r.error) throw new Error(hataMesaji(r.error));
      return r.data.map(profilKaydi).sort(function (a, b) {
        return (a.hotelCode + a.userCode) < (b.hotelCode + b.userCode) ? -1 : 1;
      });
    },
    async cagir(eylem, veri) {
      var r = await sb().functions.invoke("yonetim", { body: Object.assign({ eylem: eylem }, veri || {}) });
      if (r.error) {
        var mesaj = "Sunucuya ulaşılamadı. İnternetinizi kontrol edin.";
        try {
          var c = r.error.context;
          if (c && c.status === 404) mesaj = "Yönetim sunucu fonksiyonu henüz kurulmamış.";
          else if (c && c.json) {
            var j = await c.json();
            if (j && j.hata) mesaj = j.hata;
          }
        } catch (e) {}
        throw new Error(mesaj);
      }
      return r.data;
    },
  };
})();

function hataGoster(mesaj) {
  var kutu = document.getElementById("hataKutusu");
  var metin = document.getElementById("hataMetni");
  if (kutu && metin) {
    metin.textContent = mesaj;
    kutu.style.display = "block";
  }
}

window.addEventListener("error", function (e) {
  hataGoster((e.message || "Bilinmeyen hata") + "\n" + (e.filename ? (e.filename + ":" + e.lineno) : ""));
});

window.addEventListener("load", function () {
  setTimeout(function () {
    var eksikler = [];
    if (typeof React === "undefined") eksikler.push("React");
    if (typeof ReactDOM === "undefined") eksikler.push("ReactDOM");
    if (typeof Babel === "undefined") eksikler.push("Babel");
    if (typeof supabase === "undefined") eksikler.push("Supabase");
    if (eksikler.length > 0) {
      hataGoster(
        "Şu kütüphaneler yüklenemedi: " + eksikler.join(", ") +
        ".\n\nBu genellikle internet bağlantınızın veya kullandığınız ağın " +
        "cdnjs.cloudflare.com / cdn.jsdelivr.net adreslerine erişimi engellemesinden kaynaklanır. " +
        "Lütfen farklı bir ağ (örn. mobil veri / farklı Wi-Fi) ile tekrar deneyin."
      );
    }
  }, 4000);
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("service-worker.js").catch(function () {});
  });
}
</script>

<script id="uygulama-kaynak-kodu" type="text/plain">
const { useState, useEffect, useRef } = React;

/* ------------------------------------------------------------------
   VERİ TANIMLARI
   Yeni otel eklemek için OTELLER_BASLANGIC, yeni kullanıcı eklemek için
   KULLANICILAR_BASLANGIC, yeni departman/kontrol listesi eklemek için
   DEPARTMAN_LISTELERI dizilerini güncellemeniz yeterlidir.
-------------------------------------------------------------------*/

const OTELLER_BASLANGIC = [
  { code: "5555", name: "RDM Hotels Blue" },
  { code: "5556", name: "Perge Hotels" },
  { code: "5557", name: "Sidera Kirman Premium" },
  { code: "0001", name: "RDM Services Yönetim" },
];

// Kullanıcılar artık Supabase'de (profiles tablosu); şifre/PIN koda yazılmaz.
const KULLANICILAR_BASLANGIC = [];

const DEPARTMAN_LISTELERI = {
  Önbüro: [
    "Info board, Logbook, mail okunur, kontroller yapılır.",
    "Uyandırma listesi Otomatik/Manüeller kontrol edilir.",
    "Trace raporu çekilip kontrolü yapılır.",
    "Kasa raporu alınır, depozitler ve ödemeler kontrol edilir. Kasa eksiksiz teslim alınır.",
    "Lobby müzik ses ayarı ve lobby ışıklandırması kontrol edilir.",
    "Döviz ve Exchange kurları Sedna'dan ve TCMB web sitesinden kontrol edilir.",
    "Belldesk Form deske bırakınız ve yazılan işlerin yapıldığını takip ediniz.",

// DEPARTMAN_LISTELERI her zaman "fabrika ayarları" (kod içindeki sabit
// tanımlar) olarak kalır. Uygulama, çalışma zamanında Genel Müdür
// kullanıcılarının ekleyip düzenlediği departmanları/maddeleri de
// içerebilen BU kopyayı kullanır. Sayfa açıldığında kalıcı depodan
// (ozeldept: anahtarlarından) güncellenir.
let DEPARTMAN_LISTELERI_CALISMA = JSON.parse(JSON.stringify(DEPARTMAN_LISTELERI));

// Kalıcı depoda saklı, GM tarafından oluşturulmuş/düzenlenmiş tüm düz
// (satır bazlı) departman şablonlarını yükler ve çalışma kopyasına işler.
async function ozelDepartmanlariYukle() {
  try {
    const liste = await window.storage.list("ozeldept:", true);
    const keys = (liste && liste.keys) || [];
    for (const k of keys) {
      const r = await safeGet(k, true);
      if (r) {
        try {
          const departman = k.slice("ozeldept:".length);
          DEPARTMAN_LISTELERI_CALISMA[departman] = JSON.parse(r.value);
        } catch (e) {}
      }
    }
  } catch (e) {}
}

async function ozelDepartmanKaydet(departman, maddeler) {
  await window.storage.set(`ozeldept:${departman}`, JSON.stringify(maddeler), true);
  DEPARTMAN_LISTELERI_CALISMA[departman] = maddeler;
}

// Tüm departman adlarını (düz + bölümlü + oda bazlı) tek bir listede döner.
function tumDepartmanAdlari() {
  return [
    ...new Set([
      ...Object.keys(DEPARTMAN_LISTELERI_CALISMA),
      ...Object.keys(DEPARTMAN_BOLUMLERI || {}),
      ...Object.keys(DEPARTMAN_ODA_BAZLI || {}),
    ]),
  ].filter((d) => d !== "Admin");
}
