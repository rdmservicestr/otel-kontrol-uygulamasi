const POZISYON_LISTELERI = [{"ad":"ANİMASYON ŞEFİ","bolumler":[{"harf":"A","baslik":"Günlük planlama ve organizasyon","maddeler":["Günlük animasyon programının otel konseptine ve misafir profiline uygun hazırlanması.","Günlük etkinlik programının ilgili departmanlara ve misafirlere zamanında duyurulması.","Animasyon ekibinin vardiya ve görev dağılımının operasyon ihtiyacına göre yapılması.","Günlük aktivitelerin başlangıç ve bitiş saatlerinin programa uygun yürütülmesi.","Hava koşulları, doluluk oranı ve misafir yoğunluğuna göre alternatif etkinlik planlarının hazırlanması."]},{"harf":"B","baslik":"Ekip yönetimi ve performans","maddeler":["Animasyon personelinin kişisel bakım, üniforma ve davranış standartlarına uygunluğunun kontrol edilmesi.","Ekip üyelerinin görev yerlerinde zamanında bulunmalarının denetlenmesi.","Personelin görev ve sorumluluklarını doğru uygulayıp uygulamadığının gözlemlenmesi.","Ekip içindeki iletişim, koordinasyon ve iş birliğinin değerlendirilmesi.","Personelin performans eksiklikleri için geri bildirim ve gelişim takibinin yapılması."]},{"harf":"C","baslik":"Misafir deneyimi ve etkinlik kalitesi","maddeler":["Gündüz aktivitelerinin farklı yaş ve ilgi gruplarına hitap etmesinin sağlanması.","Akşam gösterileri ve eğlence programlarının içerik ve uygulama kalitesinin kontrol edilmesi.","Misafir katılım oranlarının etkinlik bazında takip edilmesi.","Misafir şikâyetlerinin değerlendirilmesi ve gerekli iyileştirmelerin başlatılması.","Etkinliklerde gönüllü katılım ilkesinin korunması ve misafirlerin rahatsız edilmemesi."]},{"harf":"D","baslik":"Güvenlik ve ekipman","maddeler":["Spor ve eğlence aktivitelerinde risk değerlendirmesi yapılmasının sağlanması.","Kullanılan animasyon ekipmanlarının sağlamlık ve güvenlik kontrollerinin takip edilmesi.","Sahne, ses, ışık ve gösteri alanlarının etkinlik öncesinde hazır olduğunun doğrulanması."]},{"harf":"E","baslik":"Raporlama ve iyileştirme","maddeler":["Günlük gerçekleştirilen etkinliklerin, katılımın ve yaşanan aksaklıkların kayıt altına alınması.","Animasyon faaliyetlerinin sonuçlarının değerlendirilerek işletme yönetimine raporlanması."]}]},{"ad":"ANİMATÖR","bolumler":[{"harf":"A","baslik":"Günlük hazırlık","maddeler":["Vardiyaya zamanında ve göreve hazır şekilde başlanması.","Üniforma, kişisel bakım ve görünüm standartlarına uyulması.","Günlük görev programının ve aktivite saatlerinin kontrol edilmesi.","Görevli olunan aktivite alanının misafir kabulünden önce hazırlanması.","Aktivite için gerekli malzeme ve ekipmanların eksiksiz olduğunun kontrol edilmesi."]},{"harf":"B","baslik":"Aktivite uygulaması","maddeler":["Aktivitenin ilan edilen saat ve programa uygun başlatılması.","Aktivite kurallarının katılımcılara anlaşılır biçimde açıklanması.","Katılımcıların yaş, fiziksel yeterlilik ve aktivite koşullarına uygun yönlendirilmesi.","Aktivite sırasında katılımcıların güvenliğinin gözetilmesi.","Kullanılan malzemelerin etkinlik boyunca doğru ve amacına uygun kullanılması."]},{"harf":"C","baslik":"Misafir iletişimi","maddeler":["Misafirlerle nazik, saygılı ve profesyonel iletişim kurulması.","Aktivitelere katılım davetlerinin baskı oluşturmadan yapılması.","Farklı dil ve kültürlerden gelen misafirlerle uygun iletişim kurulması.","Misafirlerden gelen soru ve taleplerin doğru yanıtlanması veya ilgili kişiye yönlendirilmesi.","Misafirler arasında ayrımcılık, tartışma ve rahatsızlık yaratabilecek davranışlardan kaçınılması."]},{"harf":"D","baslik":"Alan güvenliği ve düzeni","maddeler":["Aktivite alanındaki tehlikeli durumların fark edildiğinde derhal bildirilmesi.","Aktivite sonrasında kullanılan ekipmanların toplanması ve uygun şekilde muhafaza edilmesi.","Görev alanının temiz, düzenli ve bir sonraki kullanıma hazır bırakılması."]},{"harf":"E","baslik":"Bildirim ve sorumluluk","maddeler":["Gerçekleşmeyen aktivitelerin veya program değişikliklerinin animasyon şefine bildirilmesi.","Misafir şikâyeti, yaralanma, ekipman arızası veya güvenlik olaylarının gecikmeden sorumlu yöneticiye aktarılması."]}]},{"ad":"AŞÇI","bolumler":[{"harf":"A","baslik":"Üretim öncesi hazırlık","maddeler":["Günlük menü ve üretim planının kontrol edilmesi.","Reçeteye uygun malzeme miktarlarının hazırlanması.","Kullanılacak gıda ürünlerinin tazelik, görünüm ve koku açısından değerlendirilmesi.","Ürünlerin son tüketim tarihi ve uygun saklama koşullarının kontrol edilmesi.","Çalışma tezgâhı, kesme ekipmanları ve üretim alanının hijyenik şekilde hazırlanması."]},{"harf":"B","baslik":"Gıda güvenliği ve hijyen","maddeler":["Kişisel hijyen ve iş kıyafeti kurallarına uyulması.","Çiğ ve pişmiş ürünlerin çapraz bulaşmayı önleyecek şekilde ayrılması.","Gıdaların uygun sıcaklıklarda muhafaza edilmesi.","Ürünlerin güvenli pişirme ve soğutma prosedürlerine uygun işlenmesi.","Alerjen içeren ürünlerin ayrıştırılması ve çapraz temas riskinin önlenmesi."]},{"harf":"C","baslik":"Yemek üretimi ve kalite","maddeler":["Yemeklerin standart reçete ve porsiyon ölçülerine uygun hazırlanması.","Ürünlerin tat, kıvam, renk ve pişme derecesinin kontrol edilmesi.","Üretim miktarlarının servis ihtiyacı ve öngörülen tüketimle uyumlu tutulması.","Servise çıkacak yemeklerin sunum ve kalite standartlarının korunması.","Servise uygun olmayan ürünlerin ayrılması ve sorumlu şefe bildirilmesi."]},{"harf":"D","baslik":"Ekipman ve çalışma alanı","maddeler":["Mutfak ekipmanlarının doğru ve güvenli kullanılması.","Bıçak, sıcak yüzey ve diğer iş güvenliği risklerine karşı gerekli tedbirlerin uygulanması.","Üretim sonrasında kullanılan ekipmanların ve çalışma alanının temizlenmesi."]},{"harf":"E","baslik":"Stok ve kayıt","maddeler":["Üretimde kullanılan malzemelerin ve tespit edilen firelerin prosedüre uygun kaydedilmesi.","Eksilen, bozulmuş veya kalite standardını karşılamayan ürünlerin sorumlu şefe bildirilmesi."]}]},{"ad":"AŞÇIBAŞI YARDIMCISI","bolumler":[{"harf":"A","baslik":"Mutfak organizasyonu","maddeler":["Günlük üretim planının aşçılar ve mutfak personeli arasında dağıtılması.","Menüye göre üretim sıralaması ve hazırlık saatlerinin belirlenmesi.","Mutfak istasyonlarının servis öncesi hazır olma durumunun kontrol edilmesi.","Personelin görev dağılımına ve vardiya planına uygun çalışmasının takip edilmesi.","Üretim miktarlarının beklenen misafir sayısı ve servis ihtiyacıyla karşılaştırılması."]},{"harf":"B","baslik":"Ürün ve üretim kalitesi","maddeler":["Hazırlanan yemeklerin standart reçetelere uygunluğunun kontrol edilmesi.","Porsiyonlama ve sunum standartlarının uygulanmasının denetlenmesi.","Servis öncesi tadım ve kalite kontrolünün yapılmasının sağlanması.","Üretim sırasında oluşan kalite sorunlarına müdahale edilmesi.","Büfe veya alakart servise gönderilen ürünlerin zamanında ve uygun sıcaklıkta hazırlanmasının takip edilmesi."]},{"harf":"C","baslik":"Hijyen ve gıda güvenliği","maddeler":["Personelin hijyen kurallarına uygun çalışmasının denetlenmesi.","Çiğ ve pişmiş ürünlerin ayrı işlenmesi ve saklanmasının kontrol edilmesi.","Soğuk depoların, buzdolaplarının ve sıcak muhafaza ekipmanlarının sıcaklık kayıtlarının takip edilmesi.","Alerjen yönetimi ve özel beslenme taleplerine ilişkin prosedürlerin uygulanmasının kontrol edilmesi.","Temizlik ve dezenfeksiyon işlemlerinin belirlenen plana göre tamamlanmasının sağlanması."]},{"harf":"D","baslik":"Stok ve maliyet kontrolü","maddeler":["Günlük malzeme ihtiyaçlarının stok durumuna göre belirlenmesi.","Ürün tüketimi, porsiyon kontrolü ve mutfak firelerinin takip edilmesi.","Uygun olmayan veya bozulma riski taşıyan ürünlerin tespit edilerek gerekli işlemlerin başlatılması."]},{"harf":"E","baslik":"Koordinasyon ve raporlama","maddeler":["Mutfak ile servis ekipleri arasındaki üretim ve servis koordinasyonunun sağlanması.","Üretim aksaklıkları, personel eksiklikleri ve kalite sorunlarının aşçıbaşına raporlanması."]}]},{"ad":"BAHÇE PEYZAJ ŞEFİ","bolumler":[{"harf":"A","baslik":"Peyzaj planlaması","maddeler":["Günlük bahçe bakım programının hazırlanması ve ekibe dağıtılması.","Çim alanlar, bitki yatakları, ağaçlar ve süs bitkilerinin bakım ihtiyaçlarının belirlenmesi.","Mevsimsel bitkilendirme ve peyzaj uygulamalarının işletme konseptine uygun planlanması.","Sulama programının bitki türleri, hava koşulları ve toprak ihtiyacına göre düzenlenmesi.","Görsel açıdan önemli alanların bakım önceliklerinin belirlenmesi."]},{"harf":"B","baslik":"Ekip ve iş yönetimi","maddeler":["Bahçıvanların görev dağılımının ve çalışma alanlarının belirlenmesi.","Personelin iş güvenliği kurallarına ve koruyucu ekipman kullanımına uygunluğunun kontrol edilmesi.","Bahçe bakım işlerinin belirlenen süre ve kalite standartlarında tamamlanmasının denetlenmesi.","Kullanılan bahçe ekipmanlarının doğru işletilmesi ve güvenli muhafazasının sağlanması.","Personelin bakım teknikleri ve ekipman kullanımı konusundaki eksikliklerinin giderilmesinin takip edilmesi."]},{"harf":"C","baslik":"Bitki sağlığı ve sulama","maddeler":["Bitkilerde hastalık, zararlı, kuruma veya besin eksikliği belirtilerinin kontrol edilmesi.","Sulama sistemlerinde tıkanıklık, kaçak ve arızaların tespit edilmesinin sağlanması.","Budama, gübreleme ve bitki yenileme işlemlerinin uygun yöntemlerle planlanması.","Kimyasal bitki koruma ürünlerinin yalnızca yetkili personelce, talimatlara uygun kullanılmasının denetlenmesi.","Su tüketimini azaltan ve bitki sağlığını koruyan bakım yöntemlerinin uygulanmasının takip edilmesi."]},{"harf":"D","baslik":"Görünüm ve misafir güvenliği","maddeler":["Misafirlerin kullandığı bahçe yolları, yeşil alanlar ve dinlenme noktalarının düzenli tutulmasının sağlanması.","Kırık dallar, kaygan zeminler, açıkta kalan kablolar ve benzeri risklerin giderilmesinin takip edilmesi.","Peyzaj çalışmalarının misafir dolaşımını, manzarayı ve işletmenin genel görünümünü olumsuz etkilememesinin sağlanması."]},{"harf":"E","baslik":"Malzeme ve raporlama","maddeler":["Bitki, gübre, sulama malzemesi ve sarf malzemesi stoklarının takip edilmesi.","Günlük bakım faaliyetleri, arızalar, bitki kayıpları ve ek ihtiyaçların kayıt altına alınarak ilgili yöneticiye raporlanması."]}]},{"ad":"BAHÇEVAN","bolumler":[{"harf":"A","baslik":"Günlük bahçe bakımı","maddeler":["Sorumlu olunan bahçe alanının günlük bakım ihtiyaçlarının kontrol edilmesi.","Çimlerin biçim, yükseklik ve genel görünüm açısından kontrol edilmesi.","Bitki yatakları ve ağaç diplerindeki yabani otların temizlenmesi.","Çalı, çiçek ve bitkilerin gerekli budama işlemlerinin yapılması.","Bitkilerin sulama ihtiyaçlarının kontrol edilerek uygun miktarda sulanması."]},{"harf":"B","baslik":"Bitki sağlığı ve uygulamalar","maddeler":["Bitkilerde kuruma, sararma, hastalık ve zararlı belirtilerinin gözlemlenmesi.","Kurumuş yaprak, dal ve çiçeklerin temizlenmesi.","Gübreleme işlemlerinin verilen programa ve talimatlara uygun yapılması.","Yeni dikilen bitkilerin kök tutma ve gelişim durumlarının takip edilmesi.","Hastalık veya zararlı görülen bitkilerin peyzaj şefine bildirilmesi."]},{"harf":"C","baslik":"Alan düzeni ve güvenlik","maddeler":["Bahçe yolları ve bitki yataklarının temiz ve düzenli tutulması.","Budama atıkları ve bitkisel çöplerin belirlenen alanlara taşınması.","Sulama sonrasında yürüyüş yollarında su birikintisi ve kayma riski oluşmasının önlenmesi.","Bahçe ekipmanlarının güvenli ve talimatlara uygun kullanılması.","Çalışma sırasında misafir geçişlerinin ve ortak kullanım alanlarının güvenliğinin korunması."]},{"harf":"D","baslik":"Ekipman ve malzeme","maddeler":["El aletlerinin çalışma öncesinde kullanılabilirlik açısından kontrol edilmesi.","Sulama hortumları ve bağlantılarındaki kaçakların tespit edilmesi.","Kullanılan ekipmanların iş bitiminde temizlenerek belirlenen yerde muhafaza edilmesi."]},{"harf":"E","baslik":"Bildirim ve iş disiplini","maddeler":["Tamamlanan bakım işlerinin ve devam eden işlerin sorumlu şefe bildirilmesi.","Bitki, ekipman veya sulama sistemlerinde tespit edilen arızaların gecikmeden raporlanması."]}]},{"ad":"BAR GARSONU","bolumler":[{"harf":"A","baslik":"Servis öncesi hazırlık","maddeler":["Barın, servis tezgâhının ve misafir kullanım alanlarının temizliğinin kontrol edilmesi.","Masa, sandalye ve servis ekipmanlarının düzenlenmesi.","Bardak, fincan, peçete ve diğer servis malzemelerinin eksiksiz hazırlanması.","Menüde bulunan içeceklerin ve mevcut seçeneklerin öğrenilmesi.","Görev başlangıcında bar stoklarının ve eksik ürünlerin kontrol edilmesi."]},{"harf":"B","baslik":"Sipariş ve servis","maddeler":["Misafirlerin zamanında ve nazik şekilde karşılanması.","Siparişlerin doğru alınarak ilgili sisteme veya hazırlama birimine eksiksiz iletilmesi.","İçeceklerin standart reçete ve sunum kurallarına uygun servis edilmesi.","Siparişlerin bekletilmeden ve doğru misafire teslim edilmesi.","Özel taleplerin ve alerjenle ilgili bildirimlerin ilgili hazırlama personeline doğru aktarılması."]},{"harf":"C","baslik":"Hijyen ve misafir memnuniyeti","maddeler":["Bardak ve servis ekipmanlarının temizliğinin kontrol edilmesi.","Dökülen içeceklerin ve kirlenen yüzeylerin gecikmeden temizlenmesi.","Açıkta bulunan içecek, garnitür ve diğer ürünlerin hijyen kurallarına uygun korunması.","Misafir şikâyetlerinin sakin ve profesyonel şekilde karşılanması.","Uygun olmayan ürün veya hizmet durumlarının bar kaptanına ya da bar şefine bildirilmesi."]},{"harf":"D","baslik":"Stok ve iş güvenliği","maddeler":["Servis sırasında tükenen ürünlerin sorumlu kişiye bildirilmesi.","Kırık bardak ve cam parçalarının güvenli yöntemlerle toplanması.","Servis ekipmanlarının ve tepsilerin güvenli taşınması."]},{"harf":"E","baslik":"Kapanış işlemleri","maddeler":["Servis sonunda bar alanının temiz ve düzenli bırakılması.","Vardiya sonunda eksikler, arızalar ve misafir taleplerine ilişkin gerekli devir bilgisinin verilmesi."]}]},{"ad":"BAR KAPTANI","bolumler":[{"harf":"A","baslik":"Servis organizasyonu","maddeler":["Vardiya başında bar garsonlarının görev ve istasyon dağılımının yapılması.","Servis başlamadan önce bar hazırlıklarının tamamlandığının kontrol edilmesi.","Personelin üniforma, kişisel bakım ve işe hazır olma durumunun denetlenmesi.","Barın çalışma saatlerine ve hizmet konseptine uygun açılmasının sağlanması.","Yoğunluk durumuna göre personel desteği ve görev değişikliklerinin organize edilmesi."]},{"harf":"B","baslik":"Sipariş ve servis kalitesi","maddeler":["Siparişlerin doğru alınması ve zamanında hazırlanmasının takip edilmesi.","İçecek sunumlarının reçete, porsiyon ve işletme standartlarına uygunluğunun kontrol edilmesi.","Bekleyen siparişlerin ve servis gecikmelerinin takip edilmesi.","Yanlış veya eksik servis edilen siparişlerin düzeltilmesinin sağlanması.","Misafir şikâyetlerinin çözülmesi veya ilgili yöneticiye aktarılması."]},{"harf":"C","baslik":"Hijyen ve alan kontrolü","maddeler":["Bar tezgâhı, servis istasyonları ve ekipmanların hijyen durumunun denetlenmesi.","Buz, garnitür ve diğer açıkta kullanılan ürünlerin uygun koşullarda tutulmasının kontrol edilmesi.","Cam kırılması, dökülme ve kaygan zemin risklerine karşı gerekli önlemlerin alınması.","Servis alanındaki düzenin ve misafir güvenliğinin korunması."]},{"harf":"D","baslik":"Stok ve ekip yönetimi","maddeler":["Kritik içecek ve sarf malzemesi stoklarının takip edilmesi.","Ürün eksikliklerinin ve stok tutarsızlıklarının kayıt altına alınmasının sağlanması.","Bar garsonlarının servis standartlarına uygun çalışmasının gözlemlenmesi.","Yeni veya eksik deneyimli personele görev başında rehberlik edilmesi."]},{"harf":"E","baslik":"Raporlama ve devir","maddeler":["Vardiya sonunda barın, ekipmanların ve stok alanlarının kontrol edilmesi.","Günlük servis sorunları, misafir şikâyetleri ve operasyonel ihtiyaçların bar şefine raporlanması."]}]},{"ad":"BAR ŞEFİ","bolumler":[{"harf":"A","baslik":"Operasyon yönetimi","maddeler":["Barların açılış, servis ve kapanış standartlarının belirlenmesi ve uygulanmasının denetlenmesi.","Barların personel planlamasının doluluk ve beklenen misafir yoğunluğuna göre yapılması.","Menü ve içecek sunum standartlarının tüm barlarda tutarlı uygulanmasının sağlanması.","Bar kaptanlarının görev ve sorumluluklarının netleştirilmesi.","Servis yoğunluğuna göre barlar arası personel ve malzeme koordinasyonunun sağlanması."]},{"harf":"B","baslik":"Ürün ve servis standardı","maddeler":["Standart içecek reçetelerinin ve porsiyon ölçülerinin uygulanmasının kontrol edilmesi.","Sunulan içeceklerin tat, görünüm ve kalite açısından değerlendirilmesi.","Menüdeki ürünlerin bulunabilirliğinin ve alternatif ürün planlarının takip edilmesi.","İçecek sunumlarında kullanılan garnitür ve yardımcı malzemelerin standartlara uygunluğunun denetlenmesi.","Servis gecikmeleri ve tekrarlayan sipariş hataları için düzeltici önlemler alınması."]},{"harf":"C","baslik":"Hijyen ve güvenlik","maddeler":["Barların hijyen, temizlik ve sanitasyon uygulamalarının denetlenmesi.","İçecek depolama alanlarının ve soğutucuların uygun koşullarda tutulmasının sağlanması.","Alkollü içecek servisinde işletme prosedürleri ve geçerli mevzuata uyulmasının sağlanması.","Ekipman arızaları ve iş güvenliği risklerinin giderilmesinin takip edilmesi."]},{"harf":"D","baslik":"Maliyet ve stok yönetimi","maddeler":["İçecek stoklarının fiziksel sayım ve sistem kayıtlarıyla karşılaştırılmasının sağlanması.","Reçete, porsiyon, fire ve tüketim verileri üzerinden maliyet kontrolü yapılması.","Kritik stok seviyelerinin belirlenmesi ve zamanında sipariş ihtiyacının oluşturulması.","Yüksek tüketim, açıklanamayan fire ve stok farklılıklarının araştırılması."]},{"harf":"E","baslik":"Performans ve raporlama","maddeler":["Barların servis kalitesi, misafir geri bildirimleri ve operasyonel verimlilik göstergelerinin değerlendirilmesi.","Bar operasyonuna ilişkin sonuçların ve iyileştirme ihtiyaçlarının yiyecek içecek yönetimine raporlanması."]}]},{"ad":"BAR YÖNETİCİSİ","bolumler":[{"harf":"A","baslik":"Strateji ve operasyon planlama","maddeler":["Bar operasyonlarının işletmenin bütçe, hizmet konsepti ve kalite hedefleriyle uyumlu planlanması.","Barların çalışma saatleri, kapasite ve personel ihtiyaçlarının belirlenmesi.","İçecek menüsünün misafir profili, maliyet ve satış performansı açısından değerlendirilmesi.","Bar şefleri ve sorumlu kaptanlar arasındaki görev dağılımının ve raporlama düzeninin belirlenmesi.","Özel etkinlikler, grup organizasyonları ve yoğun dönemler için operasyon planlarının hazırlanması."]},{"harf":"B","baslik":"Hizmet kalitesi ve misafir deneyimi","maddeler":["Barlar arasında servis standardı ve ürün kalitesinin tutarlılığının denetlenmesi.","Misafir memnuniyeti verilerinin ve tekrarlayan şikâyetlerin değerlendirilmesi.","Servis hızı, sipariş doğruluğu ve ürün bulunabilirliği performansının takip edilmesi.","Özel konseptler ve temalı içecek sunumlarının işletme standartlarına uygunluğunun kontrol edilmesi."]},{"harf":"C","baslik":"Finansal ve ticari kontrol","maddeler":["İçecek maliyet oranlarının bütçe ve hedeflerle karşılaştırılması.","Ürün tüketimi, stok kayıpları ve fire oranlarının analiz edilmesi.","Satın alma taleplerinin bütçe, tüketim ve stok seviyelerine göre değerlendirilmesi.","Envanter sayımlarının doğruluğunun ve stok hareketlerinin izlenebilirliğinin denetlenmesi.","İçecek satışlarının ve ürün performansının raporlar üzerinden analiz edilmesi."]},{"harf":"D","baslik":"İnsan kaynakları ve uyum","maddeler":["Bar yönetim ekibinin performans hedeflerinin belirlenmesi ve değerlendirilmesi.","Eğitim ihtiyaçlarının tespit edilmesi ve personel gelişim planlarının takip edilmesi.","Hijyen, iş güvenliği ve sorumlu içki servisi prosedürlerinin uygulanmasının denetlenmesi.","Personel vardiya maliyetlerinin hizmet kalitesi ve operasyon ihtiyacıyla dengelenmesi."]},{"harf":"E","baslik":"Raporlama ve geliştirme","maddeler":["Barların bütçe, maliyet, stok ve misafir memnuniyeti sonuçlarının düzenli değerlendirilmesi.","Bar operasyonunun kârlılığını, verimliliğini ve hizmet kalitesini artıracak aksiyonların planlanması ve sonuçlarının takip edilmesi."]}]},{"ad":"BARİSTA","bolumler":[{"harf":"A","baslik":"Hazırlık ve ekipman","maddeler":["Kahve makinesi, öğütücü ve yardımcı ekipmanların çalışma durumunun kontrol edilmesi.","Kahve çekirdekleri, süt, bitkisel süt alternatifleri ve diğer malzemelerin yeterliliğinin kontrol edilmesi.","Kahve makinesinin temizlik, ısınma ve kullanım öncesi hazırlık işlemlerinin tamamlanması.","Fincan, bardak, kapak ve servis malzemelerinin eksiksiz hazırlanması."]},{"harf":"B","baslik":"İçecek hazırlama","maddeler":["Kahve çekirdeklerinin uygun öğütme ayarında hazırlanması.","Espresso ekstraksiyon süresi ve ürün kalitesinin işletme standardına uygunluğunun kontrol edilmesi.","Süt köpürtme ve sıcaklık uygulamalarının içecek türüne uygun yapılması.","Kahvelerin standart reçete ve porsiyonlara göre hazırlanması.","Soğuk kahve ve özel içeceklerin reçetelerine uygun hazırlanması.","İçeceklerin görünüm, aroma, sıcaklık ve tat açısından kontrol edilmesi."]},{"harf":"C","baslik":"Sipariş ve misafir deneyimi","maddeler":["Siparişlerin doğru alınması ve doğru içeceğin hazırlanması.","Kafein, süt alternatifi, şeker ve benzeri özel taleplerin doğru uygulanması.","Hazırlanan içeceklerin uygun sunumla ve doğru misafire teslim edilmesi.","Sipariş yoğunluğunda hazırlama sırasının ve servis hızının korunması."]},{"harf":"D","baslik":"Hijyen ve gıda güvenliği","maddeler":["Süt ve diğer soğuk ürünlerin uygun sıcaklıkta muhafaza edilmesi.","Süt buhar çubuğunun her kullanım sonrasında temizlenmesi.","Kahve makinesi, öğütücü ve hazırlama tezgâhının düzenli temizlenmesi.","Son tüketim tarihi, ürün tazeliği ve çapraz bulaşma risklerinin kontrol edilmesi."]},{"harf":"E","baslik":"Kapanış ve raporlama","maddeler":["Gün sonunda kahve ekipmanlarının belirlenen prosedüre göre temizlenmesi.","Ürün eksiklerinin, ekipman arızalarının ve tüketim kaynaklı sorunların sorumlu kişiye bildirilmesi."]}]},{"ad":"BARMEN","bolumler":[{"harf":"A","baslik":"Bar hazırlığı","maddeler":["Bar tezgâhı, içecek hazırlama alanı ve ekipmanların servis öncesinde hazırlanması.","Alkollü ve alkolsüz içecek stoklarının yeterliliğinin kontrol edilmesi.","Buz, garnitür, şurup ve karışım malzemelerinin hazırlanması.","Kokteyl ekipmanlarının temiz ve çalışır durumda olduğunun kontrol edilmesi."]},{"harf":"B","baslik":"İçecek hazırlama","maddeler":["Kokteyllerin standart reçete ve ölçülere uygun hazırlanması.","Ölçü kapları ve dozaj ekipmanlarının doğru kullanılması.","İçeceklerin tat, renk, kıvam ve sunum açısından kontrol edilmesi.","Alkolsüz kokteyl ve özel içeceklerin reçetelerine uygun hazırlanması.","Garnitürlerin taze, hijyenik ve uygun miktarda kullanılması.","Siparişlerin doğru sırayla ve zamanında hazırlanması."]},{"harf":"C","baslik":"Misafir hizmeti","maddeler":["Misafirlerin sipariş ve ürün bilgisi taleplerinin doğru karşılanması.","İçeceklerin doğru misafire, doğru içerikle teslim edilmesi.","Alerjen veya özel içerik taleplerinin hazırlık aşamasında dikkate alınması.","Şikâyet edilen içeceklerin değerlendirilerek gerekli düzeltmenin yapılması."]},{"harf":"D","baslik":"Hijyen ve güvenlik","maddeler":["Buzun hijyenik ekipmanlarla alınması ve uygun koşullarda korunması.","Açılmış ürünlerin etiketleme, tarih ve saklama kurallarına uygun muhafaza edilmesi.","Cam kırılması, dökülme ve kesici ekipman risklerine karşı gerekli önlemlerin alınması.","Alkollü içecek servisinde işletme kuralları ve yürürlükteki mevzuata uyulması."]},{"harf":"E","baslik":"Stok ve kapanış","maddeler":["Kullanılan içeceklerin, garnitürlerin ve diğer malzemelerin tüketiminin takip edilmesi.","Barın kapanış temizliğinin tamamlanması ve stok eksiklerinin sorumluya bildirilmesi."]}]},{"ad":"BELLBOY","bolumler":[{"harf":"A","baslik":"Karşılama ve bagaj işlemleri","maddeler":["Misafirlerin giriş ve çıkış saatlerinde karşılama alanında hazır bulunulması.","Misafirlerin bagajlarının dikkatli ve doğru şekilde teslim alınması.","Bagajların oda numarası ve misafir bilgileriyle doğru eşleştirilmesi.","Bagajların taşınması sırasında hasar ve kayıp riskine karşı gerekli özenin gösterilmesi.","Bagajların doğru odaya veya belirlenmiş bagaj muhafaza alanına teslim edilmesi."]},{"harf":"B","baslik":"Odaya eşlik ve bilgilendirme","maddeler":["Misafirlerin odalarına nazik ve profesyonel şekilde eşlik edilmesi.","Oda girişinde kapı, kart ve temel oda kullanım bilgilerinin gerektiğinde açıklanması.","Misafirin talebi veya görev kapsamı doğrultusunda temel otel alanlarının tarif edilmesi.","Misafir özel taleplerinin ilgili departmana doğru aktarılması."]},{"harf":"C","baslik":"Hizmet kalitesi ve güvenlik","maddeler":["Misafirlerle iletişimde nezaket ve gizlilik kurallarına uyulması.","Misafir eşyalarının izinsiz açılmaması veya kişisel amaçla kullanılmaması.","Bagaj tesliminde eksik, hasarlı veya yanlış eşleştirilmiş eşya olup olmadığının kontrol edilmesi.","Asansör, lobi ve geçiş alanlarında bagaj taşınmasının güvenli biçimde yapılması.","Misafir düşmesi, bagaj kazası veya benzeri olayların derhal bildirilmesi."]},{"harf":"D","baslik":"Alan ve ekipman kontrolü","maddeler":["Bagaj arabalarının temiz ve çalışır durumda tutulması.","Lobi ve bagaj bekletme alanının düzenli tutulması.","Sahipsiz bagajların işletmenin güvenlik prosedürüne göre bildirilmesi ve muhafaza edilmesi."]},{"harf":"E","baslik":"Devir ve takip","maddeler":["Teslim alınan ancak henüz teslim edilmeyen bagajların kayıtlarının kontrol edilmesi.","Bekleyen bagaj, özel teslimat ve misafir taleplerinin vardiya devrinde aktarılması.","Günlük hizmet sırasında tespit edilen arıza ve operasyonel aksaklıkların bellkaptana veya ön büro sorumlusuna bildirilmesi."]}]},{"ad":"BELLKAPTAN","bolumler":[{"harf":"A","baslik":"Ekip organizasyonu","maddeler":["Bellboy ekibinin vardiya başlangıcında görev dağılımının yapılması.","Karşılama, bagaj taşıma ve misafir eşlik hizmetlerinin personel ihtiyacına göre planlanması.","Personelin üniforma, kişisel bakım ve hazır bulunma standartlarının kontrol edilmesi.","Yoğun giriş ve çıkış saatlerinde personel desteğinin organize edilmesi."]},{"harf":"B","baslik":"Bagaj operasyonu","maddeler":["Bagaj teslim alma ve teslim etme prosedürlerinin uygulanmasının denetlenmesi.","Bagajların doğru oda ve misafir bilgileriyle eşleştirilmesinin kontrol edilmesi.","Bekleyen bagajların kayıtlarının ve muhafaza koşullarının takip edilmesi.","Bagaj hasarı, kayıp veya yanlış teslim olaylarının prosedüre uygun yönetilmesinin sağlanması.","Bagaj arabalarının yeterliliğinin, temizliğinin ve kullanılabilirliğinin kontrol edilmesi."]},{"harf":"C","baslik":"Misafir hizmeti","maddeler":["Misafir karşılama ve odaya eşlik hizmetlerinin kalite standartlarına uygunluğunun denetlenmesi.","Misafirlerin özel bagaj taşıma ve teslimat taleplerinin takip edilmesi.","Ön büro ile bellboy ekibi arasındaki oda hazır olma ve misafir hareketi koordinasyonunun sağlanması.","Misafir şikâyetlerinin çözülmesi veya ilgili yöneticiye aktarılması."]},{"harf":"D","baslik":"Güvenlik ve düzen","maddeler":["Bagaj muhafaza alanının düzen ve güvenlik standartlarına uygunluğunun kontrol edilmesi.","Sahipsiz veya şüpheli eşyaların güvenlik prosedürüne göre ele alınmasının sağlanması.","Lobi, giriş ve geçiş alanlarında bagaj arabalarının misafir dolaşımını engellememesinin sağlanması.","Personelin misafir gizliliği ve kişisel eşya güvenliği kurallarına uymasının denetlenmesi."]},{"harf":"E","baslik":"Raporlama ve performans","maddeler":["Bagaj kayıp, hasar ve teslimat sorunlarının kayıtlarının kontrol edilmesi.","Personelin hizmet kalitesi, görev disiplini ve iş birliğinin değerlendirilmesi.","Vardiya sonunda bekleyen işler ve önemli olayların ön büro yönetimine raporlanması."]}]},{"ad":"BİLGİ TEKNOLOJİLERİ MÜDÜRÜ","bolumler":[{"harf":"A","baslik":"Sistem sürekliliği","maddeler":["PMS, POS, kanal yöneticisi, internet ve diğer kritik sistemlerin çalışma durumunun kontrol edilmesi.","Otel genelindeki kablolu ve kablosuz ağların performansının takip edilmesi.","Sunucu, sanallaştırma altyapısı ve kritik sistemlerin kaynak kullanımının izlenmesi.","Kritik sistem arızaları için müdahale ve hizmet sürekliliği planlarının güncel tutulması.","Departmanlardan gelen teknik destek taleplerinin önceliklendirilerek takip edilmesi."]},{"harf":"B","baslik":"Siber güvenlik ve veri koruma","maddeler":["Kullanıcı hesapları ve erişim yetkilerinin görev tanımlarına uygunluğunun kontrol edilmesi.","Yönetici hesaplarında güçlü kimlik doğrulama ve uygun erişim güvenliği önlemlerinin uygulanması.","Antivirüs, uç nokta güvenliği ve güvenlik güncellemelerinin durumunun takip edilmesi.","Misafir ve çalışan verilerinin yetkisiz erişime karşı korunmasının sağlanması.","KVKK ve uygulanabilir veri koruma yükümlülüklerine ilişkin BT kontrollerinin yürütülmesi."]},{"harf":"C","baslik":"Yedekleme ve felaket kurtarma","maddeler":["Kritik sistemlerin yedekleme planlarının ve sonuçlarının kontrol edilmesi.","Yedeklerin erişim kısıtlaması ve gerektiğinde çevrimdışı veya değiştirilemez kopya prensiplerine uygunluğunun değerlendirilmesi.","Veri geri yükleme testlerinin belirli aralıklarla gerçekleştirilmesinin sağlanması.","Sistem kesintisi, siber olay ve veri kaybı senaryolarına ilişkin kurtarma planlarının güncel tutulması."]},{"harf":"D","baslik":"Donanım ve tedarikçi yönetimi","maddeler":["Bilgisayar, yazıcı, ağ ekipmanı ve diğer BT varlıklarının envanterinin güncel tutulması.","Lisansların, bakım sözleşmelerinin ve yazılım yenileme tarihlerinin takip edilmesi.","Harici BT hizmet sağlayıcılarının performans ve sözleşme yükümlülüklerinin değerlendirilmesi.","Yeni sistem ve donanım yatırımlarının maliyet, güvenlik ve işletme ihtiyacı açısından incelenmesi."]},{"harf":"E","baslik":"Yönetim ve raporlama","maddeler":["Arıza kayıtları, çözüm süreleri, tekrar eden sorunlar ve hizmet seviyesi göstergelerinin raporlanması.","BT bütçesi, proje takvimi, riskler ve iyileştirme çalışmalarının işletme yönetimine sunulması."]}]},{"ad":"TEKNİK SERVİS / BOYACI","bolumler":[{"harf":"A","baslik":"İş emri ve hazırlık","maddeler":["Günlük boya ve yüzey onarım iş emirlerinin kontrol edilmesi.","İşe başlamadan önce çalışma alanının ve yüzeyin durumunun değerlendirilmesi.","Uygun boya, astar, macun ve yardımcı malzemelerin seçilmesi.","Boya yapılacak yüzeyin temizlenmesi, zımparalanması ve gerekli hazırlığının tamamlanması."]},{"harf":"B","baslik":"Uygulama kalitesi","maddeler":["Yüzeydeki çatlak, delik ve kusurların uygun malzemelerle giderilmesi.","Astar ve son kat uygulamalarının üretici talimatlarına uygun yapılması.","Renk, parlaklık ve yüzey dokusunun mevcut alanla uyumunun kontrol edilmesi.","Katlar arasında gerekli kuruma sürelerine uyulması.","Boya uygulamasında akma, kabarcık, fırça izi ve kaplama farklılıklarının kontrol edilmesi.","Tamamlanan yüzeylerin iş emrindeki kalite standardına uygunluğunun doğrulanması."]},{"harf":"C","baslik":"İş güvenliği ve koruma","maddeler":["Çalışma alanının uygun bariyer ve uyarı işaretleriyle güvenli hale getirilmesi.","Zemin, mobilya ve diğer yüzeylerin boya sıçramasına karşı korunması.","Uygun kişisel koruyucu donanımın kullanılması ve yeterli havalandırmanın sağlanması.","Merdiven ve yüksekte çalışma ekipmanlarının güvenli kullanım kurallarına uyulması."]},{"harf":"D","baslik":"Malzeme ve alan düzeni","maddeler":["Boya ve kimyasal ürünlerin etiketli, kapalı ve uygun koşullarda muhafaza edilmesi.","Kullanılan fırça, rulo ve ekipmanların uygun yöntemlerle temizlenmesi.","Boya atıklarının ve kimyasal kalıntıların belirlenmiş prosedürlere göre uzaklaştırılması.","İş bitiminde çalışma alanının temiz, güvenli ve kullanıma hazır bırakılması."]},{"harf":"E","baslik":"İş emri kapatma","maddeler":["Tamamlanan işin yüzey kalitesi ve eksik kalan noktalar açısından kontrol edilmesi.","Kullanılan malzemelerin, tamamlanan işlerin ve devam eden ihtiyaçların teknik servis sorumlusuna bildirilmesi."]}]},{"ad":"CARİ HESAPLAR ŞEFİ","bolumler":[{"harf":"A","baslik":"Cari hesap kayıtları","maddeler":["Günlük cari hesap hareketlerinin ilgili muhasebe kayıtlarıyla karşılaştırılması.","Acente, tedarikçi ve diğer ticari hesapların bakiyelerinin kontrol edilmesi.","Fatura, ödeme, tahsilat ve mahsup kayıtlarının doğruluğunun incelenmesi.","Cari hesapların doğru firma ve doğru muhasebe kodlarıyla eşleştirilmesinin sağlanması."]},{"harf":"B","baslik":"Mutabakat ve alacak takibi","maddeler":["Acente ve diğer ticari müşterilerle mutabakatların belirlenen takvime göre yürütülmesi.","Mutabakat farklarının nedenlerinin araştırılması ve çözümünün takip edilmesi.","Vadesi geçmiş alacakların yaşlandırma raporları üzerinden izlenmesi.","Tahsilatı geciken hesapların ilgili yöneticilere bildirilmesi.","İtirazlı fatura ve kesintilerin belge ve sözleşmeler üzerinden incelenmesi."]},{"harf":"C","baslik":"Borç ve ödeme kontrolü","maddeler":["Tedarikçi borçlarının vade, sözleşme ve ödeme planına uygunluğunun kontrol edilmesi.","Ödeme öncesinde fatura, sipariş ve teslimat belgelerinin gerekli kontrollerden geçirilmesi.","Mükerrer fatura ve mükerrer ödeme risklerinin kontrol edilmesi.","Ödeme talimatlarının yetki ve onay prosedürlerine uygunluğunun denetlenmesi."]},{"harf":"D","baslik":"İç kontrol ve mevzuat","maddeler":["Cari hesap açılış ve değişikliklerinde gerekli belgelerin ve yetki onaylarının kontrol edilmesi.","Şüpheli, olağan dışı veya açıklanamayan hesap hareketlerinin incelenmesi.","Ticari belgelerin gizlilik, saklama ve erişim prosedürlerine uygun muhafaza edilmesi.","Muhasebe kayıtlarının ilgili vergi ve muhasebe mevzuatına uygun yürütülmesinin takip edilmesi."]},{"harf":"E","baslik":"Raporlama ve ekip yönetimi","maddeler":["Cari hesap personelinin iş dağılımı ve işlem takibinin organize edilmesi.","Dönem sonu cari hesap mutabakatlarının ve kapanış işlemlerinin zamanında tamamlanmasının sağlanması.","Alacak, borç, mutabakat farkı ve gecikmiş hesap raporlarının muhasebe yönetimine sunulması."]}]},{"ad":"COST CONTROLLER UZMANI","bolumler":[{"harf":"A","baslik":"Maliyet ve tüketim kontrolü","maddeler":["Yiyecek ve içecek tüketim verilerinin ilgili satış ve stok kayıtlarıyla karşılaştırılması.","Standart reçeteler üzerinden teorik maliyetlerin hesaplanması ve güncelliğinin kontrol edilmesi.","Gerçekleşen tüketim ile teorik tüketim arasındaki farkların analiz edilmesi.","Gıda ve içecek maliyet oranlarının bütçe ve hedeflerle karşılaştırılması.","Yüksek maliyetli ürünlerin ve olağan dışı tüketimlerin nedenlerinin araştırılması."]},{"harf":"B","baslik":"Stok ve depo kontrolü","maddeler":["Depo girişlerinin sipariş, teslimat ve fatura belgeleriyle karşılaştırılması.","Mal kabul sırasında miktar, kalite ve ürün uygunluğu kontrollerinin kayıtlarla doğrulanması.","Depoların stok düzeni, etiketleme ve ürün rotasyonu uygulamalarının kontrol edilmesi.","Fiziksel stok sayımları ile sistem bakiyeleri arasındaki farkların analiz edilmesi.","Son tüketim tarihi yaklaşan, bozulmuş veya kullanılmayan stokların tespit edilmesi."]},{"harf":"C","baslik":"Satın alma ve fiyat analizi","maddeler":["Satın alma fiyatlarının sözleşmeler ve önceki dönem fiyatlarıyla karşılaştırılması.","Tedarikçi fiyat değişikliklerinin maliyetler üzerindeki etkisinin hesaplanması.","Sipariş miktarlarının tüketim, stok seviyesi ve fire riski açısından incelenmesi.","Onaylı satın alma prosedürleri dışındaki işlemlerin tespit edilerek raporlanması."]},{"harf":"D","baslik":"Operasyonel maliyetler","maddeler":["Personel yemekleri, ikramlar, ücretsiz tüketimler ve diğer işletme içi tüketimlerin doğru kodlanmasının kontrol edilmesi.","Fire, bozulma, iade ve zayi kayıtlarının belgelerle doğrulanması.","Porsiyon standartları ve üretim verimliliğinin maliyetlere etkisinin değerlendirilmesi.","Departmanlar arası malzeme transferlerinin doğru kaydedilmesinin kontrol edilmesi."]},{"harf":"E","baslik":"Raporlama ve iyileştirme","maddeler":["Günlük, haftalık ve aylık maliyet raporlarının hazırlanarak sapmaların açıklanması.","Maliyet azaltma fırsatlarının belirlenmesi ve önerilen aksiyonların sonuçlarının takip edilmesi."]}]},{"ad":"ÇAMAŞIRHANE GÖREVLİSİ","bolumler":[{"harf":"A","baslik":"Çamaşır kabulü ve ayrıştırma","maddeler":["Kirli çamaşırların ilgili departman veya toplama alanından doğru şekilde teslim alınması.","Çamaşırların türüne, rengine ve yıkama talimatına göre ayrıştırılması.","Lekeli, hasarlı veya özel işlem gerektiren ürünlerin ayrılması.","Misafir çamaşırlarının doğru oda ve kayıt bilgileriyle eşleştirilmesi."]},{"harf":"B","baslik":"Yıkama ve kurutma","maddeler":["Çamaşırların kumaş türüne uygun programda yıkanmasının sağlanması.","Deterjan ve diğer kimyasalların belirlenmiş dozlarda kullanılması.","Makine yükleme kapasitesine ve ürünlerin yıkama talimatlarına uyulması.","Yıkama sonrası leke, koku ve temizlik durumunun kontrol edilmesi.","Kurutma işlemlerinin kumaş türüne uygun sıcaklık ve sürelerde yapılması."]},{"harf":"C","baslik":"Ütüleme ve kalite","maddeler":["Ütüleme öncesinde ürünlerin temiz ve uygun nem seviyesinde olduğunun kontrol edilmesi.","Tekstil ürünlerinin türüne uygun ütüleme ekipmanı ve ayarlarının kullanılması.","Yırtık, yanık, renk değişimi veya kalıcı leke bulunan ürünlerin ayrılması.","Katlanan tekstillerin düzgün, temiz ve standart ölçülerde hazırlanması."]},{"harf":"D","baslik":"Hijyen ve iş güvenliği","maddeler":["Kirli ve temiz tekstillerin birbirinden ayrı alanlarda tutulması.","Makine ve kimyasalların kullanım talimatlarına uygun çalışılması.","Islak zemin, sıcak yüzey ve hareketli makine parçalarına karşı gerekli güvenlik önlemlerinin uygulanması.","Çalışma alanının temiz ve düzenli tutulması."]},{"harf":"E","baslik":"Teslimat ve kayıt","maddeler":["Temiz çamaşırların doğru departman veya teslimat noktasına yönlendirilmesi.","Eksik, kayıp, hasarlı veya yanlış eşleştirilmiş çamaşırların sorumluya bildirilmesi.","Kullanılan makinelerde tespit edilen arızaların ve işlem aksaklıklarının çamaşırhane şefine aktarılması."]}]},{"ad":"ÇAMAŞIRHANE ŞEFİ","bolumler":[{"harf":"A","baslik":"İş akışı ve personel yönetimi","maddeler":["Günlük çamaşır toplama, yıkama, kurutma, ütüleme ve dağıtım planının hazırlanması.","Personel görev dağılımının iş yüküne ve vardiya ihtiyacına göre yapılması.","Departmanlardan gelen tekstil taleplerinin önceliklendirilmesi.","Kirli ve temiz çamaşır akışının birbirini kontamine etmeyecek şekilde düzenlenmesi."]},{"harf":"B","baslik":"Makine ve üretim kontrolü","maddeler":["Yıkama, kurutma ve ütüleme makinelerinin çalışır durumda olduğunun kontrol edilmesi.","Makine kapasitesi, program ve kimyasal dozajlarının uygunluğunun denetlenmesi.","Yıkama sonrası temizlik ve leke çıkarma kalitesinin örneklem yöntemiyle kontrol edilmesi.","Tekstil ürünlerinde yıpranma, çekme, renk değişimi ve hasar oranlarının takip edilmesi.","Makine arızaları ve bakım ihtiyaçlarının teknik servise zamanında iletilmesinin sağlanması."]},{"harf":"C","baslik":"Hijyen ve güvenlik","maddeler":["Temiz tekstil depolama alanlarının hijyenik koşullarda tutulmasının sağlanması.","Kimyasalların etiketli ve güvenli alanlarda muhafaza edilmesinin denetlenmesi.","Personelin kişisel koruyucu ekipman ve iş güvenliği kurallarına uyumunun kontrol edilmesi.","Temizlik ve sanitasyon planının uygulanmasının takip edilmesi."]},{"harf":"D","baslik":"Stok ve tekstil yönetimi","maddeler":["Havlu, çarşaf, nevresim, üniforma ve diğer tekstil stoklarının takip edilmesi.","Yıpranmış veya kullanılamaz tekstillerin ayrılması ve yenileme ihtiyacının belirlenmesi.","Kayıp, hasarlı ve eksik tekstillerin kayıtlarla karşılaştırılması.","Deterjan, kimyasal ve sarf malzemesi tüketiminin takip edilmesi."]},{"harf":"E","baslik":"Performans ve raporlama","maddeler":["Departmanların çamaşır teslimat süreleri ve taleplerinin karşılanma durumunun değerlendirilmesi.","Kilogram başına işlem maliyeti, kimyasal tüketimi ve yeniden yıkama oranlarının takip edilmesi.","Günlük üretim, arızalar, tekstil kayıpları ve iyileştirme ihtiyaçlarının ilgili yöneticiye raporlanması."]}]},{"ad":"DEPO ŞEFİ","bolumler":[{"harf":"A","baslik":"Mal kabul","maddeler":["Teslim alınan ürünlerin sipariş ve satın alma belgeleriyle karşılaştırılması.","Ürün miktarı, ambalaj bütünlüğü, kalite ve son tüketim tarihlerinin kontrol edilmesi.","Eksik, hasarlı veya siparişe uygun olmayan ürünlerin kayıt altına alınması.","Gıda ürünleri için gerekli sıcaklık ve teslimat koşullarının kontrol edilmesi."]},{"harf":"B","baslik":"Depolama ve stok düzeni","maddeler":["Ürünlerin uygun depo alanlarına ve saklama koşullarına göre yerleştirilmesi.","FIFO veya son tüketim tarihine dayalı FEFO stok rotasyonunun uygun şekilde uygulanması.","Depo raflarının, ürün etiketlerinin ve lokasyon bilgilerinin düzenli tutulması.","Kimyasal ürünlerin gıda ve diğer uyumsuz malzemelerden ayrı muhafaza edilmesi.","Soğuk depo sıcaklık kayıtlarının takip edilmesi ve limit dışı durumların bildirilmesi."]},{"harf":"C","baslik":"Stok hareketleri ve güvenlik","maddeler":["Depodan yapılan tüm ürün çıkışlarının yetkili talep veya belgeye dayanmasının sağlanması.","Stok transferlerinin doğru departman ve maliyet merkezine kaydedilmesinin kontrol edilmesi.","Fiziksel stok sayımları ile sistem kayıtları arasındaki farkların araştırılması.","Depo erişiminin yetkili personelle sınırlandırılması.","Yangın, su baskını, haşere ve diğer depo risklerine karşı önlemlerin kontrol edilmesi."]},{"harf":"D","baslik":"Personel ve ekipman","maddeler":["Depo personelinin görev dağılımı ve iş güvenliği kurallarına uygun çalışmasının denetlenmesi.","Taşıma arabaları ve diğer depo ekipmanlarının güvenli kullanılmasının sağlanması.","Depo alanlarının temiz, düzenli ve geçiş yollarının açık tutulmasının kontrol edilmesi."]},{"harf":"E","baslik":"Raporlama ve satın alma koordinasyonu","maddeler":["Kritik stok seviyelerinin belirlenerek satın alma birimine zamanında bildirilmesi.","Yavaş hareket eden, son tüketim tarihi yaklaşan veya atıl kalan stokların raporlanması.","Günlük mal kabul, çıkış, stok farkı ve depo operasyonu raporlarının hazırlanması."]}]},{"ad":"EĞLENCE MÜDÜR YARDIMCISI","bolumler":[{"harf":"A","baslik":"Program ve organizasyon","maddeler":["Günlük eğlence programının müdürün belirlediği plana uygun yürütülmesinin sağlanması.","Gösteri, etkinlik ve organizasyonların hazırlık takviminin takip edilmesi.","Etkinlik alanlarının teknik ve operasyonel hazırlıklarının kontrol edilmesi.","Program değişikliklerinin ilgili departmanlara zamanında iletilmesi."]},{"harf":"B","baslik":"Ekip yönetimi","maddeler":["Eğlence ekibinin görev ve vardiya dağılımının kontrol edilmesi.","Personelin etkinlik saatlerinde görev yerinde bulunmasının sağlanması.","Ekip üyelerinin sahne disiplini, kıyafet ve davranış standartlarına uyumunun denetlenmesi.","Personelin görev performansının gözlemlenerek gelişim ihtiyaçlarının belirlenmesi."]},{"harf":"C","baslik":"Etkinlik kalitesi ve güvenlik","maddeler":["Etkinliklerin programa, içerik standardına ve hedef kitleye uygun uygulanmasının kontrol edilmesi.","Ses, ışık, sahne ve gösteri ekipmanlarının kullanıma hazır olmasının doğrulanması.","Etkinlik alanlarının kapasite ve güvenlik koşullarının kontrol edilmesi.","Çocuklara yönelik eğlence faaliyetlerinde ilgili güvenlik ve teslim prosedürlerinin uygulanmasının takip edilmesi.","Misafir şikâyetleri ve etkinlik aksaklıklarının değerlendirilerek çözümünün koordine edilmesi."]},{"harf":"D","baslik":"Koordinasyon","maddeler":["Animasyon, teknik servis, yiyecek içecek ve güvenlik departmanlarıyla etkinlik koordinasyonunun sağlanması.","Dış sanatçı ve gösteri ekiplerinin sözleşme, zamanlama ve teknik ihtiyaçlarının takip edilmesi.","Etkinliklerde kullanılan malzemelerin korunması ve uygun şekilde muhafaza edilmesinin sağlanması."]},{"harf":"E","baslik":"Raporlama","maddeler":["Etkinlik katılımı ve misafir geri bildirimlerinin takip edilmesi.","Eğlence bütçesi kapsamında yapılan harcamaların ilgili belgelerle kontrol edilmesi.","Günlük program gerçekleşmelerinin ve operasyonel sorunların kayıt altına alınması.","Müdüre performans, ihtiyaçlar ve iyileştirme önerileri hakkında düzenli rapor sunulması."]}]},{"ad":"EĞLENCE MÜDÜRÜ","bolumler":[{"harf":"A","baslik":"Strateji ve program yönetimi","maddeler":["Otelin misafir profili ve konseptine uygun eğlence stratejisinin oluşturulması.","Sezonluk ve haftalık eğlence programlarının hazırlanması.","Gündüz aktiviteleri, akşam gösterileri ve özel etkinliklerin dengeli planlanması.","Programların bütçe, kapasite ve operasyon olanaklarıyla uyumunun değerlendirilmesi."]},{"harf":"B","baslik":"Ekip ve tedarikçi yönetimi","maddeler":["Eğlence ekibinin organizasyon yapısının ve görev tanımlarının belirlenmesi.","Personel planlaması, vardiya düzeni ve performans değerlendirmelerinin yürütülmesi.","Dış sanatçı ve organizasyon tedarikçilerinin seçim ve performans süreçlerinin yönetilmesi.","Eğitim, prova ve yetenek geliştirme çalışmalarının planlanması."]},{"harf":"C","baslik":"Misafir deneyimi","maddeler":["Eğlence programlarının farklı yaş gruplarına ve misafir beklentilerine uygunluğunun değerlendirilmesi.","Etkinlik katılım oranları ve misafir memnuniyeti sonuçlarının analiz edilmesi.","Şikâyetler ve tekrarlayan hizmet sorunları için iyileştirme planlarının hazırlanması.","Misafir katılımında gönüllülük, saygı ve kişisel sınırların korunmasının sağlanması."]},{"harf":"D","baslik":"Güvenlik ve kalite","maddeler":["Etkinlik risk değerlendirmelerinin ve güvenlik prosedürlerinin uygulanmasının denetlenmesi.","Çocuk etkinlikleri, havuz çevresi aktiviteleri ve sahne gösterileri için uygun güvenlik önlemlerinin sağlanması.","Teknik ekipman ve sahne altyapısının periyodik kontrolünün koordine edilmesi.","Etkinliklerin otel marka standartları ve yasal gerekliliklere uygun yürütülmesinin sağlanması."]},{"harf":"E","baslik":"Bütçe ve raporlama","maddeler":["Eğlence bütçesinin, sanatçı maliyetlerinin ve organizasyon harcamalarının takip edilmesi.","Etkinlik maliyetlerinin katılım, kalite ve misafir memnuniyeti sonuçlarıyla birlikte değerlendirilmesi","Departman performans göstergelerinin ve sezonluk sonuçların raporlanması.","Eğlence hizmetlerinin kalitesini ve verimliliğini artıracak yıllık gelişim planının hazırlanması."]}]},{"ad":"ELEKTRİK GÖREVLİSİ","bolumler":[{"harf":"A","baslik":"Günlük teknik kontroller","maddeler":["Sorumlu olunan elektrik panolarında görünür hasar, aşırı ısınma veya anormal ses belirtilerinin kontrol edilmesi.","Aydınlatma arızalarının ve çalışmayan elektrikli donanımların tespit edilmesi.","Priz, anahtar ve bağlantı noktalarında görünür hasarların kontrol edilmesi.","Ortak alanlar ve teknik hacimlerde elektrik kaynaklı risklerin gözlemlenmesi."]},{"harf":"B","baslik":"Arıza müdahalesi","maddeler":["Elektrik arıza bildirimlerinin kayıt altına alınması ve önceliklendirilmesi.","Arıza kaynağının yetki ve mesleki yeterlilik sınırları içinde belirlenmesi.","Müdahale öncesinde gerekli enerjiyi kesme, kilitleme ve etiketleme prosedürlerinin uygulanması.","Onarım sonrasında sistemin güvenli çalışmasının uygun testlerle doğrulanması.","Tekrarlayan elektrik arızalarının nedenlerinin araştırılarak teknik sorumluya bildirilmesi."]},{"harf":"C","baslik":"İş güvenliği","maddeler":["Elektrik işlerinde uygun kişisel koruyucu ekipman ve yalıtımlı araçların kullanılması.","Yetkisiz kişilerin elektrik panolarına ve çalışma alanlarına erişiminin önlenmesi.","Islak alanlarda ve havuz çevresinde elektrik güvenliği risklerinin derhal bildirilmesi.","Elektrik işlerinin yalnızca yetkili ve yeterli eğitim almış personelce yapılmasının sağlanması."]},{"harf":"D","baslik":"Bakım ve kayıt","maddeler":["Aydınlatma armatürleri ve elektrikli ekipmanların planlı bakım kontrollerinin yapılması.","Acil aydınlatma ve ilgili elektrik güvenlik sistemlerinin kontrol programına uygun testlerinin yürütülmesi.","Kullanılan yedek parça ve sarf malzemelerinin kayıtlarının tutulması.","Elektrik odalarının temiz, erişilebilir ve uygun şekilde düzenlenmiş tutulması."]},{"harf":"E","baslik":"İş emri ve devir","maddeler":["Tamamlanan arızaların iş emri sisteminde kapatılması ve yapılan işlemlerin kaydedilmesi.","Çözülemeyen arızaların ve gerekli yedek parçaların teknik şefe bildirilmesi.","Vardiya sonunda devam eden kritik arızaların ve güvenlik risklerinin devredilmesi."]}]},{"ad":"RESTAURANT GARSONU","bolumler":[{"harf":"A","baslik":"Servis hazırlığı","maddeler":["Masa, sandalye ve servis alanlarının temizliğinin kontrol edilmesi.","Masa düzeninin işletme standartlarına uygun hazırlanması.","Çatal, bıçak, kaşık, bardak ve peçetelerin eksiksiz yerleştirilmesi.","Menü, servis ekipmanı ve yardımcı malzemelerin hazır bulundurulması."]},{"harf":"B","baslik":"Misafir karşılama ve sipariş","maddeler":["Misafirlerin nazik ve profesyonel şekilde karşılanması.","Menü ve yiyecek seçenekleri hakkında doğru bilgi verilmesi.","Siparişlerin eksiksiz alınarak ilgili sisteme doğru girilmesi.","Alerjen, özel beslenme ve diyet taleplerinin mutfak ekibine doğru aktarılması.","Siparişlerin doğru masa ve doğru misafire teslim edilmesinin kontrol edilmesi."]},{"harf":"C","baslik":"Servis kalitesi","maddeler":["Yiyecek ve içeceklerin servis sırasına ve işletme standartlarına uygun sunulması.","Servis sırasında masaların ve misafir ihtiyaçlarının düzenli takip edilmesi.","Kullanılmış tabak ve ekipmanların uygun zamanda masadan alınması.","Eksik, yanlış veya geciken siparişlerin ilgili birime bildirilerek takibinin yapılması.","Misafir taleplerinin zamanında karşılanması veya sorumlu kaptana aktarılması."]},{"harf":"D","baslik":"Hijyen ve güvenlik","maddeler":["Temiz ve kirli servis ekipmanlarının birbirinden ayrı tutulması.","Dökülen yiyecek ve içeceklerin gecikmeden temizlenmesinin sağlanması.","Sıcak tabak ve içeceklerin güvenli şekilde taşınması.","Yiyeceklerin servis sırasında hijyen ve sıcaklık standartlarının korunması için gerekli prosedürlere uyulması."]},{"harf":"E","baslik":"Servis sonu","maddeler":["Masa temizliği ve yeniden düzenleme işlemlerinin standartlara uygun tamamlanması.","Vardiya sonunda servis alanının düzenlenmesi ve bekleyen misafir taleplerinin sorumlu kişiye aktarılması."]}]},{"ad":"GIDA TEKNİKERİ","bolumler":[{"harf":"A","baslik":"Mal kabul ve ürün kontrolü","maddeler":["Teslim alınan gıda ürünlerinin sipariş ve teslimat belgeleriyle karşılaştırılması.","Ürünlerin ambalaj, etiket, son tüketim tarihi ve genel kalite durumunun kontrol edilmesi.","Soğuk ve donmuş ürünlerin teslimat sıcaklıklarının ölçülerek kaydedilmesi.","Uygun olmayan veya güvenliğinden şüphe edilen ürünlerin prosedüre göre ayrılması."]},{"harf":"B","baslik":"Gıda güvenliği ve hijyen","maddeler":["Depolama alanlarının ve gıda muhafaza ekipmanlarının sıcaklık kayıtlarının kontrol edilmesi.","Çiğ, pişmiş ve tüketime hazır ürünlerin ayrı muhafaza edilmesinin denetlenmesi.","Ürün etiketleme, açılış tarihi ve son kullanım takibi uygulamalarının kontrol edilmesi.","Çapraz bulaşma ve alerjen risklerine yönelik kontrol noktalarının izlenmesi.","Temizlik ve dezenfeksiyon kayıtlarının belirlenen plana uygunluğunun kontrol edilmesi."]},{"harf":"C","baslik":"Üretim ve servis denetimi","maddeler":["Gıda hazırlama ve üretim alanlarında hijyen uygulamalarının gözlemlenmesi.","Pişirme, soğutma, yeniden ısıtma ve sıcak muhafaza süreçlerinin işletme prosedürlerine uygunluğunun kontrol edilmesi.","Büfe ve servis alanlarındaki gıdaların uygun koşullarda tutulmasının izlenmesi.","Numune alma ve saklama işlemlerinin işletme prosedürlerine ve uygulanabilir gerekliliklere uygun yürütülmesinin sağlanması."]},{"harf":"D","baslik":"Analiz ve düzeltici faaliyet","maddeler":["Gıda güvenliği kontrol formlarındaki eksik ve uygunsuz kayıtların tespit edilmesi.","Uygunsuzlukların nedenlerinin araştırılması ve düzeltici faaliyetlerin takip edilmesi.","Zararlı mücadelesi ve çevresel hijyen kayıtlarının incelenmesi.","Gıda kaynaklı risk veya şüpheli olayların gecikmeden ilgili yöneticilere bildirilmesi."]},{"harf":"E","baslik":"Eğitim ve raporlama","maddeler":["Personelin gıda hijyeni ve güvenliği eğitim kayıtlarının takip edilmesi.","Denetim sonuçlarının, ölçümlerin ve uygunsuzlukların düzenli kaydedilmesi.","Gıda güvenliği performansı ve iyileştirme ihtiyaçlarının ilgili yönetime raporlanması."]}]},{"ad":"GÜVENLİK GÖREVLİSİ","bolumler":[{"harf":"A","baslik":"Görev başlangıcı","maddeler":["Vardiya tesliminde mevcut olayların ve devam eden güvenlik risklerinin öğrenilmesi.","Görev noktasındaki iletişim cihazlarının ve gerekli ekipmanların çalışır durumda olduğunun kontrol edilmesi.","Sorumlu olunan giriş, çıkış veya devriye bölgesinin durumunun kontrol edilmesi.","Güvenlik devriye programının ve özel görev talimatlarının incelenmesi."]},{"harf":"B","baslik":"Giriş ve alan kontrolü","maddeler":["Yetkisiz girişleri önlemek için işletmenin belirlediği giriş kontrol prosedürlerinin uygulanması.","Ziyaretçi ve tedarikçi girişlerinin ilgili kayıt prosedürlerine göre yürütülmesi.","Personel girişlerinde işletmenin yetkilendirme kurallarına uyulmasının kontrol edilmesi.","Ortak alanlar, otopark ve çevre alanlarında şüpheli durumların gözlemlenmesi."]},{"harf":"C","baslik":"Devriye ve risk tespiti","maddeler":["Belirlenen güzergâh ve zaman planına uygun devriye yapılması.","Açık bırakılmış kapı, hasarlı kilit ve yetkisiz erişim noktalarının tespit edilmesi.","Yangın çıkışları ve acil tahliye yollarındaki engellerin bildirilmesi.","Şüpheli eşya, olağan dışı davranış veya güvenlik ihlallerinin prosedüre göre ele alınması.","Misafir ve çalışan güvenliğini tehlikeye atan durumların gecikmeden raporlanması."]},{"harf":"D","baslik":"Olay yönetimi","maddeler":["Kavga, tehdit veya benzeri olaylarda eğitim ve yetki sınırları içinde güvenli müdahale prosedürlerinin uygulanması.","Yaralanma ve acil sağlık olaylarında ilgili acil durum ekiplerine haber verilmesi.","Olayların saat, yer, taraflar ve yapılan işlemlerle birlikte kayıt altına alınması.","Misafir bilgileri ve olay kayıtlarının gizlilik kurallarına uygun korunması."]},{"harf":"E","baslik":"Vardiya teslimi","maddeler":["Güvenlik ekipmanlarının ve görev alanının vardiya sonunda kontrol edilmesi.","Tespit edilen arıza, risk ve olayların güvenlik amirine bildirilmesi.","Devam eden olaylar, teslim alınan eşyalar ve özel talimatların sonraki vardiyaya aktarılması."]}]},{"ad":"GÜVENLİK MÜDÜR YARDIMCISI","bolumler":[{"harf":"A","baslik":"Vardiya ve ekip yönetimi","maddeler":["Güvenlik personelinin görev noktaları ve vardiya dağılımının kontrol edilmesi.","Personelin görev başında bulunmasının ve üniforma standartlarına uyumunun denetlenmesi.","Görev devirlerinin eksiksiz yapılmasının sağlanması.","Eksik personel veya beklenmeyen yoğunluk durumlarında görev planının düzenlenmesi."]},{"harf":"B","baslik":"Güvenlik operasyonları","maddeler":["Giriş kontrol noktalarının ve devriye uygulamalarının prosedürlere uygunluğunun denetlenmesi.","Kritik alanların, güvenlik kameralarının ve erişim kontrol sistemlerinin çalışma durumunun takip edilmesi.","Otopark, mal kabul ve personel giriş alanlarındaki güvenlik uygulamalarının kontrol edilmesi.","Yangın çıkışları ve acil tahliye yollarına ilişkin gözlemlerin takip edilmesi."]},{"harf":"C","baslik":"Olay ve risk yönetimi","maddeler":["Güvenlik olaylarının kayıtlarının ve müdahale süreçlerinin incelenmesi.","Tekrarlayan güvenlik riskleri için önleyici tedbirlerin planlanması.","Misafir şikâyetleri ve güvenlik taleplerinin değerlendirilerek çözümünün takip edilmesi.","Acil durumlarda ilgili departmanlar ve müdürle koordinasyonun sağlanması.","Kayıp eşya ve şüpheli eşya süreçlerinin işletme prosedürlerine uygun yürütülmesinin denetlenmesi."]},{"harf":"D","baslik":"Ekipman ve eğitim","maddeler":["Telsiz, devriye ekipmanı ve diğer güvenlik araçlarının kullanılabilirliğinin kontrol edilmesi.","Personelin acil durum, iletişim ve olay raporlama prosedürlerine ilişkin eğitim ihtiyaçlarının belirlenmesi.","Güvenlik kameraları ve kişisel verilerle ilgili erişim kurallarının uygulanmasının denetlenmesi."]},{"harf":"E","baslik":"Raporlama","maddeler":["Olay raporlarının eksiksiz ve zamanında hazırlanmasının kontrol edilmesi.","Güvenlik personelinin görev performansının değerlendirilmesi.","Vardiya riskleri ve devam eden olayların güvenlik müdürüne aktarılması.","Güvenlik süreçlerinde tespit edilen iyileştirme ihtiyaçlarının raporlanması."]}]},{"ad":"GÜVENLİK MÜDÜRÜ","bolumler":[{"harf":"A","baslik":"Güvenlik stratejisi ve risk yönetimi","maddeler":["Otelin güvenlik risk değerlendirmesinin güncel tutulmasının sağlanması.","Giriş kontrolü, devriye, erişim yönetimi ve olay müdahale prosedürlerinin belirlenmesi.","Misafir, çalışan, tedarikçi ve ziyaretçi güvenliğine ilişkin risklerin değerlendirilmesi.","Yangın, tahliye, şiddet olayı, kayıp kişi ve diğer acil durum senaryolarının planlanması."]},{"harf":"B","baslik":"Operasyon ve ekip yönetimi","maddeler":["Güvenlik personeli kadro ve vardiya planlarının operasyon ihtiyacına göre hazırlanması.","Güvenlik müdür yardımcısı ve vardiya sorumlularının performansının değerlendirilmesi.","Kritik giriş noktaları, kamera sistemleri ve erişim kontrol süreçlerinin denetlenmesi.","Güvenlik prosedürlerinin tüm vardiyalarda tutarlı uygulanmasının sağlanması."]},{"harf":"C","baslik":"Olay ve kriz yönetimi","maddeler":["Ciddi güvenlik olaylarında müdahale ve iletişim koordinasyonunun yürütülmesi.","Olay kayıtlarının, kamera görüntülerinin ve diğer delillerin hukuka ve işletme prosedürlerine uygun korunmasının sağlanması.","Kolluk kuvvetleri ve ilgili acil durum birimleriyle gerekli koordinasyonun yürütülmesi.","Olay sonrası kök neden analizlerinin ve düzeltici faaliyetlerin takip edilmesi."]},{"harf":"D","baslik":"Sistemler ve mevzuat","maddeler":["Güvenlik kameraları, alarm sistemleri ve erişim kontrol altyapısının yeterliliğinin değerlendirilmesi.","Yangın güvenliği ve tahliye uygulamalarında ilgili departmanlarla koordinasyonun sağlanması.","Kişisel verilerin, kamera kayıtlarının ve güvenlik belgelerinin erişim kurallarına uygun korunmasının denetlenmesi.","Güvenlik hizmetlerinin geçerli mevzuat ve işletme politikalarına uygunluğunun takip edilmesi."]},{"harf":"E","baslik":"Performans ve raporlama","maddeler":["Güvenlik olayları, müdahale süreleri ve risk göstergelerinin düzenli analiz edilmesi.","Güvenlik bütçesi, personel ihtiyacı ve ekipman yatırımlarının değerlendirilmesi.","Güvenlik eğitimleri ve tatbikatların sonuçlarının incelenmesi.","Güvenlik performansı, kritik riskler ve iyileştirme planlarının üst yönetime sunulması."]}]},{"ad":"İNSAN KAYNAKLARI MÜDÜR YARDIMCISI","bolumler":[{"harf":"A","baslik":"Personel işlemleri","maddeler":["Personel özlük dosyalarının eksiksiz ve güncel tutulmasının kontrol edilmesi.","İşe giriş ve işten ayrılış belgelerinin ilgili prosedürlere göre hazırlanmasının takip edilmesi.","Personel bilgilerinin yetkisiz erişime karşı korunmasının sağlanması.","İş sözleşmeleri ve personel evraklarının gerekli onaylarla tamamlanmasının kontrol edilmesi."]},{"harf":"B","baslik":"Puantaj ve vardiya","maddeler":["Departmanlardan gelen puantaj kayıtlarının eksiksizlik açısından kontrol edilmesi.","Fazla mesai, izin ve devamsızlık kayıtlarının ilgili onaylarla karşılaştırılması.","Vardiya planlarının çalışma süreleri ve dinlenme kurallarına uygunluğunun kontrol edilmesi.","Bordro hazırlığı için gerekli personel verilerinin zamanında muhasebe veya bordro birimine iletilmesi."]},{"harf":"C","baslik":"İşe alım ve oryantasyon","maddeler":["Açık pozisyonların ve personel ihtiyaçlarının ilgili departmanlarla takip edilmesi.","Aday görüşmeleri ve işe alım belgelerinin planlanan takvime göre yürütülmesinin sağlanması.","Yeni başlayan personelin oryantasyon programına katılımının takip edilmesi.","Deneme süresi değerlendirmelerinin zamanında yapılmasının sağlanması."]},{"harf":"D","baslik":"Eğitim ve çalışan ilişkileri","maddeler":["Zorunlu ve mesleki eğitim kayıtlarının güncel tutulmasının kontrol edilmesi.","Personel talep, şikâyet ve disiplin süreçlerinin gizlilik içinde kayıt altına alınmasının sağlanması.","Departman yöneticilerinden gelen çalışan ilişkileri konularının takip edilmesi.","Personel memnuniyeti ve çalışan bağlılığı çalışmalarının organizasyonuna destek verilmesi."]},{"harf":"E","baslik":"Raporlama ve koordinasyon","maddeler":["Personel sayısı, devamsızlık ve işten ayrılma verilerinin hazırlanmasının sağlanması.","İnsan kaynakları süreçlerinde eksik veya hatalı belgelerin düzeltilmesinin takip edilmesi.","Günlük operasyonel insan kaynakları sorunlarının müdüre aktarılması.","İnsan kaynakları müdürünün verdiği görevlerin takvim ve önceliklerine uygun tamamlanmasının sağlanması."]}]},{"ad":"İNSAN KAYNAKLARI MÜDÜRÜ","bolumler":[{"harf":"A","baslik":"İnsan kaynakları planlaması","maddeler":["Personel bütçesinin ve kadro planının işletme hedefleriyle uyumlu hazırlanması.","Departmanların personel ihtiyaçlarının doluluk ve operasyon tahminlerine göre değerlendirilmesi.","İşe alım, sezonluk istihdam ve personel devamlılığı planlarının hazırlanması.","Organizasyon şeması ve görev tanımlarının güncel tutulmasının sağlanması."]},{"harf":"B","baslik":"İşe alım ve çalışan yönetimi","maddeler":["İşe alım standartlarının ve aday değerlendirme süreçlerinin belirlenmesi.","Yeni personel oryantasyonunun ve deneme süresi değerlendirmelerinin etkinliğinin takip edilmesi.","Çalışan performans değerlendirme sisteminin uygulanmasının sağlanması.","Kritik pozisyonlar için yedekleme ve kariyer gelişim planlarının değerlendirilmesi."]},{"harf":"C","baslik":"Mevzuat ve özlük işlemleri","maddeler":["İş sözleşmeleri, özlük dosyaları ve personel kayıtlarının ilgili mevzuata uygunluğunun denetlenmesi.","Çalışma süreleri, izinler, fazla mesai ve dinlenme uygulamalarının mevzuata uygunluğunun takip edilmesi.","Bordro ve yan hak süreçlerinin ilgili birimlerle koordinasyon içinde yürütülmesinin sağlanması.","İş sağlığı ve güvenliği yükümlülüklerinde ilgili uzmanlar ve departmanlarla koordinasyonun sağlanması."]},{"harf":"D","baslik":"Eğitim ve çalışan ilişkileri","maddeler":["Yıllık eğitim planının ve eğitim bütçesinin hazırlanması.","Çalışan memnuniyeti, bağlılığı ve işten ayrılma nedenlerinin analiz edilmesi.","Disiplin, şikâyet ve çalışan ilişkileri süreçlerinin adil, gizli ve tutarlı yürütülmesinin sağlanması.","Çalışanlar arasında ayrımcılık ve tacizi önlemeye yönelik politika ve bildirim süreçlerinin uygulanmasının denetlenmesi."]},{"harf":"E","baslik":"Bütçe ve performans","maddeler":["Personel maliyetlerinin bütçe ve gerçekleşen veriler üzerinden takip edilmesi.","İşe alım maliyeti, çalışan devir oranı, devamsızlık ve eğitim göstergelerinin analiz edilmesi.","İnsan kaynakları süreçlerine ilişkin yasal ve operasyonel risklerin yönetimle paylaşılması.","İnsan kaynakları performansı ve iyileştirme planlarının genel müdüre raporlanması."]}]},{"ad":"İNSAN KAYNAKLARI UZMAN YARDIMCISI","bolumler":[{"harf":"A","baslik":"Evrak ve personel kayıtları","maddeler":["Personel dosyalarındaki eksik belgelerin kontrol edilmesi.","Personel bilgilerinin insan kaynakları sistemine doğru girilmesi.","İşe giriş, görev değişikliği ve işten ayrılış evraklarının hazırlanmasına destek verilmesi.","İzin, devamsızlık ve diğer personel belgelerinin dosyalanması."]},{"harf":"B","baslik":"İşe alım desteği","maddeler":["Açık pozisyon ilanlarının onaylı içeriklerle yayımlanmasının takip edilmesi.","Aday başvurularının kayıt altına alınması ve ilgili yöneticilere iletilmesi.","Mülakat takvimlerinin hazırlanması ve adaylarla iletişimin yürütülmesi.","İşe alım belgelerinin ve aday değerlendirme formlarının eksiksiz tutulması."]},{"harf":"C","baslik":"Oryantasyon ve eğitim","maddeler":["Yeni başlayan personelin oryantasyon takviminin hazırlanmasına destek verilmesi.","Eğitim katılım listeleri ve sertifika kayıtlarının güncellenmesi.","Eğitim salonu, materyal ve katılımcı hazırlıklarının organize edilmesi.","Deneme süresi değerlendirme formlarının ilgili yöneticilerden zamanında toplanması."]},{"harf":"D","baslik":"Personel talepleri ve gizlilik","maddeler":["Personel izin ve belge taleplerinin ilgili prosedüre göre yönlendirilmesi.","Çalışan şikâyetlerinin yetkili insan kaynakları personeline aktarılması.","Personel verilerinin gizlilik ve erişim kurallarına uygun işlenmesi.","İnsan kaynakları arşivinin düzenli ve erişilebilir tutulması."]},{"harf":"E","baslik":"Takip ve raporlama","maddeler":["Günlük işe giriş, ayrılış ve personel hareketlerinin takip edilmesi.","Eksik evrak ve bekleyen işlemlerin kontrol listesinin güncellenmesi.","İnsan kaynakları raporları için gerekli verilerin hazırlanmasına destek verilmesi.","Tamamlanan ve bekleyen işlerin sorumlu uzmana zamanında bildirilmesi."]}]},{"ad":"İŞE ALIM VE EĞİTİM MÜDÜR YARDIMCISI","bolumler":[{"harf":"A","baslik":"İşe alım planlaması","maddeler":["Departmanlardan gelen personel taleplerinin kadro planı ve bütçeyle karşılaştırılması.","Açık pozisyonlar için işe alım takviminin hazırlanması ve güncellenmesi.","Aday havuzunun pozisyon, deneyim ve yeterlilik kriterlerine göre düzenlenmesi.","Mülakatların ilgili departman yöneticileriyle koordineli planlanması.","İşe alım sürecindeki gecikmelerin ve kritik personel açıklarının takip edilmesi."]},{"harf":"B","baslik":"Aday değerlendirme","maddeler":["Adayların görev tanımı ve yetkinlik kriterlerine göre değerlendirilmesinin sağlanması.","Mülakat değerlendirme formlarının eksiksiz tutulmasının kontrol edilmesi.","Referans kontrollerinin gerekli onay ve prosedürler doğrultusunda yürütülmesinin sağlanması.","İş teklifleri ve işe giriş süreçlerinin yetki ve bütçe sınırları içinde takip edilmesi."]},{"harf":"C","baslik":"Eğitim organizasyonu","maddeler":["Yıllık eğitim planının uygulanma durumunun takip edilmesi.","Departmanların eğitim ihtiyaçlarının toplanması ve sınıflandırılması.","Oryantasyon programının içerik ve takvim açısından organize edilmesi.","Zorunlu eğitimlerin katılım ve tamamlanma durumunun kontrol edilmesi.","Eğitim materyalleri, eğitmenler ve eğitim alanlarının hazırlığının koordine edilmesi."]},{"harf":"D","baslik":"Etkinlik ve sonuç değerlendirmesi","maddeler":["Eğitim sonrası değerlendirmelerin ve katılımcı geri bildirimlerinin toplanması.","Eğitimlerin iş performansı ve hizmet kalitesine etkisinin ilgili yöneticilerle değerlendirilmesi.","İşe alım kanallarının aday kalitesi, maliyet ve işe yerleşme süresi açısından karşılaştırılması."]},{"harf":"E","baslik":"Raporlama","maddeler":["Açık pozisyon, aday, işe alım süresi ve personel ihtiyacı raporlarının hazırlanması.","Eğitim katılımı, eğitim maliyeti ve tamamlanma oranlarının takip edilmesi.","İşe alım ve eğitim sonuçlarının insan kaynakları müdürüne raporlanması."]}]},{"ad":"KALİTE VE İŞ MÜKEMMELLİĞİ MÜDÜRÜ","bolumler":[{"harf":"A","baslik":"Kalite sistemi","maddeler":["Otelin kalite standartlarının, prosedürlerinin ve kontrol formlarının güncel tutulmasının sağlanması.","Departmanların kalite hedeflerinin işletme hedefleriyle uyumunun değerlendirilmesi.","İç denetim planının hazırlanması ve denetimlerin takvime uygun yürütülmesi.","Departmanlarda prosedürlere uyumun örneklem ve saha gözlemleriyle doğrulanması."]},{"harf":"B","baslik":"Hizmet kalitesi ve misafir deneyimi","maddeler":["Misafir şikâyetleri, anketleri ve çevrim içi yorumların kategorilere göre analiz edilmesi.","Tekrarlayan şikâyetlerin kök nedenlerinin ilgili departmanlarla araştırılması.","Hizmet standartlarının misafir yolculuğunun kritik noktalarında uygulanmasının değerlendirilmesi.","Düzeltici faaliyetlerin sorumlu kişi ve hedef tarihlerle takip edilmesi."]},{"harf":"C","baslik":"İş süreçleri ve verimlilik","maddeler":["Departman iş akışlarındaki gereksiz tekrar ve verimsizliklerin belirlenmesi.","Süreç iyileştirme projelerinin hedef, sorumlu ve ölçülebilir sonuçlarla planlanması.","Operasyonel KPI'ların tanımlanması ve performans sonuçlarının değerlendirilmesi.","Dijital kontrol listeleri ve raporlama araçlarının etkinliğinin ölçülmesi."]},{"harf":"D","baslik":"Uyum ve risk yönetimi","maddeler":["Kalite, hijyen, çevre ve iş güvenliği konularında ilgili uzmanlarla koordinasyonun sağlanması.","Uygunsuzlukların risk seviyesine göre önceliklendirilmesinin sağlanması.","Dış denetim ve sertifikasyon hazırlıklarının takip edilmesi.","Doküman kontrolü, kayıt saklama ve prosedür güncelleme süreçlerinin denetlenmesi."]},{"harf":"E","baslik":"Raporlama ve sürekli gelişim","maddeler":["Denetim sonuçları ve uygunsuzlukların kapanma oranlarının raporlanması.","Departmanların kalite göstergelerinin karşılaştırmalı analiz edilmesi.","İyileştirme projelerinin maliyet, süre ve performans sonuçlarının değerlendirilmesi.","Kalite ve iş mükemmelliği sonuçlarının üst yönetime sunulması."]}]},{"ad":"KAT ŞEFİ","bolumler":[{"harf":"A","baslik":"Oda ve alan kontrolü","maddeler":["Sorumlu katın oda durumlarının PMS veya ilgili oda takip sistemiyle karşılaştırılması.","Temiz, kirli, boş, dolu ve arızalı oda durumlarının doğru kaydedilmesinin kontrol edilmesi.","Temizlik sonrası odaların belirlenen oda kalite standartlarına uygunluğunun denetlenmesi.","Banyo, yatak, mobilya ve oda ekipmanlarının temizlik ve kullanım durumunun kontrol edilmesi.","Misafir odalarındaki eksik tekstil, buklet malzemesi ve sarf ürünlerinin kontrol edilmesi."]},{"harf":"B","baslik":"Personel yönetimi","maddeler":["Kat görevlilerinin günlük oda ve alan dağılımının yapılması.","Personelin vardiya başlangıcında gerekli malzeme ve ekipmanları teslim almasının kontrol edilmesi.","Oda temizliği ve kontrol sürelerinin operasyon ihtiyacına uygun takip edilmesi.","Personelin hijyen, mahremiyet ve oda giriş prosedürlerine uyumunun denetlenmesi."]},{"harf":"C","baslik":"Misafir talepleri ve özel durumlar","maddeler":["VIP, erken giriş, geç çıkış ve özel hazırlık taleplerinin takip edilmesi.","Misafirlerin rahatsız edilmemesi ve oda giriş izinlerinin doğru uygulanmasının sağlanması.","Kayıp eşya, hasar veya şüpheli durumların ilgili prosedüre göre bildirilmesi.","Misafir odalarında tespit edilen teknik arızaların iş emriyle bildirilmesinin sağlanması."]},{"harf":"D","baslik":"Malzeme ve hijyen","maddeler":["Kat arabalarının ve temizlik malzemelerinin uygun şekilde hazırlanmasının kontrol edilmesi.","Temiz ve kirli tekstillerin ayrı taşınmasının sağlanması.","Kimyasalların doğru etiketleme ve güvenli kullanım kurallarına uygun bulundurulmasının denetlenmesi.","Kat depolarının düzeni, stokları ve temizlik durumunun kontrol edilmesi."]},{"harf":"E","baslik":"Raporlama","maddeler":["Kontrolden geçemeyen odaların eksiklerinin giderilmesinin takip edilmesi.","Günlük oda durumu, personel performansı ve operasyonel sorunların kayıt altına alınması.","Kat operasyonuna ilişkin kritik sorunların kat hizmetleri yönetimine raporlanması."]}]},{"ad":"MALİ VE İDARİ İŞLER MÜDÜRÜ","bolumler":[{"harf":"A","baslik":"Bütçe ve finansal kontrol","maddeler":["İşletme bütçesinin hazırlanması ve gerçekleşen sonuçlarla karşılaştırılmasının koordine edilmesi.","Gelir, gider, nakit akışı ve işletme sermayesi göstergelerinin takip edilmesi.","Departman harcamalarının bütçe limitleri ve onay prosedürlerine uygunluğunun kontrol edilmesi.","Finansal sapmaların nedenlerinin araştırılarak düzeltici aksiyonların planlanması."]},{"harf":"B","baslik":"Muhasebe ve ödeme süreçleri","maddeler":["Muhasebe kayıtlarının dönemsel kapanış takvimine uygun tamamlanmasının sağlanması.","Tedarikçi faturaları ve ödeme taleplerinin gerekli onay ve belgelerle kontrol edilmesi.","Banka hareketleri, kasa işlemleri ve mutabakat süreçlerinin denetlenmesi.","Vergi, beyanname ve yasal bildirim takviminin ilgili uzmanlarla takip edilmesi."]},{"harf":"C","baslik":"Satın alma ve idari işler","maddeler":["Satın alma süreçlerinin bütçe, yetki ve tedarikçi prosedürlerine uygunluğunun kontrol edilmesi.","Tedarikçi sözleşmeleri, fiyat koşulları ve ödeme vadelerinin takip edilmesi.","İdari hizmetler ve genel işletme giderlerinin verimlilik açısından değerlendirilmesi.","Demirbaş envanteri ve varlık kayıtlarının güncel tutulmasının sağlanması."]},{"harf":"D","baslik":"İç kontrol ve risk","maddeler":["Finansal işlemlerde görevler ayrılığı ve yetki limitlerinin uygulanmasının denetlenmesi.","Olağan dışı harcamalar, mükerrer ödemeler ve finansal tutarsızlıkların araştırılması.","Finansal belge ve kayıtların erişim, gizlilik ve saklama kurallarına uygunluğunun sağlanması.","Mali ve idari süreçlerdeki risklerin değerlendirilerek önleyici kontrollerin geliştirilmesi."]},{"harf":"E","baslik":"Yönetim raporlaması","maddeler":["Aylık finansal sonuçların bütçe ve önceki dönemlerle karşılaştırmalı analiz edilmesi.","Maliyet merkezleri bazında harcama ve verimlilik raporlarının hazırlanması.","Finansal performans, nakit akışı ve önemli risklerin üst yönetime sunulması.","Mali ve idari süreçlerde verimliliği artıracak iyileştirme projelerinin takip edilmesi."]}]},{"ad":"MEYDAN ŞEFİ","bolumler":[{"harf":"A","baslik":"Alan ve ekip organizasyonu","maddeler":["Ortak alan temizlik planının hazırlanması ve personel görev dağılımının yapılması.","Lobi, koridor, merdiven, asansör önü ve diğer ortak alanların temizlik durumunun kontrol edilmesi.","Personelin vardiya başlangıcında görev alanlarında hazır bulunmasının sağlanması.","Yoğun kullanım alanları için temizlik sıklığının misafir trafiğine göre düzenlenmesi."]},{"harf":"B","baslik":"Temizlik kalitesi","maddeler":["Zeminlerin, duvar yüzeylerinin ve erişilebilir mobilyaların temizliğinin denetlenmesi.","Cam yüzeyler, aynalar ve dekoratif alanların temizlik standartlarına uygunluğunun kontrol edilmesi.","Tuvaletlerin temizlik, koku, sarf malzemesi ve hijyen durumunun düzenli kontrol edilmesi.","Çöp kutularının doluluk durumunun ve atıkların uygun şekilde uzaklaştırılmasının takip edilmesi.","Temizlik sonrası alanların görünüm ve koku açısından kontrol edilmesi."]},{"harf":"C","baslik":"Hijyen ve güvenlik","maddeler":["Temizlik kimyasallarının doğru etiketleme ve kullanım talimatlarına uygun kullanılmasının denetlenmesi.","Islak zeminlerde uyarı levhalarının kullanılmasının sağlanması.","Misafir geçişlerini engelleyen temizlik ekipmanlarının uygun alanlarda tutulmasının sağlanması.","Dökülme, kırılma ve benzeri acil temizlik ihtiyaçlarına müdahalenin koordine edilmesi."]},{"harf":"D","baslik":"Malzeme ve ekipman","maddeler":["Temizlik arabalarının, makinelerin ve diğer ekipmanların çalışır durumda olduğunun kontrol edilmesi.","Sarf malzemesi dirim ve teslim","maddeler":["Tamamlanan temizlik görevlerinin belirlenen kontrol sistemine işlenmesi.","Eksik sarf malzemelerinin ve arızalı ekipmanların meydan şefine bildirilmesi.","Vardiya sonunda görev alanının temiz ve düzenli bırakılması."]}]},{"ad":"MIXOLOGIST","bolumler":[{"harf":"A","baslik":"Hazırlık ve malzeme kontrolü","maddeler":["Kokteyl hazırlama ekipmanlarının ve bar tezgâhının temizliğinin kontrol edilmesi.","Reçetelerde kullanılan içecek, şurup, meyve ve garnitürlerin yeterliliğinin kontrol edilmesi.","Taze ürünlerin kalite ve saklama koşullarının değerlendirilmesi.","Ölçü kapları, shaker, süzgeç ve diğer araçların kullanıma hazır tutulması."]},{"harf":"B","baslik":"Reçete ve ürün kalitesi","maddeler":["Standart kokteyl reçetelerinin doğru ölçülerle uygulanması.","İçeceklerin tat, aroma, denge ve sunum açısından kontrol edilmesi.","Özel kokteyllerin belirlenen reçete ve işletme konseptine uygun hazırlanması.","Alkolsüz kokteyllerin de aynı kalite ve sunum standardında hazırlanması.","İçeceklerin uygun bardak ve doğru garnitürle sunulması.","Reçete dışı değişikliklerin ürün kalitesine etkisinin değerlendirilmesi ve gerektiğinde sorumluya bildirilmesi."]},{"harf":"C","baslik":"Misafir deneyimi","maddeler":["Misafirlerin kokteyl içeriği ve ürün seçenekleri hakkındaki sorularının doğru yanıtlanması.","Özel tat tercihleri ve alerjen bildirimlerinin hazırlık sürecinde dikkate alınması.","Siparişlerin doğru ve zamanında hazırlanması.","Beğenilmeyen veya hatalı hazırlanan içeceklerin işletme prosedürüne göre düzeltilmesi."]},{"harf":"D","baslik":"Hijyen ve güvenlik","maddeler":["Buz, meyve ve garnitürlerin hijyenik koşullarda hazırlanması ve saklanması.","Açılmış içeceklerin etiketleme ve saklama prosedürlerine uygun muhafaza edilmesi.","Kesici aletler, cam malzemeler ve ekipmanların güvenli kullanılması.","Bar çalışma alanının servis boyunca temiz tutulması."]},{"harf":"E","baslik":"Stok ve kapanış","maddeler":["Kullanılan malzemelerin ve firelerin işlet
